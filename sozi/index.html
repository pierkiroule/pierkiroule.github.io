<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soirée des Sosies presque parfait.e.s</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      color: white;
      background: #03000a;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .overlay {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background:
        radial-gradient(circle at center, transparent 0%, rgba(0,0,0,.35) 45%, rgba(0,0,0,.85) 100%);
    }

    .card {
      width: min(920px, 100%);
      padding: 32px 22px;
      border-radius: 32px;
      background: rgba(5, 0, 20, .45);
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(14px);
      box-shadow: 0 0 80px rgba(255,0,180,.45);
    }

    .kicker {
      letter-spacing: .28em;
      text-transform: uppercase;
      color: #6ffcff;
      font-weight: 800;
      font-size: .8rem;
    }

    h1 {
      margin: 16px 0 8px;
      font-size: clamp(2.4rem, 9vw, 6rem);
      line-height: .86;
      text-transform: uppercase;
      text-shadow:
        0 0 12px #ff2bd6,
        0 0 34px #ff2bd6,
        0 0 70px #00eaff;
    }

    h1 span {
      display: block;
      font-size: .45em;
      color: #ff4fcb;
    }

    .date, .place {
      font-size: clamp(1rem, 3vw, 1.4rem);
      letter-spacing: .08em;
      margin-top: 12px;
    }

    .place {
      color: #a9ffff;
      text-shadow: 0 0 18px #00eaff;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 30px 0 18px;
    }

    .box {
      padding: 18px 8px;
      border-radius: 22px;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: inset 0 0 30px rgba(255,255,255,.08), 0 0 26px rgba(0,234,255,.25);
    }

    .number {
      font-size: clamp(2rem, 8vw, 4.4rem);
      font-weight: 900;
      color: white;
      text-shadow: 0 0 18px #ff2bd6, 0 0 42px #00eaff;
    }

    .label {
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: .18em;
      font-size: .72rem;
      color: #c7ffff;
    }

    .audio {
      margin-top: 22px;
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 14px 22px;
      font-weight: 900;
      color: white;
      background: linear-gradient(135deg, #ff2bd6, #00eaff);
      box-shadow: 0 0 32px rgba(255,43,214,.8);
      cursor: pointer;
    }

    audio {
      width: min(420px, 100%);
      accent-color: #ff2bd6;
    }

    .sliders {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .slider {
      background: rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 12px;
      text-align: left;
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: #dff;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #ff2bd6;
    }

    .message {
      margin-top: 18px;
      font-size: 1.1rem;
      color: #ffd6fb;
    }

    @media (max-width: 640px) {
      .countdown { grid-template-columns: repeat(2, 1fr); }
      .sliders { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>

  <div class="overlay">
    <main class="card">
      <div class="kicker">Compte à rebours audio-réactif</div>

      <h1>
        Soirée des Sosies
        <span>presque parfait.e.s</span>
      </h1>

      <div class="date">27 juin 2026 · 19h30</div>
      <div class="place">13 rue des Papillons · Les Sorinières</div>

      <section class="countdown">
        <div class="box"><div id="days" class="number">00</div><div class="label">jours</div></div>
        <div class="box"><div id="hours" class="number">00</div><div class="label">heures</div></div>
        <div class="box"><div id="minutes" class="number">00</div><div class="label">minutes</div></div>
        <div class="box"><div id="seconds" class="number">00</div><div class="label">secondes</div></div>
      </section>

      <div class="audio">
        <button id="playBtn">▶ Lancer le son</button>

        <audio id="audio" controls crossorigin="anonymous">
          <source src="https://raw.githubusercontent.com/pierkiroule/pierkiroule.github.io/master/sozi/Sozi%20Qui%20Sait.mp3" type="audio/mpeg">
        </audio>
      </div>

      <div class="sliders">
        <label class="slider">
          Bulles
          <input id="bubbleSlider" type="range" min="30" max="220" value="120">
        </label>

        <label class="slider">
          Visualizer
          <input id="barSlider" type="range" min="40" max="180" value="110">
        </label>

        <label class="slider">
          Chaos Wahoo
          <input id="chaosSlider" type="range" min="0" max="100" value="55">
        </label>
      </div>

      <div id="message" class="message">
        Active le son. Les bulles vont danser.
      </div>
    </main>
  </div>

  <script>
    const targetDate = new Date("2026-06-27T19:30:00+02:00").getTime();

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");
    const messageEl = document.getElementById("message");

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function updateCountdown() {
      const distance = targetDate - Date.now();

      if (distance <= 0) {
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        messageEl.textContent = "C’est maintenant. Les doubles entrent en scène.";
        return;
      }

      daysEl.textContent = pad(Math.floor(distance / 86400000));
      hoursEl.textContent = pad(Math.floor(distance / 3600000) % 24);
      minutesEl.textContent = pad(Math.floor(distance / 60000) % 60);
      secondsEl.textContent = pad(Math.floor(distance / 1000) % 60);
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("playBtn");

    const bubbleSlider = document.getElementById("bubbleSlider");
    const barSlider = document.getElementById("barSlider");
    const chaosSlider = document.getElementById("chaosSlider");

    let w, h;
    let audioCtx, analyser, source, dataArray;
    let audioReady = false;

    const bubbles = [];

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resize);
    resize();

    function createBubble() {
      return {
        x: Math.random() * w,
        y: h + Math.random() * h,
        r: 4 + Math.random() * 36,
        speed: .4 + Math.random() * 2.2,
        drift: -1 + Math.random() * 2,
        hue: Math.random() > .5 ? 190 : 310,
        alpha: .25 + Math.random() * .65
      };
    }

    for (let i = 0; i < 220; i++) {
      bubbles.push(createBubble());
    }

    function initAudio() {
      if (audioReady) return;

      audioCtx = new AudioContext();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;

      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);

      dataArray = new Uint8Array(analyser.frequencyBinCount);
      audioReady = true;
    }

    playBtn.addEventListener("click", async () => {
      initAudio();

      if (audioCtx.state === "suspended") {
        await audioCtx.resume();
      }

      audio.play();
      playBtn.textContent = "⏸ Ambiance lancée";
    });

    function getAudioLevel() {
      if (!audioReady) return 0.25;

      analyser.getByteFrequencyData(dataArray);

      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        sum += dataArray[i];
      }

      return sum / dataArray.length / 255;
    }

    function drawBackground(level) {
      const gradient = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h));
      gradient.addColorStop(0, `rgba(255, 0, 190, ${0.16 + level * .3})`);
      gradient.addColorStop(.35, `rgba(0, 234, 255, ${0.10 + level * .2})`);
      gradient.addColorStop(1, "#03000a");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);
    }

    function drawBubbles(level) {
      const desired = Number(bubbleSlider.value);

      while (bubbles.length < desired) bubbles.push(createBubble());
      while (bubbles.length > desired) bubbles.pop();

      const chaos = Number(chaosSlider.value) / 100;

      bubbles.forEach(b => {
        b.y -= b.speed + level * 8;
        b.x += b.drift + Math.sin(Date.now() * .002 + b.y * .02) * chaos * 2;

        if (b.y < -80) {
          Object.assign(b, createBubble());
          b.y = h + 80;
        }

        const pulse = 1 + level * 1.8;
        const radius = b.r * pulse;

        ctx.beginPath();
        ctx.arc(b.x, b.y, radius, 0, Math.PI * 2);

        const g = ctx.createRadialGradient(b.x - radius / 3, b.y - radius / 3, 1, b.x, b.y, radius);
        g.addColorStop(0, `rgba(255,255,255,${b.alpha})`);
        g.addColorStop(.35, `hsla(${b.hue},100%,65%,${b.alpha * .7})`);
        g.addColorStop(1, `rgba(255,255,255,0)`);

        ctx.fillStyle = g;
        ctx.fill();

        ctx.strokeStyle = `hsla(${b.hue},100%,70%,${.2 + level})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });
    }

    function drawVisualizer(level) {
      const bars = 96;
      const barBoost = Number(barSlider.value) / 100;
      const chaos = Number(chaosSlider.value) / 100;
      const centerX = w / 2;
      const centerY = h / 2;

      for (let i = 0; i < bars; i++) {
        const value = audioReady ? dataArray[i % dataArray.length] / 255 : Math.random() * .4;
        const angle = (i / bars) * Math.PI * 2;
        const baseRadius = Math.min(w, h) * .26;
        const barHeight = (40 + value * 230 * barBoost + level * 90) * (1 + chaos * .6);

        const x1 = centerX + Math.cos(angle) * baseRadius;
        const y1 = centerY + Math.sin(angle) * baseRadius;
        const x2 = centerX + Math.cos(angle) * (baseRadius + barHeight);
        const y2 = centerY + Math.sin(angle) * (baseRadius + barHeight);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);

        ctx.strokeStyle = i % 2 === 0
          ? `rgba(255, 43, 214, ${.35 + value})`
          : `rgba(0, 234, 255, ${.35 + value})`;

        ctx.lineWidth = 2 + value * 7;
        ctx.shadowBlur = 22 + value * 40;
        ctx.shadowColor = i % 2 === 0 ? "#ff2bd6" : "#00eaff";
        ctx.stroke();
      }

      ctx.shadowBlur = 0;
    }

    function drawWave(level) {
      ctx.beginPath();

      const amp = 40 + level * 160;
      const chaos = Number(chaosSlider.value) / 100;
      const yBase = h * .78;

      for (let x = 0; x <= w; x += 8) {
        const y =
          yBase
          + Math.sin(x * .018 + Date.now() * .005) * amp
          + Math.sin(x * .045 + Date.now() * .009) * amp * chaos;

        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.strokeStyle = `rgba(255, 43, 214, ${.35 + level})`;
      ctx.lineWidth = 4;
      ctx.shadowBlur = 35;
      ctx.shadowColor = "#ff2bd6";
      ctx.stroke();

      ctx.shadowBlur = 0;
    }

    function drawFlash(level) {
      if (level > .55) {
        ctx.fillStyle = `rgba(255,255,255,${(level - .55) * .35})`;
        ctx.fillRect(0, 0, w, h);
      }
    }

    function animate() {
      const level = getAudioLevel();

      drawBackground(level);
      drawVisualizer(level);
      drawBubbles(level);
      drawWave(level);
      drawFlash(level);

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
