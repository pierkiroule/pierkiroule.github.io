<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soirée des Sosies presque parfait.e.s</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: #020008;
      color: white;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 24px;
      text-align: center;
      pointer-events: none;
    }

    .top {
      padding-top: 8px;
    }

    .badge {
      display: inline-block;
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(0, 234, 255, .12);
      border: 1px solid rgba(0, 234, 255, .45);
      color: #bfffff;
      text-transform: uppercase;
      letter-spacing: .18em;
      font-weight: 800;
      font-size: .7rem;
      text-shadow: 0 0 12px #00eaff;
    }

    h1 {
      margin: 16px auto 8px;
      max-width: 920px;
      font-size: clamp(2.4rem, 10vw, 6.6rem);
      line-height: .82;
      text-transform: uppercase;
      letter-spacing: -.06em;
      text-shadow:
        0 0 8px #fff,
        0 0 22px #ff2bd6,
        0 0 54px #00eaff;
    }

    h1 span {
      display: block;
      margin-top: 10px;
      font-size: .43em;
      color: #ff4bd8;
      letter-spacing: -.03em;
    }

    .infos {
      display: grid;
      gap: 6px;
      margin-top: 12px;
      font-size: clamp(1rem, 3vw, 1.35rem);
      letter-spacing: .06em;
      text-shadow: 0 0 16px #000, 0 0 20px #00eaff;
    }

    .place {
      color: #aaffff;
    }

    .middle {
      display: flex;
      align-items: end;
      justify-content: center;
      padding-bottom: 36px;
    }

    .countdown {
      width: min(780px, 100%);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .timebox {
      padding: 14px 6px;
      border-radius: 20px;
      background: rgba(0, 0, 0, .28);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 0 24px rgba(255, 43, 214, .25);
    }

    .number {
      font-size: clamp(2rem, 8vw, 4.3rem);
      font-weight: 950;
      line-height: 1;
      text-shadow: 0 0 16px #ff2bd6, 0 0 34px #00eaff;
    }

    .label {
      margin-top: 7px;
      font-size: .66rem;
      text-transform: uppercase;
      letter-spacing: .18em;
      color: #d6ffff;
    }

    .bottom {
      padding-bottom: 8px;
      pointer-events: auto;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 24px;
      color: white;
      font-weight: 900;
      letter-spacing: .04em;
      background: linear-gradient(135deg, #ff2bd6, #00eaff);
      box-shadow: 0 0 28px rgba(255, 43, 214, .8);
      cursor: pointer;
    }

    .hint {
      margin-top: 10px;
      color: #ffd9fb;
      font-size: .9rem;
      text-shadow: 0 0 12px #000;
    }

    @media (max-width: 640px) {
      .content { padding: 18px; }
      .countdown { grid-template-columns: repeat(2, 1fr); }
      .middle { padding-bottom: 24px; }
    }
  </style>
</head>

<body>
  <canvas id="fx"></canvas>

  <main class="content">
    <section class="top">
      <div class="badge">Audio party countdown</div>

      <h1>
        Soirée des Sosies
        <span>presque parfait.e.s</span>
      </h1>

      <div class="infos">
        <div>27 juin 2026 · 19h30</div>
        <div class="place">13 rue des Papillons · Les Sorinières</div>
      </div>
    </section>

    <section class="middle">
      <div class="countdown">
        <div class="timebox"><div id="days" class="number">00</div><div class="label">jours</div></div>
        <div class="timebox"><div id="hours" class="number">00</div><div class="label">heures</div></div>
        <div class="timebox"><div id="minutes" class="number">00</div><div class="label">minutes</div></div>
        <div class="timebox"><div id="seconds" class="number">00</div><div class="label">secondes</div></div>
      </div>
    </section>

    <section class="bottom">
      <button id="playBtn">▶ Lancer la soirée</button>
      <div id="hint" class="hint">Tape l’écran pour lancer le son et les bulles audio-réactives.</div>
    </section>
  </main>

  <audio id="audio" preload="auto" crossorigin="anonymous">
    <source src="https://raw.githubusercontent.com/pierkiroule/pierkiroule.github.io/master/sozi/Sozi%20Qui%20Sait.mp3" type="audio/mpeg">
  </audio>

  <script>
    const targetDate = new Date("2026-06-27T19:30:00+02:00").getTime();

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");

    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d");

    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("playBtn");
    const hint = document.getElementById("hint");

    let width = 0;
    let height = 0;

    let audioCtx;
    let analyser;
    let source;
    let dataArray;
    let audioReady = false;
    let started = false;

    const bubbles = [];
    const sparks = [];

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateCountdown() {
      const distance = targetDate - Date.now();

      if (distance <= 0) {
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        hint.textContent = "C’est maintenant. Que les doubles entrent en scène.";
        return;
      }

      daysEl.textContent = pad(Math.floor(distance / 86400000));
      hoursEl.textContent = pad(Math.floor(distance / 3600000) % 24);
      minutesEl.textContent = pad(Math.floor(distance / 60000) % 60);
      secondsEl.textContent = pad(Math.floor(distance / 1000) % 60);
    }

    function resize() {
      const ratio = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * ratio;
      canvas.height = height * ratio;

      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function makeBubble() {
      return {
        x: Math.random() * width,
        y: height + Math.random() * height,
        r: 5 + Math.random() * 42,
        speed: .4 + Math.random() * 2,
        drift: -1.4 + Math.random() * 2.8,
        hue: Math.random() > .5 ? 190 + Math.random() * 25 : 300 + Math.random() * 30,
        alpha: .2 + Math.random() * .55
      };
    }

    function makeSpark() {
      return {
        x: Math.random() * width,
        y: Math.random() * height,
        vx: -1.6 + Math.random() * 3.2,
        vy: -1.6 + Math.random() * 3.2,
        life: 20 + Math.random() * 60,
        hue: Math.random() > .5 ? 190 : 315
      };
    }

    function initParticles() {
      bubbles.length = 0;
      sparks.length = 0;

      for (let i = 0; i < 180; i++) bubbles.push(makeBubble());
      for (let i = 0; i < 120; i++) sparks.push(makeSpark());
    }

    function initAudio() {
      if (audioReady) return;

      audioCtx = new AudioContext();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = .82;

      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);

      dataArray = new Uint8Array(analyser.frequencyBinCount);
      audioReady = true;
    }

    async function startSound() {
      try {
        initAudio();

        if (audioCtx.state === "suspended") {
          await audioCtx.resume();
        }

        await audio.play();

        started = true;
        playBtn.textContent = "⏸ Ambiance lancée";
        hint.textContent = "Les bulles dansent sur Sozi Qui Sait.";
      } catch {
        hint.textContent = "Clique sur le bouton pour lancer le son.";
      }
    }

    function getAudioData() {
      if (!audioReady) {
        return { level: .22, bass: .18, mid: .2, treble: .25 };
      }

      analyser.getByteFrequencyData(dataArray);

      let sum = 0;
      let bass = 0;
      let mid = 0;
      let treble = 0;

      for (let i = 0; i < dataArray.length; i++) {
        const value = dataArray[i] / 255;
        sum += value;

        if (i < dataArray.length * .14) bass += value;
        else if (i < dataArray.length * .48) mid += value;
        else treble += value;
      }

      return {
        level: sum / dataArray.length,
        bass: bass / (dataArray.length * .14),
        mid: mid / (dataArray.length * .34),
        treble: treble / (dataArray.length * .52)
      };
    }

    function drawBackground(a) {
      const gradient = ctx.createRadialGradient(
        width / 2, height / 2, 0,
        width / 2, height / 2, Math.max(width, height)
      );

      gradient.addColorStop(0, `rgba(255, 0, 210, ${.18 + a.bass * .35})`);
      gradient.addColorStop(.34, `rgba(0, 235, 255, ${.1 + a.mid * .25})`);
      gradient.addColorStop(.72, "rgba(40, 0, 90, .55)");
      gradient.addColorStop(1, "#020008");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
    }

    function drawGrid(a) {
      const gap = 46;
      const yStart = height * .56;
      const vx = width / 2;
      const vy = height * .38;

      ctx.save();
      ctx.globalAlpha = .14 + a.level * .28;
      ctx.strokeStyle = "#00eaff";
      ctx.lineWidth = 1;

      for (let x = -width; x < width * 2; x += gap) {
        ctx.beginPath();
        ctx.moveTo(x, height);
        ctx.lineTo(vx, vy);
        ctx.stroke();
      }

      for (let y = yStart; y < height; y += gap) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.quadraticCurveTo(width / 2, y - 60, width, y);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawVisualizer(a) {
      const bars = 170;
      const cx = width / 2;
      const cy = height / 2 + 12;
      const baseRadius = Math.min(width, height) * .24;

      ctx.save();

      for (let i = 0; i < bars; i++) {
        const value = audioReady
          ? dataArray[i % dataArray.length] / 255
          : .12 + Math.random() * .22;

        const angle = (i / bars) * Math.PI * 2;
        const wobble = Math.sin(Date.now() * .004 + i) * 10;
        const barHeight = 30 + value * 260 + a.bass * 120;

        const r1 = baseRadius + wobble;
        const r2 = baseRadius + barHeight + wobble;

        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(angle) * r1, cy + Math.sin(angle) * r1);
        ctx.lineTo(cx + Math.cos(angle) * r2, cy + Math.sin(angle) * r2);

        ctx.strokeStyle = i % 2 === 0
          ? `rgba(255, 43, 214, ${.32 + value})`
          : `rgba(0, 234, 255, ${.32 + value})`;

        ctx.lineWidth = 1.5 + value * 7;
        ctx.shadowBlur = 22 + value * 45;
        ctx.shadowColor = i % 2 === 0 ? "#ff2bd6" : "#00eaff";
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(cx, cy, baseRadius * (.92 + a.bass * .16), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,255,255,${.24 + a.level})`;
      ctx.lineWidth = 2 + a.bass * 8;
      ctx.shadowBlur = 35;
      ctx.shadowColor = "#ffffff";
      ctx.stroke();

      ctx.restore();
    }

    function drawBubbles(a) {
      for (const b of bubbles) {
        b.y -= b.speed + a.level * 8 + a.bass * 5;
        b.x += b.drift + Math.sin(Date.now() * .002 + b.y * .015) * 2.4;

        if (b.y < -90 || b.x < -90 || b.x > width + 90) {
          Object.assign(b, makeBubble());
          b.y = height + 80;
        }

        const radius = b.r * (1 + a.bass * 1.8);

        const gradient = ctx.createRadialGradient(
          b.x - radius * .35,
          b.y - radius * .35,
          1,
          b.x,
          b.y,
          radius
        );

        gradient.addColorStop(0, `rgba(255,255,255,${b.alpha})`);
        gradient.addColorStop(.25, `hsla(${b.hue},100%,72%,${b.alpha * .65})`);
        gradient.addColorStop(.68, `hsla(${b.hue},100%,50%,${b.alpha * .18})`);
        gradient.addColorStop(1, "rgba(255,255,255,0)");

        ctx.beginPath();
        ctx.arc(b.x, b.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();

        ctx.strokeStyle = `hsla(${b.hue},100%,78%,${.18 + a.level})`;
        ctx.lineWidth = 1.2 + a.treble * 2;
        ctx.stroke();
      }
    }

    function drawWave(a) {
      const amp = 30 + a.level * 130 + a.bass * 120;
      const baseY = height * .8;

      ctx.save();

      ctx.beginPath();
      for (let x = 0; x <= width; x += 7) {
        const y =
          baseY
          + Math.sin(x * .018 + Date.now() * .005) * amp
          + Math.sin(x * .045 + Date.now() * .009) * amp * .55;

        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.strokeStyle = `rgba(255, 43, 214, ${.35 + a.level})`;
      ctx.lineWidth = 3 + a.bass * 7;
      ctx.shadowBlur = 34;
      ctx.shadowColor = "#ff2bd6";
      ctx.stroke();

      ctx.beginPath();
      for (let x = 0; x <= width; x += 7) {
        const y =
          baseY + 22
          + Math.cos(x * .014 + Date.now() * .004) * amp * .65;

        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.strokeStyle = `rgba(0, 234, 255, ${.25 + a.mid})`;
      ctx.shadowColor = "#00eaff";
      ctx.stroke();

      ctx.restore();
    }

    function drawSparks(a) {
      for (const s of sparks) {
        s.x += s.vx * (1 + a.treble * 3);
        s.y += s.vy * (1 + a.treble * 3);
        s.life -= .35 + a.treble;

        if (s.life <= 0 || s.x < 0 || s.x > width || s.y < 0 || s.y > height) {
          Object.assign(s, makeSpark());
        }

        ctx.beginPath();
        ctx.arc(s.x, s.y, 1 + a.treble * 3, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${s.hue},100%,70%,${Math.min(1, s.life / 50)})`;
        ctx.shadowBlur = 18;
        ctx.shadowColor = s.hue === 190 ? "#00eaff" : "#ff2bd6";
        ctx.fill();
      }

      ctx.shadowBlur = 0;
    }

    function drawFlash(a) {
      if (a.bass > .55) {
        ctx.fillStyle = `rgba(255,255,255,${(a.bass - .55) * .22})`;
        ctx.fillRect(0, 0, width, height);
      }
    }

    function animate() {
      const a = getAudioData();

      drawBackground(a);
      drawGrid(a);
      drawVisualizer(a);
      drawBubbles(a);
      drawWave(a);
      drawSparks(a);
      drawFlash(a);

      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", () => {
      resize();
      initParticles();
    });

    playBtn.addEventListener("click", startSound);

    document.body.addEventListener("pointerdown", () => {
      if (!started) startSound();
    }, { once: true });

    updateCountdown();
    setInterval(updateCountdown, 1000);

    resize();
    initParticles();
    animate();
  </script>
</body>
</html>
