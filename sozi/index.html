<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soirée des Sosies presque parfait.e.s</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020008;
      color: white;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    .screen {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background:
        radial-gradient(circle at center, transparent 0%, rgba(0,0,0,.28) 45%, rgba(0,0,0,.88) 100%);
    }

    .card {
      width: min(940px, 100%);
      padding: clamp(22px, 4vw, 42px);
      border-radius: 34px;
      background: rgba(5, 0, 18, .54);
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(16px);
      box-shadow:
        0 0 45px rgba(255, 0, 200, .38),
        0 0 90px rgba(0, 235, 255, .18);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.1);
      color: #9fffff;
      text-transform: uppercase;
      letter-spacing: .18em;
      font-weight: 800;
      font-size: .72rem;
      box-shadow: 0 0 20px rgba(0, 235, 255, .45);
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(2.3rem, 9vw, 6.2rem);
      line-height: .82;
      text-transform: uppercase;
      letter-spacing: -.06em;
      text-shadow:
        0 0 8px #fff,
        0 0 22px #ff2bd6,
        0 0 60px #ff2bd6,
        0 0 90px #00eaff;
    }

    h1 span {
      display: block;
      margin-top: 10px;
      font-size: .43em;
      color: #ff43c7;
      letter-spacing: -.03em;
    }

    .infos {
      display: grid;
      gap: 6px;
      margin: 16px 0 26px;
      font-size: clamp(.98rem, 2.7vw, 1.35rem);
      letter-spacing: .06em;
    }

    .date {
      color: #ffffff;
    }

    .place {
      color: #9fffff;
      text-shadow: 0 0 18px #00eaff;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 26px 0 20px;
    }

    .timebox {
      min-height: 115px;
      display: grid;
      place-items: center;
      padding: 14px 8px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.04));
      border: 1px solid rgba(255,255,255,.18);
      box-shadow:
        inset 0 0 30px rgba(255,255,255,.06),
        0 0 28px rgba(255, 43, 214, .18);
    }

    .number {
      font-size: clamp(2.2rem, 8vw, 4.6rem);
      font-weight: 950;
      line-height: 1;
      color: white;
      text-shadow:
        0 0 14px #ff2bd6,
        0 0 34px #00eaff;
    }

    .label {
      margin-top: 8px;
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: .2em;
      color: #caffff;
    }

    .soundline {
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 22px;
      color: white;
      font-weight: 900;
      letter-spacing: .04em;
      background: linear-gradient(135deg, #ff2bd6, #00eaff);
      box-shadow:
        0 0 22px rgba(255, 43, 214, .85),
        0 0 42px rgba(0, 234, 255, .45);
      cursor: pointer;
    }

    audio {
      width: min(440px, 100%);
      accent-color: #ff2bd6;
    }

    .hint {
      margin-top: 12px;
      color: #ffd9fb;
      font-size: .95rem;
    }

    .sliders {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .slider {
      padding: 13px;
      border-radius: 18px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      text-align: left;
      color: #e6ffff;
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .13em;
    }

    input[type="range"] {
      width: 100%;
      margin-top: 10px;
      accent-color: #ff2bd6;
    }

    @media (max-width: 680px) {
      .countdown {
        grid-template-columns: repeat(2, 1fr);
      }

      .sliders {
        grid-template-columns: 1fr;
      }

      .timebox {
        min-height: 98px;
      }
    }
  </style>
</head>

<body>
  <canvas id="fx"></canvas>

  <main class="screen">
    <section class="card">
      <div class="badge">◉ Audio party countdown</div>

      <h1>
        Soirée des Sosies
        <span>presque parfait.e.s</span>
      </h1>

      <div class="infos">
        <div class="date">27 juin 2026 · 19h30</div>
        <div class="place">13 rue des Papillons · Les Sorinières</div>
      </div>

      <section class="countdown">
        <div class="timebox">
          <div>
            <div id="days" class="number">00</div>
            <div class="label">jours</div>
          </div>
        </div>

        <div class="timebox">
          <div>
            <div id="hours" class="number">00</div>
            <div class="label">heures</div>
          </div>
        </div>

        <div class="timebox">
          <div>
            <div id="minutes" class="number">00</div>
            <div class="label">minutes</div>
          </div>
        </div>

        <div class="timebox">
          <div>
            <div id="seconds" class="number">00</div>
            <div class="label">secondes</div>
          </div>
        </div>
      </section>

      <div class="soundline">
        <button id="playBtn">▶ Lancer la soirée</button>

        <audio id="audio" controls crossorigin="anonymous">
          <source src="https://raw.githubusercontent.com/pierkiroule/pierkiroule.github.io/master/sozi/Sozi%20Qui%20Sait.mp3" type="audio/mpeg">
        </audio>
      </div>

      <div id="hint" class="hint">
        Tape l’écran : le son démarre et les bulles deviennent audio-réactives.
      </div>

      <div class="sliders">
        <label class="slider">
          Bulles
          <input id="bubblePower" type="range" min="40" max="260" value="150">
        </label>

        <label class="slider">
          Visualizer
          <input id="visualPower" type="range" min="40" max="220" value="140">
        </label>

        <label class="slider">
          Chaos wahoo
          <input id="chaosPower" type="range" min="0" max="120" value="70">
        </label>
      </div>
    </section>
  </main>

  <script>
    const targetDate = new Date("2026-06-27T19:30:00+02:00").getTime();

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");

    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d");

    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("playBtn");
    const hint = document.getElementById("hint");

    const bubblePower = document.getElementById("bubblePower");
    const visualPower = document.getElementById("visualPower");
    const chaosPower = document.getElementById("chaosPower");

    let width = 0;
    let height = 0;

    let audioCtx;
    let analyser;
    let source;
    let dataArray;
    let audioReady = false;
    let hasStarted = false;

    const bubbles = [];
    const sparks = [];

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateCountdown() {
      const distance = targetDate - Date.now();

      if (distance <= 0) {
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        hint.textContent = "C’est maintenant. Que les doubles entrent en scène.";
        return;
      }

      daysEl.textContent = pad(Math.floor(distance / 86400000));
      hoursEl.textContent = pad(Math.floor(distance / 3600000) % 24);
      minutesEl.textContent = pad(Math.floor(distance / 60000) % 60);
      secondsEl.textContent = pad(Math.floor(distance / 1000) % 60);
    }

    function resize() {
      width = canvas.width = window.innerWidth * window.devicePixelRatio;
      height = canvas.height = window.innerHeight * window.devicePixelRatio;
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
      width = window.innerWidth;
      height = window.innerHeight;
    }

    function makeBubble() {
      return {
        x: Math.random() * width,
        y: height + Math.random() * height,
        r: 5 + Math.random() * 38,
        speed: .35 + Math.random() * 1.9,
        drift: -1.2 + Math.random() * 2.4,
        hue: Math.random() > .5 ? 190 + Math.random() * 25 : 295 + Math.random() * 35,
        alpha: .22 + Math.random() * .55
      };
    }

    function makeSpark() {
      return {
        x: Math.random() * width,
        y: Math.random() * height,
        vx: -1.5 + Math.random() * 3,
        vy: -1.5 + Math.random() * 3,
        life: 20 + Math.random() * 50,
        hue: Math.random() > .5 ? 190 : 315
      };
    }

    function initParticles() {
      bubbles.length = 0;
      sparks.length = 0;

      for (let i = 0; i < 260; i++) {
        bubbles.push(makeBubble());
      }

      for (let i = 0; i < 120; i++) {
        sparks.push(makeSpark());
      }
    }

    function initAudio() {
      if (audioReady) return;

      audioCtx = new AudioContext();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = .82;

      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);

      dataArray = new Uint8Array(analyser.frequencyBinCount);
      audioReady = true;
    }

    async function startSound() {
      try {
        initAudio();

        if (audioCtx.state === "suspended") {
          await audioCtx.resume();
        }

        await audio.play();

        hasStarted = true;
        playBtn.textContent = "⏸ Ambiance lancée";
        hint.textContent = "Les sosies presque parfait.e.s entrent dans la fréquence.";
      } catch (error) {
        hint.textContent = "Clique sur le bouton pour lancer le son.";
      }
    }

    function getAudioData() {
      if (!audioReady) {
        return {
          level: .22,
          bass: .18,
          mid: .2,
          treble: .25
        };
      }

      analyser.getByteFrequencyData(dataArray);

      let sum = 0;
      let bass = 0;
      let mid = 0;
      let treble = 0;

      for (let i = 0; i < dataArray.length; i++) {
        const value = dataArray[i] / 255;
        sum += value;

        if (i < dataArray.length * .14) bass += value;
        else if (i < dataArray.length * .48) mid += value;
        else treble += value;
      }

      return {
        level: sum / dataArray.length,
        bass: bass / (dataArray.length * .14),
        mid: mid / (dataArray.length * .34),
        treble: treble / (dataArray.length * .52)
      };
    }

    function drawBackground(audioData) {
      const pulse = audioData.bass;

      const gradient = ctx.createRadialGradient(
        width / 2,
        height / 2,
        0,
        width / 2,
        height / 2,
        Math.max(width, height)
      );

      gradient.addColorStop(0, `rgba(255, 0, 210, ${.18 + pulse * .35})`);
      gradient.addColorStop(.34, `rgba(0, 235, 255, ${.10 + audioData.mid * .25})`);
      gradient.addColorStop(.72, `rgba(40, 0, 90, ${.55})`);
      gradient.addColorStop(1, "#020008");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
    }

    function drawGrid(audioData) {
      const gap = 46;
      const yStart = height * .58;
      const vanishingX = width / 2;
      const vanishingY = height * .38;

      ctx.save();
      ctx.globalAlpha = .18 + audioData.level * .28;
      ctx.strokeStyle = "#00eaff";
      ctx.lineWidth = 1;

      for (let x = -width; x < width * 2; x += gap) {
        ctx.beginPath();
        ctx.moveTo(x, height);
        ctx.lineTo(vanishingX, vanishingY);
        ctx.stroke();
      }

      for (let y = yStart; y < height; y += gap) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.quadraticCurveTo(width / 2, y - 60, width, y);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawVisualizer(audioData) {
      const bars = 160;
      const visual = Number(visualPower.value) / 100;
      const chaos = Number(chaosPower.value) / 100;

      const cx = width / 2;
      const cy = height / 2;
      const baseRadius = Math.min(width, height) * .23;

      ctx.save();

      for (let i = 0; i < bars; i++) {
        const value = audioReady
          ? dataArray[i % dataArray.length] / 255
          : .15 + Math.random() * .2;

        const angle = (i / bars) * Math.PI * 2;
        const wobble = Math.sin(Date.now() * .004 + i) * chaos * 12;
        const barHeight = 30 + value * 240 * visual + audioData.bass * 120;

        const r1 = baseRadius + wobble;
        const r2 = baseRadius + barHeight + wobble;

        const x1 = cx + Math.cos(angle) * r1;
        const y1 = cy + Math.sin(angle) * r1;
        const x2 = cx + Math.cos(angle) * r2;
        const y2 = cy + Math.sin(angle) * r2;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);

        ctx.strokeStyle = i % 2 === 0
          ? `rgba(255, 43, 214, ${.32 + value})`
          : `rgba(0, 234, 255, ${.32 + value})`;

        ctx.lineWidth = 1.5 + value * 7;
        ctx.shadowBlur = 22 + value * 45;
        ctx.shadowColor = i % 2 === 0 ? "#ff2bd6" : "#00eaff";
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(cx, cy, baseRadius * (.92 + audioData.bass * .16), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,255,255,${.24 + audioData.level})`;
      ctx.lineWidth = 2 + audioData.bass * 8;
      ctx.shadowBlur = 35;
      ctx.shadowColor = "#ffffff";
      ctx.stroke();

      ctx.restore();
    }

    function drawBubbles(audioData) {
      const maxBubbles = Number(bubblePower.value);
      const chaos = Number(chaosPower.value) / 100;

      while (bubbles.length < maxBubbles) bubbles.push(makeBubble());
      while (bubbles.length > maxBubbles) bubbles.pop();

      for (const b of bubbles) {
        b.y -= b.speed + audioData.level * 8 + audioData.bass * 5;
        b.x += b.drift + Math.sin(Date.now() * .002 + b.y * .015) * chaos * 2.8;

        if (b.y < -90 || b.x < -90 || b.x > width + 90) {
          Object.assign(b, makeBubble());
          b.y = height + 80;
        }

        const radius = b.r * (1 + audioData.bass * 1.9);

        const gradient = ctx.createRadialGradient(
          b.x - radius * .35,
          b.y - radius * .35,
          1,
          b.x,
          b.y,
          radius
        );

        gradient.addColorStop(0, `rgba(255,255,255,${b.alpha})`);
        gradient.addColorStop(.25, `hsla(${b.hue},100%,72%,${b.alpha * .65})`);
        gradient.addColorStop(.68, `hsla(${b.hue},100%,50%,${b.alpha * .18})`);
        gradient.addColorStop(1, "rgba(255,255,255,0)");

        ctx.beginPath();
        ctx.arc(b.x, b.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(b.x, b.y, radius, 0, Math.PI * 2);
        ctx.strokeStyle = `hsla(${b.hue},100%,78%,${.18 + audioData.level})`;
        ctx.lineWidth = 1.2 + audioData.treble * 2;
        ctx.stroke();
      }
    }

    function drawWave(audioData) {
      const chaos = Number(chaosPower.value) / 100;
      const amp = 30 + audioData.level * 130 + audioData.bass * 120;
      const baseY = height * .79;

      ctx.save();
      ctx.beginPath();

      for (let x = 0; x <= width; x += 7) {
        const y =
          baseY
          + Math.sin(x * .018 + Date.now() * .005) * amp
          + Math.sin(x * .045 + Date.now() * .009) * amp * chaos * .75;

        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.strokeStyle = `rgba(255, 43, 214, ${.35 + audioData.level})`;
      ctx.lineWidth = 3 + audioData.bass * 7;
      ctx.shadowBlur = 34;
      ctx.shadowColor = "#ff2bd6";
      ctx.stroke();

      ctx.beginPath();

      for (let x = 0; x <= width; x += 7) {
        const y =
          baseY + 22
          + Math.cos(x * .014 + Date.now() * .004) * amp * .65;

        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.strokeStyle = `rgba(0, 234, 255, ${.25 + audioData.mid})`;
      ctx.shadowColor = "#00eaff";
      ctx.stroke();

      ctx.restore();
    }

    function drawSparks(audioData) {
      const chaos = Number(chaosPower.value) / 100;

      for (const s of sparks) {
        s.x += s.vx * (1 + chaos * 2 + audioData.treble * 3);
        s.y += s.vy * (1 + chaos * 2 + audioData.treble * 3);
        s.life -= .35 + audioData.treble;

        if (s.life <= 0 || s.x < 0 || s.x > width || s.y < 0 || s.y > height) {
          Object.assign(s, makeSpark());
        }

        ctx.beginPath();
        ctx.arc(s.x, s.y, 1 + audioData.treble * 3, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${s.hue},100%,70%,${Math.min(1, s.life / 50)})`;
        ctx.shadowBlur = 18;
        ctx.shadowColor = s.hue === 190 ? "#00eaff" : "#ff2bd6";
        ctx.fill();
      }

      ctx.shadowBlur = 0;
    }

    function drawBassFlash(audioData) {
      if (audioData.bass > .55) {
        ctx.fillStyle = `rgba(255,255,255,${(audioData.bass - .55) * .22})`;
        ctx.fillRect(0, 0, width, height);
      }
    }

    function animate() {
      const audioData = getAudioData();

      drawBackground(audioData);
      drawGrid(audioData);
      drawVisualizer(audioData);
      drawBubbles(audioData);
      drawWave(audioData);
      drawSparks(audioData);
      drawBassFlash(audioData);

      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", () => {
      resize();
      initParticles();
    });

    playBtn.addEventListener("click", startSound);

    document.body.addEventListener("pointerdown", () => {
      if (!hasStarted) startSound();
    }, { once: true });

    updateCountdown();
    setInterval(updateCountdown, 1000);

    resize();
    initParticles();
    animate();
  </script>
</body>
</html>
