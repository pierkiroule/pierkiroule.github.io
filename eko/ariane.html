<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Le Défi d’Eko — Fil d'@riane</title>



<style>

:root{
--bg:#0c0e13;
--panel:#171a21;
--panel2:#1f2430;
--text:#f3f5f7;
--muted:#b8c0cc;
--line:#2a3140;
--accent:#8b5cf6;
--blue:#3b82f6;
--red:#ef4444;
--radius:18px;
}

*{box-sizing:border-box}

body{
margin:0;
background:#0c0e13;
color:var(--text);
font-family:system-ui;
}

.hidden{display:none}

.btn{
background:linear-gradient(135deg,var(--blue),var(--accent));
border:none;
padding:14px;
border-radius:12px;
font-weight:bold;
color:white;
cursor:pointer;
font-size:1rem;
}

.challenge-wrap{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:30px;
}

.challenge-card{
max-width:600px;
background:var(--panel);
border:1px solid var(--line);
border-radius:20px;
padding:30px;
text-align:center;
}

video{
width:100%;
border-radius:15px;
margin-top:15px;
}

.scan-frame{
position:absolute;
width:200px;
height:200px;
border:3px dashed var(--accent);
border-radius:20px;
top:50%;
left:50%;
transform:translate(-50%,-50%);
pointer-events:none;
}

.status{
margin-top:10px;
color:var(--muted);
}

.app{
width:min(850px,calc(100% - 30px));
margin:auto;
padding:40px 0;
}

.card{
background:var(--panel);
border:1px solid var(--line);
border-radius:var(--radius);
padding:25px;
margin-bottom:20px;
}

textarea{
width:100%;
min-height:90px;
background:#0a0c10;
border:1px solid var(--line);
border-radius:12px;
padding:14px;
color:white;
font:inherit;
}

.result-card{
display:none;
background:white;
color:#1e293b;
padding:40px;
}

.res-block{
margin-bottom:20px;
}

.help{
background:#fff1f2;
border:2px solid var(--red);
border-radius:15px;
padding:18px;
margin-top:25px;
}

.help-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.help-box{
background:white;
border:1px solid #fecaca;
border-radius:10px;
padding:10px;
text-align:center;
text-decoration:none;
color:inherit;
}

.sigs{
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
margin-top:40px;
}

.sig-line{
border-bottom:1px solid #1e293b;
height:45px;
}

@media(max-width:600px){
.help-grid,.sigs{grid-template-columns:1fr}
}

</style>
</head>

<body>

<!-- Écran Défi -->

<section id="challengeScreen" class="challenge-wrap">

<div class="challenge-card">

<h1>Le Défi d’Eko</h1>



<div style="position:relative">


</div>

<canvas id="canvas" style="display:none"></canvas>



</section>

<!-- App -->

<div id="mainApp" class="app hidden">

<section class="card">

<h2>Notre Fil d'@riane</h2>

<p>Créer ensemble un pacte numérique.</p>

<label>Ce que nous aimons dans le numérique</label>
<textarea id="in1"></textarea>

<label>Les pièges du labyrinthe</label>
<textarea id="in2"></textarea>

<label>Nos repères</label>
<textarea id="in3"></textarea>

<label>Notre pacte</label>
<textarea id="in4"></textarea>

<button class="btn" onclick="generate()">Générer</button>

</section>

<div id="resultCard" class="card result-card">

<h2>NOTRE FIL D'@RIANE</h2>

<div class="res-block">
<h3>Lumières</h3>
<p id="out1"></p>
</div>

<div class="res-block">
<h3>Minotaures</h3>
<p id="out2"></p>
</div>

<div class="res-block">
<h3>Repères</h3>
<p id="out3"></p>
</div>

<div class="res-block">
<h3>Engagement</h3>
<p id="out4"></p>
</div>

<div class="help">

<div style="text-align:center;font-weight:bold;color:red">
AIDE
</div>

<div class="help-grid">

<a href="tel:3018" class="help-box">3018</a>
<a href="https://www.e-enfance.org" target="_blank" class="help-box">e-Enfance</a>
<a href="https://www.netecoute.fr" target="_blank" class="help-box">NetÉcoute</a>

</div>

</div>

<div class="sigs">

<div>
<div class="sig-line"></div>
Parent
</div>

<div>
<div class="sig-line"></div>
Ado
</div>

</div>

<button class="btn" onclick="window.print()">Imprimer</button>

</div>

</div>

<script>

let video=document.getElementById("video")
let canvas=document.getElementById("canvas")
let ctx=canvas.getContext("2d")
let status=document.getElementById("status")

let detectCounter=0
let unlocked=false

async function startCamera(){

let stream=await navigator.mediaDevices.getUserMedia({video:true})

video.srcObject=stream

status.innerText="Montre le symbole @"

setInterval(processFrame,600)

}

function detectAtSymbol(contours){

let spiralScore=0
let holeDetected=false

for(let i=0;i<contours.size();i++){

let cnt=contours.get(i)

let area=cv.contourArea(cnt)

if(area>2000){

let peri=cv.arcLength(cnt,true)

let approx=new cv.Mat()

cv.approxPolyDP(cnt,approx,0.01*peri,true)

if(approx.rows>10){
spiralScore++
}

let rect=cv.boundingRect(cnt)

if(rect.width/rect.height>0.7 && rect.width/rect.height<1.3){
holeDetected=true
}

approx.delete()

}

cnt.delete()

}

if(spiralScore>=2 && holeDetected){
return true
}

return false

}

function processFrame(){

if(unlocked) return

canvas.width=video.videoWidth
canvas.height=video.videoHeight

ctx.drawImage(video,0,0)

let src=cv.imread(canvas)
let gray=new cv.Mat()

cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY)

let edges=new cv.Mat()

cv.Canny(gray,edges,60,140)

let contours=new cv.MatVector()
let hierarchy=new cv.Mat()

cv.findContours(edges,contours,hierarchy,cv.RETR_TREE,cv.CHAIN_APPROX_SIMPLE)

if(detectAtSymbol(contours)){

detectCounter++

if(detectCounter>=3){

unlockApp()

}

}else{

detectCounter=0

}

src.delete()
gray.delete()
edges.delete()
contours.delete()
hierarchy.delete()

}

function unlockApp(){

unlocked=true

document.getElementById("challengeScreen").classList.add("hidden")

document.getElementById("mainApp").classList.remove("hidden")

}

function val(id){

let v=document.getElementById(id).value

return v || "À définir ensemble"

}

function generate(){

document.getElementById("out1").innerText=val("in1")
document.getElementById("out2").innerText=val("in2")
document.getElementById("out3").innerText=val("in3")
document.getElementById("out4").innerText=val("in4")

let r=document.getElementById("resultCard")

r.style.display="block"

r.scrollIntoView({behavior:"smooth"})

}

</script>

</body>
</html>
