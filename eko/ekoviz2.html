
<!DOCTYPE html>  <html lang="fr">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Résonance Onirique - Le Tissage du @</title>  <style>  
    :root {  
        --accent: #d4ffd6;  
        --bg: #010402;  
    }  
    * { margin: 0; padding: 0; box-sizing: border-box; }  
    body {   
        background: var(--bg);   
        overflow: hidden;   
        cursor: none;  
        font-family: 'Inter', sans-serif;  
    }  
    canvas { position: fixed; inset: 0; }  
      
    /* Le symbole central */  
    #center-symbol {  
        position: fixed;  
        top: 50%;  
        left: 50%;  
        transform: translate(-50%, -50%);  
        font-size: 12rem;  
        color: var(--accent);  
        font-weight: 100;  
        pointer-events: none;  
        z-index: 5;  
        opacity: 0; /* Commence invisible */  
        transition: opacity 5s ease;  
        filter: blur(2px) drop-shadow(0 0 15px rgba(212, 255, 214, 0.3));  
        user-select: none;  
    }  
  
    #ui {  
        position: fixed; inset: 0;  
        display: flex; flex-direction: column;  
        align-items: center; justify-content: center;  
        background: black;  
        z-index: 100;  
        transition: opacity 2s ease;  
    }  
      
    .instruction {  
        color: var(--accent);  
        font-weight: 100;  
        letter-spacing: 0.8em;  
        text-transform: uppercase;  
        font-size: 0.7rem;  
        opacity: 0.5;  
        margin-top: 30px;  
        text-align: center;  
    }  
  
    
  
    .vignette {  
        position: fixed; inset: 0;  
        pointer-events: none;  
        background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.9) 100%);  
        z-index: 10;  
    }  
  
    @keyframes pulse {  
        0% { transform: scale(1); opacity: 0.5; }  
        50% { transform: scale(1.2); opacity: 1; }  
        100% { transform: scale(1); opacity: 0.5; }  
    }  
</style>  </head>  <body>    
<div id="center-symbol">@</div>  
<canvas id="c"></canvas>  
<div class="vignette"></div>  <div id="ui" onclick="startAudio()">  
    <div id="ring" style="width: 40px; height: 40px; border: 1px solid white; border-radius: 50%; animation: pulse 2s infinite"></div>  
    <p class="instruction">Tisser la connexion<br>(Cliquer pour commencer)</p>  
</div>  <script>  
const canvas = document.getElementById("c");  
const ctx = canvas.getContext("2d");  
const cursor = document.getElementById("cursor");  
const mainSymbol = document.getElementById("center-symbol");  
  
let W, H, t = 0;  
let analyser, data;  
let volume = 0, smoothVol = 0;  
let mouse = { x: window.innerWidth/2, y: window.innerHeight/2 };  
let symbolOpacity = 0;  
  
const SRCS = [  
    'https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=1600&q=60',  
    'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=60',  
    'https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=1600&q=60'  
];  
  
const imgs = SRCS.map(src => {  
    const i = new Image();  
    i.crossOrigin = "anonymous";  
    i.src = src;  
    return i;  
});  
  
let iA = 0, iB = 1, fade = 0;  
  
// Points pour former le symbole @ au centre (version canevas)  
let symbolPoints = [];  
function generateSymbolPoints() {  
    symbolPoints = [];  
    const tempCanvas = document.createElement('canvas');  
    const tCtx = tempCanvas.getContext('2d');  
    tempCanvas.width = 400;  
    tempCanvas.height = 400;  
    tCtx.textAlign = 'center';  
    tCtx.textBaseline = 'middle';  
    tCtx.font = 'bold 300px serif';  
    tCtx.fillText('@', 200, 200);  
      
    const pixels = tCtx.getImageData(0, 0, 400, 400).data;  
    for (let y = 0; y < 400; y += 12) {  
        for (let x = 0; x < 400; x += 12) {  
            if (pixels[(y * 400 + x) * 4] > 0) {  
                symbolPoints.push({  
                    ox: x - 200,   
                    oy: y - 200,  
                    phase: Math.random() * Math.PI * 2  
                });  
            }  
        }  
    }  
}  
  
window.addEventListener('mousemove', e => {  
    mouse.x = e.clientX;  
    mouse.y = e.clientY;  
    cursor.style.left = e.clientX + 'px';  
    cursor.style.top = e.clientY + 'px';  
});  
  
async function startAudio() {  
    document.getElementById("ui").style.opacity = "0";  
    setTimeout(() => document.getElementById("ui").remove(), 2000);  
      
    // Rendre le symbole HTML visible  
    mainSymbol.style.opacity = "0.25";  
  
    try {  
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });  
        const ac = new AudioContext();  
        analyser = ac.createAnalyser();  
        analyser.fftSize = 256;  
        ac.createMediaStreamSource(stream).connect(analyser);  
        data = new Uint8Array(analyser.frequencyBinCount);  
    } catch (e) { console.log("Audio non disponible"); }  
}  
  
function resize() {  
    W = canvas.width = window.innerWidth;  
    H = canvas.height = window.innerHeight;  
    generateSymbolPoints();  
}  
window.addEventListener("resize", resize);  
resize();  
  
let particles = Array.from({ length: 60 }, () => ({  
    x: Math.random() * W,  
    y: Math.random() * H,  
    vx: (Math.random() - 0.5),  
    vy: (Math.random() - 0.5),  
    size: Math.random() * 1.5 + 0.5,  
    history: []  
}));  
  
let nodes = Array.from({ length: 40 }, () => ({  
    x: Math.random() * W,  
    y: Math.random() * H,  
    vx: (Math.random() - 0.5) * 0.2,  
    vy: (Math.random() - 0.5) * 0.2,  
    phase: Math.random() * Math.PI * 2  
}));  
  
function loop() {  
    requestAnimationFrame(loop);  
    t += 0.005;  
  
    if (analyser) {
    analyser.getByteTimeDomainData(data);

    let sum = 0;
    for (let i = 0; i < data.length; i++) {
        const v = (data[i] - 128) / 128;
        sum += v * v;
    }

    const rms = Math.sqrt(sum / data.length);

    volume = Math.min(rms * 2.2, 1);
}

smoothVol += (volume - smoothVol) * 0.22;  
  
    // Mise à jour du symbole central (effets audio)  
    mainSymbol.style.filter = `blur(${2 + smoothVol * 20}px) drop-shadow(0 0 ${10 + smoothVol * 50}px var(--accent))`;  
    mainSymbol.style.transform = `translate(-50%, -50%) scale(${1 + smoothVol * 0.5})`;  
  
    if (symbolOpacity < 1) symbolOpacity += 0.001;  
  
    fade += 0.0015;   
    if (fade >= 1) {  
        fade = 0; iA = iB; iB = (iB + 1) % imgs.length;  
    }  
  
    const totalBlur = (Math.sin(fade * Math.PI) * 15) + (smoothVol * 35);  
      
    ctx.globalCompositeOperation = "source-over";  
    ctx.fillStyle = `rgba(1, 4, 2, ${0.12 + (smoothVol * 0.08)})`;  
    ctx.fillRect(0, 0, W, H);  
  
    ctx.save();  
    ctx.filter = `blur(${totalBlur}px) saturate(${1 + smoothVol})`;  
    [iA, iB].forEach((imgIdx, idx) => {  
        if (imgs[imgIdx].complete && imgs[imgIdx].naturalWidth !== 0) {  
            ctx.globalAlpha = (idx === 0 ? (1-fade) : fade) * 0.5;  
            ctx.drawImage(imgs[imgIdx], -20, -20, W+40, H+40);  
        }  
    });  
    ctx.restore();  
  
    const cx = W / 2, cy = H / 2;  
    ctx.globalCompositeOperation = "screen";  
  
    symbolPoints.forEach((p, idx) => {  
        const driftX = Math.cos(t + p.phase) * 5;  
        const driftY = Math.sin(t + p.phase) * 5;  
        const px = cx + p.ox + driftX;  
        const py = cy + p.oy + driftY;  
  
        if (idx % 3 === 0) {  
            const nextP = symbolPoints[(idx + 4) % symbolPoints.length];  
            const npx = cx + nextP.ox + Math.cos(t + nextP.phase) * 5;  
            const npy = cy + nextP.oy + Math.sin(t + nextP.phase) * 5;  
  
            ctx.beginPath();  
            ctx.moveTo(px, py);  
            ctx.lineTo(npx, npy);  
            ctx.strokeStyle = `rgba(212, 255, 214, ${symbolOpacity * (0.1 + smoothVol * 0.4)})`;  
            ctx.lineWidth = 0.5 + smoothVol;  
            ctx.stroke();  
        }  
  
        if (Math.random() > 0.98) {  
            ctx.fillStyle = `rgba(255, 255, 255, ${symbolOpacity * smoothVol})`;  
            ctx.beginPath();  
            ctx.arc(px, py, 1 + smoothVol * 3, 0, 7);  
            ctx.fill();  
        }  
    });  
  
    // Reste du code (Mycélium et Spores) identique...  
    nodes.forEach((n, i) => {  
        n.x += n.vx + Math.cos(t + n.phase) * 0.3;  
        n.y += n.vy + Math.sin(t + n.phase) * 0.3;  
        if(n.x < 0 || n.x > W) n.vx *= -1;  
        if(n.y < 0 || n.y > H) n.vy *= -1;  
        nodes.slice(i + 1).forEach(n2 => {  
            const d = Math.sqrt((n.x-n2.x)**2 + (n.y-n2.y)**2);  
            const range = 200 + smoothVol * 200;  
            if (d < range) {  
                ctx.beginPath();  
                ctx.moveTo(n.x, n.y);  
                ctx.lineTo(n2.x, n2.y);  
                const alpha = (1 - d/range) * (0.1 + smoothVol * 0.3);  
                ctx.strokeStyle = `rgba(212, 255, 214, ${alpha})`;  
                ctx.lineWidth = 0.6;  
                ctx.stroke();  
            }  
        });  
    });  
  
    particles.forEach(p => {  
        p.vx += Math.cos(t + p.x * 0.01) * 0.02;  
        p.vy += Math.sin(t + p.y * 0.01) * 0.02;  
        p.x += p.vx * (1 + smoothVol * 5);  
        p.y += p.vy * (1 + smoothVol * 5);  
        if(p.x < 0) p.x = W; if(p.x > W) p.x = 0;  
        if(p.y < 0) p.y = H; if(p.y > H) p.y = 0;  
        p.history.push({x: p.x, y: p.y});  
        if(p.history.length > 15) p.history.shift();  
        ctx.beginPath();  
        if(p.history.length > 0) ctx.moveTo(p.history[0].x, p.history[0].y);  
        p.history.forEach(h => ctx.lineTo(h.x, h.y));  
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.03 + smoothVol * 0.2})`;  
        ctx.lineWidth = p.size;  
        ctx.stroke();  
    });  
  
    cursor.style.width = (15 + smoothVol * 120) + 'px';  
    cursor.style.height = (15 + smoothVol * 120) + 'px';  
}  
  
loop();  
</script>  </body>  
</html>
