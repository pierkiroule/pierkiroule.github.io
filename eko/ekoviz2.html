<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résonance Onirique</title>

<style>

:root{
--accent:#d4ffd6;
--bg:#010402;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
background:var(--bg);
overflow:hidden;
cursor:none;
font-family:system-ui;
}

canvas{
position:fixed;
inset:0;
}

#symbol{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:14rem;
font-weight:100;
color:var(--accent);
pointer-events:none;
opacity:0;
z-index:5;
filter:blur(2px) drop-shadow(0 0 20px rgba(212,255,214,.4));
transition:opacity 3s;
}

#cursor{
width:20px;
height:20px;
border:1px solid var(--accent);
border-radius:50%;
position:fixed;
transform:translate(-50%,-50%);
pointer-events:none;
z-index:1000;
}

.vignette{
position:fixed;
inset:0;
pointer-events:none;
background:radial-gradient(circle,transparent 35%,rgba(0,0,0,.9)100%);
}

#ui{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
background:black;
z-index:100;
}

.instruction{
color:var(--accent);
letter-spacing:.7em;
font-size:.7rem;
opacity:.6;
margin-top:25px;
text-align:center;
}

@keyframes pulse{
0%{transform:scale(1);opacity:.4}
50%{transform:scale(1.2);opacity:1}
100%{transform:scale(1);opacity:.4}
}

</style>
</head>

<body>

<div id="cursor"></div>
<div id="symbol">@</div>
<canvas id="c"></canvas>
<div class="vignette"></div>

<div id="ui" onclick="startAudio()">
<div style="width:40px;height:40px;border:1px solid white;border-radius:50%;animation:pulse 2s infinite"></div>
<p class="instruction">tisser la connexion<br>cliquer pour commencer</p>
</div>

<script>

const canvas=document.getElementById("c")
const ctx=canvas.getContext("2d")
const symbol=document.getElementById("symbol")
const cursor=document.getElementById("cursor")

let W,H
let t=0

let analyser,data
let volume=0
let smoothVol=0

/* resize */

function resize(){
W=canvas.width=innerWidth
H=canvas.height=innerHeight
}
addEventListener("resize",resize)
resize()

/* souris */

addEventListener("mousemove",e=>{
cursor.style.left=e.clientX+"px"
cursor.style.top=e.clientY+"px"
})

/* audio */

async function startAudio(){

document.getElementById("ui").remove()

symbol.style.opacity=.15

const stream=await navigator.mediaDevices.getUserMedia({audio:true})

const ac=new AudioContext()

const gain=ac.createGain()
gain.gain.value=3

analyser=ac.createAnalyser()
analyser.fftSize=1024
analyser.smoothingTimeConstant=.7

ac.createMediaStreamSource(stream)
.connect(gain)
.connect(analyser)

data=new Uint8Array(analyser.fftSize)

}

/* particules */

let particles=Array.from({length:90},()=>({

x:Math.random()*W,
y:Math.random()*H,

vx:(Math.random()-.5)*.4,
vy:(Math.random()-.5)*.4,

size:Math.random()*1.5+.5,

trail:[]

}))

/* nodes mycelium */

let nodes=Array.from({length:45},()=>({

x:Math.random()*W,
y:Math.random()*H,

vx:(Math.random()-.5)*.2,
vy:(Math.random()-.5)*.2,

phase:Math.random()*6

}))

/* volume */

function computeVolume(){

if(!analyser) return

analyser.getByteTimeDomainData(data)

let sum=0

for(let i=0;i<data.length;i++){

let v=(data[i]-128)/128
sum+=v*v

}

let rms=Math.sqrt(sum/data.length)

volume=Math.pow(rms*4,1.3)
volume=Math.min(volume,1)

}

/* loop */

function loop(){

requestAnimationFrame(loop)

t+=.01

computeVolume()

smoothVol+=(volume-smoothVol)*.25

/* symbole */

symbol.style.transform=`translate(-50%,-50%) scale(${1+smoothVol*1.5})`
symbol.style.filter=`blur(${2+smoothVol*40}px) drop-shadow(0 0 ${20+smoothVol*120}px rgba(212,255,214,.7))`

/* fond */

ctx.fillStyle=`rgba(1,4,2,${.12+smoothVol*.15})`
ctx.fillRect(0,0,W,H)

ctx.globalCompositeOperation="screen"

/* mycelium */

nodes.forEach((n,i)=>{

n.x+=n.vx+Math.cos(t+n.phase)*.4
n.y+=n.vy+Math.sin(t+n.phase)*.4

if(n.x<0||n.x>W)n.vx*=-1
if(n.y<0||n.y>H)n.vy*=-1

nodes.slice(i+1).forEach(n2=>{

let dx=n.x-n2.x
let dy=n.y-n2.y
let d=Math.sqrt(dx*dx+dy*dy)

let range=160+smoothVol*250

if(d<range){

ctx.beginPath()
ctx.moveTo(n.x,n.y)
ctx.lineTo(n2.x,n2.y)

ctx.strokeStyle=`rgba(212,255,214,${(1-d/range)*(.15+smoothVol*.4)})`
ctx.lineWidth=.4+smoothVol

ctx.stroke()

}

})

})

/* particules */

particles.forEach(p=>{

p.vx+=Math.cos(t+p.x*.01)*.02
p.vy+=Math.sin(t+p.y*.01)*.02

p.x+=p.vx*(1+smoothVol*6)
p.y+=p.vy*(1+smoothVol*6)

if(p.x<0)p.x=W
if(p.x>W)p.x=0
if(p.y<0)p.y=H
if(p.y>H)p.y=0

p.trail.push({x:p.x,y:p.y})
if(p.trail.length>18)p.trail.shift()

ctx.beginPath()

ctx.moveTo(p.trail[0].x,p.trail[0].y)

p.trail.forEach(pt=>{
ctx.lineTo(pt.x,pt.y)
})

ctx.strokeStyle=`rgba(255,255,255,${.04+smoothVol*.3})`
ctx.lineWidth=p.size

ctx.stroke()

})

/* curseur */

cursor.style.width=(18+smoothVol*160)+"px"
cursor.style.height=(18+smoothVol*160)+"px"

}

loop()

</script>

</body>
</html>
