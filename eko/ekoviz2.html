<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résonance Onirique - Le Tissage du @</title>

<style>
:root{
  --accent:#d4ffd6;
  --bg:#010402;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  overflow:hidden;
  cursor:none;
  font-family:'Inter',sans-serif;
}

canvas{
  position:fixed;
  inset:0;
}

#center-symbol{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:12rem;
  color:var(--accent);
  font-weight:100;
  pointer-events:none;
  z-index:5;
  opacity:0;
  transition:opacity 5s ease;
  filter:blur(2px) drop-shadow(0 0 15px rgba(212,255,214,0.3));
  user-select:none;
}

#ui{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:black;
  z-index:100;
  transition:opacity 2s ease;
}

.instruction{
  color:var(--accent);
  font-weight:100;
  letter-spacing:0.8em;
  text-transform:uppercase;
  font-size:0.7rem;
  opacity:0.5;
  margin-top:30px;
  text-align:center;
}

.vignette{
  position:fixed;
  inset:0;
  pointer-events:none;
  background:radial-gradient(circle, transparent 30%, rgba(0,0,0,0.9) 100%);
  z-index:10;
}

@keyframes pulse{
  0%{transform:scale(1);opacity:0.5;}
  50%{transform:scale(1.2);opacity:1;}
  100%{transform:scale(1);opacity:0.5;}
}
</style>
</head>

<body>

<div id="center-symbol">@</div>
<canvas id="c"></canvas>
<div class="vignette"></div>

<div id="ui" onclick="startAudio()">
  <div id="ring" style="width:40px;height:40px;border:1px solid white;border-radius:50%;animation:pulse 2s infinite"></div>
  <p class="instruction">Tisser la connexion<br>(Cliquer pour commencer)</p>
</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const mainSymbol = document.getElementById("center-symbol");

let W = 0;
let H = 0;
let t = 0;

let analyser = null;
let data = null;
let volume = 0;
let smoothVol = 0;
let symbolOpacity = 0;

const SRCS = [
  "https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=1600&q=60",
  "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=60",
  "https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=1600&q=60"
];

const imgs = SRCS.map(src => {
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.src = src;
  return img;
});

let iA = 0;
let iB = 1;
let fade = 0;

/* points du symbole @ */
let symbolPoints = [];

function generateSymbolPoints(){
  symbolPoints = [];

  const tempCanvas = document.createElement("canvas");
  const tCtx = tempCanvas.getContext("2d");

  tempCanvas.width = 400;
  tempCanvas.height = 400;

  tCtx.clearRect(0, 0, 400, 400);
  tCtx.textAlign = "center";
  tCtx.textBaseline = "middle";
  tCtx.font = "bold 300px serif";
  tCtx.fillStyle = "#fff";
  tCtx.fillText("@", 200, 200);

  const pixels = tCtx.getImageData(0, 0, 400, 400).data;

  for(let y = 0; y < 400; y += 12){
    for(let x = 0; x < 400; x += 12){
      if(pixels[(y * 400 + x) * 4] > 0){
        symbolPoints.push({
          ox: x - 200,
          oy: y - 200,
          phase: Math.random() * Math.PI * 2
        });
      }
    }
  }
}

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  generateSymbolPoints();
}

window.addEventListener("resize", resize);
resize();

/* audio */
async function startAudio(){
  const ui = document.getElementById("ui");
  ui.style.opacity = "0";
  setTimeout(() => ui.remove(), 2000);

  mainSymbol.style.opacity = "0.22";

  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });

    const ac = new (window.AudioContext || window.webkitAudioContext)();

    const source = ac.createMediaStreamSource(stream);
    const gainNode = ac.createGain();
    gainNode.gain.value = 1.5;

    analyser = ac.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.7;

    source.connect(gainNode);
    gainNode.connect(analyser);

    data = new Uint8Array(analyser.fftSize);

  }catch(e){
    console.log("Audio non disponible", e);
  }
}

/* particules */
let particles = Array.from({ length: 36 }, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  vx: (Math.random() - 0.5) * 0.35,
  vy: (Math.random() - 0.5) * 0.35,
  size: Math.random() * 1.8 + 0.8,
  history: []
}));

/* noeuds mycéliens */
let nodes = Array.from({ length: 34 }, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  vx: (Math.random() - 0.5) * 0.18,
  vy: (Math.random() - 0.5) * 0.18,
  phase: Math.random() * Math.PI * 2
}));

function computeVolume(){
  if(!analyser || !data) return;

  analyser.getByteTimeDomainData(data);

  let sum = 0;
  for(let i = 0; i < data.length; i++){
    const v = (data[i] - 128) / 128;
    sum += v * v;
  }

  const rms = Math.sqrt(sum / data.length);
  volume = Math.min(Math.pow(rms * 2.8, 0.95), 1);
}

function drawBackground(){
  fade += 0.0015;

  if(fade >= 1){
    fade = 0;
    iA = iB;
    iB = (iB + 1) % imgs.length;
  }

  const totalBlur = (Math.sin(fade * Math.PI) * 15) + (smoothVol * 35);

  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = `rgba(1,4,2,${0.12 + smoothVol * 0.08})`;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.filter = `blur(${totalBlur}px) saturate(${1 + smoothVol})`;

  [iA, iB].forEach((imgIdx, idx) => {
    const img = imgs[imgIdx];
    if(img.complete && img.naturalWidth !== 0){
      ctx.globalAlpha = (idx === 0 ? 1 - fade : fade) * 0.5;
      ctx.drawImage(img, -20, -20, W + 40, H + 40);
    }
  });

  ctx.restore();
}

function drawSymbolSpores(){
  const cx = W / 2;
  const cy = H / 2;

  ctx.globalCompositeOperation = "screen";

  symbolPoints.forEach((p) => {
    const driftX = Math.cos(t + p.phase) * 5;
    const driftY = Math.sin(t + p.phase) * 5;

    const px = cx + p.ox + driftX;
    const py = cy + p.oy + driftY;

    if(Math.random() > 0.982){
      ctx.fillStyle = `rgba(255,255,255,${symbolOpacity * (0.18 + smoothVol * 0.9)})`;
      ctx.beginPath();
      ctx.arc(px, py, 0.8 + smoothVol * 2.8, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

function drawMycelium(){
  ctx.globalCompositeOperation = "screen";

  nodes.forEach((n, i) => {
    n.x += n.vx + Math.cos(t + n.phase) * 0.25;
    n.y += n.vy + Math.sin(t + n.phase) * 0.25;

    if(n.x < 0 || n.x > W) n.vx *= -1;
    if(n.y < 0 || n.y > H) n.vy *= -1;

    nodes.slice(i + 1).forEach(n2 => {
      const dx = n.x - n2.x;
      const dy = n.y - n2.y;
      const d = Math.sqrt(dx * dx + dy * dy);

      const range = 160 + smoothVol * 150;

      if(d < range){
        const alpha = (1 - d / range) * (0.08 + smoothVol * 0.28);

        const mx = (n.x + n2.x) / 2 + Math.sin(t + n.phase + i * 0.3) * 18;
        const my = (n.y + n2.y) / 2 + Math.cos(t + n.phase + i * 0.3) * 18;

        ctx.beginPath();
        ctx.moveTo(n.x, n.y);
        ctx.quadraticCurveTo(mx, my, n2.x, n2.y);
        ctx.strokeStyle = `rgba(212,255,214,${alpha})`;
        ctx.lineWidth = 0.5 + smoothVol * 0.4;
        ctx.stroke();
      }
    });
  });
}

function drawParticles(){
  ctx.globalCompositeOperation = "screen";

  particles.forEach(p => {
    p.vx += Math.cos(t + p.x * 0.01) * 0.01;
    p.vy += Math.sin(t + p.y * 0.01) * 0.01;

    p.x += p.vx * (1 + smoothVol * 3);
    p.y += p.vy * (1 + smoothVol * 3);

    if(p.x < 0) p.x = W;
    if(p.x > W) p.x = 0;
    if(p.y < 0) p.y = H;
    if(p.y > H) p.y = 0;

    p.history.push({ x: p.x, y: p.y });
    if(p.history.length > 8) p.history.shift();

    ctx.beginPath();
    ctx.moveTo(p.history[0].x, p.history[0].y);

    p.history.forEach(h => {
      ctx.lineTo(h.x, h.y);
    });

    ctx.strokeStyle = `rgba(255,255,255,${0.12 + smoothVol * 0.28})`;
    ctx.lineWidth = p.size;
    ctx.stroke();
  });
}

function animateSymbol(){
  mainSymbol.style.filter =
    `blur(${2 + smoothVol * 20}px) drop-shadow(0 0 ${10 + smoothVol * 50}px rgba(212,255,214,0.45))`;

  mainSymbol.style.transform =
    `translate(-50%, -50%) scale(${1 + smoothVol * 0.55})`;
}

function loop(){
  requestAnimationFrame(loop);
  t += 0.005;

  computeVolume();
  smoothVol += (volume - smoothVol) * 0.2;

  if(symbolOpacity < 1) symbolOpacity += 0.0012;

  animateSymbol();
  drawBackground();
  drawSymbolSpores();
  drawMycelium();
  drawParticles();
}

loop();
</script>

</body>
</html>
