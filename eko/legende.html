<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La légende d’Eko — l’influenceur influencé</title>
    <!-- Tailwind CSS pour un design fluide et responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,500;1,600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617; /* slate-950 */
        }
        .font-serif-poetic {
            font-family: 'Playfair Display', Georgia, serif;
        }
        /* Effet de lueur douce et mystérieuse */
        .glow-cyan {
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.15);
        }
        .glow-purple {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.15);
        }
        /* Transition douce pour les changements d'écran */
        .screen-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Masquer la scrollbar pour une immersion console */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* La révélation finale devient un paysage vivant, pas un simple lecteur audio. */
        .soundscape-stage {
            position: relative;
            min-height: 330px;
            overflow: hidden;
            isolation: isolate;
            background:
                radial-gradient(circle at 50% 48%, rgba(34, 211, 238, .16), transparent 25%),
                radial-gradient(circle at 20% 15%, rgba(236, 72, 153, .13), transparent 32%),
                radial-gradient(circle at 80% 85%, rgba(139, 92, 246, .18), transparent 35%),
                #030817;
        }
        .soundscape-stage::before {
            content: "";
            position: absolute;
            inset: -50%;
            z-index: -1;
            background: conic-gradient(from 90deg, transparent, rgba(34,211,238,.08), transparent, rgba(217,70,239,.1), transparent);
            animation: soundscape-aurora 16s linear infinite;
        }
        .soundscape-stage.is-playing {
            box-shadow: inset 0 0 80px rgba(34,211,238,.13), 0 0 35px rgba(139,92,246,.16);
        }
        .soundscape-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
        .soundscape-copy { position: relative; z-index: 2; pointer-events: none; }
        .soundscape-controls { position: relative; z-index: 3; }
        .soundscape-play { box-shadow: 0 0 0 0 rgba(34,211,238,.35); }
        .is-playing .soundscape-play { animation: soundscape-pulse 1.8s ease-out infinite; }
        @keyframes soundscape-aurora { to { transform: rotate(360deg); } }
        @keyframes soundscape-pulse {
            70% { box-shadow: 0 0 0 18px rgba(34,211,238,0); }
            100% { box-shadow: 0 0 0 0 rgba(34,211,238,0); }
        }
        @media (prefers-reduced-motion: reduce) {
            .soundscape-stage::before, .is-playing .soundscape-play { animation: none; }
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-purple-950 selection:text-cyan-300">

    <!-- CONTENEUR GLOBAL SÉCURISÉ -->
    <div id="game-container" class="flex-1 flex flex-col w-full max-w-xl mx-auto px-4 py-4 md:py-6 justify-between">
        
        <!-- HEADER DE L'APPLICATION -->
        <header class="border-b border-slate-850 pb-3 mb-6 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="navigateTo('home')">
                <span class="text-2xl animate-pulse">🧵</span>

                    <h1 class="text-xs font-extrabold tracking-widest uppercase text-cyan-400">La Légende d'Eko</h1>

                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="anim-toggle" onclick="toggleAnimations()" class="text-[10px] px-2.5 py-1 rounded bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-400 transition-all">
                    ✨ Anim : ON
                </button>
                <button onclick="navigateTo('collection')" class="relative p-2 rounded-full hover:bg-slate-900 transition-colors" title="Consulter la collection">
                    📂 <span id="collection-badge" class="absolute -top-1 -right-1 bg-cyan-500 text-slate-950 text-[9px] font-extrabold rounded-full w-4 h-4 flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </header>

        <!-- ZONE D'EXPOSITION DU CONTENU DYNAMIQUE -->
        <main id="main-content" class="flex-1 flex flex-col justify-center">
            <!-- Injecté de manière dynamique par le script JS -->
        </main>

        <!-- PIED DE PAGE POÉTIQUE -->
        <footer class="mt-8 border-t border-slate-900 pt-4 pb-2 text-center">
            <p class="text-[10px] text-slate-500 uppercase tracking-widest">
                Atelier de médiation douce • Cadre protecteur et contenant
            </p>
            <p class="text-[9px] text-slate-600 mt-1">
                L'exploration respecte votre propre rythme. Parlez, respirez, revenez à vous.
            </p>
        </footer>
    </div>

    <!-- NOTIFICATION SÉCURISÉE (TOAST) -->
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 border border-cyan-500/50 text-cyan-300 text-xs px-4 py-3 rounded-full shadow-lg shadow-cyan-950/50 flex items-center gap-2 max-w-[90%] text-center opacity-0 pointer-events-none transition-all duration-300">
        <span class="text-cyan-400">✦</span> <span id="toast-text">Notification</span>
    </div>

    <!-- DIALOGUE DE CONFIRMATION SÉCURISÉ (MODALE CUSTOM) -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-sm space-y-4 shadow-2xl">
            <h4 class="text-sm font-bold uppercase tracking-widest text-pink-400" id="confirm-title">Attention</h4>

            <div class="flex gap-2 pt-2">
                <button id="confirm-cancel-btn" class="flex-1 py-2 px-3 rounded-xl bg-slate-950 border border-slate-800 hover:bg-slate-850 text-xs font-semibold text-slate-400 transition-colors">Annuler</button>
                <button id="confirm-ok-btn" class="flex-1 py-2 px-3 rounded-xl bg-pink-950/40 hover:bg-pink-900/50 border border-pink-700/50 text-xs font-semibold text-pink-300 transition-colors">Confirmer</button>
            </div>

    </div>

                question: "Qu’est-ce qu’on cherche parfois dans un écran qu’une vraie relation pourrait mieux donner ?",
                wisdom: "Je vaux plus que mon reflet.",
                resource: "Retrouver une personne ou un lieu où je n’ai pas besoin de me mettre en scène.",

                narrativeExcerpt: "<b>Fiche de fouille #3 — Enregistrement caméra d'Eko (Février 2022) :</b><br>« Nous observons que sur ses vidéos, Eko ne regarde plus l'objectif (qui symbolise les autres), mais fixe constamment son propre retour écran. Il confie à voix basse : 'J'ai peur que si les gens me voient sans filtre ou fatigué, ils découvrent que je n'ai rien de spécial. J'ai l'impression de n'exister que si je suis reflété par cette dalle de verre. Sans elle, je suis invisible.' »"
            },
            {
                id: 4,
                name: "Le Minotaure Algorithmique",
                fossil: "La Boussole Détraquée",
                icon: "🧭",
                type: "Influence",
                power: "Signaler les forces qui orientent nos choix",
                vulnerability: "Obéir à trop de voix en même temps",
                question: "Comment reconnaître une voix qui guide d’une voix qui enferme ?",
                wisdom: "Je peux écouter sans obéir à toutes les voix.",
                resource: "Distinguer ce qui m’aide, ce qui m’épuise, ce qui me remet en lien.",
                defaultPrompt: "Un labyrinthe numérique vu de haut, lignes lumineuses violettes et bleues, boussole douce au premier plan, présence symbolique non menaçante au centre, style mythologique futuriste, symbole des voix algorithmiques, atmosphère contenant, aucun élément violent.",
                narrativeExcerpt: "<b>Fiche de fouille #4 — Console système d'Eko (Avril 2022) :</b><br>« Une alerte automatique de sa plateforme d'hébergement s'est déclenchée : 'Baisse d'engagement de 14%. Publiez plus souvent pour rester visible.' Eko a répondu sur son journal intime : 'Je voulais juste prendre deux semaines pour écrire une chanson acoustique douce. Mais la machine me dit que si je ralentis, je vais disparaître. Je cours dans un labyrinthe invisible.' »"
            },
            {
                id: 5,
                name: "Le Passeur de Résonance",
                fossil: "Le Fil Lumineux",
                icon: "🧵",
                type: "Ressource",
                power: "Retrouver ce qui sonne juste",
                vulnerability: "Oublier son fil quand les voix deviennent trop fortes",

                wisdom: "J’ai un fil pour revenir.",
                resource: "Une personne, un lieu, un son, un geste, une phrase.",
                defaultPrompt: "Un fil lumineux très fin traversant un paysage numérique nocturne, reliant des fragments doux comme un son, une main, une étoile, une respiration, couleurs cyan violet or, ambiance sécurisante et poétique, symbole de résonance et de retour à soi, style conte transnumériste initiatique.",
                narrativeExcerpt: "<b>Fiche de fouille #5 — Journal audio enregistré hors-ligne (Juin 2022) :</b><br>« Nous trouvons ce fichier, enregistré loin d'internet. On entend Eko souffler : 'Aujourd'hui, j'ai débranché la connexion pendant deux heures. Au début, j'ai eu un vertige immense, une panique physique. Et puis, je me suis assis. J'ai écouté le vent dans les arbres de mon voisin. J'avais oublié que le vrai monde avait un bruit si simple. Un tout petit fil de calme s'est recousu en moi.' »"
            },
            {
                id: 6,
                name: "La Sentinelle du Corps",
                fossil: "Le Capteur Endormi",
                icon: "🫀",
                type: "Corps",
                power: "Sentir avant de comprendre",
                vulnerability: "Ignorer les signaux faibles",
                question: "Ton corps sait parfois quelque chose avant ta tête. Comment te le montre-t-il ?",
                wisdom: "Mon corps peut être une boussole.",
                resource: "Identifier une sensation simple : tension, chaleur, fatigue, appui, respiration.",
                defaultPrompt: "Un petit capteur lumineux posé près d’un cœur symbolique, paysage intérieur doux, lignes de respiration, couleurs chaudes mêlées à du bleu nocturne, ambiance calme et protectrice, symbole du corps comme boussole, style poétique futuriste, aucun danger, présence apaisante.",
                narrativeExcerpt: "<b>Fiche de fouille #6 — Rapports biométriques restaurés (Août 2022) :</b><br>« Son bracelet connecté affichait une tension cardiaque élevée et une respiration superficielle. Eko écrit : 'Mon corps essayait de me parler depuis des mois. J'avais la gorge serrée dès que j'ouvrais les applications, un nœud dans le ventre avant chaque stream. Aujourd'hui, j'ai posé ma main sur mon cœur. J'ai fermé les yeux et j'ai respiré, longuement, pour lui dire merci d'avoir tenu bon.' »"
            },
            {
                id: 7,
                name: "Le Jardinier des Liens",
                fossil: "La Graine Connectée",
                icon: "🌱",
                type: "Relation",
                power: "Transformer le réseau en lien vivant",
                vulnerability: "Confondre contact et rencontre",
                question: "Qui ou quoi t’aide à te sentir vraiment relié ?",
                wisdom: "Le lien vivant se cultive.",
                resource: "Nourrir une relation réelle, même par un petit geste.",
                defaultPrompt: "Une graine lumineuse reliée à de fins fils numériques qui deviennent des racines vivantes, ambiance douce, terre nocturne et halos cyan, symbole du lien vivant dans le monde numérique, style conte écologique transnumériste, composition poétique, aucun danger, sentiment de croissance et de soin.",
                narrativeExcerpt: "<b>Fiche de fouille #7 — Dernier mémo d'Eko avant sa transition saine (Octobre 2022) :</b><br>« Eko n'a pas abandonné le monde. Il a juste réajusté son équilibre. Il termine par ces mots lumineux : 'J'ai éteint la diffusion permanente de ma vie pour recommencer à la vivre. J'ai planté des herbes aromatiques sur mon balcon. Quand des amis viennent, nous laissons les téléphones dans une corbeille. Le numérique n'est plus ma cage, il est redevenu mon outil. Je suis revenu à la maison.' »"
            }
        ];

        // --- ÉTAT GLOBAL DE L'APPLICATION ---
        let state = {
            screen: 'home', // 'home', 'intro', 'quest', 'collection'
            currentArchetypeIndex: 0,
            questSubStep: 1, // 1: Fossil & Narratif, 2: Question projective, 3: Fiche de l'archétype & Prompt
            collection: {}, // Format: { archetypeId: { prompt: string, collectedAt: string } }
            animations: true
        };

        let soundscapeAudioContext = null;
        let soundscapeSource = null;
        let soundscapeAnalyser = null;
        let soundscapeFrame = null;

        // --- CHARGEMENT DU LOCALSTORAGE ---
        function loadState() {
            try {
                const saved = localStorage.getItem('eko_full_save');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state.collection = parsed.collection || {};
                    state.currentArchetypeIndex = parsed.currentArchetypeIndex || 0;
                    state.questSubStep = parsed.questSubStep || 1;
                }
            } catch (e) {
                console.error("Impossible de charger la sauvegarde locale :", e);
            }
            updateCollectionBadge();
        }

        // --- SAUVEGARDE DANS LE LOCALSTORAGE ---
        function saveState() {
            try {
                localStorage.setItem('eko_full_save', JSON.stringify({
                    collection: state.collection,
                    currentArchetypeIndex: state.currentArchetypeIndex,
                    questSubStep: state.questSubStep
                }));
            } catch (e) {
                console.error("Erreur d'écriture dans localStorage :", e);
            }
            updateCollectionBadge();
        }

        // --- SYSTÈME DE NOTIFICATIONS CUSTOM (SANS ALERT) ---
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            toastText.textContent = message;
            
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // --- SYSTÈME DE CONFIRMATION CUSTOM (SANS CONFIRM) ---
        function showConfirmModal(title, message, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            const modalTitle = document.getElementById('confirm-title');
            const modalMessage = document.getElementById('confirm-message');
            const cancelBtn = document.getElementById('confirm-cancel-btn');
            const okBtn = document.getElementById('confirm-ok-btn');

            modalTitle.textContent = title;
            modalMessage.textContent = message;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100');

            const closeModal = () => {
                modal.classList.remove('opacity-100');
                modal.classList.add('opacity-0', 'pointer-events-none');
            };

            cancelBtn.onclick = () => {
                closeModal();
            };

            okBtn.onclick = () => {
                closeModal();
                onConfirm();
            };
        }

        // --- GESTION DES ANIMATIONS GLOBALES ---
        function toggleAnimations() {
            state.animations = !state.animations;
            const btn = document.getElementById('anim-toggle');
            if (state.animations) {
                btn.textContent = "✨ Anim : ON";
                btn.classList.add('bg-slate-900');
                btn.classList.remove('bg-slate-950', 'text-slate-500');
            } else {
                btn.textContent = "🔇 Anim : OFF";
                btn.classList.remove('bg-slate-900');
                btn.classList.add('bg-slate-950', 'text-slate-500');
            }
            // Force le rafraîchissement visuel pour appliquer ou stopper les animations
            render();
        }

        // --- MISE À JOUR DE L'ICÔNE DE NOTIFICATION DU SAC À DOS ---
        function updateCollectionBadge() {
            const badge = document.getElementById('collection-badge');
            const count = Object.keys(state.collection).length;
            if (count > 0) {
                badge.textContent = count;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // --- NAVIGATION DE L'APPLICATION (ROUTING SIMPLE) ---
        function navigateTo(screen, index = null, subStep = null) {
            state.screen = screen;
            if (index !== null) state.currentArchetypeIndex = index;
            if (subStep !== null) state.questSubStep = subStep;
            
            saveState();
            render();
            // Scroll doux vers le haut
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- RECONSTRUCTION DE L'INTERFACE SELON L'ÉTAT ---
        function render() {
            stopSoundscapeVisuals();
            const main = document.getElementById('main-content');
            
            if (state.screen === 'home') {
                main.innerHTML = renderHome();
            } else if (state.screen === 'intro') {
                main.innerHTML = renderIntro();
            } else if (state.screen === 'quest') {
                main.innerHTML = renderQuest();
            } else if (state.screen === 'collection') {
                main.innerHTML = renderCollection();
            }
        }

        function stopSoundscapeVisuals() {
            if (soundscapeFrame) cancelAnimationFrame(soundscapeFrame);
            soundscapeFrame = null;
            const audio = document.getElementById('eko-soundscape');
            if (audio) audio.pause();
            if (soundscapeAudioContext) soundscapeAudioContext.close();
            soundscapeAudioContext = null;
            soundscapeSource = null;
            soundscapeAnalyser = null;
        }

        async function toggleSoundscape() {
            const audio = document.getElementById('eko-soundscape');
            if (!audio) return;

            if (!soundscapeAudioContext) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                soundscapeAudioContext = new AudioContext();
                soundscapeAnalyser = soundscapeAudioContext.createAnalyser();
                soundscapeAnalyser.fftSize = 256;
                soundscapeAnalyser.smoothingTimeConstant = .82;
                soundscapeSource = soundscapeAudioContext.createMediaElementSource(audio);
                soundscapeSource.connect(soundscapeAnalyser);
                soundscapeAnalyser.connect(soundscapeAudioContext.destination);
            }

            if (soundscapeAudioContext.state === 'suspended') await soundscapeAudioContext.resume();
            if (audio.paused) {
                await audio.play();
                drawSoundscape();
            } else {
                audio.pause();
            }
            updateSoundscapeControls();
        }

        function updateSoundscapeControls() {
            const audio = document.getElementById('eko-soundscape');
            const stage = document.getElementById('soundscape-stage');
            const button = document.getElementById('soundscape-play');
            const label = document.getElementById('soundscape-status');
            if (!audio || !stage || !button || !label) return;
            const playing = !audio.paused && !audio.ended;
            stage.classList.toggle('is-playing', playing);
            button.textContent = playing ? '❚❚' : '▶';
            button.setAttribute('aria-label', playing ? 'Mettre le paysage sonore en pause' : 'Écouter le paysage sonore');
            label.textContent = playing ? 'Le paysage résonne — la bulle écoute chaque fréquence' : 'Touchez pour faire naître le paysage';
        }

        function drawSoundscape() {
            if (soundscapeFrame) cancelAnimationFrame(soundscapeFrame);
            soundscapeFrame = null;
            const canvas = document.getElementById('soundscape-canvas');
            const audio = document.getElementById('eko-soundscape');
            if (!canvas || !audio || !soundscapeAnalyser) return;
            const ctx = canvas.getContext('2d');
            const frequency = new Uint8Array(soundscapeAnalyser.frequencyBinCount);

            function paint() {
                const ratio = window.devicePixelRatio || 1;
                const width = canvas.clientWidth;
                const height = canvas.clientHeight;
                if (canvas.width !== width * ratio || canvas.height !== height * ratio) {
                    canvas.width = width * ratio;
                    canvas.height = height * ratio;
                }
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                ctx.clearRect(0, 0, width, height);
                soundscapeAnalyser.getByteFrequencyData(frequency);
                const bass = frequency.slice(0, 16).reduce((a, b) => a + b, 0) / (16 * 255);
                const energy = frequency.reduce((a, b) => a + b, 0) / (frequency.length * 255);
                const cx = width / 2, cy = height * .53;
                const base = Math.min(width, height) * (.16 + bass * .07);

                // Ondes concentriques, spectre orbital et cœur liquide audioreactif.
                for (let ring = 3; ring >= 1; ring--) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, base + ring * 23 + energy * ring * 17, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(${ring === 2 ? '217,70,239' : '34,211,238'},${.05 + energy * .18})`;
                    ctx.lineWidth = 1.3;
                    ctx.stroke();
                }
                const points = 96;
                ctx.beginPath();
                for (let i = 0; i <= points; i++) {
                    const angle = (i / points) * Math.PI * 2 - Math.PI / 2;
                    const bin = frequency[Math.floor((i % points) / points * frequency.length)] / 255;
                    const radius = base + bin * 38;
                    const x = cx + Math.cos(angle) * radius;
                    const y = cy + Math.sin(angle) * radius;
                    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
                }
                ctx.closePath();
                const glow = ctx.createRadialGradient(cx - base * .3, cy - base * .4, 4, cx, cy, base * 1.55);
                glow.addColorStop(0, `rgba(255,255,255,${.72 + energy * .25})`);
                glow.addColorStop(.28, `rgba(34,211,238,${.45 + bass * .4})`);
                glow.addColorStop(.67, `rgba(139,92,246,${.38 + energy * .4})`);
                glow.addColorStop(1, 'rgba(236,72,153,.06)');
                ctx.fillStyle = glow;
                ctx.shadowColor = '#22d3ee';
                ctx.shadowBlur = 22 + energy * 45;
                ctx.fill();
                ctx.shadowBlur = 0;

                for (let i = 0; i < 32; i++) {
                    const bin = frequency[i * 2] / 255;
                    const angle = i / 32 * Math.PI * 2;
                    const inner = base + 13;
                    const outer = inner + 8 + bin * 47;
                    ctx.beginPath();
                    ctx.moveTo(cx + Math.cos(angle) * inner, cy + Math.sin(angle) * inner);
                    ctx.lineTo(cx + Math.cos(angle) * outer, cy + Math.sin(angle) * outer);
                    ctx.strokeStyle = `hsla(${180 + i * 4},90%,68%,${.18 + bin * .72})`;
                    ctx.lineWidth = 1 + bin * 2.5;
                    ctx.stroke();
                }
                if (!audio.paused && !audio.ended && state.animations) soundscapeFrame = requestAnimationFrame(paint);
            }
            paint();
        }

                                    <textarea id="prompt-textarea-${arch.id}" class="w-full h-24 bg-slate-950 border border-slate-850 rounded-xl p-3 text-xs text-slate-300 focus:outline-none focus:border-cyan-500/50 transition-colors resize-none leading-relaxed no-scrollbar" placeholder="Saisissez ou modifiez votre prompt...">${currentPromptValue}</textarea>

                                    <div class="grid grid-cols-2 gap-2 pt-1">
                                        <button onclick="actionCopyPrompt(${arch.id})" class="py-2 px-3 rounded-lg bg-slate-900 hover:bg-slate-850 text-slate-300 border border-slate-800 text-[10px] font-bold uppercase tracking-wider flex items-center justify-center gap-1 transition-all">
                                            📋 Copier le prompt
                                        </button>
                                        <button onclick="actionExportCardJSON(${arch.id})" class="py-2 px-3 rounded-lg bg-slate-900 hover:bg-slate-850 text-slate-300 border border-slate-800 text-[10px] font-bold uppercase tracking-wider flex items-center justify-center gap-1 transition-all">
                                            💾 Exporter la carte
                                        </button>
                                    </div>
                                </div>

                            </div>

                            <!-- Bas de carte : Validation et sacoche -->
                            <div class="bg-slate-900/50 px-4 py-3 border-t border-slate-850 flex items-center">
                                <button onclick="actionAddCurrentToCollection()" class="w-full py-3 px-4 rounded-xl text-xs font-bold text-slate-950 bg-cyan-400 hover:bg-cyan-300 transition-all text-center flex items-center justify-center gap-1 uppercase tracking-wider">
                                    ${collectedData ? "✓ Mettre à jour dans la collection" : "✦ Conserver dans mon carnet"}
                                </button>
                            </div>
                        </div>

                        <!-- NAVIGATION DU PARCOURS -->
                        <div class="flex justify-between items-center gap-3 pt-2">
                            <button onclick="navigateTo('quest', ${state.currentArchetypeIndex}, 2)" class="flex-1 py-3 px-4 rounded-xl text-[10px] font-bold uppercase tracking-wider border border-slate-800 text-slate-400 hover:text-slate-300 text-center transition-colors">
                                ← Question
                            </button>

                            ${state.currentArchetypeIndex < 6 ? `
                                <button onclick="navigateTo('quest', ${state.currentArchetypeIndex + 1}, 1)" class="flex-1 py-3 px-4 rounded-xl text-[10px] font-bold uppercase tracking-wider bg-slate-900 hover:bg-slate-850 border border-slate-700 text-slate-200 text-center flex items-center justify-center gap-1 transition-all">
                                    Fossile suivant →
                                </button>
                            ` : `
                                <button onclick="navigateTo('collection')" class="flex-1 py-3 px-4 rounded-xl text-[10px] font-bold uppercase tracking-wider bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white text-center flex items-center justify-center gap-1 transition-all">
                                    Bilan de l'exploration ✨
                                </button>
                            `}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="space-y-5">
                    <!-- Entête d'étape -->
                    <div class="flex justify-between items-center text-[10px] text-slate-500 uppercase tracking-widest font-extrabold">
                        <span>Fossile ${state.currentArchetypeIndex + 1} de 7</span>
                        <span>Sagesse transnumériste</span>
                    </div>

                    <!-- Barre de progression -->
                    <div class="w-full bg-slate-900 rounded-full h-2 overflow-hidden">
                        <div class="bg-gradient-to-r from-cyan-400 to-purple-500 h-2 transition-all duration-500" style="width: ${progressPercent}%"></div>
                    </div>

                    <!-- Sous-contenu injecté -->
                    <div class="mt-4">
                        ${subStepContent}
                    </div>
                </div>
            `;
        }

        function renderCollection() {
            const count = Object.keys(state.collection).length;
            const progressPercent = (count / 7) * 100;

            let cardListHTML = '';
            ARCHETYPES.forEach(arch => {
                const collected = state.collection[arch.id];
                const isCollected = !!collected;

                cardListHTML += `
                    <div class="border rounded-xl overflow-hidden transition-all duration-300 ${isCollected ? 'border-cyan-500/20 bg-slate-900/40' : 'border-slate-850 bg-slate-950/20 opacity-60'}">
                        <!-- Résumé -->
                        <div class="p-3.5 flex items-center justify-between gap-3">
                            <div class="flex items-center gap-3">
                                <span class="text-3xl">${arch.icon}</span>
                                <div>
                                    <div class="flex items-center gap-1.5">
                                        <span class="text-[9px] text-slate-500 font-extrabold">#0${arch.id}</span>
                                        <h5 class="font-bold text-white text-xs tracking-wide">${arch.name}</h5>
                                    </div>
                                    <p class="text-[10px] text-slate-500">Fossile : ${arch.fossil}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-[9px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full ${isCollected ? 'text-cyan-400 bg-cyan-950/40 border border-cyan-800/40' : 'text-slate-500 bg-slate-900'}">
                                    ${isCollected ? 'Restauré' : 'À chercher'}
                                </span>
                                <button onclick="navigateTo('quest', ${arch.id - 1}, 3)" class="p-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 text-xs transition-colors" title="Consulter la fiche complète">
                                    👁️
                                </button>
                            </div>
                        </div>

                        <!-- Détails si collecté -->
                        ${isCollected ? `
                            <div class="bg-slate-950/50 p-3.5 border-t border-slate-850/60 text-xs space-y-2 leading-relaxed">
                                <p class="text-slate-300 text-[11px]">
                                    <strong class="text-purple-400 font-semibold uppercase tracking-wider text-[9px] block">Phrase-Mantra :</strong>
                                    « ${arch.wisdom} »
                                </p>
                                <p class="text-slate-300 text-[11px]">
                                    <strong class="text-indigo-400 font-semibold uppercase tracking-wider text-[9px] block">Ressource de retour à soi :</strong>
                                    ${arch.resource}
                                </p>
                                ${collected.prompt !== arch.defaultPrompt ? `
                                    <div class="mt-1.5 pt-1.5 border-t border-slate-900">
                                        <span class="text-[9px] font-extrabold text-cyan-500 uppercase tracking-widest block">Votre prompt ajusté :</span>
                                        <p class="text-[10px] text-slate-400 italic line-clamp-2 mt-0.5">${collected.prompt}</p>
                                    </div>
                                ` : ''}
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            return `
                <div class="space-y-6 text-left screen-transition">
                    <div class="flex items-center justify-between">
                        <div>
                            <span class="text-[9px] text-cyan-400 font-extrabold uppercase tracking-widest block">Musée Transnumériste</span>
                            <h3 class="text-2xl font-serif-poetic font-semibold text-white">L'Archive d'Eko</h3>
                        </div>
                        <button onclick="navigateTo('home')" class="text-[10px] font-bold uppercase tracking-wider px-3 py-1.5 rounded-lg border border-slate-800 hover:bg-slate-900 text-slate-400 transition-colors">
                            Fermer
                        </button>
                    </div>

                    <!-- Barre globale -->
                    <div class="bg-slate-900/40 border border-slate-850 p-4 rounded-xl space-y-2">
                        <div class="flex justify-between items-center text-xs text-slate-300 font-medium">
                            <span>Sagesse d'Eko restaurées</span>
                            <span class="font-extrabold text-cyan-400 text-sm">${count} / 7</span>
                        </div>
                        <div class="w-full bg-slate-950 rounded-full h-2 overflow-hidden">
                            <div class="bg-gradient-to-r from-cyan-400 via-indigo-500 to-purple-500 h-2 transition-all duration-700" style="width: ${progressPercent}%"></div>
                        </div>
                        <p class="text-[11px] text-slate-400 leading-relaxed pt-1">
                            À travers chaque cyber-fossile analysé et collecté, Eko a consolidé sa sagesse. Son histoire intime montre qu'il est possible de déconnecter pour mieux respirer.
                        </p>
                    </div>

                    <!-- Options d'exportation -->
                    ${count > 0 ? `
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="actionExportAllJSON()" class="py-3 px-3 rounded-xl bg-cyan-950/20 hover:bg-cyan-950/40 text-cyan-300 border border-cyan-800/40 text-[10px] font-bold uppercase tracking-wider flex items-center justify-center gap-1.5 transition-colors">
                                📥 Exporter la collection (JSON)
                            </button>
                            <button onclick="actionExportAllTXT()" class="py-3 px-3 rounded-xl bg-indigo-950/20 hover:bg-indigo-950/40 text-indigo-300 border border-indigo-800/40 text-[10px] font-bold uppercase tracking-wider flex items-center justify-center gap-1.5 transition-colors">
                                📝 Exporter la synthèse (TXT)
                            </button>
                        </div>
                    ` : ''}

                    <!-- Liste des cartes -->
                    <div class="space-y-4">
                        <h4 class="text-[10px] font-extrabold uppercase tracking-widest text-slate-500 border-b border-slate-900 pb-2">
                            Index des 7 figures d'exploration
                        </h4>

                        <div class="space-y-3">
                            ${cardListHTML}
                        </div>
                    </div>

                    <!-- ÉCRAN COMPLET ACCOMPLI -->
                    ${count === 7 ? `
                        <div class="border border-cyan-400/30 rounded-2xl overflow-hidden shadow-2xl">
                            <div id="soundscape-stage" class="soundscape-stage flex flex-col items-center justify-between p-6 text-center">
                                <canvas id="soundscape-canvas" class="soundscape-canvas" aria-hidden="true"></canvas>
                                <div class="soundscape-copy space-y-2">
                                    <span class="text-[9px] text-cyan-300 font-extrabold uppercase tracking-[.28em]">Révélation finale • cadeau sonore</span>
                                    <h4 class="text-xl font-serif-poetic font-semibold text-white">Le paysage retrouvé d’Eko</h4>
                                    <p class="text-[11px] text-slate-300 max-w-sm leading-relaxed">Sept fragments deviennent une seule onde. Écoutez : le vent, le lien et le vivant reprennent leur place.</p>
                                </div>
                                <div class="soundscape-controls flex flex-col items-center gap-3">
                                    <button id="soundscape-play" onclick="toggleSoundscape()" class="soundscape-play w-16 h-16 rounded-full bg-white/95 hover:bg-cyan-100 text-slate-950 text-xl flex items-center justify-center transition-transform hover:scale-105" aria-label="Écouter le paysage sonore">▶</button>
                                    <span id="soundscape-status" class="text-[10px] text-cyan-200 tracking-wide">Touchez pour faire naître le paysage</span>
                                </div>
                                <audio id="eko-soundscape" src="Mino.mp3" preload="metadata" onplay="updateSoundscapeControls()" onpause="updateSoundscapeControls()" onended="updateSoundscapeControls()"></audio>
                            </div>
                            <div class="bg-slate-950/95 p-5 text-center space-y-3 border-t border-cyan-500/20">
                                <p class="text-xs text-slate-300 leading-relaxed">Ce paysage sonore vous est offert comme un fil de retour : à réécouter quand les voix deviennent trop fortes, pour retrouver votre rythme et votre propre résonance.</p>
                                <a href="Mino.mp3" download="Le-paysage-retrouve-d-Eko.mp3" class="inline-flex items-center gap-2 py-2.5 px-4 rounded-full bg-cyan-950/50 hover:bg-cyan-900/60 border border-cyan-500/30 text-[10px] font-bold uppercase tracking-wider text-cyan-200 transition-colors">↓ Garder ce paysage sonore</a>
                            </div>
                        </div>
                    ` : ''}

                    <!-- Options de bas de page -->
                    <div class="pt-4 flex flex-col sm:flex-row gap-2">
                        <button onclick="navigateTo('quest', ${state.currentArchetypeIndex}, ${state.questSubStep})" class="flex-1 py-3.5 px-4 rounded-xl text-xs font-bold uppercase tracking-wider bg-slate-900 hover:bg-slate-850 border border-slate-800 text-slate-300 text-center transition-all">
                            Continuer la fouille active
                        </button>
                        <button onclick="actionResetAll()" class="py-3.5 px-4 rounded-xl text-xs font-bold uppercase tracking-wider text-pink-400 hover:text-pink-300 bg-pink-950/10 hover:bg-pink-950/20 border border-pink-900/20 text-center transition-all">
                            Réinitialiser l'atelier
                        </button>
                    </div>
                </div>
            `;
        }

        // --- APPEL INITIALISATION DE L'APPLICATION ---
        window.onload = function() {
            loadState();
            render();
        };
    </script>
</body>
</html>
