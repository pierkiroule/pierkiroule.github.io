<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fil du Ciel</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Georgia, serif;

  /* blocage interactions parasites */
  touch-action:none;
  overscroll-behavior:none;
  user-select:none;
}

canvas{display:block;}

/* écran départ */
#start{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:#000; color:#a8cfff;
  letter-spacing:.25em;
  z-index:10; cursor:pointer;
  transition:opacity 1.2s;
}
#start.hidden{opacity:0; pointer-events:none;}

#sub{
  color:#ffffff55;
  font-size:.8rem;
  margin-top:.5rem;
}

/* bouton fullscreen */
#fs{
  position:fixed;
  bottom:12px;
  right:14px;
  color:#9ecbff88;
  font-size:18px;
  cursor:pointer;
  z-index:20;
}

/* mode immersion total */
body.fullscreen-mode{
  cursor:none;
}
</style>
</head>

<body>

<div id="start">
  <div>fil de résonance</div>
  <div id="sub">toucher pour écouter</div>
</div>

<div id="fs">•°○</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/addons/p5.sound.min.js"></script>

<script>

let mic, fft;
let started=false, audioOK=false;
let wakeLock=null;

const N = 140;
let pts=[];
let phase=0;

let bubbles=[];
let hearts=[];

// ---------------- SETUP
function setup(){
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);

  for(let i=0;i<N;i++){
    pts.push(createVector(0,height/2));
  }

  document.getElementById("start").onclick=startExperience;
  document.getElementById("fs").onclick=toggleFullscreen;

  background(0);
}

// ---------------- START
async function startExperience(){

  if(started) return;
  started=true;

  await startAudio();
  await requestWakeLock();

  document.getElementById("start").classList.add("hidden");

  // auto fullscreen (important mobile)
  setTimeout(()=>toggleFullscreen(), 300);
}

// ---------------- AUDIO
async function startAudio(){
  try{
    await userStartAudio();
    mic=new p5.AudioIn();
    mic.start();

    fft=new p5.FFT(0.8,64);
    fft.setInput(mic);

    audioOK=true;
  }catch(e){
    audioOK=false;
  }
}

// ---------------- FULLSCREEN
async function toggleFullscreen(){

  try{
    if(!document.fullscreenElement){
      await document.documentElement.requestFullscreen();
      document.body.classList.add("fullscreen-mode");
    }else{
      await document.exitFullscreen();
      document.body.classList.remove("fullscreen-mode");
    }
  }catch(e){}
}

// ---------------- WAKE LOCK (anti écran veille)
async function requestWakeLock(){
  try{
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
    }
  }catch(e){}
}

// re-lock si perte focus
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible'){
    requestWakeLock();
  }
});

// ---------------- DRAW
function draw(){

  fill(8,10,20,22);
  noStroke();
  rect(0,0,width,height);

  if(!started) return;

  let bass=0,mid=0,tre=0,level=0;

  if(audioOK){
    fft.analyze();
    bass=fft.getEnergy("bass")/255;
    mid =fft.getEnergy("mid")/255;
    tre =fft.getEnergy("treble")/255;
    level=mic.getLevel();
  }else{
    bass=(sin(frameCount*0.02)+1)/2;
    mid =(sin(frameCount*0.015)+1)/2;
    tre =(sin(frameCount*0.03)+1)/2;
    level=0.02;
  }

  phase += 0.01 + mid*0.008;

  updateFil(level);
  drawFil();

  spawnBubbles(level);
  updateBubbles(level);
  drawLinks();
  drawBubbles();

  spawnHearts(level);
  updateHearts();
  drawHearts();
}

// ---------------- FIL
function updateFil(level){

  let base = height*0.52;

  for(let i=0;i<N;i++){
    let u=i/(N-1);
    let x=u*width;

    let y =
      base
      + sin(u*5 + phase*0.7)*20
      + sin(u*12 + phase*0.3)*8
      + sin(u*2 + phase*0.2)*28;

    let local =
      sin(u*18 + phase)
      + 0.5*sin(u*30 + phase*0.8);

    y += local*(12 + level*220);

    pts[i].set(x,y);
  }
}

function drawFil(){

  stroke(90,80,170,25);
  strokeWeight(5);
  noFill();
  beginShape();
  for(let p of pts) curveVertex(p.x,p.y);
  endShape();

  stroke(80,150,230,40);
  strokeWeight(2.5);
  beginShape();
  for(let p of pts) curveVertex(p.x,p.y);
  endShape();

  stroke(190,210,240,180);
  strokeWeight(0.9);
  beginShape();
  for(let p of pts) curveVertex(p.x,p.y);
  endShape();
}

// ---------------- BULLES
function spawnBubbles(level){
  if(random()<0.015 + level*0.3 && bubbles.length<8){
    let i=floor(random(20,N-20));
    let p=pts[i];

    bubbles.push({
      x:p.x,
      y:p.y,
      r:random(12,24),
      life:1,
      vy:-random(0.08,0.2)
    });
  }
}

function updateBubbles(level){
  for(let b of bubbles){
    b.y += b.vy;
    b.life -= 0.007;
    b.r += 0.02 + level*0.15;
  }
  bubbles=bubbles.filter(b=>b.life>0);
}

function drawBubbles(){
  noFill();

  for(let b of bubbles){
    stroke(110,150,255,20*b.life);
    strokeWeight(5);
    circle(b.x,b.y,b.r*2);

    stroke(160,210,255,90*b.life);
    strokeWeight(1);
    circle(b.x,b.y,b.r*1.5);
  }
}

// ---------------- LIENS
function drawLinks(){
  for(let i=0;i<bubbles.length;i++){
    for(let j=i+1;j<bubbles.length;j++){
      let a=bubbles[i];
      let b=bubbles[j];
      let d=dist(a.x,a.y,b.x,b.y);

      if(d<120){
        let alpha=map(d,0,120,40,0);
        stroke(120,180,255,alpha);
        strokeWeight(0.6);
        line(a.x,a.y,b.x,b.y);
      }
    }
  }
}

// ---------------- HEART
function spawnHearts(level){
  if(level<0.01 && random()<0.01){
    let i=floor(random(30,N-30));
    let p=pts[i];
    hearts.push({x:p.x,y:p.y,life:1});
  }
}

function updateHearts(){
  for(let h of hearts){
    h.life -= 0.02;
  }
  hearts=hearts.filter(h=>h.life>0);
}

function drawHearts(){
  textAlign(CENTER,CENTER);
  for(let h of hearts){
    fill(255,90,120,150*h.life);
    textSize(16);
    text("♡",h.x,h.y-8);
  }
}

// ---------------- RESIZE
function windowResized(){
  resizeCanvas(windowWidth, windowHeight);
  background(0);
}

</script>

</body>
</html>
