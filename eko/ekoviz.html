<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EKO - Métamorphose Polymorphe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,400;1,700&family=Quicksand:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #010103; overflow: hidden; color: white; font-family: 'Quicksand', sans-serif; }
        canvas { position: fixed; top: 0; left: 0; z-index: 1; }
        .ui-layer { position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: none; text-align: center; }
        #text-box { font-family: 'Bodoni Moda', serif; font-style: italic; font-size: clamp(1.8rem, 5vw, 3.8rem); max-width: 75%; line-height: 1.4; transition: all 2s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; transform: translateY(20px); }
        #text-box.visible { opacity: 0.9; transform: translateY(0); text-shadow: 0 0 25px rgba(255,255,255,0.4); }
        .start-btn { position: fixed; inset: 0; z-index: 100; background: #010103; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: opacity 1.5s; }
        .orb { width: 100px; height: 100px; border-radius: 50%; background: white; filter: blur(40px); opacity: 0.2; animation: breathe 4s infinite; }
        @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.1; } 50% { transform: scale(1.5); opacity: 0.3; } }
        .label { position: fixed; bottom: 40px; letter-spacing: 0.8em; font-size: 0.6rem; opacity: 0.3; font-weight: 300; }
    </style>
</head>
<body>

    <div id="start-screen" class="start-btn" onclick="init()">
        <div class="orb"></div>
        <div class="absolute text-[10px] tracking-[0.5em] uppercase font-light">Ouvrir l'Èkran</div>
    </div>

    <canvas id="canvas"></canvas>

    <div class="ui-layer">
        <h2 id="text-box"></h2>
        <div id="phase-label" class="label">INITIALISATION</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const textBox = document.getElementById('text-box');
        const phaseLabel = document.getElementById('phase-label');

        let audioCtx, analyser, dataArray;
        let w, h, time = 0, volume = 0, currentPhase = 0;
        let particles = [];

        const PHASES = [
            { 
                label: "Phase I : Le Reflet", 
                lines: ["Je suis né dans un reflet", "Dans une mer de pixels"],
                color: [0, 242, 255], 
                mode: "circles",
                density: 40
            },
            { 
                label: "Phase II : La Dérive", 
                lines: ["Je scroll comme on dérive", "Des milliers de regards"],
                color: [255, 255, 255], 
                mode: "filaments",
                density: 60
            },
            { 
                label: "Phase III : La Transe", 
                lines: ["Nuits clandestines", "Tu me replies ?"],
                color: [255, 0, 150], 
                mode: "geometry",
                density: 30
            },
            { 
                label: "Phase IV : L'Effondrement", 
                lines: ["MON SOUFFLE RÉTRÉCIT", "TOUT S'EFFONDRE"],
                color: [255, 50, 20], 
                mode: "chaos",
                density: 100
            },
            { 
                label: "Phase V : L'Ether", 
                lines: ["Le silence de l'infini", "Métamorphose"],
                color: [180, 200, 255], 
                mode: "mist",
                density: 20
            }
        ];

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 1;
                this.speedY = (Math.random() - 0.5) * 1;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.02;
            }
            update() {
                const p = PHASES[currentPhase];
                this.angle += this.spin + (volume * 0.2);
                
                if (p.mode === "circles" || p.mode === "mist") {
                    this.x += Math.cos(this.angle) * (0.5 + volume * 5);
                    this.y += Math.sin(this.angle) * (0.5 + volume * 5);
                } else if (p.mode === "filaments") {
                    this.y -= (0.3 + volume * 10);
                    this.x += Math.sin(this.y * 0.01) * 2;
                } else {
                    this.x += (Math.random() - 0.5) * (10 * volume + 1);
                    this.y += (Math.random() - 0.5) * (10 * volume + 1);
                }

                if (this.x < 0) this.x = w; if (this.x > w) this.x = 0;
                if (this.y < 0) this.y = h; if (this.y > h) this.y = 0;
            }
            draw() {
                const p = PHASES[currentPhase];
                const c = p.color;
                ctx.fillStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${0.2 + volume})`;
                
                if (p.mode === "circles") {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 10 * volume + 2, 0, Math.PI*2);
                    ctx.fill();
                } else if (p.mode === "filaments") {
                    ctx.fillRect(this.x, this.y, 1, 40 * volume + 5);
                } else if (p.mode === "geometry") {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);
                    ctx.strokeRect(-10, -10, 20 * volume + 5, 20 * volume + 5);
                    ctx.restore();
                } else if (p.mode === "chaos") {
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x + (Math.random()-0.5)*100*volume, this.y + (Math.random()-0.5)*100*volume);
                    ctx.strokeStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, 0.5)`;
                    ctx.stroke();
                } else {
                    // Mist
                    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 50 * volume + 10);
                    grad.addColorStop(0, `rgba(${c[0]}, ${c[1]}, ${c[2]}, 0.1)`);
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.fillRect(this.x - 100, this.y - 100, 200, 200);
                }
            }
        }

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            particles = Array.from({length: 150}, () => new Particle());
        }

        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                audioCtx.createMediaStreamSource(stream).connect(analyser);
                analyser.fftSize = 64;
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                document.getElementById('start-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('start-screen').remove(), 1500);

                resize();
                loop();
                narrative();
            } catch (e) { alert("Micro requis."); }
        }

        function narrative() {
            const p = PHASES[currentPhase];
            phaseLabel.textContent = p.label;
            let i = 0;
            const step = () => {
                textBox.textContent = p.lines[i];
                textBox.classList.add('visible');
                setTimeout(() => {
                    textBox.classList.remove('visible');
                    setTimeout(() => {
                        i++;
                        if (i < p.lines.length) step();
                        else { currentPhase = (currentPhase + 1) % PHASES.length; narrative(); }
                    }, 2500);
                }, 5000);
            };
            step();
        }

        function loop() {
            time += 0.01;
            analyser.getByteFrequencyData(dataArray);
            volume = (dataArray.reduce((a,b) => a+b) / dataArray.length) / 255;

            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = `rgba(1, 1, 3, ${currentPhase === 4 ? 0.3 : 0.15})`;
            ctx.fillRect(0, 0, w, h);

            ctx.globalCompositeOperation = 'lighter';
            const p = PHASES[currentPhase];
            for (let i = 0; i < p.density; i++) {
                particles[i].update();
                particles[i].draw();
            }

            // Coeur pulsant central
            const pulse = (Math.sin(time * 3) * 20 + 100) * (1 + volume * 2);
            const g = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, pulse);
            g.addColorStop(0, `rgba(${p.color[0]}, ${p.color[1]}, ${p.color[2]}, 0.15)`);
            g.addColorStop(1, 'transparent');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, w, h);

            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', resize);
    </script>
</body>
</html>
