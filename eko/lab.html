<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>VDO Maze Runner</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
        
        #ui {
            position: fixed; inset: 0; z-index: 100;
            display: flex; justify-content: center; align-items: center;
            background: #000; font-family: Courier, monospace;
        }
        
        .box { border: 1px solid #0f0; padding: 20px; background: #050505; }
        input { padding: 10px; width: 250px; background: #000; border: 1px solid #0f0; color: #0f0; outline: none; }
        button { padding: 10px 20px; background: #0f0; border: none; color: #000; cursor: pointer; font-weight: bold; }

        #container { position: fixed; inset: 0; display: none; }

        /* L'IFRAME : Noir et Blanc + Pixelisation */
        iframe {
            width: 100%; height: 100%; border: none;
            filter: grayscale(1) contrast(5) brightness(0.7) url(#pixelate);
        }

        /* L'OVERLAY LABYRINTHE */
        #maze {
            position: absolute; inset: 0; z-index: 10;
            pointer-events: none;
            /* Motif 10PRINT en SVG haute résolution */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"><path d="M0 16L16 0" stroke="white" stroke-width="2.5" stroke-linecap="square"/></svg>');
            background-size: 16px 16px;
            mix-blend-mode: difference;
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div id="ui">
    <div class="box">
        <input id="url" placeholder="ID VDO.NINJA" value="ArtmoonQKw">
        <button onclick="start()">ACTIVATE_MAZE</button>
    </div>
</div>

<div id="container">
    <div id="maze"></div>
    <iframe id="frame" allow="autoplay;camera;microphone;fullscreen;display-capture;"></iframe>
</div>

<svg style="display: none;">
    <filter id="pixelate">
        <feFlood x="4" y="4" height="2" width="2"/>
        <feComposite width="8" height="8"/>
        <feTile result="a"/>
        <feComposite in="SourceGraphic" in2="a" operator="in"/>
        <feMorphology operator="dilate" radius="2"/>
    </filter>
</svg>

<script>
function start() {
    const val = document.getElementById("url").value.trim();
    if (!val) return;

    let url = val.includes("http") ? val : "https://vdo.ninja/?view=" + val;
    const sep = url.includes("?") ? "&" : "?";
    // Paramètres optimisés pour GitHub Pages
    url += sep + "cleanoutput&autostart&noheader&transparent&quality=0";

    document.getElementById("frame").src = url;
    document.getElementById("ui").style.display = "none";
    document.getElementById("container").style.display = "block";
}
</script>

</body>
</html>
