<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Scanner Sol@riane</title>

<style>
body{
margin:0;
background:#0b0b12;
color:#e2e8f0;
font-family:system-ui;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

.app{width:420px;text-align:center;}

.cam{
position:relative;
aspect-ratio:4/3;
background:black;
border-radius:14px;
overflow:hidden;
border:1px solid #2a2a35;
}

video{width:100%;height:100%;object-fit:cover;}

.scan{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:200px;
height:200px;
border:2px solid #7c3aed;
border-radius:50%;
}

.scan.detect{
border-color:#10b981;
box-shadow:0 0 18px #10b981;
}

.status{margin-top:10px;color:#94a3b8;}

button{
margin-top:14px;
padding:14px;
width:100%;
border:none;
border-radius:10px;
background:#7c3aed;
color:white;
font-weight:bold;
cursor:pointer;
}

canvas{display:none}
</style>
</head>

<body>

<div class="app">

<h2>Trace ton @ solaire</h2>

<div class="cam">
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div class="scan" id="scan"></div>
</div>

<div class="status" id="status">caméra inactive</div>

<button id="start">Activer caméra</button>

</div>

<script src="https://docs.opencv.org/4.x/opencv.js"></script>

<script>

let video=document.getElementById("video")
let canvas=document.getElementById("canvas")
let ctx=canvas.getContext("2d")

let scanBox=document.getElementById("scan")
let status=document.getElementById("status")
let startBtn=document.getElementById("start")

let detectCount=0
const NEEDED=5
let running=false

startBtn.onclick=async()=>{

const stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:"environment"}
})

video.srcObject=stream
await video.play()

startBtn.style.display="none"
status.innerText="cherche symbole"

running=true
setInterval(scan,400)

}

function scan(){

if(!running)return
if(video.readyState<4)return

canvas.width=video.videoWidth
canvas.height=video.videoHeight

ctx.drawImage(video,0,0)

let src=cv.imread(canvas)

let gray=new cv.Mat()
cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY)

cv.GaussianBlur(gray,gray,new cv.Size(5,5),0)

let circles=new cv.Mat()

cv.HoughCircles(
gray,
circles,
cv.HOUGH_GRADIENT,
1,
100,
120,
40,
40,
200
)

let found=false

if(circles.cols>0){

for(let i=0;i<circles.cols;i++){

let x=circles.data32F[i*3]
let y=circles.data32F[i*3+1]
let r=circles.data32F[i*3+2]

if(checkSun(gray,x,y,r)){
found=true
break
}

}

}

if(found){

scanBox.classList.add("detect")
detectCount++

if(detectCount>=NEEDED){

running=false
status.innerText="symbole reconnu"

setTimeout(()=>{
window.location.href="https://urlr.me/34872E"
},1200)

}

}else{

scanBox.classList.remove("detect")
detectCount=0
status.innerText="aligne ton soleil"

}

src.delete()
gray.delete()
circles.delete()

}

function checkSun(gray,cx,cy,r){

let rays=0

for(let a=0;a<360;a+=15){

let rad=a*Math.PI/180

let x1=Math.floor(cx+Math.cos(rad)*r*0.5)
let y1=Math.floor(cy+Math.sin(rad)*r*0.5)

let x2=Math.floor(cx+Math.cos(rad)*r*0.9)
let y2=Math.floor(cy+Math.sin(rad)*r*0.9)

if(
x1>0 && y1>0 &&
x2>0 && y2>0 &&
x1<gray.cols && y1<gray.rows &&
x2<gray.cols && y2<gray.rows
){

let p1=gray.ucharPtr(y1,x1)[0]
let p2=gray.ucharPtr(y2,x2)[0]

if(p2<p1-20){
rays++
}

}

}

return rays>6

}

</script>

</body>
</html>
