<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fil d'@riane — Résonance</title>

<style>

:root{
--primary:#a78bfa;
--bg:#05050a;
--success:#10b981;
}

body{
margin:0;
background:var(--bg);
color:white;
font-family:system-ui;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

.container{
text-align:center;
width:90%;
max-width:420px;
}

.resonance-box{
position:relative;
width:220px;
height:220px;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
}

.wave{
position:absolute;
border:2px solid var(--primary);
border-radius:50%;
width:80px;
height:80px;
opacity:.8;
}

.core-at{
font-size:90px;
font-weight:900;
text-shadow:0 0 25px rgba(167,139,250,.4);
transition:.15s;
}

.status{
margin-top:15px;
font-size:13px;
color:var(--primary);
letter-spacing:2px;
text-transform:uppercase;
}

.preview{
font-size:12px;
color:#475569;
margin-top:6px;
}

button{
margin-top:25px;
padding:16px 40px;
border-radius:50px;
border:none;
background:var(--primary);
color:black;
font-weight:900;
font-size:16px;
cursor:pointer;
}

.success{
position:fixed;
inset:0;
background:var(--success);
display:flex;
align-items:center;
justify-content:center;
transform:translateY(100%);
transition:.5s;
}

.success.show{
transform:translateY(0);
}

</style>
</head>

<body>

<div class="success" id="success">
<svg width="110" height="110" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
<polyline points="20 6 9 17 4 12"></polyline>
</svg>
</div>

<div class="container">

<div class="resonance-box" id="box">
<div class="core-at" id="at">@</div>
</div>

<h2>Fil d'@riane</h2>

<div class="status" id="status">système inactif</div>
<div class="preview" id="preview"></div>

<button id="startBtn">ACTIVER MICRO</button>

</div>

<script>

const startBtn=document.getElementById("startBtn")
const status=document.getElementById("status")
const preview=document.getElementById("preview")
const box=document.getElementById("box")
const at=document.getElementById("at")
const success=document.getElementById("success")

let recognition
let listening=false
let unlocked=false
let waveTimer

const KEYWORDS=["EKO","ÉCHO","ECHO"]

function createWave(){

if(!listening || unlocked) return

const w=document.createElement("div")
w.className="wave"
box.appendChild(w)

w.animate([
{transform:"scale(1)",opacity:.8},
{transform:"scale(3)",opacity:0}
],{
duration:2000,
easing:"ease-out"
})

setTimeout(()=>w.remove(),2000)

at.style.transform="scale(1.15)"
setTimeout(()=>at.style.transform="scale(1)",120)

}

function startListening(){

const SpeechRecognition=
window.SpeechRecognition ||
window.webkitSpeechRecognition

if(!SpeechRecognition){

status.innerText="navigateur non compatible"
return

}

recognition=new SpeechRecognition()

recognition.lang="fr-FR"
recognition.continuous=true
recognition.interimResults=false

recognition.onstart=()=>{

listening=true
status.innerText="écoute..."
startBtn.style.display="none"
waveTimer=setInterval(createWave,700)

}

recognition.onresult=(event)=>{

const text=event.results[event.results.length-1][0].transcript.toUpperCase()

preview.innerText=text

if(KEYWORDS.some(w=>text.includes(w))){

unlock()

}

}

recognition.onend=()=>{

if(listening && !unlocked){

recognition.start()

}

}

recognition.onerror=(e)=>{

status.innerText="erreur micro"

}

recognition.start()

}

function unlock(){

if(unlocked) return

unlocked=true
listening=false

clearInterval(waveTimer)

recognition.stop()

status.innerText="résonance détectée"

navigator.vibrate?.([100,50,100])

success.classList.add("show")

setTimeout(()=>{

window.location.assign("https://urlr.me/34872E")

},1200)

}

startBtn.onclick=startListening

</script>

</body>
</html>
