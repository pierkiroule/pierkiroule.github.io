<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fil d'@riane Scanner</title>

<style>

body{
margin:0;
background:#0b0b12;
color:#e2e8f0;
font-family:system-ui;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

.app{
width:420px;
text-align:center;
}

h1{
font-size:26px;
margin-bottom:6px;
}

.subtitle{
font-size:13px;
color:#94a3b8;
margin-bottom:12px;
}

.cam{
position:relative;
aspect-ratio:4/3;
background:black;
border-radius:14px;
overflow:hidden;
border:1px solid #2a2a35;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

canvas{
display:none;
}

.filigrane{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
opacity:.18;
pointer-events:none;
}

.filigrane svg{
width:200px;
height:200px;
}

.scan{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:210px;
height:210px;
border:2px dashed #7c3aed;
clip-path:polygon(50% 0%, 0% 100%, 100% 100%);
transition:.2s;
}

.scan.detect{
border-color:#10b981;
box-shadow:0 0 18px #10b981;
}

.status{
margin-top:10px;
font-size:13px;
color:#94a3b8;
}

.progress{
height:4px;
background:#222;
border-radius:99px;
margin-top:6px;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#7c3aed,#06b6d4);
transition:.25s;
}

button{
margin-top:14px;
padding:14px;
width:100%;
border:none;
border-radius:10px;
background:#7c3aed;
color:white;
font-weight:bold;
cursor:pointer;
}

.success{
position:absolute;
inset:0;
background:#10b981;
display:flex;
align-items:center;
justify-content:center;
font-size:60px;
opacity:0;
pointer-events:none;
transition:.4s;
}

.success.show{
opacity:1;
}

</style>
</head>

<body>

<div class="app">

<h1>Fil d'@riane</h1>
<div class="subtitle">Aligne ton tatouage triangle @</div>

<div class="cam">

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div class="scan" id="scan"></div>

<div class="filigrane">
<svg viewBox="0 0 200 200">
<polygon points="100,10 10,180 190,180"
stroke="white" stroke-width="4" fill="none"/>
<text x="100" y="120" font-size="60"
text-anchor="middle" fill="white">@</text>
</svg>
</div>

<div class="success" id="success">✓</div>

</div>

<div class="status" id="status">caméra inactive</div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<button id="start">Activer caméra</button>

</div>

<script src="https://docs.opencv.org/4.x/opencv.js"></script>

<script>

const video=document.getElementById("video")
const canvas=document.getElementById("canvas")
const ctx=canvas.getContext("2d")

const status=document.getElementById("status")
const bar=document.getElementById("bar")
const scanBox=document.getElementById("scan")
const success=document.getElementById("success")
const startBtn=document.getElementById("start")

let detect=0
const NEEDED=6
let running=false

startBtn.onclick=async()=>{

try{

const stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:"environment"}
})

video.srcObject=stream
await video.play()

startBtn.style.display="none"
status.textContent="cherche triangle @"

running=true
setInterval(scan,350)

}catch(e){

status.textContent="accès caméra refusé"

}

}

function scan(){

if(!running)return
if(video.readyState<4)return

const W=video.videoWidth
const H=video.videoHeight

canvas.width=W
canvas.height=H

ctx.drawImage(video,0,0)

let src=cv.imread(canvas)

let gray=new cv.Mat()
cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY)

cv.GaussianBlur(gray,gray,new cv.Size(5,5),0)

cv.equalizeHist(gray,gray)

let thresh=new cv.Mat()

cv.adaptiveThreshold(
gray,
thresh,
255,
cv.ADAPTIVE_THRESH_GAUSSIAN_C,
cv.THRESH_BINARY_INV,
11,
2
)

let edges=new cv.Mat()
cv.Canny(thresh,edges,40,120)

let contours=new cv.MatVector()
let hierarchy=new cv.Mat()

cv.findContours(edges,contours,hierarchy,cv.RETR_TREE,cv.CHAIN_APPROX_SIMPLE)

let found=false

for(let i=0;i<contours.size();i++){

let cnt=contours.get(i)

let area=cv.contourArea(cnt)

if(area<4000) continue

let peri=cv.arcLength(cnt,true)

let approx=new cv.Mat()
cv.approxPolyDP(cnt,approx,0.04*peri,true)

if(approx.rows==3){

let M=cv.moments(cnt)

let cx=M.m10/M.m00
let cy=M.m01/M.m00

if(cx>W*0.3 && cx<W*0.7){

let pixel=gray.ucharPtr(Math.floor(cy),Math.floor(cx))[0]

if(pixel<120){
found=true
}

}

}

approx.delete()
cnt.delete()

}

if(found){

scanBox.classList.add("detect")

detect++
bar.style.width=(detect/NEEDED*100)+"%"

status.textContent="tatouage détecté"

if(detect>=NEEDED){

running=false

success.classList.add("show")
status.textContent="symbole reconnu"

if(navigator.vibrate)
navigator.vibrate([120,60,120])

setTimeout(()=>{
window.location.href="https://urlr.me/34872E"
},1200)

}

}else{

scanBox.classList.remove("detect")
detect=Math.max(detect-1,0)

bar.style.width=(detect/NEEDED*100)+"%"
status.textContent="aligne le tatouage"

}

src.delete()
gray.delete()
thresh.delete()
edges.delete()
contours.delete()
hierarchy.delete()

}

</script>

</body>
</html>
