<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Scanner Sol@riane</title>

<style>
body{
margin:0;
background:#0b0b12;
color:#e2e8f0;
font-family:system-ui;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

.app{
width:420px;
text-align:center;
}

h1{
font-size:28px;
margin-bottom:4px;
}

.subtitle{
font-size:12px;
color:#94a3b8;
margin-bottom:14px;
}

.cam{
position:relative;
aspect-ratio:4/3;
background:black;
border-radius:14px;
overflow:hidden;
border:1px solid #2a2a35;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

.scan{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:190px;
height:190px;
border:2px solid #7c3aed;
border-radius:50%;
transition:.2s;
}

.scan.detect{
border-color:#10b981;
box-shadow:0 0 18px #10b981;
}

.guide{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:64px;
opacity:.18;
}

.status{
margin-top:10px;
font-size:13px;
color:#94a3b8;
}

.progress{
height:4px;
background:#222;
border-radius:99px;
margin-top:6px;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#7c3aed,#06b6d4);
transition:.25s;
}

button{
margin-top:14px;
padding:14px;
width:100%;
border:none;
border-radius:10px;
background:#7c3aed;
color:white;
font-weight:bold;
cursor:pointer;
}

canvas{display:none}

.success{
position:absolute;
inset:0;
background:#7c3aed;
display:flex;
align-items:center;
justify-content:center;
font-size:60px;
opacity:0;
pointer-events:none;
transition:.4s;
}

.success.show{
opacity:1;
}
</style>
</head>

<body>

<div class="app">

<h1>Trace ton @ solaire</h1>
<div class="subtitle">@ au centre + rayons libres, comme un soleil arobase </div>

<div class="cam">

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div class="scan" id="scan">
<div class="guide">@</div>
</div>

<div class="success" id="success">☀</div>

</div>

<div class="status" id="status">caméra inactive</div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<button id="start">Activer caméra</button>

</div>

<script>

const video=document.getElementById("video")
const canvas=document.getElementById("canvas")
const ctx=canvas.getContext("2d")

const status=document.getElementById("status")
const bar=document.getElementById("bar")
const scanBox=document.getElementById("scan")
const success=document.getElementById("success")
const startBtn=document.getElementById("start")

let detect=0
const NEEDED=6
let running=false

startBtn.onclick=async()=>{

try{

const stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:"environment"}
})

video.srcObject=stream
await video.play()

startBtn.style.display="none"
status.textContent="montre ton soleil"

running=true
setInterval(scan,450)

}catch(e){

status.textContent="accès caméra refusé"

}

}

function scan(){

if(!running)return
if(video.readyState<4)return

const W=video.videoWidth
const H=video.videoHeight

canvas.width=W
canvas.height=H

ctx.drawImage(video,0,0)

const cx=W/2
const cy=H/2
const R=Math.min(W,H)*0.22

const img=ctx.getImageData(cx-R,cy-R,R*2,R*2).data

let darkCenter=0
let totalCenter=0
let darkRing=0

const step=5

for(let y=0;y<R*2;y+=step){

for(let x=0;x<R*2;x+=step){

const i=(y*(R*2)+x)*4

const lum=img[i]*0.3+img[i+1]*0.6+img[i+2]*0.1

const dx=x-R
const dy=y-R
const dist=Math.sqrt(dx*dx+dy*dy)

if(dist<R*0.35){
totalCenter++
if(lum<110)darkCenter++
}

if(dist>R*0.5 && dist<R*0.9){
if(lum<110)darkRing++
}

}

}

const centerRatio=darkCenter/totalCenter
const raysOk=darkRing>50

const match=centerRatio>0.15 && raysOk

if(match){

scanBox.classList.add("detect")
detect++
bar.style.width=(detect/NEEDED*100)+"%"
status.textContent="soleil détecté"

if(navigator.vibrate)navigator.vibrate(25)

if(detect>=NEEDED){

running=false
success.classList.add("show")
status.textContent="symbole reconnu"

if(navigator.vibrate)navigator.vibrate([100,50,100])

setTimeout(()=>{
window.location.href="https://urlr.me/34872E"
},1300)

}

}else{

scanBox.classList.remove("detect")
detect=Math.max(detect-1,0)
bar.style.width=(detect/NEEDED*100)+"%"
status.textContent="aligne ton soleil"

}

}

</script>
</body>
</html>
