<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>QuizGPS Admin avec OpenLayers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v8.0.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@v8.0.0/dist/ol.js"></script>
  <style>
    #map { height: calc(100vh - 250px); width: 100%; }
    textarea { font-size: 0.9em; }
    .floating-btn {
      position: fixed;
      bottom: 80px;
      right: 20px;
      z-index: 1000;
    }
  </style>
</head>
<body class="container-fluid">
  <header class="bg-primary text-white p-3 mb-3">
    <h1 class="h4">QuizGPS Admin</h1>
    <p class="mb-0">Collez vos questions, cliquez sur la carte pour les placer</p>
  </header>
  <div class="row">
    <div class="col-md-8">
      <div id="map"></div>
    </div>
    <div class="col-md-4">
      <label class="form-label">Titre du quiz</label>
      <input type="text" class="form-control mb-2" id="quizTitle" placeholder="Mon parcours">
      <label class="form-label">Rayon d'activation (m)</label>
      <input type="number" class="form-control mb-2" id="radius" value="30" min="5" max="100">
      <label class="form-label">Questions (une par ligne)</label>
      <textarea class="form-control mb-2" id="questionsInput" rows="5" placeholder="Question 1\nQuestion 2"></textarea>
      <button id="startBtn" class="btn btn-primary w-100 mb-2">Commencer le positionnement</button>
      <button id="calibrateBtn" class="btn btn-secondary w-100 mb-2">Me localiser manuellement</button>
      <button id="exportBtn" class="btn btn-success w-100 mb-2">Exporter en JSON</button>
      <button id="lockBtn" class="btn btn-warning w-100 mb-2">Verrouiller les positions</button>
      <label class="form-label">Résultat JSON</label>
      <textarea id="quizData" class="form-control" rows="8" readonly></textarea>
      <div id="gps-status" class="mt-2">
        Précision GPS : <span id="gps-accuracy">Inconnue</span> mètres
      </div>
    </div>
  </div>
  <button id="recenterBtn" class="btn btn-primary btn-sm floating-btn">Recentrer</button>

  <script>
    // Créer la carte
    const map = new ol.Map({
      target: 'map',
      layers: [
        new ol.layer.Tile({
          source: new ol.source.OSM() // Utilise OpenStreetMap comme couche de base
        })
      ],
      view: new ol.View({
        center: ol.proj.fromLonLat([2.3522, 48.8566]), // Centre la carte sur Paris
        zoom: 12,
        rotation: 0 // Initialiser la rotation à 0
      })
    });

    // Ajouter une couche vectorielle pour les questions
    const vectorSource = new ol.source.Vector();
    const vectorLayer = new ol.layer.Vector({
      source: vectorSource,
      style: new ol.style.Style({
        image: new ol.style.Icon({
          anchor: [0.5, 1],
          src: 'https://openlayers.org/en/latest/examples/data/icon.png'
        })
      })
    });
    map.addLayer(vectorLayer);

    let userMarker;
    let manualCalibration = false;
    let placingQuestion = false;
    let questionsLocked = false;
    let questionList = [], currentIndex = 0, questions = [];

    // Géolocalisation
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(pos => {
        const { latitude, longitude, accuracy } = pos.coords;
        document.getElementById('gps-accuracy').textContent = accuracy.toFixed(2);

        if (accuracy < 100 && !manualCalibration) {
          const userLocation = ol.proj.fromLonLat([longitude, latitude]);
          if (!userMarker) {
            userMarker = new ol.Feature(new ol.geom.Point(userLocation));
            vectorSource.addFeature(userMarker);
          } else {
            userMarker.getGeometry().setCoordinates(userLocation);
          }
          map.getView().setCenter(userLocation);
        }
      }, err => alert("Erreur de géolocalisation : " + err.message), {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      });
    } else {
      alert("Géolocalisation non supportée.");
    }

    // Gestion de la rotation
    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', event => {
        if (event.alpha !== null) {
          map.getView().setRotation(-event.alpha * (Math.PI / 180));
        }
      });
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      const raw = document.getElementById('questionsInput').value.trim();
      questionList = raw.split('\n').map(q => q.trim()).filter(q => q);
      currentIndex = 0;
      placingQuestion = true;
      alert("Cliquez sur la carte pour placer chaque question.");
    });

    document.getElementById('calibrateBtn').addEventListener('click', () => {
      manualCalibration = true;
      alert("Cliquez sur la carte pour vous positionner manuellement.");
    });

    document.getElementById('recenterBtn').addEventListener('click', () => {
      if (userMarker) map.getView().setCenter(userMarker.getGeometry().getCoordinates());
    });

    document.getElementById('lockBtn').addEventListener('click', () => {
      questionsLocked = true;
      alert("Les positions des questions ont été verrouillées.");
    });

    map.on('click', e => {
      const coordinate = e.coordinate;
      if (manualCalibration) {
        if (!userMarker) {
          userMarker = new ol.Feature(new ol.geom.Point(coordinate));
          vectorSource.addFeature(userMarker);
        } else {
          userMarker.getGeometry().setCoordinates(coordinate);
        }
        map.getView().setCenter(coordinate);
        manualCalibration = false;
        return;
      }

      if (!placingQuestion || currentIndex >= questionList.length) {
        return alert("Toutes les questions ont été placées.");
      }

      const radius = parseInt(document.getElementById("radius").value);
      const questionText = questionList[currentIndex];

      const questionFeature = new ol.Feature(new ol.geom.Point(coordinate));
      questionFeature.set('question', questionText);
      questionFeature.set('radius', radius);
      vectorSource.addFeature(questionFeature);

      questions.push({
        lat: ol.proj.toLonLat(coordinate)[1],
        lng: ol.proj.toLonLat(coordinate)[0],
        radius,
        question: questionText
      });

      currentIndex++;
      if (currentIndex >= questionList.length) {
        placingQuestion = false;
      }
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      const title = document.getElementById("quizTitle").value || "Mon Quiz";
      const data = { title, questions };
      const jsonText = JSON.stringify(data, null, 2);
      document.getElementById("quizData").value = jsonText;

      const blob = new Blob([jsonText], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = title.replace(/\s+/g, "_") + ".json";
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
