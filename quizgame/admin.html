<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>QuizGPS Admin avec MapLibre</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@2.1.9/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@2.1.9/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    #map { height: calc(100vh - 250px); width: 100%; touch-action: auto; }
    textarea { font-size: 0.9em; }
    .floating-btn {
      position: fixed;
      bottom: 80px;
      right: 20px;
      z-index: 1000;
    }
  </style>
</head>
<body class="container-fluid">  <header class="bg-primary text-white p-3 mb-3">
    <h1 class="h4">QuizGPS Admin</h1>
    <p class="mb-0">Collez vos questions, cliquez sur la carte pour les placer</p>
  </header>  <div class="row">
    <div class="col-md-8">
      <div id="map"></div>
    </div>
    <div class="col-md-4">
      <label class="form-label">Titre du quiz</label>
      <input type="text" class="form-control mb-2" id="quizTitle" placeholder="Mon parcours"><label class="form-label">Rayon d'activation (m)</label>
  <input type="number" class="form-control mb-2" id="radius" value="30" min="5" max="100">

  <label class="form-label">Questions (une par ligne)</label>
  <textarea class="form-control mb-2" id="questionsInput" rows="5" placeholder="Question 1\nQuestion 2"></textarea>

  <button id="startBtn" class="btn btn-primary w-100 mb-2">Commencer le positionnement</button>
  <button id="calibrateBtn" class="btn btn-secondary w-100 mb-2">Me localiser manuellement</button>
  <button id="exportBtn" class="btn btn-success w-100 mb-2">Exporter en JSON</button>

  <label class="form-label">Résultat JSON</label>
  <textarea id="quizData" class="form-control" rows="8" readonly></textarea>

  <div id="gps-status" class="mt-2">
    Précision GPS : <span id="gps-accuracy">Inconnue</span> mètres
  </div>
</div>

  </div><button id="recenterBtn" class="btn btn-primary btn-sm floating-btn">Recentrer</button>

  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          osm: {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '© OpenStreetMap contributors'
          }
        },
        layers: [
          {
            id: 'osm',
            type: 'raster',
            source: 'osm'
          }
        ]
      },
      center: [48.515, -2.775],
      zoom: 15
    });

    map.addControl(new maplibregl.NavigationControl());
    map.touchZoomRotate.enable();
    map.touchZoomRotate.enableRotation();
    map.dragPan.enable();
    window.addEventListener('resize', () => map.resize());

    let userMarker = null;
    let manualCalibration = false;

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(pos => {
        const { latitude: lat, longitude: lng, accuracy } = pos.coords;
        document.getElementById('gps-accuracy').textContent = accuracy.toFixed(2);

        if (accuracy < 100 && !manualCalibration) {
          if (!userMarker) {
            userMarker = new maplibregl.Marker().setLngLat([lng, lat]).addTo(map);
          } else {
            userMarker.setLngLat([lng, lat]);
          }
          map.setCenter([lng, lat]);
        }
      }, err => alert("Erreur de géolocalisation : " + err.message), {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      });
    } else {
      alert("Géolocalisation non supportée.");
    }

    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', event => {
        if (event.alpha !== null) map.setBearing(360 - event.alpha);
      });
    }

    let questionList = [], currentIndex = 0, questionMarkers = [], questions = [];

    document.getElementById('startBtn').addEventListener('click', () => {
      const raw = document.getElementById('questionsInput').value.trim();
      questionList = raw.split('\n').map(q => q.trim()).filter(q => q);
      currentIndex = 0;
      alert("Cliquez sur la carte pour placer chaque question.");
    });

    document.getElementById('calibrateBtn').addEventListener('click', () => {
      manualCalibration = true;
      alert("Cliquez sur la carte pour vous positionner manuellement.");
    });

    document.getElementById('recenterBtn').addEventListener('click', () => {
      if (userMarker) map.setCenter(userMarker.getLngLat());
    });

    map.on('click', e => {
      if (manualCalibration) {
        if (!userMarker) {
          userMarker = new maplibregl.Marker({ color: 'blue' }).setLngLat(e.lngLat).addTo(map);
        } else {
          userMarker.setLngLat(e.lngLat);
        }
        map.setCenter(e.lngLat);
        manualCalibration = false;
        return;
      }

      if (currentIndex >= questionList.length) return alert("Toutes les questions ont été placées.");

      const radius = parseInt(document.getElementById("radius").value);
      const questionText = questionList[currentIndex];

      const marker = new maplibregl.Marker({ draggable: true, color: 'orange' })
        .setLngLat(e.lngLat)
        .addTo(map);

      const popupContent = document.createElement('div');
      const input = document.createElement('textarea');
      input.rows = 2;
      input.className = 'form-control mb-2';
      input.value = questionText;

      const saveBtn = document.createElement('button');
      saveBtn.textContent = 'Modifier';
      saveBtn.className = 'btn btn-sm btn-outline-primary me-1';

      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = 'Supprimer';
      deleteBtn.className = 'btn btn-sm btn-outline-danger';

      popupContent.append(input, saveBtn, deleteBtn);
      const popup = new maplibregl.Popup({ offset: 25 }).setDOMContent(popupContent);
      marker.setPopup(popup);

      const questionObj = {
        lat: e.lngLat.lat,
        lng: e.lngLat.lng,
        radius,
        question: questionText
      };
      questions.push(questionObj);
      questionMarkers.push(marker);

      const thisIndex = questions.length - 1;
      saveBtn.onclick = () => { questions[thisIndex].question = input.value; marker.getPopup().remove(); };
      deleteBtn.onclick = () => {
        if (confirm("Supprimer cette question ?")) {
          marker.remove();
          questions.splice(thisIndex, 1);
          questionMarkers.splice(thisIndex, 1);
        }
      };

      currentIndex++;
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      const title = document.getElementById("quizTitle").value || "Mon Quiz";
      const data = { title, questions };
      const jsonText = JSON.stringify(data, null, 2);
      document.getElementById("quizData").value = jsonText;

      const blob = new Blob([jsonText], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = title.replace(/\s+/g, "_") + ".json";
      a.click();
      URL.revokeObjectURL(url);
    });
  </script></body>
</html>
