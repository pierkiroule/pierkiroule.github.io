<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>QuizGPS Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
    integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
    crossorigin=""/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { height: 60vh; width: 100%; }
    #quizData { height: 150px; font-size: 0.9em; }
    .question-marker { cursor: pointer; }
  </style>
</head>
<body class="container-fluid">
  <header class="bg-primary text-white p-3 mb-3">
    <h1 class="h3">QuizGPS Admin</h1>
    <p class="mb-0">Préparez votre parcours pédagogique géolocalisé</p>
  </header>

  <div class="row">
    <div class="col-md-8">
      <div id="map"></div>
    </div>
    <div class="col-md-4">
      <label class="form-label mt-2">Titre du quiz</label>
      <input type="text" class="form-control mb-2" id="quizTitle" placeholder="Mon parcours">
      <label class="form-label">Rayon d'activation (m)</label>
      <input type="number" class="form-control mb-3" id="radius" value="30" min="5" max="100">
      <button id="exportBtn" class="btn btn-primary w-100 mb-2">Enregistrer le quiz</button>
      <label class="form-label">JSON exporté</label>
      <textarea id="quizData" class="form-control" readonly></textarea>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"
    integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
    crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const map = L.map('map').setView([47.2173, -1.5534], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 22,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let questions = [];
    let questionMarkers = [];

    map.on('click', function(e) {
      const radius = parseInt(document.getElementById("radius").value);
      const questionText = prompt("Entrez votre question :");
      if (!questionText) return;

      const marker = L.circle([e.latlng.lat, e.latlng.lng], {
        radius: radius,
        color: "orange",
        fillOpacity: 0.3,
        className: 'question-marker'
      }).addTo(map).bindPopup(questionText);

      questions.push({ lat: e.latlng.lat, lng: e.latlng.lng, radius, question: questionText });
      questionMarkers.push(marker);

      marker.on('click', () => {
        const newQuestion = prompt("Modifier la question :", questionText);
        if (newQuestion) {
          marker.bindPopup(newQuestion);
          questions.find(q => q.lat === e.latlng.lat && q.lng === e.latlng.lng).question = newQuestion;
        } else if (confirm("Voulez-vous supprimer cette question ?")) {
          const index = questions.findIndex(q => q.lat === e.latlng.lat && q.lng === e.latlng.lng);
          questions.splice(index, 1);
          map.removeLayer(marker);
          questionMarkers.splice(index, 1);
        }
      });
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      const title = document.getElementById("quizTitle").value || "Mon Quiz";
      const data = { title, questions };
      document.getElementById("quizData").value = JSON.stringify(data, null, 2);

      // Sauvegarder les données dans un fichier JSON
      fetch('/quizgame/quiz_data.json', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      }).then(response => response.json())
        .then(data => {
          alert('Quiz enregistré avec succès !');
        }).catch(error => {
          console.error('Erreur:', error);
        });
    });
  </script>
</body>
</html>
