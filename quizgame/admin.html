<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>QuizGPS Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #map { height: 60vh; }
    textarea { font-size: 0.9em; }
  </style>
</head>
<body class="container-fluid">

  <header class="bg-primary text-white p-3 mb-3">
    <h1 class="h4">QuizGPS Admin</h1>
    <p class="mb-0">Collez vos questions, cliquez sur la carte pour les placer</p>
  </header>

  <div class="row">
    <div class="col-md-8">
      <div id="map"></div>
    </div>
    <div class="col-md-4">
      <label class="form-label">Titre du quiz</label>
      <input type="text" class="form-control mb-2" id="quizTitle" placeholder="Mon parcours">

      <label class="form-label">Rayon d'activation (m)</label>
      <input type="number" class="form-control mb-2" id="radius" value="30" min="5" max="100">

      <label class="form-label">Questions (une par ligne)</label>
      <textarea class="form-control mb-2" id="questionsInput" rows="5" placeholder="Question 1&#10;Question 2"></textarea>

      <button id="startBtn" class="btn btn-primary w-100 mb-2">Commencer le positionnement</button>
      <button id="exportBtn" class="btn btn-success w-100 mb-2">Exporter en JSON</button>

      <label class="form-label">Résultat JSON</label>
      <textarea id="quizData" class="form-control" rows="8" readonly></textarea>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script>
    const map = L.map('map');
    let userMarker = null;

    // Suivi de la position en temps réel
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        if (!userMarker) {
          userMarker = L.marker([lat, lng]).addTo(map).bindPopup("Vous êtes ici").openPopup();
        } else {
          userMarker.setLatLng([lat, lng]);
        }

        // Centrer la carte sur la position actuelle
        map.setView([lat, lng], 16);
      }, err => {
        alert("Erreur de géolocalisation : " + err.message);
      });
    } else {
      alert("Géolocalisation non supportée.");
    }

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 22,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let questionList = [];
    let currentIndex = 0;
    let questionMarkers = [];
    let questions = [];

    document.getElementById('startBtn').addEventListener('click', () => {
      const raw = document.getElementById('questionsInput').value.trim();
      questionList = raw.split('\n').map(q => q.trim()).filter(q => q !== '');
      currentIndex = 0;
      alert("Cliquez sur la carte pour placer chaque question.");
    });

    map.on('click', e => {
      if (currentIndex >= questionList.length) {
        alert("Toutes les questions ont été placées.");
        return;
      }

      const radius = parseInt(document.getElementById("radius").value);
      const questionText = questionList[currentIndex];

      const marker = L.circle(e.latlng, {
        radius: radius,
        color: 'orange',
        fillOpacity: 0.4
      }).addTo(map);

      const popupContent = document.createElement('div');
      const input = document.createElement('textarea');
      input.rows = 2;
      input.className = 'form-control mb-2';
      input.value = questionText;

      const saveBtn = document.createElement('button');
      saveBtn.textContent = 'Modifier';
      saveBtn.className = 'btn btn-sm btn-outline-primary me-1';

      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = 'Supprimer';
      deleteBtn.className = 'btn btn-sm btn-outline-danger';

      popupContent.appendChild(input);
      popupContent.appendChild(saveBtn);
      popupContent.appendChild(deleteBtn);

      marker.bindPopup(popupContent).openPopup();

      const questionObj = {
        lat: e.latlng.lat,
        lng: e.latlng.lng,
        radius: radius,
        question: questionText
      };
      questions.push(questionObj);
      questionMarkers.push(marker);

      const thisIndex = questions.length - 1;

      saveBtn.onclick = () => {
        questions[thisIndex].question = input.value;
        marker.closePopup();
      };

      deleteBtn.onclick = () => {
        map.removeLayer(marker);
        questions.splice(thisIndex, 1);
        questionMarkers.splice(thisIndex, 1);
      };

      currentIndex++;
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      const title = document.getElementById("quizTitle").value || "Mon Quiz";
      const data = { title, questions };
      const jsonText = JSON.stringify(data, null, 2);
      document.getElementById("quizData").value = jsonText;

      // Téléchargement du fichier JSON
      const blob = new Blob([jsonText], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = title.replace(/\s+/g, "_") + ".json";
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
