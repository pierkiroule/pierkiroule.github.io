<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chasse au Trésor GPS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@2.1.9/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@2.1.9/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { height: calc(100vh - 250px); width: 100%; touch-action: auto; }
    #message-box {
      height: 20vh;
      overflow-y: auto;
      padding: 1em;
      background: #ffe;
      border: 1px solid #ccc;
      margin-bottom: 1em;
    }
    #indicators { display: flex; flex-wrap: wrap; justify-content: space-between; padding: 1em; font-size: 0.9em; }
    #load-indicator { color: red; font-weight: bold; }
    #load-indicator.loaded { color: green; }
    .floating-btn {
      position: fixed;
      bottom: 80px;
      right: 20px;
      z-index: 1000;
    }
  </style>
</head>
<body class="container-fluid">
  <header class="bg-primary text-white p-3 mb-3">
    <h1 class="h4">Chasse au Trésor GPS</h1>
    <p class="mb-0">Trouvez les énigmes cachées sur la carte !</p>
  </header>  <div id="indicators">
    <div>GPS : <span id="gps-indicator">Non capté</span></div>
    <div>Bulles : <span id="bubble-count-indicator">0</span></div>
    <div id="load-indicator">Chargement...</div>
    <div>Précision : <span id="accuracy-value">Inconnue</span> m</div>
  </div>  <div id="message-box">Approchez-vous des bulles pour voir les questions...</div>
  <div id="map"></div><button id="calibrateBtn" class="btn btn-secondary btn-sm floating-btn">Me localiser</button> <button id="recenterBtn" class="btn btn-primary btn-sm floating-btn" style="bottom: 20px;">Recentrer</button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>  <script src="https://cdn.jsdelivr.net/npm/@turf/turf/turf.min.js"></script>  <script>
    const hospitalCoords = [48.515, -2.775];
    let manualCalibration = false;
    let map, userMarker = null;

    fetch('/quizgame/quiz_data.json')
      .then(response => response.json())
      .then(data => {
        const questions = data.questions;
        document.getElementById('bubble-count-indicator').textContent = questions.length;
        document.getElementById('load-indicator').textContent = "Textes chargés";
        document.getElementById('load-indicator').classList.add('loaded');

        const messageBox = document.getElementById('message-box');
        let bubbles = [];

        map = new maplibregl.Map({
          container: 'map',
          style: {
            version: 8,
            sources: {
              osm: {
                type: 'raster',
                tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                tileSize: 256,
                attribution: '© OpenStreetMap contributors'
              }
            },
            layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
          },
          center: hospitalCoords,
          zoom: 15
        });

        map.addControl(new maplibregl.NavigationControl());
        map.touchZoomRotate.enable();
        map.touchZoomRotate.enableRotation();
        map.dragPan.enable();

        questions.forEach(q => {
          const marker = new maplibregl.Marker({ color: 'orange' })
            .setLngLat([q.lng, q.lat])
            .addTo(map);
          bubbles.push({ marker, question: q.question, lat: q.lat, lng: q.lng, radius: q.radius || 30, visible: false });
        });

        map.on('click', e => {
          if (manualCalibration) {
            if (!userMarker) {
              userMarker = new maplibregl.Marker({ color: 'blue' }).setLngLat(e.lngLat).addTo(map);
            } else {
              userMarker.setLngLat(e.lngLat);
            }
            map.setCenter(e.lngLat);
            manualCalibration = false;
          }
        });

        document.getElementById('calibrateBtn').addEventListener('click', () => {
          manualCalibration = true;
          alert("Cliquez sur la carte pour vous positionner manuellement.");
        });

        document.getElementById('recenterBtn').addEventListener('click', () => {
          if (userMarker) map.setCenter(userMarker.getLngLat());
        });

        if (navigator.geolocation) {
          navigator.geolocation.watchPosition(pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const accuracy = pos.coords.accuracy;
            document.getElementById('gps-indicator').textContent = 'Capté';
            document.getElementById('accuracy-value').textContent = accuracy.toFixed(2);

            if (!manualCalibration) {
              if (userMarker) {
                userMarker.setLngLat([lng, lat]);
              } else {
                userMarker = new maplibregl.Marker().setLngLat([lng, lat]).addTo(map);
              }
            }

            let closestBubble = null;
            bubbles.forEach(b => {
              const d = turf.distance([lng, lat], [b.lng, b.lat], { units: 'meters' });
              if (d <= b.radius) closestBubble = b;
            });

            if (closestBubble) {
              messageBox.textContent = closestBubble.question;
              if (!closestBubble.visible) closestBubble.visible = true;
            } else {
              messageBox.textContent = "Approchez-vous des bulles pour voir les questions...";
              bubbles.forEach(b => b.visible = false);
            }

          }, err => {
            console.warn("Erreur GPS", err);
            document.getElementById('gps-indicator').textContent = 'Non capté';
          }, {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          });
        }

        if (window.DeviceOrientationEvent) {
          window.addEventListener('deviceorientation', e => {
            if (e.alpha !== null) map.setBearing(360 - e.alpha);
          });
        }

      })
      .catch(err => {
        console.error("Erreur de chargement", err);
        document.getElementById('load-indicator').textContent = "Erreur de chargement";
      });
  </script></body>
</html>
