<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chasse au Trésor GPS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
    integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
    crossorigin=""/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { height: 70vh; width: 100%; }
    #message-box {
      height: 20vh;
      overflow-y: auto;
      padding: 1em;
      background: #ffe;
      border: 1px solid #ccc;
      margin-bottom: 1em;
    }
    #indicators { display: flex; justify-content: space-between; padding: 1em; }
    #load-indicator { color: red; font-weight: bold; }
    #load-indicator.loaded { color: green; }
  </style>
</head>
<body class="container-fluid">
  <header class="bg-primary text-white p-3 mb-3">
    <h1 class="h3">Chasse au Trésor GPS</h1>
    <p class="mb-0">Trouve les énigmes cachées sur la carte !</p>
  </header>

  <div id="indicators">
    <div id="gps-status">GPS : <span id="gps-indicator">Non capté</span></div>
    <div id="bubble-count">Bulles chargées : <span id="bubble-count-indicator">0</span></div>
    <div id="load-indicator">Textes en cours de chargement...</div>
    <div id="gps-accuracy">Précision GPS : <span id="accuracy-value">Inconnue</span> mètres</div>
  </div>

  <div id="message-box">Approchez-vous des bulles pour voir les questions...</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"
    integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
    crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Coordonnées du Centre Hospitalier de Saint-Brieuc
    const hospitalCoords = [48.515, -2.775];

    // Charger les données du quiz
    fetch('/quizgame/quiz_data.json')
      .then(response => response.json())
      .then(data => {
        const questions = data.questions;
        const bubbleCountIndicator = document.getElementById('bubble-count-indicator');
        bubbleCountIndicator.textContent = questions.length;

        // Indicateur de chargement des textes
        const loadIndicator = document.getElementById('load-indicator');
        loadIndicator.textContent = "Textes chargés avec succès !";
        loadIndicator.classList.add('loaded');

        let map;
        let userMarker = null;
        let bubbles = [];
        const messageBox = document.getElementById('message-box');

        // Fonction pour initialiser la carte
        function initMap() {
          map = L.map('map').setView(hospitalCoords, 15);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 22,
            attribution: '&copy; OpenStreetMap'
          }).addTo(map);

          // Ajout des questions sur la carte
          questions.forEach(q => {
            const bubble = L.circle([q.lat, q.lng], {
              radius: 50, // Rayon de la bulle
              color: 'orange',
              fillOpacity: 0.3,
              interactive: false // Désactive l'interaction directe avec la bulle
            }).addTo(map);
            bubbles.push({ bubble, question: q.question, visible: false });
          });
        }

        // Initialiser la carte sur les coordonnées de l'hôpital
        initMap();

        // Suivi de la position de l'apprenant en temps réel
        if (navigator.geolocation) {
          navigator.geolocation.watchPosition(pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const accuracy = pos.coords.accuracy;
            document.getElementById('gps-indicator').textContent = 'Capté';
            document.getElementById('accuracy-value').textContent = accuracy.toFixed(2);

            if (userMarker) {
              userMarker.setLatLng([lat, lng]);
            } else {
              userMarker = L.marker([lat, lng], { title: "Votre position" }).addTo(map);
            }

            // Vérifier si le joueur est dans une zone de bulle
            let closestBubble = null;
            let minDistance = Infinity;

            bubbles.forEach(b => {
              const bubbleLatLng = b.bubble.getLatLng();
              const distance = map.distance(L.latLng(lat, lng), bubbleLatLng);
              if (distance <= 20) { // 20 mètres de rayon
                closestBubble = b;
                minDistance = distance;
              }
            });

            // Mettre à jour l'affichage du texte
            if (closestBubble) {
              messageBox.textContent = closestBubble.question;
              if (!closestBubble.visible) {
                closestBubble.bubble.setStyle({ fillOpacity: 0.3, opacity: 1 });
                closestBubble.visible = true;
              }
            } else {
              messageBox.textContent = "Approchez-vous des bulles pour voir les questions...";
              bubbles.forEach(b => {
                if (b.visible) {
                  b.bubble.setStyle({ fillOpacity: 0, opacity: 0 });
                  b.visible = false;
                }
              });
            }

          }, error => {
            console.error("Erreur de géolocalisation : ", error);
            document.getElementById('gps-indicator').textContent = 'Non capté';
          });
        } else {
          alert("La géolocalisation n'est pas supportée par ce navigateur.");
        }
      }).catch(error => {
        console.error('Erreur lors du chargement des données du quiz:', error);
        const loadIndicator = document.getElementById('load-indicator');
        loadIndicator.textContent = "Erreur de chargement des textes.";
      });
  </script>
</body>
</html>
