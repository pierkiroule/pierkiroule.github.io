<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chasse au Trésor GPS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v8.0.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@v8.0.0/dist/ol.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { height: 70vh; width: 100%; }
    #message-box {
      height: 20vh;
      overflow-y: auto;
      padding: 1em;
      background: #ffe;
      border: 1px solid #ccc;
      margin-bottom: 1em;
    }
    #indicators { display: flex; justify-content: space-between; padding: 1em; }
    #load-indicator { color: red; font-weight: bold; }
    #load-indicator.loaded { color: green; }
  </style>
</head>
<body class="container-fluid">
  <header class="bg-primary text-white p-3 mb-3">
    <h1 class="h3">Chasse au Trésor GPS</h1>
    <p class="mb-0">Trouvez les énigmes cachées sur la carte !</p>
  </header>

  <div id="indicators">
    <div id="gps-status">GPS : <span id="gps-indicator">Non capté</span></div>
    <div id="bubble-count">Bulles chargées : <span id="bubble-count-indicator">0</span></div>
    <div id="load-indicator">Textes en cours de chargement...</div>
    <div id="gps-accuracy">Précision GPS : <span id="accuracy-value">Inconnue</span> mètres</div>
  </div>

  <div id="message-box">Approchez-vous des bulles pour voir les questions...</div>
  <div id="map"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf/turf.min.js"></script>

  <script>
    // Charger les données du quiz
    fetch('/quizgame/quiz_data.json')
      .then(response => response.json())
      .then(data => {
        const questions = data.questions;
        const bubbleCountIndicator = document.getElementById('bubble-count-indicator');
        bubbleCountIndicator.textContent = questions.length;

        // Indicateur de chargement des textes
        const loadIndicator = document.getElementById('load-indicator');
        loadIndicator.textContent = "Textes chargés avec succès !";
        loadIndicator.classList.add('loaded');

        let map;
        let userMarker = null;
        let bubbles = [];
        const messageBox = document.getElementById('message-box');

        // Fonction pour initialiser la carte
        function initMap() {
          map = new ol.Map({
            target: 'map',
            layers: [
              new ol.layer.Tile({
                source: new ol.source.OSM() // Utilise OpenStreetMap comme couche de base
              })
            ],
            view: new ol.View({
              center: ol.proj.fromLonLat([-2.775, 48.515]), // Centre initial sur Saint-Brieuc
              zoom: 15,
              rotation: 0 // Initialiser la rotation à 0
            })
          });

          // Ajout des questions sur la carte
          const vectorSource = new ol.source.Vector();
          questions.forEach(q => {
            const bubble = new ol.Feature(new ol.geom.Point(ol.proj.fromLonLat([q.lng, q.lat])));
            bubble.set('question', q.question);
            bubbles.push({ bubble, question: q.question, visible: false });
          });

          vectorSource.addFeatures(bubbles.map(b => b.bubble));

          const vectorLayer = new ol.layer.Vector({
            source: vectorSource,
            style: new ol.style.Style({
              image: new ol.style.Icon({
                anchor: [0.5, 1],
                src: 'https://openlayers.org/en/latest/examples/data/icon.png'
              })
            })
          });

          map.addLayer(vectorLayer);
        }

        // Initialiser la carte
        initMap();

        // Suivi de la position de l'apprenant en temps réel
        if (navigator.geolocation) {
          navigator.geolocation.watchPosition(pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const accuracy = pos.coords.accuracy;
            document.getElementById('gps-indicator').textContent = 'Capté';
            document.getElementById('accuracy-value').textContent = accuracy.toFixed(2);

            const userLocation = ol.proj.fromLonLat([lng, lat]);
            if (userMarker) {
              userMarker.getGeometry().setCoordinates(userLocation);
            } else {
              userMarker = new ol.Feature(new ol.geom.Point(userLocation));
              vectorSource.addFeature(userMarker);
            }

            // Centrer la carte sur la position de l'utilisateur
            map.getView().setCenter(userLocation);

            // Vérifier si le joueur est dans une zone de bulle
            let closestBubble = null;
            let minDistance = Infinity;

            bubbles.forEach(b => {
              const bubbleCoords = b.bubble.getGeometry().getCoordinates();
              const distance = turf.distance(ol.proj.toLonLat(userLocation), ol.proj.toLonLat(bubbleCoords), { units: 'meters' });
              if (distance <= 20) { // 20 mètres de rayon
                closestBubble = b;
                minDistance = distance;
              }
            });

            // Mettre à jour l'affichage du texte
            if (closestBubble) {
              messageBox.textContent = closestBubble.question;
              if (!closestBubble.visible) {
                closestBubble.visible = true;
              }
            } else {
              messageBox.textContent = "Approchez-vous des bulles pour voir les questions...";
              bubbles.forEach(b => {
                if (b.visible) {
                  b.visible = false;
                }
              });
            }

          }, error => {
            console.error("Erreur de géolocalisation : ", error);
            document.getElementById('gps-indicator').textContent = 'Non capté';
          });
        } else {
          alert("La géolocalisation n'est pas supportée par ce navigateur.");
        }

        // Suivi de l'orientation de l'appareil
        if (window.DeviceOrientationEvent) {
          window.addEventListener('deviceorientation', event => {
            if (event.alpha !== null) {
              // Utiliser l'angle alpha pour faire pivoter la carte
              map.getView().setRotation(-event.alpha * (Math.PI / 180));
            }
          });
        } else {
          alert("L'orientation de l'appareil n'est pas supportée.");
        }
      }).catch(error => {
        console.error('Erreur lors du chargement des données du quiz:', error);
        const loadIndicator = document.getElementById('load-indicator');
        loadIndicator.textContent = "Erreur de chargement des textes.";
      });
  </script>
</body>
</html>
