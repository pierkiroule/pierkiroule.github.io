<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bâille By Mirror 😴</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; height: 100%; background-color: #000; font-family: 'Arial', sans-serif; color: #000; }
        canvas { position: absolute; filter: brightness(1.2) contrast(1.1) hue-rotate(1deg) saturate(1.1); }
        
        #title { position: absolute; top: 3%; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: bold; color: black; text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.6); text-align: center; z-index: 10; }
        #emoji { position: absolute; font-size: 60px; opacity: 0.8; z-index: 10; }
        #score { position: absolute; top: 5%; right: 5%; font-size: 18px; font-weight: bold; color: white; z-index: 10; }
        #animation { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 50px; opacity: 0; transition: opacity 0.5s ease-in-out; z-index: 10; }
        #enemyBar { position: absolute; top: 1%; left: 50%; transform: translateX(-50%); font-size: 10px; z-index: 10; }
        #restartButton { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); padding: 15px 30px; font-size: 20px; font-weight: bold; color: #fff; background: linear-gradient(45deg, #00b4d8, #0077b6); border: none; border-radius: 10px; cursor: pointer; transition: transform 0.2s, background 0.3s; opacity: 0; z-index: 20; }
        #restartButton:hover { transform: scale(1.1); background: linear-gradient(45deg, #0077b6, #00b4d8); }

        #startScreen { position: absolute; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; }
        #startButton { padding: 15px 30px; font-size: 20px; font-weight: bold; color: #fff; background: linear-gradient(45deg, #00b4d8, #0077b6); border: none; border-radius: 10px; cursor: pointer; transition: transform 0.2s, background 0.3s; }
        #startButton:hover { transform: scale(1.1); background: linear-gradient(45deg, #0077b6, #00b4d8); }
        #instructions { font-size: 18px; margin-top: 20px; text-align: center; color: #ccc; }

        @media (orientation: portrait) {
            #title { font-size: 18px; }
            #emoji { font-size: 40px; }
            #instructions { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div id="startScreen">
        <h1>Bâille By Mirror 😴</h1>
        <button id="startButton">Démarrer</button>
        <p id="instructions">Bâillez pour projeter des particules et détruire les 🤯 ! Détruisez 10 pour gagner.</p>
    </div>
    <h1 id="title">Bâille By Mirror 😴</h1>
    <div id="score">Score: <span id="scoreCount">0</span> | <span id="highScoreCount">0</span></div>
    <div id="animation">Et hop•° une rumination en moins 👏</div>
    <div id="emoji">•°○</div>
    <div id="enemyBar">🤯🤯🤯🤯🤯🤯🤯🤯🤯🤯</div>
    <button id="restartButton" style="display: none;">Recommencer</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>

    <script>
        let faceMesh, video, faces = [];
        let isYawning = false;
        let particles = [];
        let explosionParticles = [];
        let enemy = null;
        let score = 0;
        let highScore = localStorage.getItem('highScore') || 0;
        let enemiesToKill = 10;

        let yawningSounds = [
            "https://pierkiroule.github.io/mp3/Yawn/Y1.mp3",
            "https://pierkiroule.github.io/mp3/Yawn/Y2.mp3",
            "https://pierkiroule.github.io/mp3/Yawn/Y3.mp3"
        ];
        let backgroundMusic = new Audio("https://pierkiroule.github.io/mp3/Yawn/Background1.mp3");
        let explosionSound = new Audio("https://pierkiroule.github.io/mp3/Yawn/Bop.mp3");
        let audio = new Audio();
        let gameStarted = false;

        function preload() {
            faceMesh = ml5.faceMesh({ maxFaces: 1, refineLandmarks: false, flipHorizontal: true });
        }

        function setup() {
            createCanvas(windowWidth, windowHeight);
            video = createCapture(VIDEO);
            video.size(640, 640);
            video.hide();
            document.getElementById("startButton").addEventListener("click", startGame);
            document.getElementById("restartButton").addEventListener("click", restartGame);
            document.getElementById("highScoreCount").innerText = highScore;
        }

        function startGame() {
            document.getElementById("startScreen").style.display = "none";
            gameStarted = true;
            faceMesh.detectStart(video, gotFaces);
            fullscreen(true);
            backgroundMusic.loop = true;
            backgroundMusic.volume = 0.3;
            backgroundMusic.play().catch(e => console.error("Erreur musique :", e));
            spawnEnemy();
        }

        function draw() {
            if (!gameStarted) return;
            background(0);

            push();
            translate(width, 0);
            scale(-1, 1);
            image(video, 0, 0, width, height);
            pop();

            if (faces.length > 0) {
                let mouthTopX = faces[0].keypoints[13].x;
                let mouthTopY = faces[0].keypoints[13].y;
                let mouthBottomX = faces[0].keypoints[14].x;
                let mouthBottomY = faces[0].keypoints[14].y;

                let scaleX = width / 640;
                let scaleY = height / 640;
                let centerX = width - ((mouthTopX + mouthBottomX) / 2) * scaleX;
                let centerY = ((mouthTopY + mouthBottomY) / 2) * scaleY;

                moveEmoji(centerX, centerY);
                detectYawning(faces[0]);
            }
            updateParticles();
            updateExplosionParticles();
            updateEnemy();
        }

        function moveEmoji(x, y) {
            let emoji = document.getElementById("emoji");
            emoji.style.left = `${x - 30}px`;
            emoji.style.top = `${y - 30}px`;
        }

        function detectYawning(face) {
            let mouthHeight = face.keypoints[14].y - face.keypoints[13].y;
            if (mouthHeight > 20 && !isYawning) {
                isYawning = true;
                spawnParticles();
                playRandomYawnSound();
            } else if (mouthHeight <= 20) {
                isYawning = false;
            }
        }

        function gotFaces(results) {
            faces = results;
        }

        function playRandomYawnSound() {
            let randomIndex = floor(random(yawningSounds.length));
            audio.src = yawningSounds[randomIndex];
            audio.play().catch(e => console.error("Erreur lecture audio :", e));
        }

        function spawnParticles() {
            let emoji = document.getElementById("emoji");
            let rect = emoji.getBoundingClientRect();
            let centerX = rect.left + rect.width / 2;
            let centerY = rect.top + rect.height / 2;

            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: centerX,
                    y: centerY,
                    size: random(10, 60),
                    speedX: random(-8, 8),
                    speedY: random(-8, 8),
                    life: 300,
                    color: [random(150, 255), random(150, 255), 255],
                    trail: []
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.speedX;
                p.y += p.speedY;
                p.life -= 2;

                if (frameCount % 3 === 0) p.trail.push({x: p.x, y: p.y});
                if (p.trail.length > 5) p.trail.shift();
                p.trail.forEach((pos, i) => {
                    fill(...p.color, p.life * (i/p.trail.length));
                    ellipse(pos.x, pos.y, p.size * (i/p.trail.length));
                });

                checkCollisions(p, i);
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function spawnExplosionParticles(x, y) {
            for (let i = 0; i < 50; i++) {
                explosionParticles.push({
                    x: x,
                    y: y,
                    size: random(2, 8),
                    speedX: random(-4, 4),
                    speedY: random(-4, 4),
                    life: 100,
                    color: [255, random(100, 255), random(100, 255)]
                });
            }
        }

        function updateExplosionParticles() {
            for (let i = explosionParticles.length - 1; i >= 0; i--) {
                let p = explosionParticles[i];
                p.x += p.speedX;
                p.y += p.speedY;
                p.life -= 3;
                fill(...p.color, p.life);
                rect(p.x, p.y, p.size, p.size);
                if (p.life <= 0) explosionParticles.splice(i, 1);
            }
        }

        function spawnEnemy() {
            if (enemiesToKill > 0 && !enemy) {
                enemy = {
                    x: random(width),
                    y: random(height),
                    size: 30,
                    type: random() < 0.001 && enemiesToKill > 1 ? "💫" : "🤯",
                    speed: 1 + (10 - enemiesToKill),
                    directionX: random([-1, 0, 1]),
                    directionY: random([-1, 0, 1]),
                    changeDirectionTimer: 60
                };
                if (enemy.type === "💫") {
                    enemy.speed *= 2;
                    enemy.color = [255, 200, 0];
                }
            }
        }

        function updateEnemy() {
            if (enemy) {
                enemy.x += enemy.speed * enemy.directionX;
                enemy.y += enemy.speed * enemy.directionY;

                if (enemy.x < 0 || enemy.x > width) enemy.directionX *= -1;
                if (enemy.y < 0 || enemy.y > height) enemy.directionY *= -1;
                enemy.x = constrain(enemy.x, 0, width);
                enemy.y = constrain(enemy.y, 0, height);

                enemy.changeDirectionTimer--;
                if (enemy.changeDirectionTimer <= 0) {
                    enemy.directionX = random([-1, 0, 1]);
                    enemy.directionY = random([-1, 0, 1]);
                    enemy.changeDirectionTimer = 60;
                }

                textSize(enemy.size);
                fill(255, 0, 0);
                text(enemy.type, enemy.x, enemy.y);
            }
        }

        function checkCollisions(particle, index) {
            if (enemy && dist(particle.x, particle.y, enemy.x, enemy.y) < enemy.size / 2) {
                enemy.size *= 1.2;
                setTimeout(() => { if(enemy) enemy.size /= 1.2 }, 100);
                spawnExplosionParticles(enemy.x, enemy.y);
                explosionSound.play().catch(e => console.error("Erreur son explosion :", e));
                enemy = null;
                particles.splice(index, 1);
                score++;
                enemiesToKill--;
                updateScore();
                showFeedback();
                updateEnemyBar();
                if (enemiesToKill > 0) {
                    spawnEnemy();
                } else {
                    endGame();
                }
            }
        }

        function updateScore() {
            document.getElementById("scoreCount").innerText = score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highScore', highScore);
                document.getElementById("highScoreCount").innerText = highScore;
            }
        }

        function showFeedback() {
            let anim = document.getElementById("animation");
            anim.innerText = "Et hop•° une rumination en moins 👏";
            anim.style.opacity = 1;
            setTimeout(() => anim.style.opacity = 0, 1000);
        }

        function updateEnemyBar() {
            let bar = document.getElementById("enemyBar");
            bar.innerText = "🤯".repeat(enemiesToKill);
        }

        function endGame() {
            gameStarted = false;
            backgroundMusic.pause();
            let anim = document.getElementById("animation");
            anim.innerText = score > highScore ? "Nouveau record! 🏆" : "Gagné ! 🎉";
            anim.style.opacity = 1;
            let restartBtn = document.getElementById("restartButton");
            restartBtn.style.display = "block";
            restartBtn.style.opacity = 1;
        }

        function restartGame() {
            gameStarted = true;
            score = 0;
            enemiesToKill = 10;
            enemy = null;
            particles = [];
            explosionParticles = [];
            updateScore();
            updateEnemyBar();
            backgroundMusic.play().catch(e => console.error("Erreur musique :", e));
            let anim = document.getElementById("animation");
            anim.style.opacity = 0;
            let restartBtn = document.getElementById("restartButton");
            restartBtn.style.display = "none";
            spawnEnemy();
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
