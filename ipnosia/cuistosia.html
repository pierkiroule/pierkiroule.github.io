-weight:850;font-size:25px}.definition{color:#536579;font-size:15px}.summaryrow{padding:15px 0;border-bottom:1px solid #e9edf2}.summaryrow:last-child{border:0}.summaryrow strong{display:block}.summaryrow small{color:#64738a}.status{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:750;margin-top:5px;background:#f0f2f5}.status.known{background:#d5f3e3;color:#176043}.status.learned{background:#dce9ff;color:#275995}.status.pending{background:#ffead7;color:#8b5224}.footnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0}.note{width:100%;min-height:80px;resize:vertical;background:#f7f9fc;border:1px solid #e8edf3;border-radius:13px;padding:13px;color:var(--ink)}.mini{font-size:13px}.tools{display:flex;flex-wrap:wrap;gap:8px}.tools a{color:#2e587e;border:1px solid #e1e8ef;border-radius:12px;padding:9px 12px;text-decoration:none;background:#f5f8fc;font-size:13px;font-weight:650}.tools a:hover{text-decoration:underline}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#233e35;color:white;padding:12px 17px;border-radius:15px;font-weight:750;box-shadow:0 10px 35px #0002;z-index:50}.modal{position:fixed;inset:0;background:#15243c88;z-index:40;display:grid;place-items:center;padding:16px;backdrop-filter:blur(8px)}.modal .glass{max-width:500px;width:100%;padding:27px;box-shadow:0 20px 60px #12243d35}.modal .choices{margin-top:17px}.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:25px}.filterrow{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.filterrow button{background:#f4f7fb;color:#3a4a60;border:1px solid #e8edf2;padding:9px 12px;border-radius:999px}.filterrow button.active{background:#24354e;color:white}.printonly{display:none}.home-intro{background:linear-gradient(130deg,#e7fbf2 0%,#f6faff 65%,#fff 100%)}.home-intro .eyebrow{color:#178967}.home-intro .lead{font-size:17px;color:#41536a;max-width:660px}.howto{display:flex;gap:12px;flex-wrap:wrap;margin-to const stages=[
{id:0,key:'ch',name:'Marmite 1',title:'Écouter & cuisiner les mots',subtitle:'De la scène clinique à la métaphore',emoji:'🫕',color:'#74dfb3',deep:'#318e72',wash:'rgba(67,190,140,.27)',duration:'Écoute + texte',goal:'Faire émerger une idée de médiation IA depuis l’écoute d’un patient fictif, puis formuler un premier prompt.',mission:['En trinôme, jouez une séance fictive de 5 minutes : un patient décrit une difficulté concrète ; le soignant écoute et relance ; l’observateur repère les mots sensoriels.','Débriefez : quel vécu ? quelle expérience le patient aimerait-il découvrir ? Quelle médiation IA pourrait soutenir cette expérience, ou pourquoi s’en passer ?','Dans une IA conversationnelle, explorez plusieurs pistes puis créez une courte métaphore. Ajustez-la à partir des mots du patient.','Partagez une création et discutez ce qui facilite ou freine l’alliance.'],roles:['Patient : « Le soir, mes pensées tournent comme un moteur. J’aimerais ralentir. » Décrivez ce que vous ressentez, sans chercher à aider le soignant.','Soignant : « C’est comment, ce moteur ? », « Qu’aimeriez-vous ressentir à la place ? », « Quel support vous aiderait à l’explorer ? » N’imposez pas l’IA.','Observateur : notez les mots du patient, les relances, le moment où une idée émerge et la place laissée au choix du patient.'],prompt:'À partir de cette situation fictive et non identifiable : « Le soir, mes pensées tournent comme un moteur. J’aimerais ralentir. » Propose 3 idées de médiations sensorielles différentes, sans imposer d’interprétation. Puis écris une métaphore hypnotique de 120 mots maximum, souple et non directive. Utilise les mots du patient. Ne présente aucune efficacité comme garantie.',tools:[['Mammouth AI','https://mammouth.ai/'],['ChatGPT','https://chatgpt.com/'],['Claude','https://claude.ai/']],keypoint:'L’écoute et l’intention du patient précèdent le choix de l’outil.',skill:'Écouter, faire émerger une intention, imaginer une médiation et ajuster un prompt.',concepts:[["Écoute hypnotique","Savoir-être","Écouter les mots, sensations et images de la personne sans chercher immédiatement une solution. Exemple : explorer ce que signifie « mon esprit tourne » avant de proposer une image."],["Alliance et consentement","Savoir-être","Construire une coopération où le patient peut choisir, modifier ou refuser une médiation. L’IA ne remplace jamais cette relation."],["Position de non-savoir","Savoir-être","Rester curieux de la signification que le patient donne à ses propres mots, plutôt que d’interpréter à sa place."],["Intention expérientielle","Savoir","Ce que la personne souhaite apprendre à ressentir ou expérimenter : par exemple, passer d’un rythme intérieur rapide à un ralentissement possible."],["Métaphore thérapeutique","Savoir","Image ou histoire qui permet d’explorer autrement une expérience. Elle reste une proposition : le patient lui donne son propre sens."],["Cocréation","Savoir-faire","Construire le support avec le patient : lui demander ce qui lui convient, puis ajuster la proposition à ses réponses."],["LLM","Savoir","Large Language Model : modèle entraîné sur de grandes quantités de textes pour prédire des suites de tokens. Il produit du langage plausible, pas une expertise clinique garantie."],["Token","Savoir","Petite unité de texte traitée par un modèle : un mot, un morceau de mot ou un signe. Le nombre de tokens influence les limites et parfois le coût."],["Fenêtre de contexte","Savoir","Quantité d’informations que l’IA peut prendre en compte dans une requête. Un contexte trop long peut dépasser cette limite ou diluer les consignes."],["Hallucination IA","Savoir","Affirmation inventée ou erronée formulée avec assurance. Exemple : une référence scientifique inexistante ; toujours vérifier les faits importants."],["Prompt structuré","Savoir-faire","Écrire une demande en précisant objectif, contexte fictif, contraintes et format attendu. Exemple : « Propose 3 métaphores non directives en 80 mots ». "],["Itération","Savoir-faire","Améliorer une production par petites corrections : « moins directif », « plus sensoriel », « conserve les mots du patient »."],["Mammouth AI","Savoir-faire","Plateforme permettant d’accéder à différents modèles selon l’offre. Utile pour produire une première médiation textuelle et la retravailler."],["ChatGPT / Claude","Savoir-faire","Assistants conversationnels pouvant aider à rédiger, reformuler et coder. Le thérapeute sélectionne et vérifie ce qui sera réellement utilisé."],["Données fictives","Savoir-être","Ne jamais saisir de données permettant d’identifier un patient dans un service IA non autorisé. Préférer des situations entièrement fictives."]]},
{id:1,key:'au',name:'Marmite 2',title:'Donner à voir',subtitle:'De la métaphore à l’image',emoji:'🎨',color:'#ffb27a',deep:'#b66c35',wash:'rgba(249,149,81,.29)',duration:'Image',goal:'Traduire une intention sensorielle en image, puis la modifier sans figer l’imaginaire du patient.',mission:['Choisissez une métaphore de la première marmite ou une nouvelle intention clinique fictive.','Demandez une image avec un sujet, une ambiance, une palette, une composition et un style.','Testez une variation : lumière, distance, détails, matière ou cadrage.','Échangez : qu’est-ce qui résonne ? qu’est-ce qui semble trop imposé ?'],roles:[],prompt:'Crée une image poétique, sans texte, représentant un moteur intérieur qui apprend à ralentir comme un paysage au crépuscule. Composition épurée, couleurs douces, espace ouvert, aucune personne. Propose ensuite 3 variations visuelles possibles. L’image doit rester interprétable et non prescriptive.',tools:[['Mammouth AI','https://mammouth.ai/'],['ChatGPT','https://chatgpt.com/'],['Photopea','https://www.photopea.com/']],keypoint:'Une image utile ouvre des possibles : elle n’impose pas une représentation.',skill:'Générer, comparer et ajuster une image en fonction de l’intention et des préférences.',concepts:[["Image générative","Savoir","Image créée par un modèle à partir d’une description ou d’un visuel de référence. Ce n’est pas une photographie ni une représentation fidèle garantie."],["Modèle de diffusion","Savoir","Famille de modèles qui construisent souvent une image en transformant progressivement du bruit en formes cohérentes."],["Espace latent","Savoir","Représentation numérique condensée utilisée par certains modèles pour manipuler des caractéristiques visuelles avant de produire l’image."],["Prompt visuel","Savoir-faire","Décrire sujet, ambiance, composition, lumière et style. Exemple : « horizon ouvert, lumière douce, sans personnage ni texte »."],["Composition et cadrage","Savoir-faire","Organiser les éléments et choisir la distance de vue pour laisser de la place à l’imagination du patient."],["Variation","Savoir-faire","Créer plusieurs versions d’une image pour comparer ce qui correspond à l’intention : plus abstrait, plus lumineux, moins figuratif."],["Inpainting","Savoir-faire","Modifier seulement une zone d’image. Exemple : remplacer un objet trop imposant sans recréer tout le paysage."],["Outpainting","Savoir-faire","Prolonger une image au-delà de ses bords pour ouvrir le paysage ou changer le format."],["Photopea","Savoir-faire","Éditeur d’images dans le navigateur, pratique pour recadrer, assembler ou retoucher une médiation."],["Générateurs d’images","Savoir-faire","ChatGPT Images, Midjourney ou des modèles de type Stable Diffusion permettent de créer des visuels ; leurs accès et licences varient."],["Projection et polysémie","Savoir","Une image ouverte peut évoquer plusieurs sens. Éviter de décréter ce que le patient « doit » y voir."],["Paréidolie","Savoir","Tendance à reconnaître des formes familières dans des motifs ambigus, comme un visage dans un nuage ; ce n’est pas une interprétation clinique en soi."],["Biais visuels","Savoir","Les images générées reflètent des stéréotypes et préférences statistiques des données d’entraînement ; interroger les représentations proposées."],["Question ouverte","Savoir-être","Demander « Qu’est-ce que cette image évoque pour vous ? » plutôt que « Cette image vous apaise, n’est-ce pas ? »."],["Respect des préférences","Savoir-être","Laisser la personne refuser une couleur, un symbole ou une image : la pertinence est subjective, non dictée par l’outil."]]},
{id:2,key:'dr',name:'Marmite 3',title:'Donner à entendre & animer',subtitle:'Du paysage sonore au mouvement',emoji:'🎧',color:'#c1a0ff',deep:'#7e62b3',wash:'rgba(159,112,233,.3)',duration:'Audio + vidéo',goal:'Explorer la traduction d’une intention en ambiance sonore puis en animation courte.',mission:['Choisissez une intention sensorielle : ralentir, s’alléger, se sentir soutenu…','Imaginez ou générez un court paysage sonore : texture, rythme, intensité, silences.','Animez une image avec un mouvement simple et progressif, ou observez une démonstration si l’outil n’est pas disponible.','Testez : le son et le mouvement soutiennent-ils l’expérience ou la surchargent-ils ?'],roles:[],prompt:'Imagine une ambiance sonore non verbale de 20 secondes évoquant un ralentissement progressif. Décris précisément rythme, texture, intensité, silences et transitions, sans promesse thérapeutique. Puis écris un prompt vidéo de 5 secondes : une lumière douce évolue lentement, caméra fixe, aucun flash, aucun mouvement brusque.',tools:[['Mammouth AI','https://mammouth.ai/'],['Audacity','https://www.audacityteam.org/'],['CapCut','https://www.capcut.com/']],keypoint:'Le rythme, le confort et le choix du patient priment sur les effets spectaculaires.',skill:'Décrire, générer ou assembler une ambiance sonore et un mouvement cohérents.',concepts:[["Multimodalité","Savoir","Capacité d’un système à traiter ou générer plusieurs modalités : texte, image, son ou vidéo."],["Transmodalité","Savoir","Passage d’une modalité sensorielle à une autre. Exemple : transformer l’idée de « ralentir » en rythme sonore, puis en mouvement visuel."],["TTS et STT","Savoir","Text-to-speech : transformer un texte en voix ; speech-to-text : transcrire une voix en texte. Ce sont deux fonctions différentes."],["Text-to-audio","Savoir","Générer un son à partir d’une description. Le résultat peut être imprévisible et doit être écouté avant usage."],["Image-to-video","Savoir","Animer une image fixe avec une consigne de mouvement, de caméra ou de durée."],["Temporalité hypnotique","Savoir","Importance du rythme, des pauses et de la durée dans l’expérience proposée. Une animation rapide peut contredire une intention de ralentissement."],["Prompt sonore","Savoir-faire","Préciser texture, tempo, intensité, évolution et silence. Exemple : « bruissement doux, espacé, sans voix, fondu final »."],["Montage et fondu","Savoir-faire","Assembler des sons et régler des transitions progressives pour éviter les ruptures brusques."],["Audacity","Savoir-faire","Logiciel de montage audio : couper, ajuster le niveau sonore et créer des fondus."],["ElevenLabs / Suno","Savoir-faire","Exemples d’outils de synthèse vocale ou musicale. Vérifier leurs fonctions, conditions d’utilisation et les droits sur les contenus."],["Prompt de mouvement","Savoir-faire","Décrire un mouvement simple : « caméra fixe, respiration lente de la lumière, sans flash, cinq secondes »."],["Runway / Kling","Savoir-faire","Exemples de services de génération vidéo ; l’accès aux modèles, la durée et les coûts dépendent des offres."],["Confort sensoriel","Savoir-être","Vérifier avec la personne le volume, les mouvements, les flashes et les sensations désagréables ; prévoir l’arrêt immédiat."],["Sobriété créative","Savoir-être","Choisir seulement les effets utiles à l’intention. Plus de médias ne signifie pas meilleure médiation."],["Évaluation avec le patient","Savoir-être","Demander ce qui aide, gêne ou laisse indifférent. Un effet esthétique ne démontre pas une efficacité thérapeutique."]]},
{id:3,key:'on',name:'Marmite 4',title:'Rendre interactif',subtitle:'Du média à l’expérience pilotable',emoji:'✨',color:'#83cfff',deep:'#4282b7',wash:'rgba(89,173,230,.28)',duration:'Mini-app + synthèse',goal:'Découvrir comment demander à l’IA un prototype simple qui laisse le patient agir sur la médiation.',mission:['Imaginez un geste unique : déplacer un curseur pour ralentir un mouvement, faire varier une lumière ou moduler une ambiance.','Demandez à une IA de générer un seul fichier HTML utilisable sur smartphone.','Ouvrez le prototype, testez le geste, puis demandez une correction ciblée.','En fin d’atelier, ouvrez votre carnet : ce qui est compris et ce qui reste à éclaircir.'],roles:[],prompt:'Code une mini-médiation interactive en un seul fichier HTML, CSS et JavaScript, sans bibliothèque externe. Fond doux, une forme organique animée et un curseur intitulé « Mon rythme » qui ralentit ou accélère l’animation. Interface mobile, accessible, sans collecte de données, sans flash. Fournis le code complet.',tools:[['Claude','https://claude.ai/'],['ChatGPT','https://chatgpt.com/'],['CodePen','https://codepen.io/']],keypoint:'L’interactivité a du sens quand elle redonne du pouvoir d’agir au patient.',skill:'Formuler une demande de prototype, tester une interaction et ajuster un résultat.',concepts:[["Prototype","Savoir","Première version simplifiée d’une idée, conçue pour être essayée et corrigée, non pour être utilisée d’emblée en clinique."],["HTML / CSS / JavaScript","Savoir","HTML organise la page ; CSS définit son apparence ; JavaScript rend les éléments interactifs."],["Génération de code","Savoir","L’IA peut produire du code à partir d’une description, mais ce code peut contenir des erreurs ou des comportements non prévus."],["Vibe coding","Savoir","Créer un logiciel en décrivant à l’IA ce qu’on veut, puis en testant et corrigeant le résultat. Ce n’est pas une dispense de vérification."],["Interaction et agentivité","Savoir","Une interface interactive permet à la personne d’agir sur le support : par exemple régler elle-même la vitesse d’une animation."],["Prompt de prototype","Savoir-faire","Décrire un seul geste et son effet observable : « un curseur fait ralentir une forme animée ; fonctionne sur mobile »."],["Monofichier HTML","Savoir-faire","Regrouper HTML, CSS et JavaScript dans un seul fichier facile à ouvrir et partager, sans installation complexe."],["Tester et déboguer","Savoir-faire","Essayer chaque bouton, repérer un comportement inattendu, puis demander à l’IA une correction ciblée."],["CodePen","Savoir-faire","Éditeur web pour tester rapidement une interface HTML, CSS et JavaScript."],["GitHub","Savoir-faire","Service de gestion et de partage de versions du code, utile pour retrouver un état antérieur du prototype."],["API et clé API","Savoir","Une API relie des logiciels ; sa clé donne accès à un service. Une clé secrète ne doit jamais être placée dans une page HTML publique."],["IA locale","Savoir","Modèle exécuté sur un appareil ou serveur maîtrisé. Peut limiter certains transferts de données, sans garantir à lui seul la conformité."],["Accessibilité","Savoir-faire","Prévoir des contrôles lisibles, utilisables au toucher et au clavier, et une option pour réduire les animations."],["Confidentialité et RGPD","Savoir-être","Ne pas exposer de données cliniques identifiables. Vérifier les règles institutionnelles et le cadre légal avant tout usage réel."],["Humain aux commandes","Savoir-être","Le thérapeute et le patient gardent le choix, le contrôle et la possibilité d’arrêter ; l’IA reste un outil, jamais un décideur clinique."]]}
];
const K='cuisto4m_v4_pedago';let saved={};try{saved=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}const state={unlocked:saved.unlocked||[],ratings:saved.ratings||{},notes:saved.notes||{},page:'home',active:0,modal:null,filter:'all'};function persist(){try{localStorage.setItem(K,JSON.stringify({unlocked:state.unlocked,ratings:state.ratings,notes:state.notes}))}catch(e){}}function count(){return Object.values(state.ratings).filter(x=>x==='understood').length}function setTheme(s){document.documentElement.style.setProperty('--accent',s?.color||'#78e0bf');document.documentElement.style.setProperty('--accent2',s?.deep||'#448f7c')}function safe(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function goHome(){state.page='home';render();scrollTo(0,0)}function enter(i){if(i>0&&!state.unlocked.includes(i-1)){state.active=i-1;state.page='stage';render();toast('Ouvrez d’abord la marmite précédente.');scrollTo(0,0);return}state.active=i;state.page='stage';render();scrollTo(0,0)}function showSummary(){state.page='summary';render();scrollTo(0,0)}function render(){let s=stages[state.active];setTheme(state.page==='stage'?s:null);document.getElementById('counter').textContent=count()+'/'+stages.reduce((a,x)=>a+x.concepts.length,0);document.getElementById('app').innerHTML=state.page==='home'?home():state.page==='summary'?summary():stage(s);if(state.page==='stage'&&state.unlocked.includes(s.id)){let ta=document.getElementById('note');if(ta)ta.addEventListener('input',e=>{state.notes[s.id]=e.target.value;persist()})}}function home(){return `<section class="hero glass home-intro newhero"><div class="hero-logo" aria-label="Logo El Cuisto"><svg viewBox="0 0 120 120" width="94" height="94" role="img" aria-label="Marmite multicolore"><defs><linearGradient id="potGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#65dcb2"/><stop offset=".55" stop-color="#80bfff"/><stop offset="1" stop-color="#bc9bff"/></linearGradient></defs><circle cx="60" cy="60" r="58" fill="#ffffff" opacity=".82"/><path d="M42 28q-8-12 2-20M61 27q-8-12 2-20M80 28q-8-12 2-20" stroke="#ef9a64" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M21 51h78M28 54v23q0 25 32 25t32-25V54" fill="url(#potGradient)" stroke="#29435e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 65H9m93 0h9" stroke="#29435e" stroke-width="6" stroke-linecap="round"/><ellipse cx="60" cy="52" rx="39" ry="10" fill="#fff3d8" stroke="#29435e" stroke-width="5"/><circle cx="46" cy="49" r="5" fill="#f8b96e"/><circle cx="66" cy="51" r="5" fill="#ac87e7"/><circle cx="78" cy="48" r="4" fill="#5ec99d"/></svg></div><div class="eyebrow">Atelier ludique · Hypnose & IA générative</div><h1>El Cuisto<span class="brandmark">•°</span><br><span class="gradient-text">de la HypnosIA</span></h1><p class="hero-subtitle">Quatre marmites pour faire pétiller les idées.</p><p class="lead">En hypnose, tout commence par <b>l’écoute</b>. Comme en cuisine, on choisit ensuite les ingrédients qui conviennent : <b>mots, images, sons et interactions</b>. L’IA est un ustensile créatif, pas le chef : le patient reste libre de goûter, d’ajuster ou de refuser.</p><div class="howto"><span>🔓 Un sésame par marmite</span><span>🫧 Une bulle = un apprentissage</span><span>✨ Compris ? Faites POP !</span><span>📒 Votre récolte devient une fiche</span></div><div class="actions"><button class="primary" onclick="enter(0)">Entrer dans la cuisine →</button><button class="secondary" onclick="showSummary()">Ma récolte · ${count()} notions</button></div></section><div class="colorline">${stages.map(s=>`<i style="background:${s.color}"></i>`).join('')}</div><div class="four">${stages.map(s=>`<button class="tile ${state.unlocked.includes(s.id)?'':'locked'}" style="border-top:5px solid ${s.color}" onclick="enter(${s.id})"><span class="num">MARMITE 0${s.id+1}</span><div class="ico">${s.emoji}</div><strong>${safe(s.title)}</strong><small>${safe(s.duration)}</small><span class="state">${state.unlocked.includes(s.id)?'✓ Ouverte':s.id>0&&!state.unlocked.includes(s.id-1)?'🔒 Marmite précédente requise':'🔒 Sésame requis'}</span></button>`).join('')}</div><section class="glass section"><h3>La règle du jeu</h3><p class="muted">À chaque séquence, l’animateur révèle un sésame. Découvrez les notions et les outils. <b>Si vous comprenez une notion, touchez sa bulle : elle éclate et disparaît avec un POP !</b> Si elle reste floue, ne la touchez pas : elle restera visible. Le petit <b>i</b> ouvre la définition sans éclater la bulle.</p><p class="mini muted">Votre fiche finale rassemble les notions récoltées et celles à approfondir. Progression enregistrée uniquement sur votre appareil.</p></section>`}
function stage(s){if(!state.unlocked.includes(s.id))return `<section class="stagehead" style="--wash:${s.wash}"><div class="tag">🔒 ${s.name}</div><h2>${safe(s.title)}</h2><p class="muted">Cette marmite s’ouvre au signal de l’animateur.</p></section><section class="glass unlock"><div class="pot" style="--accent:${s.color};--accent2:${s.deep}" aria-hidden="true"><span class="steam">♨️</span><div class="handle"></div><div class="rim"></div><div class="bowl"></div></div><h3>Quel est le sésame ?</h3><p class="hint">Un sésame de deux lettres est donné par l’animateur à chaque étape. Les marmites s’ouvrent dans l’ordre.</p><form onsubmit="unlock(event,${s.id})"><input id="pass" autocomplete="off" autocapitalize="off" maxlength="12" aria-label="Sésame de la marmite ${s.id+1}" placeholder="••" required><div class="error" id="err" aria-live="polite"></div><button class="primary" type="submit">Ouvrir la marmite</button></form></section><div class="footnav"><button class="secondary" onclick="goHome()">← Les marmites</button><button class="secondary" onclick="enter(${(s.id+1)%4})">Marmite suivante →</button></div>`;let done=s.concepts.filter((_,j)=>state.ratings[`${s.id}-${j}`]==='understood').length;return `<section class="stagehead" style="--wash:${s.wash}"><div class="tag">${s.emoji} ${s.name} · ${safe(s.duration)}</div><h2>${safe(s.title)}</h2><p class="desc">${safe(s.subtitle)}</p><div class="pill" style="display:inline-block;color:white">Objectif : ${safe(s.goal)}</div></section><div class="grid2"><section class="glass card"><h3>🎯 Votre mission</h3>${s.mission.map((m,i)=>`<div class="step"><b>${i+1}.</b><span>${safe(m)}</span></div>`).join('')}${s.roles.length?`<details><summary style="cursor:pointer;font-weight:800;margin-top:12px">Voir les consignes précises du jeu de rôle</summary><ul>${s.roles.map(r=>`<li>${safe(r)}</li>`).join('')}</ul></details>`:''}</section><section class="glass card"><h3>🧰 Les ustensiles</h3><p class="muted mini">Exemples d’outils à explorer selon leur disponibilité.</p><div class="tools">${s.tools.map(t=>`<a href="${t[1]}" target="_blank" rel="noopener noreferrer">${safe(t[0])} ↗</a>`).join('')}</div><h3 style="margin-top:23px">📝 Recette de prompt</h3><p class="mini muted">Une base à personnaliser, jamais une prescription clinique.</p><div class="collect"><div class="mini">${safe(s.prompt)}</div></div><div class="actions"><button class="secondary" onclick="copyPrompt(${s.id})">Copier le prompt</button></div></section></div><section class="glass section" style="margin-top:16px"><div class="eyebrow">La récolte</div><h2>Récoltez vos apprentissages</h2><p class="muted">Une notion comprise ? Touchez sa bulle : POP, elle disparaît ! Sinon, laissez-la flotter. Touchez <b>i</b> pour sa définition.</p><div class="progress"><span style="width:${Math.round(done/s.concepts.length*100)}%"></span></div><div class="mini">${done} / ${s.concepts.length} notions récoltées dans cette marmite</div><div class="categorylegend">${[...new Set(s.concepts.map(c=>c[1]))].map(cat=>`<span class="categorychip"><i style="background:${categoryColors[cat]||'#DCE8F5'}"></i>${safe(cat)}</span>`).join('')}</div><div class="bubblezone">${s.concepts.map(([name,cat],j)=>{let r=state.ratings[`${s.id}-${j}`];if(r==='understood')return '';let sz=104+(j%3)*13;return `<div class="bubblewrap"><button class="bubble ${r==='understood'?'popped':''}" style="--size:${sz}px;--bubble:${categoryColors[cat]||'#DCE8F5'};animation-delay:${j*35}ms" onclick="toggleBubble(${s.id},${j},this)" aria-label="${safe(name)} : ${r==='understood'?'comprise, toucher pour remettre':'toucher si compris'}">${r==='understood'?'<span class="check">✓</span>':''}${safe(name)}<small>${safe(cat)}</small></button><button class="bubbleinfo" onclick="openBubble(${s.id},${j})" aria-label="Définition : ${safe(name)}" title="Lire la définition">i</button></div>`}).join('')}</div><div class="legend"><span class="pill">✓ Disparue : compris</span><span class="pill">○ Intacte : à découvrir</span><span class="pill">i : définition</span></div></section><section class="glass card" style="margin-top:16px"><h3>💡 Ce qu'on retient</h3><p><b>Message clé :</b> ${safe(s.keypoint)}</p><p><b>Compétence travaillée :</b> ${safe(s.skill)}</p><h3 style="margin-top:18px">✍️ Ma note de Cuisto•°</h3><textarea class="note" id="note" placeholder="Une idée de médiation, un prompt, une question…">${safe(state.notes[s.id]||'')}</textarea></section><div class="footnav"><button class="secondary" onclick="${s.id===0?'goHome()':`enter(${s.id-1})`}">← ${s.id===0?'Accueil':'Précédente'}</button><button class="primary" onclick="${s.id===3?'showSummary()':`enter(${s.id+1})`}">${s.id===3?'Voir ma récolte':'Marmite suivante →'}</button></div>`}function unlock(e,i){e.preventDefault();let value=document.getElementById('pass').value.trim().toLowerCase();if(value===stages[i].key&&(i===0||state.unlocked.includes(i-1))){if(!state.unlocked.includes(i))state.unlocked.push(i);persist();render();toast('Marmite ouverte !')}else document.getElementById('err').textContent='Pas encore ! Demandez le sésame à l’animateur.'}function playPop(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=window._popCtx||(window._popCtx=new C());if(ctx.state==='suspended')ctx.resume();const osc=ctx.createOscillator(),gain=ctx.createGain(),t=ctx.currentTime;osc.type='sine';osc.frequency.setValueAtTime(720,t);osc.frequency.exponentialRampToValueAtTime(190,t+.095);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.22,t+.008);gain.gain.exponentialRampToValueAtTime(.0001,t+.13);osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+.14)}catch(e){}}function toggleBubble(i,j,button){const k=`${i}-${j}`;if(state.ratings[k]==='understood')return;state.ratings[k]='understood';persist();playPop();const bubble=button;const wrap=bubble?.closest('.bubblewrap');if(wrap){wrap.classList.add('burst');setTimeout(()=>render(),260)}else render();document.getElementById('counter').textContent=count()+'/'+stages.reduce((a,x)=>a+x.concepts.length,0)}
function openBubble(i,j){state.modal={i,j};let s=stages[i],c=s.concepts[j],r=state.ratings[`${i}-${j}`];document.getElementById('modalcontent').innerHTML=`<div class="eyebrow">${s.name} · ${safe(c[1])}</div><h2 class="concept">${safe(c[0])}</h2><p class="definition">${safe(c[2])}</p><p class="mini muted">${r==='understood'?'✓ Notion récoltée':'○ Notion encore à découvrir'}</p><div class="actions"><button class="primary" onclick="closeModal()">Compris</button></div>`;document.getElementById('modal').classList.remove('hide')}function closeModal(){document.getElementById('modal').classList.add('hide');state.modal=null}function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.remove('hide');clearTimeout(window._toast);window._toast=setTimeout(()=>el.classList.add('hide'),1800)}function copyPrompt(i){let v=stages[i].prompt;if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(v).then(()=>toast('Prompt copié !')).catch(()=>fallbackCopy(v));else fallbackCopy(v)}function fallbackCopy(v){let t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Prompt copié !')}catch(e){toast('Sélectionnez et copiez le prompt')}t.remove()}function summary(){
 const total=stages.reduce((a,s)=>a+s.concepts.length,0),understood=count();
 const categories=['Savoir','Savoir-faire','Savoir-être'];
 const defs={'Savoir':'Ce que je comprends : notions cliniques, IA et culture technique.','Savoir-faire':'Ce que je sais expérimenter : gestes, méthodes et outils.','Savoir-être':'La posture que je cultive : écoute, alliance, discernement et éthique.'};
 const all=stages.flatMap(s=>s.concepts.map((c,j)=>({c,s,r:state.ratings[`${s.id}-${j}`]==='understood'?'understood':'pending'})));
 return `<section class="hero glass"><div class="eyebrow">Mon carnet du Cuisto•°</div><h1>Ma fiche d'apprentissages</h1><p class="lead">Une synthèse pour distinguer ce que j'ai compris et ce que je peux encore explorer, sans note ni jugement.</p><div class="grid2"><div class="collect"><strong style="font-size:30px">${understood}</strong><p>notions comprises</p></div><div class="collect"><strong style="font-size:30px">${total-understood}</strong><p>notions à éclaircir</p></div></div><div class="progress"><span style="width:${Math.round(understood/total*100)}%"></span></div><div class="actions noprint"><button class="primary" onclick="window.print()">Imprimer / PDF</button><button class="secondary" onclick="exportText()">Exporter en texte</button><button class="secondary" onclick="goHome()">Retour aux marmites</button></div></section>
 <section class="glass section" style="margin-top:16px"><h2>Mes trois ingrédients pédagogiques</h2><p class="muted">Chaque notion est expliquée simplement, avec un exemple ou un usage concret quand c'est pertinent.</p>${categories.map(cat=>{let items=all.filter(x=>x.c[1]===cat);let ok=items.filter(x=>x.r==='understood');let pending=items.filter(x=>x.r!=='understood');return `<div class="learning-group" style="--cat:${categoryColors[cat]}"><div class="learning-head"><h3>${cat}</h3><span class="pill">${ok.length} / ${items.length} compris</span></div><p class="mini muted">${defs[cat]}</p><h4>✓ J'ai compris (${ok.length})</h4>${ok.length?ok.map(({c,s})=>`<div class="summaryrow"><strong>${safe(c[0])} <span class="stage-mini">Marmite ${s.id+1}</span></strong><p class="mini">${safe(c[2])}</p></div>`).join(''):'<p class="muted mini">Aucune bulle éclatée pour le moment.</p>'}<h4>○ À éclaircir (${pending.length})</h4>${pending.length?pending.map(({c,s})=>`<div class="summaryrow"><strong>${safe(c[0])} <span class="stage-mini">Marmite ${s.id+1}</span></strong><p class="mini">${safe(c[2])}</p></div>`).join(''):'<p class="muted mini">Toutes les notions de cette catégorie ont été récoltées !</p>'}</div>`}).join('')}</section>
 <section class="glass section" style="margin-top:16px"><h2>Les 4 compétences explorées</h2>${stages.map(s=>`<div class="summaryrow"><strong style="color:${s.deep}">${s.name} — ${safe(s.title)}</strong><p class="mini">${safe(s.skill)}</p><p class="mini muted">${safe(s.keypoint)}</p>${state.notes[s.id]?`<p class="mini"><b>Ma note :</b> ${safe(state.notes[s.id])}</p>`:''}</div>`).join('')}</section><section class="glass section" style="margin-top:16px"><h3>Bravo, Cuisto•° !</h3><p>Les bulles encore présentes sont des pistes d'apprentissage. L'essentiel : écouter avant de créer, choisir l'outil avec discernement et laisser au patient la liberté d'ajuster.</p></section>`;
}
function exportText(){let lines=['EL CUISTO•° DE LA HYPNOSIA — MA RÉCOLTE',''];stages.forEach(s=>{lines.push(s.name+' — '+s.title);s.concepts.forEach((c,j)=>{let r=state.ratings[`${s.id}-${j}`];lines.push('['+(r==='understood'?'J’ai compris':'Pas encore compris')+'] '+c[0]+' ('+c[1]+') — '+c[2])});if(state.notes[s.id])lines.push('Ma note : '+state.notes[s.id]);lines.push('')});let b=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Ma_recolte_Cuisto_HypnosIA.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closeModal()});render();
</script></body></html>
