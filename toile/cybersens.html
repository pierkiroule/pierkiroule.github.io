<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar de mes CyberSensations</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f5f5f5;
        font-family: Arial, sans-serif;
        flex-direction: column;
        gap: 15px;
    }

    h1 {
        font-size: 20px;
        color: #444;
        text-align: center;
        margin: 0;
    }

    .radar {
        width: 340px;
        height: 340px;
        border-radius: 50%;
        background: radial-gradient(circle, #ffffff, #e8e8e8);
        position: relative;
        box-shadow: 0 5px 18px rgba(0,0,0,0.15);
        overflow: visible;
    }

    .sensation {
        position: absolute;
        padding: 6px 10px;
        background: white;
        border-radius: 12px;
        font-size: 13px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        cursor: pointer;
        user-select: none;
        transition: transform .15s, background .2s, color .2s;
    }

    .sensation.active {
        background: #ff2f78;
        color: white;
        transform: scale(1.15);
    }

    .message {
        min-height: 30px;
        font-size: 14px;
        color: #444;
        text-align: center;
        padding: 5px;
        width: 90%;
        max-width: 360px;
    }
</style>
</head>

<body>

<h1>⭐ Le Radar de mes CyberSensations</h1>

<div class="radar" id="radar">
    <div class="sensation" style="top: 8%; left: 40%;" 
         data-msg="Ton corps se contracte. Tension présente face au smartphone.">
         Tendu·e
    </div>

    <div class="sensation" style="top: 32%; left: 4%;"
         data-msg="Ta respiration se raccourcit. Apnée numérique.">
         Souffle court
    </div>

    <div class="sensation" style="bottom: 15%; left: 12%;"
         data-msg="Ton attention se trouble. Trop d'info ?">
         Tête floue
    </div>

    <div class="sensation" style="bottom: 22%; right: 20%;"
         data-msg="Tu te sens vidé·e. Le scroll pompe ton énergie.">
         Vidé·e
    </div>

    <div class="sensation" style="top: 45%; right: 6%;"
         data-msg="Ton système s’emballe. Surstimulation.">
         Agité·e
    </div>

    <div class="sensation" style="bottom: 45%; left: 40%;"
         data-msg="Tu es plutôt stable. Usage équilibré.">
         Stable / ok
    </div>
</div>

<div class="message" id="message">Clique une cyberSensations.</div>

<script>
    const items = document.querySelectorAll(".sensation");
    const messageBox = document.getElementById("message");

    items.forEach(item => {
        item.addEventListener("click", () => {
            items.forEach(i => i.classList.remove("active"));
            item.classList.add("active");
            messageBox.textContent = item.dataset.msg;
        });
    });
</script>

</body>
</html>
