<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les 12 travaux du soignant-éducateur</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#26342f;background:#f6f2e8}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:22px 16px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;color:#34614c}.pill{font-size:12px;background:#e4ebdd;border-radius:99px;padding:7px 12px}.hero{background:#284b3d;color:white;border-radius:22px;padding:30px;margin:22px 0;background-image:radial-gradient(circle at 90% 10%,#527b55 0,transparent 45%)}h1{font-size:clamp(28px,5vw,46px);line-height:1.1;margin:8px 0 16px}h2{font-size:clamp(23px,4vw,32px);margin:8px 0 12px}h3{margin:10px 0}p{line-height:1.65}.muted{color:#63736b}.hero .muted{color:#d5e4d8}.panel{background:#fff;border:1px solid #e1e3d9;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 5px 22px #293a2510}.scene{background:#f2f5ef;border-left:4px solid #83a18c;padding:17px;border-radius:10px;line-height:1.7;white-space:pre-line}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:800;color:#688472}.choices{display:grid;gap:10px;margin:18px 0}.choice{border:1px solid #cbd8cd;border-radius:12px;background:white;text-align:left;padding:14px;cursor:pointer;font:inherit}.choice:hover,.choice.selected{border-color:#377d5c;background:#e8f2e9}.feedback{background:#eaf4e9;padding:16px;border-radius:12px;line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}button.primary,button.secondary{border:0;border-radius:12px;padding:13px 19px;font:inherit;font-weight:750;cursor:pointer}.primary{background:#2d6249;color:#fff}.secondary{background:#e8ede6;color:#2c5140}.primary:disabled{opacity:.45;cursor:not-allowed}.progress{height:9px;background:#e0e6dc;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#568568;transition:width .3s}.rating{display:flex;justify-content:space-between;gap:6px;margin:16px 0}.rating button{width:15%;padding:12px 0;border:1px solid #c9d8ca;border-radius:10px;background:#fff;font-size:18px;cursor:pointer}.rating button.selected{background:#2d6249;color:white}.chapters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.chapters button{padding:12px 4px;border:1px solid #d4dfd4;background:white;border-radius:10px;cursor:pointer}.chapters button.active{background:#2d6249;color:white}.chapters button.done{border-color:#5d9770}.note{font-size:13px;color:#64766b}.radar{width:100%;max-width:530px;display:block;margin:auto}.scorelist{display:grid;grid-template-columns:1fr 1fr;gap:9px}.scoreitem{padding:10px;border-radius:9px;background:#f3f6f1;font-size:13px}textarea{width:100%;min-height:160px;border:1px solid #b8cdbb;border-radius:12px;padding:15px;font:inherit;resize:vertical}footer{font-size:12px;color:#738178;text-align:center;margin-top:35px}@media(max-width:500px){.scorelist{grid-template-columns:1fr}.panel{padding:16px}.hero{padding:22px}}@media print{body{background:white}.actions,.chapters,.choices,.rating,.top,.progress,textarea{display:none!important}.panel,.hero{box-shadow:none;break-inside:avoid}.hero{color:black;background:white;border:1px solid #aaa}main{max-width:100%}}
</style></head><body><main id="app"></main><script>
const works=[
{act:1,title:'Le déclic',axis:'Fondements de l’ETP',scene:'Camille, infirmière, donne chaque jour des conseils à Marc, qui vit avec un diabète de type 2. Un matin, il soupire : « Je connais vos recommandations. Mais vous ne savez pas comment je vis. »',question:'Quel premier pas marque l’entrée dans une démarche ETP ?',choices:['Répéter les conseils avec un support plus clair.','Explorer ce que Marc vit, sait et souhaite.','L’inscrire d’emblée à toutes les séances.'],good:1,why:'L’ETP vise à aider une personne à développer les compétences utiles pour vivre avec sa maladie. Elle s’inscrit dans un processus continu, centré sur le patient, et ne se réduit pas à transmettre des informations.',detail:'Repères : finalités de l’ETP, place du patient, démarche structurée, distinction information/conseil/éducation.',self:'Je sais expliquer les finalités de l’ETP et les traduire dans ma pratique.'},
{act:1,title:'La rencontre',axis:'Posture éducative',scene:'Camille propose un entretien. Marc dit : « On me juge dès que je parle de ce que je mange. » Camille sent monter l’envie de le rassurer et de donner une solution.',question:'Quelle réponse favorise l’alliance éducative ?',choices:['« Ne vous inquiétez pas, je vais vous dire quoi faire. »','« Vous devez faire un effort, c’est important. »','« Qu’est-ce qui vous donne ce sentiment d’être jugé ? »'],good:2,why:'L’écoute active, l’empathie, les questions ouvertes et une posture non jugeante facilitent l’expression. Le soignant passe du rôle de prescripteur de réponses à celui de partenaire des apprentissages.',detail:'Repères : alliance, entretien motivationnel, écoute, reformulation, autonomie et décision partagée.',self:'Je sais adopter une posture éducative favorisant l’expression et l’autonomie du patient.'},
{act:1,title:'Le labyrinthe des besoins',axis:'Bilan éducatif partagé',scene:'Marc évoque ses horaires, son sommeil, sa famille, ses traitements, sa peur des complications et ses réussites passées. Camille a envie de tout noter, mais cherche un fil conducteur.',question:'Que faut-il explorer avant de planifier les séances ?',choices:['Uniquement les connaissances médicales de Marc.','Son vécu, ses besoins, ses ressources, ses priorités et son contexte.','Seulement ses résultats biologiques.'],good:1,why:'Le bilan éducatif partagé (BEP) explore les dimensions pertinentes de la vie avec la maladie. Sa synthèse est construite avec le patient et permet de dégager des besoins éducatifs.',detail:'Repères : dimensions biomédicale, cognitive, psychoaffective et socioprofessionnelle ; représentations, ressources, synthèse du BEP.',self:'Je sais conduire et synthétiser un bilan éducatif partagé.'},
{act:2,title:'La négociation',axis:'Objectifs partagés',scene:'Camille propose un atelier nutrition. Marc répond : « Ce qui m’inquiète, c’est surtout de ne pas savoir quoi faire quand mes horaires changent. »',question:'Comment définir la suite du parcours ?',choices:['Maintenir le programme prévu sans changement.','Négocier avec Marc un objectif concret et pertinent pour lui.','Lui demander de choisir parmi dix objectifs imposés.'],good:1,why:'Les objectifs éducatifs se construisent à partir du BEP et se négocient avec le patient. Ils décrivent ce qu’il souhaite apprendre à faire, comprendre ou mobiliser.',detail:'Repères : priorisation, objectifs personnalisés, formulation observable, contrat éducatif souple.',self:'Je sais négocier et formuler des objectifs éducatifs personnalisés.'},
{act:2,title:'Les pouvoirs à acquérir',axis:'Compétences du patient',scene:'Marc veut savoir ajuster ses habitudes lors des semaines de travail chargées et oser demander de l’aide à ses proches.',question:'Quelles compétences le parcours peut-il soutenir ?',choices:['Uniquement la mémorisation des recommandations.','Uniquement les gestes techniques.','Les compétences d’autosoins et les compétences d’adaptation.'],good:2,why:'L’ETP mobilise des compétences d’autosoins et d’adaptation. Elles peuvent concerner les décisions du quotidien, la résolution de problèmes, la communication et l’usage des ressources.',detail:'Repères : compétences d’autosoins, compétences d’adaptation, apprentissages situés et pouvoir d’agir.',self:'Je sais identifier les compétences d’autosoins et d’adaptation à développer.'},
{act:2,title:'L’atelier des possibles',axis:'Conception pédagogique',scene:'Camille dispose de trente minutes, d’un paperboard et de cartes illustrées. Elle doit aider Marc à anticiper une journée de travail difficile.',question:'Quel conducteur de séance serait le plus pertinent ?',choices:['Objectif clair, activité participative, support adapté et évaluation prévue.','Un exposé exhaustif sur le diabète.','Une activité ludique choisie uniquement parce qu’elle est amusante.'],good:0,why:'Une séance se conçoit à partir d’un objectif éducatif, d’activités adaptées, d’un temps réaliste et d’une évaluation cohérente. L’outil est au service de l’apprentissage.',detail:'Repères : conducteur, objectifs opérationnels, méthodes actives, outils, supports, temporalité.',self:'Je sais concevoir une séance et choisir des outils pédagogiques adaptés.'},
{act:3,title:'L’arène des bavards',axis:'Animation collective',scene:'Lors du premier atelier collectif, un participant parle sans arrêt. Marc n’ose pas intervenir. Une autre personne conteste toutes les propositions.',question:'Que peut faire Camille ?',choices:['Laisser le participant le plus bavard mener la séance.','Recadrer avec bienveillance et diversifier les modalités de participation.','Faire taire tout le monde et reprendre un cours magistral.'],good:1,why:'L’animation collective nécessite un cadre sécurisant, des consignes compréhensibles et une régulation de la parole. L’animateur soutient les échanges entre participants.',detail:'Repères : dynamique de groupe, coanimation, reformulation, participation, gestion des situations délicates.',self:'Je sais animer un groupe et favoriser la participation de chacun.'},
{act:3,title:'L’imprévu',axis:'Adaptation éducative',scene:'Le support prévu ne fonctionne pas. Marc semble fatigué et dit : « Aujourd’hui, j’ai surtout besoin de parler de ma peur de l’hypoglycémie. »',question:'Quelle réaction respecte la démarche éducative ?',choices:['Poursuivre le programme à tout prix.','Annuler tout échange faute de support.','Réajuster la séance en tenant compte de sa préoccupation et du temps disponible.'],good:2,why:'La démarche éducative reste souple et s’ajuste aux besoins émergents, aux capacités, au rythme et au contexte du patient. Adapter ne signifie pas renoncer à toute intention pédagogique.',detail:'Repères : flexibilité, individualisation, régulation, réévaluation des besoins.',self:'Je sais adapter mon intervention aux imprévus et aux besoins émergents.'},
{act:3,title:'Le miroir des apprentissages',axis:'Évaluation éducative',scene:'À la fin, Marc dit : « C’était très bien ! » Camille est contente, mais se demande ce qu’il pourra réellement réutiliser demain.',question:'Comment évaluer les apprentissages ?',choices:['Se contenter de la satisfaction exprimée.','Proposer à Marc une mise en situation et faire le point sur ses acquis et difficultés.','Mesurer uniquement le nombre de participants.'],good:1,why:'L’évaluation éducative examine les apprentissages, le vécu du parcours et les compétences mobilisables. Elle se distingue de la satisfaction et des indicateurs d’activité.',detail:'Repères : évaluation formative, bilan éducatif final, autoévaluation, indicateurs d’acquisition.',self:'Je sais évaluer les apprentissages et contribuer au bilan éducatif final.'},
{act:4,title:'L’alliance des métiers',axis:'Travail en équipe',scene:'Camille souhaite développer son action. Le médecin parle sécurité, la diététicienne propose un atelier, la psychologue évoque le vécu de Marc. Un patient partenaire apporte un autre regard.',question:'Comment construire une démarche cohérente ?',choices:['Répartir les tâches sans discuter des objectifs.','Construire un projet partagé avec les professionnels et les patients concernés.','Confier toutes les décisions à une seule profession.'],good:1,why:'L’ETP est une démarche coordonnée et pluriprofessionnelle. Les savoirs expérientiels des patients peuvent enrichir sa conception, son animation et son évaluation.',detail:'Repères : complémentarité des rôles, coordination, transmissions, partenariat avec les patients.',self:'Je sais contribuer à une démarche ETP en équipe pluriprofessionnelle.'},
{act:4,title:'La maison des formulaires',axis:'Programme et qualité',scene:'L’équipe souhaite passer d’une action éducative ciblée à un programme structuré. Elle doit définir le public, le parcours, les intervenants, les ressources, la coordination et l’évaluation.',question:'Quel est le bon réflexe ?',choices:['Multiplier les ateliers avant de définir les besoins.','Écrire uniquement un calendrier de séances.','Structurer le programme, vérifier le cadre de déclaration applicable et prévoir son évaluation.'],good:2,why:'Un programme ETP repose sur une organisation cohérente : population cible, besoins, parcours personnalisés, compétences, séances, coordination, moyens, traçabilité et évaluation. En France, les programmes relèvent d’un régime de déclaration auprès de l’ARS selon les textes applicables.',detail:'Repères : différence AEC/programme, coordination, dossier de déclaration, indicateurs d’activité, de processus et de résultats, amélioration continue.',self:'Je sais expliquer comment structurer, déclarer et évaluer un programme ETP.'},
{act:4,title:'Le retour au terrain',axis:'Transfert en pratique',scene:'Les 40 heures s’achèvent. Camille revient dans son service. Les contraintes sont toujours là. Pourtant, elle regarde autrement les échanges avec les patients.',question:'Quel serait son premier pas réaliste ?',choices:['Attendre que toutes les conditions soient parfaites.','Choisir une action réalisable, identifier des alliés et prévoir un retour d’expérience.','Créer immédiatement un grand programme sans concertation.'],good:1,why:'Le transfert des acquis passe par des actions réalistes, contextualisées et discutées en équipe. Une posture éducative peut déjà transformer les échanges, même avant la création d’un programme.',detail:'Repères : analyse de pratique, projet de transfert, obstacles, ressources, suivi à distance.',self:'Je sais identifier et mettre en œuvre un premier projet ETP adapté à mon contexte.'}
];
const actNames=['Devenir soignant-éducateur','Construire le parcours','Dispenser et évaluer','Faire vivre l’ETP'];
const key='quete-etp-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{}}catch(e){state={}};state.index=Number.isInteger(state.index)?Math.min(12,Math.max(0,state.index)):0;state.scores=Array.isArray(state.scores)?state.scores:Array(12).fill(null);state.answers=Array.isArray(state.answers)?state.answers:Array(12).fill(null);state.potion=state.potion||'';state.view=state.view||'intro';const app=document.getElementById('app');
function save(){localStorage.setItem(key,JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function button(label,fn,kind='primary',disabled=false){return `<button class="${kind}" onclick="${fn}" ${disabled?'disabled':''}>${label}</button>`}function shell(content){app.innerHTML=`<div class="top"><div class="brand">✦ LES 12 TRAVAUX · ETP</div><span class="pill">Formation 40 h · Bilan personnel</span></div>${content}<footer>Outil pédagogique d’autoévaluation · Scores déclaratifs, sans valeur certificative · Données conservées sur cet appareil uniquement</footer>`}
function intro(){shell(`<section class="hero"><div class="eyebrow" style="color:#d4e4c8">Une aventure en 4 actes</div><h1>Les 12 travaux du soignant-éducateur</h1><p>Accompagne Camille et Marc dans une quête qui revisite les grandes étapes de la formation ETP de 40 heures. Douze situations, douze décisions, douze compétences à explorer.</p><p class="muted">À la fin : ta cible de compétences et ta recette personnelle de la potion magique ETP.</p>${button('Commencer l’aventure','start()')}</section><div class="panel"><h3>Les règles de la quête</h3><p>Lis chaque scène, choisis une réponse, découvre son décryptage, puis évalue ta capacité à agir de <b>0 à 5</b>. Les choix servent à réfléchir, pas à te noter.</p><p class="note">0 = pas encore capable · 1 = premiers repères · 2 = avec accompagnement · 3 = avec appui ponctuel · 4 = autonome · 5 = autonome et capable de transmettre.</p>${state.scores.some(v=>v!==null)?button('Reprendre ma progression','resume()','secondary'):''}</div>`)}
function start(){state.view='work';state.index=0;save();render()}function resume(){state.view='work';save();render()}
function choose(i){state.answers[state.index]=i;save();render()};function rate(v){state.scores[state.index]=v;save();render()};function go(i){state.index=Math.max(0,Math.min(11,i));state.view='work';save();render()};function finish(){state.view='final';save();render()};function resetAll(){if(confirm('Effacer toutes les réponses enregistrées sur cet appareil ?')){localStorage.removeItem(key);location.reload()}}
function work(){let n=state.index,w=works[n],a=state.answers[n],s=state.scores[n],done=state.scores.filter(v=>v!==null).length;let choices=w.choices.map((c,i)=>`<button class="choice ${a===i?'selected':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${esc(c)}</button>`).join('');shell(`<section class="hero"><div class="eyebrow" style="color:#d5e8d3">Acte ${w.act} — ${actNames[w.act-1]}</div><h1>Travail ${n+1} · ${esc(w.title)}</h1><p>La quête de Camille et Marc continue…</p></section><div class="progress"><div style="width:${done/12*100}%"></div></div><p class="note">${done} compétences autoévaluées sur 12</p><section class="panel"><div class="eyebrow">La scène</div><p class="scene">${esc(w.scene)}</p><h3>Le dilemme</h3><p>${esc(w.question)}</p><div class="choices">${choices}</div>${a!==null?`<div class="feedback"><b>${a===w.good?'Une piste pertinente.':'Une autre piste mérite d’être explorée.'}</b><p>${esc(w.why)}</p><small>${esc(w.detail)}</small></div><h3>Mon autoévaluation</h3><p><b>${esc(w.self)}</b></p><div class="rating">${[0,1,2,3,4,5].map(v=>`<button class="${s===v?'selected':''}" onclick="rate(${v})" aria-label="${v} sur 5">${v}</button>`).join('')}</div><p class="note">${s===null?'Choisis le niveau qui reflète ton sentiment de compétence.':(['Pas encore capable','Premiers repères','Avec accompagnement','Avec appui ponctuel','Autonome','Autonome et capable de transmettre'][s])}</p>`:''}<div class="actions">${n>0?button('← Précédent',`go(${n-1})`,'secondary'):button('Accueil','home()','secondary')}${n<11?button('Travail suivant →',`go(${n+1})`,'primary',s===null):button('Découvrir ma cible →','finish()','primary',s===null||state.scores.some(v=>v===null))}</div></section><section class="panel"><h3>Les 12 travaux</h3><div class="chapters">${works.map((w,i)=>`<button class="${i===n?'active':''} ${state.scores[i]!==null?'done':''}" onclick="go(${i})">${i+1}${state.scores[i]!==null?' ✓':''}</button>`).join('')}</div></section>`)}
function radar(){let cx=230,cy=230,R=155,p=(i,v)=>{let a=-Math.PI/2+i*Math.PI/6;return [cx+Math.cos(a)*R*v/5,cy+Math.sin(a)*R*v/5]},rings=[1,2,3,4,5].map(v=>`<circle cx="${cx}" cy="${cy}" r="${R*v/5}" fill="none" stroke="#b5c8b8"/>`).join(''),axes=works.map((w,i)=>{let [x,y]=p(i,5),a=-Math.PI/2+i*Math.PI/6;return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#c6d4c8"/><text x="${cx+Math.cos(a)*188}" y="${cy+Math.sin(a)*188+5}" font-size="14" text-anchor="middle" fill="#375644">${i+1}</text>`}).join(''),poly=state.scores.map((v,i)=>p(i,v||0).join(',')).join(' ');return `<svg class="radar" viewBox="0 0 460 460" role="img" aria-label="Cible radar des 12 compétences">${rings}${axes}<polygon points="${poly}" fill="#5ba883" fill-opacity=".28" stroke="#2f8058" stroke-width="3"/>${state.scores.map((v,i)=>{let [x,y]=p(i,v||0);return `<circle cx="${x}" cy="${y}" r="4" fill="#2f8058"/>`}).join('')}</svg>`}
function final(){let incomplete=state.scores.some(v=>v===null);if(incomplete){state.view='work';state.index=state.scores.findIndex(v=>v===null);save();return work()}let items=works.map((w,i)=>`<div class="scoreitem"><b>${i+1}. ${esc(w.axis)}</b><br>${state.scores[i]}/5</div>`).join('');shell(`<section class="hero"><div class="eyebrow" style="color:#d5e8d3">La quête est accomplie</div><h1>Ta cible des 12 travaux</h1><p>Voici la photographie de ton sentiment de compétence à la fin des 40 heures. Ce n’est ni une note ni un jugement : c’est un support pour réfléchir à la suite.</p></section><section class="panel"><h2>Mon portrait de soignant-éducateur</h2>${radar()}<div class="scorelist">${items}</div><p class="note">Les dimensions sont indépendantes : il n’y a pas de score global à atteindre.</p></section><section class="panel"><div class="eyebrow">L’épreuve secrète · Le chaudron</div><h2>Ma potion magique ETP</h2><p>Tu as traversé les douze travaux. Mais aucune recette ne fait à elle seule un bon soignant-éducateur.</p><h3>Et toi, quels sont les ingrédients de ta potion magique ETP ?</h3><p>À partir de ton expérience et des 40 heures de formation, compose librement ta recette. Quels ingrédients te semblent indispensables pour faire vivre l’ETP dans ta pratique ?</p><textarea id="potion" placeholder="Dans ma potion magique ETP, je mettrais…" oninput="setPotion(this.value)">${esc(state.potion)}</textarea><p class="note">Question ouverte : aucune réponse attendue, aucune correction automatique.</p></section><section class="panel"><h3>Pour prolonger la quête</h3><p>Quelle compétence est déjà un point d’appui ? Laquelle souhaites-tu développer ? Quel premier pas réaliste vas-tu entreprendre dans ton service ?</p><div class="actions">${button('Imprimer / enregistrer en PDF','window.print()')}${button('Copier mon bilan','copyReport()','secondary')}${button('Revoir les travaux','go(0)','secondary')}${button('Recommencer','resetAll()','secondary')}</div></section>`)}
function setPotion(v){state.potion=v;save()}function home(){state.view='intro';save();render()}function copyReport(){let t='Les 12 travaux du soignant-éducateur\n\n'+works.map((w,i)=>`${i+1}. ${w.axis} : ${state.scores[i]}/5`).join('\n')+'\n\nMa potion magique ETP :\n'+state.potion;navigator.clipboard?.writeText(t).then(()=>alert('Bilan copié.')).catch(()=>prompt('Copier le bilan :',t))}function render(){if(state.view==='final')final();else if(state.view==='work')work();else intro();window.scrollTo(0,0)}render();
</script></body></html>
