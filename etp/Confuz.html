<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confusions intimes •°</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;color:#fff;background:repeating-linear-gradient(90deg,#57052f 0%,#a90b60 5%,#ed398d 8%,#75083e 12%);min-height:100dvh}body:before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,#ffe8a655,transparent 60%);pointer-events:none}main{position:relative;max-width:1200px;margin:auto;padding:20px 30px;text-align:center}header{font-size:clamp(24px,4vw,48px);font-style:italic;color:#ffe4a0;text-shadow:2px 3px #78113c,0 0 18px #ffcc68}header small{display:block;font:12px Arial;letter-spacing:5px;color:white;margin:8px}section{background:linear-gradient(145deg,#fffaf0,#ffe5ed);color:#51143c;border:5px double #c99a36;border-radius:30px;box-shadow:0 12px 40px #35001e99,inset 0 0 25px #f5c6a4;padding:clamp(18px,4vw,45px);margin:22px 0;min-height:55vh;display:flex;flex-direction:column;justify-content:center}h1{font-size:clamp(32px,5vw,65px);margin:10px 0;color:#9c145c;line-height:1.05}h2{font-size:clamp(24px,3vw,40px);margin:10px 0}p{font-size:clamp(19px,2.5vw,32px);line-height:1.35;margin:12px 0}.tag{font: bold 13px Arial;letter-spacing:3px;color:#9c145c}.duel{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:18px 0}.choice{border:2px solid #c89a39;border-radius:20px;padding:20px;background:white;text-align:left;font-size:clamp(19px,2.4vw,30px);line-height:1.4}.choice b{display:block;font: bold 24px Arial;color:#a20c60;margin-bottom:12px}.choice.good{border:4px solid #358354;background:#e9f8e9}.choice.bad{background:#fce6e9}.key{background:#8b1055;color:white;padding:20px;border-radius:16px;font-size:clamp(20px,2.6vw,34px);margin-top:16px}button{font:bold 17px Arial;border:2px solid #ffe3a0;border-radius:40px;padding:15px 28px;background:linear-gradient(#fff1b3,#d6a33d);color:#521333;cursor:pointer;box-shadow:0 4px 0 #8d5a1c}button:focus-visible{outline:4px solid white;outline-offset:4px}nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button.secondary{background:#720d49;color:white;box-shadow:none}button:disabled{opacity:.4;cursor:default}.progress{display:flex;justify-content:center;gap:10px;margin:16px}.dot{width:14px;height:14px;border:1px solid #ffe2a0;border-radius:50%}.dot.done{background:#ffe2a0;box-shadow:0 0 12px gold}.spark{color:#bc8b30;font-size:30px;letter-spacing:12px}.summary{text-align:left;display:grid;gap:12px}.summary div{border-bottom:1px solid #d7b7b7;padding:10px;font-size:clamp(17px,2vw,24px)}.summary b{color:#a20c60;display:block}.hint{font:14px Arial;color:#7c4765}.patient{font-size:clamp(17px,2vw,24px);font-style:italic;background:#f4dce7;padding:12px;border-radius:12px}.pop{animation:pop .4s ease-out}@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}@media(max-width:650px){main{padding:12px}.duel{grid-template-columns:1fr;gap:10px}section{padding:18px}.choice{padding:14px}}@media(prefers-reduced-motion:reduce){.pop{animation:none}}@media print{body{background:white}header,nav,.progress{display:none}section{box-shadow:none}}
</style></head><body><main><header>✦ Confusions intimes •° ✦<small>LE GRAND SHOW DE L’ETP</small></header><div class="progress" id="progress"></div><section id="stage" aria-live="polite"></section><nav><button class="secondary" id="back">← Retour</button><button id="next">Entrer sur le plateau</button><button class="secondary" id="full">Plein écran</button></nav></main><script>
const data=[
{title:'Un atelier nommé désir',patient:'« Je suis épuisée. Je voudrais retrouver un sommeil réparateur. »',a:'Mme L. a besoin de participer à un atelier sur le sommeil.',b:'Mme L. exprime le besoin de retrouver un sommeil réparateur. Les réponses possibles restent à explorer avec elle.',good:1,concept:'Besoin ≠ Moyen',definition:'Le besoin exprime ce qui est nécessaire. Le moyen est une réponse possible à ce besoin.',key:'Un atelier n’est pas un besoin. C’est un moyen possible.'},
{title:'Les grandes attentes',patient:'« Donnez-moi un menu. Je ne sais plus quoi manger sans avoir peur de me tromper. »',a:'Mme R. attend un menu. Elle exprime aussi un besoin de confiance dans ses choix alimentaires, à préciser avec elle.',b:'Le besoin principal de Mme R. est de recevoir un menu alimentaire.',good:0,concept:'Besoin ≠ Attente',definition:'L’attente exprime ce que le patient espère de nous. Le besoin exprime ce qui lui est nécessaire.',key:'Derrière une attente peut se cacher un besoin. Explorons-le avec le patient.'},
{title:'Tout ne s’apprend pas',patient:'« J’aimerais avoir moins mal et apprendre à adapter mes activités quand la douleur augmente. »',a:'Le besoin éducatif de M. D. est de diminuer ses douleurs.',b:'M. D. souhaite être soulagé. Il exprime également le besoin d’apprendre à adapter ses activités à la douleur.',good:1,concept:'Besoin ≠ Besoin éducatif',definition:'Un besoin éducatif est un besoin d’apprentissage. Le soulagement de la douleur est un besoin de santé.',key:'Tous les besoins ne relèvent pas d’un apprentissage.'},
{title:'À chacun ses priorités',patient:'« Je sais que mon diabète est déséquilibré, mais ce qui me pèse le plus, c’est de ne plus sortir avec mes amis. »',a:'La priorité clinique est l’équilibre glycémique. Le patient souhaite retrouver une vie sociale. Une priorité éducative reste à négocier ensemble.',b:'Le besoin prioritaire du patient est d’améliorer son équilibre glycémique.',good:0,concept:'Priorité du patient ≠ Priorité du soignant',definition:'Les priorités du patient et celles du soignant peuvent différer. Elles doivent être mises en dialogue.',key:'Une priorité médicale ne devient pas automatiquement une priorité éducative.'},
{title:'Un projet qui n’en est pas un',patient:'« Je veux repartir en randonnée. Nous avons convenu que je devais savoir prévenir et gérer une hypoglycémie pendant l’effort. »',a:'Le projet de Mme B. est de savoir prévenir et gérer une hypoglycémie.',b:'Mme B. souhaite reprendre la randonnée. L’objectif éducatif convenu est de savoir prévenir et gérer une hypoglycémie pendant l’effort.',good:1,concept:'Projet ≠ Objectif éducatif',definition:'Le projet concerne ce que le patient souhaite vivre. L’objectif éducatif précise une capacité à développer.',key:'Le projet donne du sens à l’apprentissage. L’objectif éducatif contribue à sa réalisation.'}];
let step=0;const stage=document.getElementById('stage'),next=document.getElementById('next'),back=document.getElementById('back');function render(){stage.classList.remove('pop');void stage.offsetWidth;stage.classList.add('pop');document.getElementById('progress').innerHTML=data.map((_,i)=>`<span class="dot ${step>=i*3+3?'done':''}"></span>`).join('');back.disabled=step===0;if(step===0){stage.innerHTML='<div class="spark">✦ ♡ ✦</div><div class="tag">CINQ DUELS · UN DÉFI COLLECTIF</div><h1>Les mots s’emmêlent…</h1><p>Deux transmissions. Un même patient.<br>Saurez-vous démasquer les confusions ?</p><p class="hint">Vote à main levée · Discussion · Révélation</p>';next.textContent='Entrer sur le plateau';return}if(step===16){stage.innerHTML='<div class="spark">✦ ♡ ✦</div><h1>Les 5 révélations</h1><div class="summary">'+data.map(d=>`<div><b>${d.concept}</b>${d.key}</div>`).join('')+'</div><p>Partir de la vie du patient, pas de notre offre éducative.</p>';next.textContent='Rejouer';return}let i=Math.floor((step-1)/3),phase=(step-1)%3,d=data[i];let cards=`<div class="duel"><div class="choice ${phase===2?(d.good===0?'good':'bad'):''}"><b>A ${phase===2&&d.good===0?'— Plus claire':''}</b>${d.a}</div><div class="choice ${phase===2?(d.good===1?'good':'bad'):''}"><b>B ${phase===2&&d.good===1?'— Plus claire':''}</b>${d.b}</div></div>`;stage.innerHTML=`<div class="tag">ÉPISODE ${i+1} / 5 · ${d.title}</div>`+(phase===0?`<h2>Quelle transmission est la plus claire ?</h2><div class="patient">${d.patient}</div>${cards}<div class="hint">Votez A ou B à main levée.</div>`:phase===1?`<h2>Quelle confusion se cache ici ?</h2>${cards}<p>Argumentez votre choix. Quels concepts sont confondus ?</p>`:`<div class="spark">✦ ✦ ✦</div><div class="tag">LA GRANDE RÉVÉLATION · Transmission ${d.good===0?'A':'B'}</div><h1>${d.concept}</h1><p>${d.definition}</p><div class="key">${d.key}</div>`);next.textContent=['Ouvrir le débat','Démasquer la confusion',i===4?'Voir la synthèse':'Épisode suivant'][phase]}
next.onclick=()=>{step=step===16?0:step+1;render()};back.onclick=()=>{step=Math.max(0,step-1);render()};document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){}};document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next.click()}if(e.key==='ArrowLeft')back.click()});render();</script></body></html>
