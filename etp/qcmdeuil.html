<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>DeuilQCM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
/* ---------- RESET ---------- */
*{margin:0;padding:0;box-sizing:border-box}

/* ---------- BODY THEME ---------- */
body{
    font-family:system-ui;
    background:#000;
    color:#eee;
    display:flex;
    justify-content:center;
    padding:20px;
}

.app{
    width:100%;
    max-width:480px;
    background:#111;
    padding:18px;
    border-radius:14px;
    box-shadow:0 0 22px rgba(255,255,255,0.07);
}

/* ---------- HEADER ---------- */
.title{
    text-align:center;
    font-size:1.8rem;
    font-weight:700;
    color:#f1c40f;
    margin-bottom:4px;
}
.subtitle{
    text-align:center;
    font-size:0.85rem;
    color:#bbb;
    margin-bottom:14px;
}

/* ---------- PROGRESS ---------- */
.progress{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:0.8rem;
    color:#aaa;
    margin-bottom:10px;
}
.progress-bar{
    flex:1;
    height:6px;
    margin-left:10px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}
.progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00e0ff,#f1c40f);
}

/* ---------- CARD ---------- */
.card{
    background:#151515;
    border-radius:12px;
    padding:14px;
    border:1px solid #222;
}
.question-index{
    font-size:0.75rem;
    color:#999;
    margin-bottom:4px;
}
.question-text{
    font-size:1rem;
    margin-bottom:10px;
    line-height:1.4;
}

/* ---------- OPTIONS ---------- */
.options{list-style:none;margin-top:10px}
.option{margin-bottom:8px}
.option label{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 10px;
    border-radius:999px;
    background:#1b1b1b;
    border:1px solid #2a2a2a;
    transition:0.15s;
    cursor:pointer;
}
.option input[type="radio"]{accent-color:#00e0ff;width:18px;height:18px}
.option.selected label{
    border-color:#00e0ff;
    background:#00262a;
}

/* ---------- BUTTONS ---------- */
.actions{
    margin-top:12px;
    display:flex;
    gap:8px;
}
button{
    flex:1;
    padding:10px 14px;
    border:none;
    border-radius:999px;
    font-weight:600;
    font-size:0.9rem;
    cursor:pointer;
}
.btn-primary{
    background:linear-gradient(135deg,#00e0ff,#2ecc71);
    color:#000;
}
.btn-secondary{
    background:#222;
    color:#ccc;
}

/* ---------- FEEDBACK ---------- */
.feedback{
    margin-top:12px;
    display:none;
    padding:12px;
    border-radius:10px;
    font-size:0.85rem;
}
.feedback.correct{background:#0f3e1e;border:1px solid #27ae60}
.feedback.incorrect{background:#3e1e1e;border:1px solid #e74c3c}

.feedback-title{font-weight:700;margin-bottom:6px}
.feedback ul{margin-top:6px;padding-left:16px}
.feedback li{margin-bottom:4px}

/* ---------- RESULT ---------- */
.result{
    margin-top:16px;
    text-align:center;
    display:none;
}
.score-main{
    font-size:1.6rem;
    color:#f1c40f;
    font-weight:700;
}
.score-detail{
    font-size:1rem;
    margin-top:6px;
    color:#ccc;
}
</style>
</head>

<body>
<div class="app">
    <div class="title">DeuilQCM</div>
    <div class="subtitle">Les grands auteurs du travail de deuil</div>

    <div class="progress">
        <span id="progressLabel"></span>
        <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    </div>

    <div class="card">
        <div class="question-index" id="questionIndex"></div>
        <div class="question-text" id="questionText"></div>
        <ul id="optionsList" class="options"></ul>

        <div class="actions">
            <button id="btnPrev" class="btn-secondary" disabled>Précédent</button>
            <button id="btnValidate" class="btn-primary">Valider</button>
            <button id="btnNext" class="btn-secondary" style="display:none;">Suivant</button>
        </div>

        <div class="feedback" id="feedback"></div>
    </div>

    <div id="result" class="result">
        <div id="scoreMain" class="score-main"></div>
        <div id="scoreDetail" class="score-detail"></div>
    </div>
</div>

<script>
// ---------------------- QUESTIONS ----------------------
const questions = [
    {
        q:"Qui a introduit la notion de « travail du deuil » ?",
        options:["John Bowlby","Sigmund Freud","Parkes","Kübler-Ross"],
        correct:1,
        author:"Sigmund Freud (1856-1939)",
        bullets:[
            "Père de la psychanalyse.",
            "Texte clé : « Deuil et mélancolie » (1917).",
            "Il décrit un véritable travail psychique actif."
        ]
    },
    {
        q:"Quel auteur explique le deuil via la théorie de l’attachement ?",
        options:["Neimeyer","Bowlby","Worden","Hanus"],
        correct:1,
        author:"John Bowlby (1907-1990)",
        bullets:[
            "Fondateur de la théorie de l’attachement.",
            "Le deuil = désorganisation du système d’attachement.",
            "Modèle fondamental en psychologie du deuil."
        ]
    },
    {
        q:"Qui propose les cinq étapes (déni, colère, marchandage, dépression, acceptation) ?",
        options:["Bacqué","Kübler-Ross","Parkes","Bonanno"],
        correct:1,
        author:"Elisabeth Kübler-Ross (1926-2004)",
        bullets:[
            "Pionnière des soins palliatifs.",
            "Modèle populaire mais non linéaire.",
            "Initialement conçu pour les patients en fin de vie."
        ]
    },
    {
        q:"Qui propose les quatre tâches du deuil ?",
        options:["Bonanno","Worden","Hanus","Rando"],
        correct:1,
        author:"J. William Worden (1939-2023)",
        bullets:[
            "Les 4 tâches : accepter, ressentir, s’ajuster, relocaliser.",
            "Modèle actif et moderne.",
            "Très utilisé en clinique."
        ]
    },
    {
        q:"Quel modèle repose sur une oscillation Perte ↔ Restauration ?",
        options:["Meaning Reconstruction","Modèle dual","Transitionnel","Lien continu"],
        correct:1,
        author:"Stroebe & Schut",
        bullets:[
            "Modèle dual (1999).",
            "Le deuil oscille entre confrontation et reprise de vie.",
            "Référence scientifique actuelle."
        ]
    },
    {
        q:"Quel auteur montre que la résilience est fréquente ?",
        options:["Freud","Bonanno","Fauré","Parkes"],
        correct:1,
        author:"George Bonanno (1959-)",
        bullets:[
            "Professeur à Columbia.",
            "Travaux sur les trajectoires de deuil.",
            "La résilience est plus fréquente qu’on ne le pense."
        ]
    },
    {
        q:"Pour qui le deuil est-il une reconstruction du sens ?",
        options:["Neimeyer","Bowlby","Kübler-Ross","Hanus"],
        correct:0,
        author:"Robert Neimeyer (1954-)",
        bullets:[
            "Théorie de la « Meaning Reconstruction ». ",
            "Le deuil = reconstruire une cohérence de vie.",
            "Approche très compatible avec l’hypnose."
        ]
    },
    {
        q:"Qui a théorisé le « lien continu » avec le défunt ?",
        options:["Kübler-Ross","Klass et al.","Parkes","Rando"],
        correct:1,
        author:"Klass, Silverman & Nickman",
        bullets:[
            "Concept clé : Continuing Bonds (1996).",
            "Le lien ne disparaît pas, il se transforme.",
            "Révolutionne la thanatologie moderne."
        ]
    },
    {
        q:"Quelle auteure décrit le concept de « deuil blanc » ?",
        options:["Neau","Bacqué","Fauré","Hanus"],
        correct:1,
        author:"Marie-Frédérique Bacqué",
        bullets:[
            "Professeure à Strasbourg.",
            "« Deuil blanc » = deuil du non-advenu (infertilité…).",
            "Référence francophone."
        ]
    },
    {
        q:"Qui parle du deuil comme d’un réaménagement identitaire ?",
        options:["Parkes","Hanus","Frankl","Bonanno"],
        correct:1,
        author:"Michel Hanus (1937-2019)",
        bullets:[
            "Psychiatre et psychanalyste.",
            "Le deuil transforme l’identité.",
            "Vision profondément structurante."
        ]
    }
];

// ---------------------- ÉTAT ----------------------
let current = 0;
let score = 0;
let answers = new Array(questions.length).fill(null);

// ---------------------- DOM ----------------------
const qIndex = document.getElementById("questionIndex");
const qText = document.getElementById("questionText");
const optionsList = document.getElementById("optionsList");
const progressLabel = document.getElementById("progressLabel");
const progressFill = document.getElementById("progressFill");
const feedback = document.getElementById("feedback");
const btnPrev = document.getElementById("btnPrev");
const btnValidate = document.getElementById("btnValidate");
const btnNext = document.getElementById("btnNext");
const result = document.getElementById("result");
const scoreMain = document.getElementById("scoreMain");
const scoreDetail = document.getElementById("scoreDetail");

// ---------------------- RENDER ----------------------
function render(){
    const q = questions[current];
    qIndex.textContent = "Question " + (current+1);
    qText.textContent = q.q;
    progressLabel.textContent = "Question " + (current+1) + " / " + questions.length;
    progressFill.style.width = (current/questions.length)*100 + "%";

    feedback.style.display = "none";
    btnNext.style.display = "none";
    btnValidate.disabled = false;

    optionsList.innerHTML="";
    q.options.forEach((opt,i)=>{
        const li=document.createElement("li");
        li.className="option";
        const lab=document.createElement("label");
        const input=document.createElement("input");
        input.type="radio";
        input.name="opt";
        input.value=i;
        if(answers[current]===i){
            input.checked=true;
            li.classList.add("selected");
        }
        input.addEventListener("change",()=>{
            document.querySelectorAll(".option").forEach(o=>o.classList.remove("selected"));
            li.classList.add("selected");
        });
        lab.appendChild(input);
        lab.appendChild(document.createTextNode(opt));
        li.appendChild(lab);
        optionsList.appendChild(li);
    });

    btnPrev.disabled=(current===0);
}

// ---------------------- VALIDATION ----------------------
btnValidate.addEventListener("click",()=>{
    const selected = document.querySelector('input[name="opt"]:checked');
    if(!selected){alert("Choisis une option !");return;}

    const answer = parseInt(selected.value);
    answers[current] = answer;

    const q = questions[current];
    const correct = (answer === q.correct);

    if(correct) score++;

    btnValidate.disabled = true;
    btnNext.style.display="block";

    feedback.className="feedback " + (correct?"correct":"incorrect");
    feedback.style.display="block";

    let html = `<div class="feedback-title">${correct?"✔ Bravo !":"✖ Mauvaise réponse"}</div>`;
    html += `<div><strong>Bonne réponse :</strong> ${q.options[q.correct]}</div>`;
    html += `<div style="margin-top:6px;"><strong>${q.author}</strong></div><ul>`;
    q.bullets.forEach(b=> html+=`<li>${b}</li>`);
    html+="</ul>";
    feedback.innerHTML = html;
});

// ---------------------- NAVIGATION ----------------------
btnNext.addEventListener("click",()=>{
    if(current < questions.length-1){
        current++;
        render();
    } else {
        showScore();
    }
});
btnPrev.addEventListener("click",()=>{
    if(current>0){
        current--;
        render();
    }
});

// ---------------------- SCORE FINAL ----------------------
function showScore(){
    document.querySelector(".card").style.display="none";
    result.style.display="block";

    scoreMain.textContent = `${score} / ${questions.length}`;

    const ratio = score/questions.length;
    if(ratio === 1){
        scoreDetail.textContent = "🎉 Bravo Champion du Deuil ! Niveau expert absolu.";
    } else if(ratio >= 0.7){
        scoreDetail.textContent = "Excellent niveau. Tu maîtrises très bien les auteurs du deuil.";
    } else if(ratio >= 0.4){
        scoreDetail.textContent = "Bon début. Quelques points à consolider.";
    } else {
        scoreDetail.textContent = "Continue à explorer, tu progresses !";
    }
}

// ---------------------- INIT ----------------------
render();
</script>

</body>
</html>
