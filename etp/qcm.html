<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Kahoot Bretagne – ETP</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #006994, #00b7ff);
    padding: 20px;
    color: white;
  }
  h1 {
    text-align: center;
    margin-bottom: 10px;
  }
  .question {
    background: rgba(0,0,0,0.25);
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 10px;
  }
  .answers button {
    display: block;
    width: 100%;
    margin: 6px 0;
    padding: 10px;
    border: none;
    cursor: pointer;
    background: #ffffff;
    border-radius: 6px;
    font-size: 16px;
  }
  .answers button:hover {
    background: #ffe58b;
  }
  #scoreBox {
    display: none;
    margin-top: 20px;
    padding: 20px;
    background: rgba(0,0,0,0.35);
    border-radius: 10px;
    text-align: center;
  }
</style>
</head>
<body>

<h1>🎉 Quiz Bretagne ETP – Brise-Glace 🎉</h1>
<p style="text-align:center;">Humour breton 🌊 mais vraies réponses ETP ✔️</p>

<div id="quiz"></div>

<div id="scoreBox">
  <h2>Résultat 📊</h2>
  <p id="scoreText"></p>
</div>

<script>
const questions = [
  {
    q: "L’ETP, c’est surtout…",
    a: ["💃 Une danse de fest-noz", "🧚 Un entraînement pour devenir korrigan", "🌿 Un accompagnement pour mieux vivre avec sa maladie", "🥐 Une thérapie au kouign-amann"],
    correct: 2
  },
  {
    q: "Première étape d’un programme ETP ?",
    a: ["🌬️ Vérifier la météo d’Ouessant", "📋 Le bilan initial", "🌭 Commander une galette-saucisse", "🐦 Saluer les goélands"],
    correct: 1
  },
  {
    q: "Le but principal de l’ETP ?",
    a: ["⚡ Préparer aux tempêtes", "🧭 Aider à être autonome", "🥏 Gagner au palet", "🗼 Connaître tous les phares du Finistère"],
    correct: 1
  },
  {
    q: "Un bon objectif ETP doit être…",
    a: ["🌫️ Flou comme un phare dans le brouillard", "🔮 Décidé par un druide", "🎯 Précis et utile au quotidien", "🏴 Écrit en breton ancien"],
    correct: 2
  },
  {
    q: "La posture éducative, c’est…",
    a: ["💃 Une danse bretonne", "🤝 Une attitude du quotidien", "🥁 Un pas de gavotte", "🪁 Une figure de cerf-volant"],
    correct: 1
  },
  {
    q: "Le bilan initial sert surtout à…",
    a: ["📍 Choisir entre Saint-Malo ou Quimper", "🧠 Comprendre le vécu et les besoins", "🥞 Tester les crêpes", "🌦️ Vérifier la résistance au crachin"],
    correct: 1
  },
  {
    q: "Le bilan final sert à…",
    a: ["🍻 Fêter ça au cidre", "🌟 Mesurer ce que la personne a appris", "🎯 Compter les points comme au bouchon", "🎶 Choisir un fest-noz"],
    correct: 1
  },
  {
    q: "L’information en ETP doit être…",
    a: ["🌊 Identique pour tous", "💬 Adaptée au vécu du patient", "🏴 Transmise en breton", "🎶 Délivrée au biniou"],
    correct: 1
  },
  {
    q: "Une séance ETP réussie, c’est quand…",
    a: ["🗣️ Le soignant monologue", "🤝 Le patient participe", "😴 On fait la sieste", "💃 On lance une gavotte"],
    correct: 1
  },
  {
    q: "L’ETP vise surtout…",
    a: ["🧱 L’obéissance", "🧭 L’autonomie", "🧕 Le dressage de bigoudènes", "🕺 Le recrutement de cercles celtiques"],
    correct: 1
  }
];

let score = 0;

function loadQuiz() {
  const container = document.getElementById('quiz');
  container.innerHTML = "";
  
  questions.forEach((item, index) => {
    const div = document.createElement('div');
    div.className = "question";

    const title = document.createElement('h3');
    title.innerText = (index+1) + ". " + item.q;
    div.appendChild(title);

    const answersDiv = document.createElement('div');
    answersDiv.className = "answers";

    item.a.forEach((ans, i) => {
      const btn = document.createElement('button');
      btn.innerText = ans;
      btn.onclick = () => validateAnswer(index, i, btn);
      answersDiv.appendChild(btn);
    });

    div.appendChild(answersDiv);
    container.appendChild(div);
  });
}

function validateAnswer(qIndex, aIndex, btn) {
  const question = questions[qIndex];
  
  if (aIndex === question.correct) {
    score++;
    btn.style.background = "#8eff80";
  } else {
    btn.style.background = "#ff8080";
  }

  // Désactiver tous les boutons de la question
  const parent = btn.parentNode;
  [...parent.children].forEach(b => b.disabled = true);

  // Fin
  if (document.querySelectorAll("button:not([disabled])").length === 0) {
    showScore();
  }
}

function showScore() {
  const box = document.getElementById("scoreBox");
  const text = document.getElementById("scoreText");
  text.textContent = "Ton score : " + score + " / " + questions.length + " 🌟";
  box.style.display = "block";
}

loadQuiz();
</script>

</body>
</html>
