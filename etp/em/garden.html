<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4e9"><title>Mon compost du ras-le-bol •°</title><style>
:root{--ink:#293e32;--muted:#667363;--green:#41694b;--paper:#f8f5ea;--line:#deded0;--cream:#fffdf5;--orange:#e8a86e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,#e7ebd4,transparent 55%),var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #9a653c;outline-offset:3px}main{max-width:850px;margin:auto;padding:24px clamp(16px,4vw,36px) 32px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:750}.quiet{border:1px solid var(--line);border-radius:99px;background:transparent;padding:8px 14px;font-size:13px}h1,h2{font-family:Georgia,serif;font-weight:normal;line-height:1.08;margin:12px 0}h1{font-size:clamp(36px,7vw,64px);letter-spacing:-.04em}h2{font-size:clamp(27px,5vw,40px)}p{margin:8px 0 16px}.sub{color:var(--muted)}.hero{position:relative;overflow:hidden;background:#e7ead8;border:1px solid #d9dfca;border-radius:30px;margin:20px 0;min-height:180px}.hero svg{width:100%;display:block;max-height:270px}.agegrid,.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{border:1px solid var(--line);border-radius:19px;background:var(--cream);padding:14px 8px;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;text-align:center;transition:transform .18s,background .18s,border .18s}.tile:hover{transform:translateY(-2px)}.tile[aria-pressed=true]{background:#dce9cd;border:2px solid var(--green);padding:13px 7px}.tile[aria-pressed=true]:after{content:'✓';position:absolute;top:5px;right:10px;font-weight:800;color:var(--green)}.emoji{font-size:34px;line-height:1.15}.name{font-size:14px;font-weight:650;line-height:1.3}.agegrid .tile{min-height:135px}.agegrid .emoji{font-size:46px}.primary{border:0;background:var(--green);color:#fff;border-radius:16px;padding:15px 20px;font-weight:700;min-height:52px;flex:1}.primary:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;gap:10px;margin-top:22px;align-items:center}.back{border:1px solid var(--line);background:var(--cream);border-radius:16px;padding:14px}.progress{display:flex;gap:7px;margin-top:22px}.progress span{flex:1;height:5px;border-radius:9px;background:#dcded0}.progress .done{background:var(--green)}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:20px}.talk{border-left:3px solid #d5a66b;background:#fffaf0;padding:13px 16px;border-radius:0 15px 15px 0;margin:15px 0}.talk strong{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8b643b;margin-bottom:4px}.tokens{position:absolute;left:50%;top:43%;transform:translateX(-50%);display:flex;justify-content:center;gap:4px;max-width:80%;pointer-events:none}.token{font-size:clamp(20px,5vw,36px);animation:drop .65s cubic-bezier(.2,.8,.3,1) both;filter:drop-shadow(0 2px 1px #0002)}@keyframes drop{from{transform:translateY(-100px) rotate(-30deg);opacity:0}to{transform:translateY(0) rotate(0);opacity:1}}.sway{transform-origin:300px 194px;animation:sway 4s ease-in-out infinite alternate}@keyframes sway{to{transform:rotate(3deg)}}.grow{transform-origin:300px 190px;animation:grow .8s ease-out both}@keyframes grow{from{transform:scale(.15);opacity:.2}to{transform:scale(1);opacity:1}}.summary{display:grid;gap:10px}.summary>div{background:var(--cream);border:1px solid var(--line);padding:16px;border-radius:18px}.summary small{display:block;color:var(--muted);font-weight:700}.summary b{font-size:18px}.bigseed{font:normal 24px Georgia,serif}.notice{font-size:12px;color:var(--muted);margin-top:20px}.skip{display:block;margin:12px auto 0;border:0;background:transparent;text-decoration:underline;color:var(--muted);font-size:13px}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:32px}dialog{border:1px solid var(--line);border-radius:24px;background:var(--paper);color:var(--ink);max-width:min(90vw,440px);padding:24px}dialog::backdrop{background:#24382c66}@media(min-width:650px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:380px){.cards{gap:7px}.tile{min-height:94px}.name{font-size:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media print{body{background:#fff}header,.actions,.skip,.notice,footer button,.progress{display:none!important}main{padding:0}.hero{max-height:200px}button{border:0}}
</style></head><body><main><header><div class="brand">✳ Le jardin de ma motivation</div><button class="quiet" id="reset">Recommencer</button></header><section id="app" aria-live="polite"></section><footer>Mon compost du ras-le-bol •°<br>Conception : Pierre-Henri Garnier<br><button class="skip" id="about">À propos de la médiation</button></footer></main><dialog id="modal"><div id="modaltext"></div><div class="actions"><button class="back" id="close">Fermer</button><button class="primary" id="confirm" hidden>Recommencer</button></div></dialog><script>
const data={
 adulte:{label:'Adulte',icon:'🧑',intro:'Quand le diabète prend trop de place, on peut commencer par écouter ce qui pèse.',q:['Qu’est-ce qui vous pèse en ce moment ?','De quoi auriez-vous besoin pour que ce soit un peu moins lourd ?','Quel petit pas vous semblerait possible ?'],talk:['Qu’est-ce qui vous pèse le plus dans ce que vous avez choisi ?','Qu’est-ce que ce ras-le-bol essaie de vous dire ? Comment pourrait-on vous aider ?','À quoi ressemblerait ce petit pas dans votre vraie vie ? Quand, avec qui ?'],burden:[['😮‍💨','Ras-le-bol'],['🤯','Trop à penser'],['🥱','Fatigue'],['😨','Peur des hypos'],['📈','Glycémies imprévisibles'],['💉','Soins répétitifs'],['🍽️','Repas compliqués'],['😣','Culpabilité'],['😡','Colère'],['🫥','Solitude'],['🗣️','Trop de conseils'],['😔','Découragement']],need:[['🛌','Du repos'],['🧩','Moins de complexité'],['🛟','Me sentir en sécurité'],['🤝','Du soutien'],['👂','Être écouté'],['🕊️','Plus de liberté'],['❤️','Moins de jugement'],['☀️','Du plaisir'],['💡','Mieux comprendre']],seed:[['🗣️','Parler de ce qui me pèse'],['🤝','Demander un coup de main'],['🩺','Revoir une difficulté avec mon équipe'],['🧩','Chercher une façon de simplifier'],['🌳','Me réserver un moment agréable'],['🛌','Protéger un moment de repos'],['💬','Poser une question qui me tracasse'],['🌱','Choisir un geste de santé à ma portée']]},
 ado:{label:'Ado',icon:'🧑‍🎤',intro:'Le diabète, parfois, ça saoule. Ici, tu peux poser ce qui te prend la tête.',q:['Qu’est-ce qui te prend la tête en ce moment ?','Qu’est-ce qui te ferait du bien, vraiment ?','C’est quoi ton petit pas à toi ?'],talk:['Lequel te saoule le plus ? Tu peux raconter, ou juste montrer.','Si ton entourage pouvait changer un truc, ce serait quoi ?','Comment tu pourrais essayer ça, à ta façon ?'],burden:[['🙄','Marre du diabète'],['🤯','Trop de trucs à gérer'],['😴','Crevé·e'],['📱','Alarmes non-stop'],['💉','Piqûres et matériel'],['🍕','Repas et calculs'],['😨','Peur des hypos'],['👀','Regard des autres'],['🗣️','Remarques des adultes'],['🫥','Me sentir à part'],['😡','Ça m’énerve'],['📈','Chiffres qui font n’importe quoi']],need:[['🕊️','Plus de liberté'],['👂','Qu’on m’écoute'],['🤝','Qu’on m’aide'],['😌','Moins de pression'],['🛟','Être rassuré·e'],['🧩','Que ce soit plus simple'],['🎮','Du temps pour moi'],['❤️','Pas de jugement'],['👥','Me sentir compris·e']],seed:[['💬','Dire ce qui me saoule'],['🤝','Demander de l’aide'],['🩺','Parler d’un truc gênant à mon équipe'],['🎧','Me garder un moment cool'],['🧩','Trouver une astuce avec mon équipe'],['👥','En parler à quelqu’un de confiance'],['🌱','Essayer un petit changement à ma façon']]},
 enfant:{label:'Enfant',icon:'🧒',intro:'Parfois, le diabète remplit ton seau de choses pas faciles. On peut les regarder ensemble.',q:['Qu’est-ce qui remplit ton seau de ras-le-bol ?','De quoi aurais-tu besoin pour te sentir mieux ?','Quelle petite graine veux-tu planter ?'],talk:['Tu veux me raconter ce qui se passe avec cet emoji ?','Qui pourrait t’aider à avoir un peu plus de ça ?','Comment pourrait-on faire ça ensemble ?'],burden:[['😡','Je suis fâché·e'],['😢','Je suis triste'],['😨','J’ai peur'],['🥱','Je suis fatigué·e'],['💉','Les piqûres'],['🔔','Les bips'],['🍪','Les repas'],['🛑','Arrêter de jouer'],['👀','Les regards'],['😵','Trop de choses']],need:[['🫂','Un câlin'],['👂','Qu’on m’écoute'],['🧸','Être rassuré·e'],['🤝','De l’aide'],['🎨','M’amuser'],['😴','Me reposer'],['💡','Mieux comprendre'],['🕊️','Choisir un peu plus']],seed:[['💬','Dire ce qui m’embête'],['🙋','Demander de l’aide'],['🧸','Choisir un objet qui rassure'],['🎲','Jouer avec quelqu’un'],['❓','Poser une question'],['🤝','Essayer un petit geste avec un adulte']]}}
let age=null,step=0,choices=[[],[],[]],focus=-1;const app=document.querySelector('#app'), modal=document.querySelector('#modal');
function art(stage){let bin=stage<3;return `<div class="hero"><svg viewBox="0 0 600 250" role="img" aria-label="${bin?'Un composteur dans un jardin':'Une petite pousse dans un jardin'}"><defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r=".7" fill="#61754e" opacity=".2"/></pattern><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#e9efdd"/><stop offset="1" stop-color="#f7f1db"/></linearGradient></defs><rect width="600" height="250" fill="url(#sky)"/><circle cx="484" cy="54" r="29" fill="#efd088"/><path d="M0 170Q100 120 230 165T600 153V250H0" fill="#cddcba"/><path d="M0 203Q130 165 300 200T600 190V250H0" fill="#b1c59e"/><rect width="600" height="250" fill="url(#dots)"/>${[55,110,480,545].map((x,i)=>`<g transform="translate(${x} ${i%2?205:221})"><path d="M0 0Q-4 -24 0 -43" stroke="#63865b" stroke-width="3" fill="none"/><path d="M0 -15Q-28 -18 -19 -35Q0 -34 0 -15M0 -23Q22 -45 25 -28Q14 -15 0 -23" fill="#789965"/><circle cy="-44" r="7" fill="${i%2?'#e3b56e':'#d69583'}"/></g>`).join('')}<ellipse cx="300" cy="214" rx="133" ry="17" fill="#748e65" opacity=".23"/>${bin?`<g stroke="#795b3c" stroke-width="2" stroke-linejoin="round"><path d="M201 105L218 210H382L399 105Z" fill="#ba8b5c"/><path d="M210 129H391M214 157H387M217 184H383" fill="none" stroke="#8b623e" stroke-width="4"/><path d="M225 106V210M375 106V210" stroke="#e0b382" stroke-width="8"/><ellipse cx="300" cy="106" rx="99" ry="23" fill="#69533b"/><path d="M218 105Q250 87 286 100T381 105" fill="#96724d" stroke="none"/><path d="M196 92L226 55L405 66L399 93Z" fill="#d3a373" transform="rotate(-12 300 80)"/><path d="M273 65Q273 51 287 51H319Q330 51 330 65" fill="none" stroke-width="5"/></g><rect x="248" y="145" width="104" height="38" rx="9" fill="#f4e5c3"/><text x="300" y="170" text-anchor="middle" font-family="Georgia" font-size="15" fill="#624a32">COMPOST</text>`:`<ellipse cx="300" cy="204" rx="90" ry="25" fill="#96704e"/><ellipse cx="300" cy="198" rx="73" ry="16" fill="#b58d60"/><g class="grow"><g class="sway"><path d="M300 198Q285 153 302 104" stroke="#4e7849" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M295 159Q234 162 241 122Q280 120 295 159M298 141Q341 94 369 113Q357 150 298 141" fill="#75a061" stroke="#567e49" stroke-width="2"/>${stage===4?'<g fill="#e9b66b">'+Array.from({length:7},(_,i)=>`<ellipse cx="302" cy="83" rx="11" ry="23" transform="rotate(${i*360/7} 302 104)"/>`).join('')+'</g><circle cx="302" cy="104" r="13" fill="#96704e"/>':''}</g></g>`}<path d="M28 88q12 -9 24 0q12 -9 24 0M422 30q10 -8 20 0q10 -8 20 0" stroke="#70856a" stroke-width="2" fill="none" stroke-linecap="round"/></svg>${bin&&choices[0].length?`<div class="tokens">${choices[0].filter(x=>x>=0).map((x,i)=>`<span class="token" style="animation-delay:${i*70}ms">${data[age].burden[x][0]}</span>`).join('')}</div>`:''}</div>`}
function tiles(items,idx){return `<div class="cards">${items.map((v,i)=>`<button class="tile" data-pick="${i}" aria-pressed="${choices[idx].includes(i)}"><span class="emoji" aria-hidden="true">${v[0]}</span><span class="name">${v[1]}</span></button>`).join('')}</div>`}
function render(move=true){if(step===0){app.innerHTML=`<h1>Mon compost<br>du ras-le-bol <small>•°</small></h1><p class="sub">Du trop-plein à la petite graine.</p>${art(0)}<h2>À chacun son jardin</h2><p>Choisissez votre version pour commencer.</p><div class="agegrid">${Object.entries(data).map(([k,v])=>`<button class="tile" data-age="${k}"><span class="emoji">${v.icon}</span><b>${v.label}</b></button>`).join('')}</div><p class="notice">Un support pour en parler ensemble, sans notes ni bonnes ou mauvaises réponses.</p>`;return}
const d=data[age];if(step===4){app.innerHTML=`<div class="eyebrow">Mon jardin · ${d.label}</div><h2>Ma petite graine est plantée !</h2>${art(4)}<p class="bigseed">Chaque graine pousse à son rythme.</p><div class="summary">${['Ce que j’ai déposé','Ce dont j’ai besoin','Ma petite graine'].map((t,i)=>`<div><small>${t}</small><b>${choices[i].filter(x=>x>=0).map(x=>[d.burden,d.need,d.seed][i][x].join(' ')).join(' · ')||'Je préfère en parler / y réfléchir'}</b></div>`).join('')}</div><div class="talk"><strong>À partager ensemble</strong>${d.talk[2]}</div><p class="notice">Un petit pas choisi, pas une obligation. Si cela concerne le traitement du diabète, convenez-en avec votre équipe soignante.</p><div class="actions"><button class="back" data-back>Modifier</button><button class="primary" id="print">Garder ma carte (PDF / impression)</button></div><button class="skip" data-home>Terminer et effacer mes choix</button>`;}
else{let i=step-1;let titles=['Je vide mon seau','Je fais mon compost','Je plante ma petite graine'];let items=[d.burden,d.need,d.seed][i];let limit=i===0?3:1;app.innerHTML=`<div class="progress" aria-label="Étape ${step} sur 3">${[1,2,3].map(n=>`<span class="${n<=step?'done':''}"></span>`).join('')}</div><div class="eyebrow">${step} / 3 · ${d.label}</div><h2>${titles[i]}</h2>${step===1?`<p class="sub">${d.intro}</p>`:''}${art(step)}<h2 style="font-size:clamp(22px,4.5vw,29px)">${d.q[i]}</h2><p class="sub">${i===0?'Choisir jusqu’à trois cartes.':'Choisir une carte, celle qui vous parle le plus.'}</p>${tiles(items,i)}<p class="notice" id="count">${choices[i].filter(x=>x>=0).length} / ${limit} sélectionné(s)</p><div class="talk"><strong>Un moment pour en parler</strong>${d.talk[i]}</div><div class="actions"><button class="back" data-back>Retour</button><button class="primary" data-next ${choices[i].length===0?'disabled':''}>${['Faire mon compost','Choisir ma petite graine','Planter ma graine'][i]} →</button></div><button class="skip" data-skip>Passer cette étape / en parler autrement</button>`;}
if(move){window.scrollTo({top:0,behavior:'instant'});}}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.age){age=b.dataset.age;step=1;choices=[[],[],[]];render();}else if(b.hasAttribute('data-pick')){let i=step-1,n=Number(b.dataset.pick),a=choices[i].filter(x=>x>=0);if(a.includes(n))a=a.filter(x=>x!==n);else if(i===0&&a.length<3)a.push(n);else if(i!==0)a=[n];else{document.querySelector('#count').textContent='Trois cartes maximum : retirez-en une pour en choisir une autre.';return;}choices[i]=a;render(false);app.querySelector(`[data-pick="${n}"]`)?.focus({preventScroll:true});}else if(b.hasAttribute('data-next')||b.hasAttribute('data-skip')){if(b.hasAttribute('data-skip'))choices[step-1]=[-1];step++;render();}else if(b.hasAttribute('data-back')){step--;render();}else if(b.hasAttribute('data-home')){home()}else if(b.id==='print'){window.print()}});
function home(){step=0;age=null;choices=[[],[],[]];render();window.scrollTo(0,0)}function showModal(html,confirm=false){document.querySelector('#modaltext').innerHTML=html;document.querySelector('#confirm').hidden=!confirm;modal.showModal()}document.querySelector('#reset').onclick=()=>step===0?home():showModal('<h2>Un nouveau départ ?</h2><p>Les choix de ce parcours seront effacés.</p>',true);document.querySelector('#close').onclick=()=>modal.close();document.querySelector('#confirm').onclick=()=>{modal.close();home()};document.querySelector('#about').onclick=()=>showModal('<h2>À propos</h2><p>Une médiation narrative pour parler du vécu du diabète, de la charge mentale et de la motivation. Les émotions ne sont pas des déchets : le compost représente ce qui s’accumule et mérite d’être entendu.</p><p>Ce support ne mesure pas la motivation et ne remplace pas un avis médical. Il ne collecte ni ne transmet de données. Les choix restent en mémoire le temps de la page, sauf si vous imprimez la carte.</p><p>Conception : Pierre-Henri Garnier.</p>');render();
</script></body></html>
