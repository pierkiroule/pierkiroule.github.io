<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5ec"><title>Mon Jardin Motivationnel •°</title><style>
:root{color-scheme:light;--paper:#f7f5ec;--ink:#304b3c;--muted:#647265;--line:#d9dfd0;--green:#365d48}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#fffdf4,var(--paper) 55%,#e9eddf);color:var(--ink);font:16px system-ui,sans-serif;min-height:100dvh}main{max-width:580px;margin:auto;padding:24px 18px 30px}header{text-align:center}.eyebrow{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);font-weight:700}h1,h2{font-family:Georgia,serif;font-weight:400;line-height:1.15}h1{font-size:clamp(32px,8vw,46px);margin:9px 0}h2{font-size:26px;margin:12px 0}p{line-height:1.55}.sub{margin:0;color:var(--muted);font-size:15px}.garden{position:relative;margin:22px 0 8px;border:1px solid #e1e2d2;border-radius:48% 48% 24px 24px/30% 30% 24px 24px;overflow:hidden;background:#fdfbf0}.garden svg{display:block;width:100%;height:auto}.plant{transform-origin:200px 238px;animation:sway 7s ease-in-out infinite}.petal{animation:appear .8s ease both;transform-box:fill-box;transform-origin:center}.smallflower{animation:appear 1s ease both;transform-box:fill-box;transform-origin:center}@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}@keyframes appear{from{opacity:0;scale:.5}to{opacity:1;scale:1}}.garden-caption{text-align:center;font:italic 15px Georgia,serif;color:var(--muted);margin:10px 0 25px}.question{text-align:center;font-size:24px;margin:20px 0 14px}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:focus-visible{outline:3px solid #bd8c49;outline-offset:3px}.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:108px;border:1px solid var(--line);border-radius:20px;background:#fffdf6;padding:10px 4px;box-shadow:0 3px 8px #415b3510;transition:transform .2s,background .2s}.tool:active{transform:scale(.96)}.tool .emoji{font-size:30px}.tool b{font-size:13px;font-weight:650}.tool small{font-size:11px;color:var(--muted);line-height:1.2;text-align:center}.wisdom{margin:23px 0;padding:18px 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;font:italic 19px/1.45 Georgia,serif}.quiet{background:none;border:0;text-decoration:underline;text-underline-offset:4px;font-size:13px;color:var(--muted);padding:10px}.center{text-align:center}footer{text-align:center;font-size:11px;color:var(--muted);line-height:1.6;margin-top:20px}dialog{border:1px solid var(--line);border-radius:28px;background:#fffdf5;color:var(--ink);padding:22px;width:min(94vw,500px);max-height:90dvh;overflow:auto;box-shadow:0 20px 80px #233a3b35}dialog::backdrop{background:#263c3277;backdrop-filter:blur(4px)}.close{float:right;border:0;background:#eceee3;border-radius:50%;width:38px;height:38px;font-size:23px}.big{font-size:40px;margin:8px 0}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:18px 0}.choice{min-height:87px;border:1px solid var(--line);background:#f8f8ed;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:9px;font-size:13px}.choice span{font-size:29px}.choice[aria-pressed=true]{background:#dce9d2;border:2px solid #64845d;box-shadow:inset 0 0 0 2px #fffdf5}.primary{background:var(--green);color:white;border:0;border-radius:16px;padding:15px;width:100%;font-weight:650;min-height:48px}.primary:disabled{opacity:.45;cursor:default}.hint{font-size:13px;color:var(--muted)}.entry{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.entry span{font-size:22px}.entry small{display:block;color:var(--muted);margin-top:4px}.hidden{display:none!important}.notice{font-size:12px;color:var(--muted);padding:10px;background:#f0f1e6;border-radius:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:90vw;background:#365d48;color:white;padding:12px 20px;border-radius:22px;z-index:4;text-align:center;box-shadow:0 4px 20px #0002}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main><header><div class="eyebrow">Une parenthèse pour moi</div><h1>Mon Jardin<br>Motivationnel •°</h1><p class="sub">Ma motivation aussi, ça se cultive !</p></header>
<div class="garden"><svg viewBox="0 0 400 290" role="img" aria-label="Jardin symbolique avec une plante fleurie"><defs><radialGradient id="sky"><stop stop-color="#fffdf5"/><stop offset="1" stop-color="#eff0dc"/></radialGradient><linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#a4bb83"/><stop offset="1" stop-color="#577d55"/></linearGradient><radialGradient id="flower"><stop stop-color="#efd398"/><stop offset="1" stop-color="#dca783"/></radialGradient><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/></filter></defs><rect width="400" height="290" fill="url(#sky)"/><circle cx="310" cy="65" r="37" fill="#efd49a" opacity=".65"/><path d="M0 190Q80 150 174 195T400 166V290H0" fill="#dce5ca"/><path d="M0 220Q95 183 202 219T400 208V290H0" fill="#c6d7b5"/><path d="M0 260Q100 235 220 257T400 245V290H0" fill="#b9cba7"/><ellipse cx="200" cy="243" rx="77" ry="9" fill="#7e9c72" opacity=".2"/><g id="memories"></g><g class="plant"><path d="M200 242Q185 185 200 106" fill="none" stroke="#52764d" stroke-width="4" stroke-linecap="round"/><path d="M193 202Q124 206 125 157Q173 159 193 202Z" fill="url(#leaf)"/><path d="M195 172Q241 118 267 149Q247 184 195 172Z" fill="url(#leaf)"/><path d="M195 146Q146 144 145 114Q179 113 195 146Z" fill="#93ae7b"/><path d="M193 202L138 169M195 172L253 151M195 146L156 120" stroke="#f3f4d9" stroke-width="1.2" opacity=".6" fill="none"/><g id="bloom"></g><circle cx="200" cy="100" r="15" fill="#b59156"/><circle cx="196" cy="96" r="6" fill="#d2ad69" opacity=".6"/></g><rect width="400" height="290" filter="url(#grain)" opacity=".065" style="mix-blend-mode:multiply;pointer-events:none"/></svg></div>
<p class="garden-caption">Un jardin vivant, jamais à réussir.</p><h2 class="question">De quoi ma motivation<br>a-t-elle besoin aujourd'hui ?</h2><div id="tools" class="tools"></div><div class="wisdom" id="wisdom"></div><div class="center"><button class="quiet" id="journalBtn">Mon carnet de jardin</button><button class="quiet" id="quoteBtn">Une autre sagesse</button></div><footer>Conception : Pierre-Henri Garnier<br>Psychologue clinicien · Formateur en ETP<br>© 2026 — Mon Jardin Motivationnel •°<br><button class="quiet" id="infoBtn">À propos et confidentialité</button></footer></main>
<dialog id="panel" aria-labelledby="panelTitle"><button class="close" aria-label="Fermer" id="close">×</button><div id="panelBody"></div></dialog><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const tools=[
{icon:'💧',name:'Arroser',short:'Retrouver du sens',question:'Pourquoi ai-je envie de prendre soin de ma santé ?',help:'Je retrouve mes bonnes raisons, celles qui m’appartiennent.',choices:[['❤️','Mes liens'],['👨‍👩‍👧','Mes proches'],['🕊️','Ma liberté'],['🌈','Mes projets'],['😊','Mon bien-être'],['🌿','Ma santé'],['🧭','Mon autonomie'],['✨','Autre raison']],message:'Mes bonnes raisons nourrissent ma motivation.'},
{icon:'☀️',name:'Ensoleiller',short:'Retrouver du plaisir',question:'Qu’est-ce qui pourrait rendre mes soins plus agréables ?',help:'Je cherche une manière de prendre soin de moi qui me ressemble.',choices:[['🎵','Avec de la musique'],['🌳','Dans la nature'],['🚶','En me promenant'],['🍽️','Avec gourmandise'],['🤝','En bonne compagnie'],['😌','Sans me presser'],['🎨','Avec créativité'],['✨','Autrement']],message:'Le plaisir peut donner des racines à mes habitudes.'},
{icon:'🌱',name:'Semer',short:'Choisir un petit pas',question:'Quel petit geste ai-je envie d’essayer ?',help:'Un geste réaliste, compatible avec ma vie et mes soins.',choices:[['🚶','Bouger un peu'],['🥗','Préparer un repas'],['🩸','Observer mon glucose'],['💤','Préparer mon sommeil'],['🩺','Poser une question'],['🧘','Prendre un moment'],['💊','Faciliter mes soins'],['✨','Mon propre petit pas']],message:'Une petite graine suffit pour commencer.'},
{icon:'🪴',name:'Replanter',short:'Essayer autrement',question:'Qu’est-ce qui pourrait me faciliter la vie avec le diabète ?',help:'Si une habitude ne me convient pas, je peux chercher une autre façon de faire.',choices:[['⏰','Trouver un meilleur moment'],['🧩','Simplifier mon organisation'],['🔔','Choisir un rappel'],['🎒','Préparer mon matériel'],['💬','En parler en consultation'],['🔄','Réessayer autrement'],['🤝','Demander de l’aide'],['✨','Une autre idée']],message:'Changer de méthode, ce n’est pas renoncer.'},
{icon:'🎋',name:'Tuteurer',short:'Trouver du soutien',question:'Sur qui ou sur quoi pourrais-je m’appuyer ?',help:'Je n’ai pas besoin de jardiner seul.',choices:[['❤️','Mes proches'],['🧑‍⚕️','Mes soignants'],['🤝','Mes amis'],['👥','Des personnes qui vivent avec le diabète'],['📱','Un outil pratique'],['💬','Une association'],['🗓️','Une organisation'],['✨','Un autre soutien']],message:'Demander de l’aide est aussi une façon de prendre soin de soi.'},
{icon:'🍂',name:'Laisser reposer',short:'Alléger la pression',question:'Comment pourrais-je souffler un peu ?',help:'Je peux alléger la pression sans interrompre mes soins nécessaires.',choices:[['😌','Respirer'],['🎵','Écouter de la musique'],['🫂','Parler de ma lassitude'],['🛋️','Prendre une pause'],['🌳','Sortir prendre l’air'],['🧑‍⚕️','Demander un soutien'],['💛','Me parler avec douceur'],['✨','Autre parenthèse']],message:'Même le jardinier a besoin de repos.'}];
const quotes=['Je peux cultiver mon jardin sans maîtriser la météo.','Une glycémie est une information, pas un bulletin scolaire.','Je prends soin de mon diabète pour faire grandir ce qui compte pour moi.','Une petite graine peut ouvrir de grandes possibilités.','Mon diabète est une parcelle de mon jardin, pas tout mon paysage.','Je cultive mes ressources plutôt que mes culpabilités.','Le jardin a aussi besoin de repos. Moi aussi.','Je ne cherche pas un jardin parfait, mais un jardin où il fait bon vivre.'];
const $=id=>document.getElementById(id),panel=$('panel'),body=$('panelBody');let entries=[],persistent=true,active=null,picked=new Set(),qi=0,timer;const key='jardin-motivationnel-v1';try{const data=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(data))entries=data.filter(e=>e&&Number.isInteger(e.tool)&&tools[e.tool]&&Array.isArray(e.choices)&&e.choices.every(c=>Number.isInteger(c)&&tools[e.tool].choices[c])&&Number.isFinite(e.date));}catch{persistent=false;}
function save(){try{localStorage.setItem(key,JSON.stringify(entries));}catch{persistent=false;}}
function svg(tag,attrs,parent){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));parent.append(el);return el;}
for(let i=0;i<8;i++)svg('ellipse',{cx:200,cy:77,rx:11,ry:22,fill:'url(#flower)',transform:`rotate(${i*45} 200 100)`,opacity:.93},$('bloom'));
function renderGarden(){const g=$('memories');g.replaceChildren();const distinct=[...new Set(entries.map(e=>e.tool))];distinct.forEach((t,i)=>{const x=[55,340,99,299,27,373][i],y=[213,215,237,240,254,250][i];const f=svg('g',{class:'smallflower'},g);svg('path',{d:`M${x} ${y}q-6 -13 0 -29`,stroke:'#6b8958',fill:'none','stroke-width':2},f);const colors=['#9cb8cb','#edca80','#d5a2a4','#aab5d7','#b5c68d','#d9b18c'];for(let j=0;j<5;j++)svg('ellipse',{cx:x,cy:y-36,rx:4.5,ry:8,fill:colors[t],transform:`rotate(${j*72} ${x} ${y-29})`},f);svg('circle',{cx:x,cy:y-29,r:4,fill:'#b79355'},f);});}
function toast(s){clearTimeout(timer);$('toast').textContent=s;$('toast').classList.remove('hidden');timer=setTimeout(()=>$('toast').classList.add('hidden'),3200);}
function open(){if(!panel.open)panel.showModal();panel.scrollTop=0;}
function close(){panel.close();} $('close').onclick=close;panel.addEventListener('click',e=>{if(e.target===panel){const r=panel.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();}});
tools.forEach((t,i)=>{let b=document.createElement('button');b.className='tool';b.innerHTML=`<span class="emoji">${t.icon}</span><b>${t.name}</b><small>${t.short}</small>`;b.onclick=()=>selectTool(i);$('tools').append(b);});
function selectTool(i){active=i;picked=new Set();const t=tools[i];body.innerHTML=`<div class="center"><div class="big">${t.icon}</div><div class="eyebrow">${t.name}</div><h2 id="panelTitle">${t.question}</h2><p class="hint">${t.help}</p></div><div class="choices" id="choices"></div><p class="hint center">Je choisis ce qui me parle. Rien n’est obligatoire.</p><button class="primary" id="commit" disabled>Je prends soin de ma motivation</button>`;t.choices.forEach(([emoji,label],j)=>{const b=document.createElement('button');b.className='choice';b.setAttribute('aria-pressed','false');b.innerHTML=`<span>${emoji}</span>${label}`;b.onclick=()=>{if(picked.has(j))picked.delete(j);else picked.add(j);b.setAttribute('aria-pressed',String(picked.has(j)));$('commit').disabled=!picked.size;};$('choices').append(b);});$('commit').onclick=commit;open();}
function commit(){if(!picked.size||active===null)return;const t=tools[active];entries.push({tool:active,choices:[...picked],date:Date.now()});save();renderGarden();body.innerHTML=`<div class="center"><div class="big">🌷</div><h2 id="panelTitle">Un moment pour moi</h2><p style="font:22px/1.5 Georgia,serif">${t.message}</p><p class="hint">${persistent?'Je garde cette découverte dans mon carnet.':'Mon navigateur ne permet pas de conserver cette découverte après fermeture.'}</p><button class="primary" id="back">Retrouver mon jardin</button></div>`;$('back').onclick=close;}
function showJournal(){body.innerHTML='<div class="big">📖</div><h2 id="panelTitle">Mon carnet de jardin</h2><p class="hint">Des traces de ce qui m’aide, sans objectif de fréquence ni score.</p><div id="entries"></div><button class="primary" id="journalBack" style="margin-top:18px">Retour au jardin</button>';const box=$('entries');if(!entries.length)box.textContent='Mon carnet attend mes premières découvertes.';[...entries].reverse().forEach(e=>{const t=tools[e.tool],el=document.createElement('div');el.className='entry';const top=document.createElement('strong');top.textContent=t.icon+' '+t.name;el.append(top);const line=document.createElement('p');line.style.margin='5px 0';line.textContent=e.choices.map(i=>t.choices[i].join(' ')).join(' · ');el.append(line);const date=document.createElement('small');date.textContent=new Date(e.date).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});el.append(date);box.append(el);});$('journalBack').onclick=close;open();}
$('journalBtn').onclick=showJournal;$('quoteBtn').onclick=()=>{qi=(qi+1)%quotes.length;$('wisdom').textContent=quotes[qi];};$('wisdom').textContent=quotes[0];
$('infoBtn').onclick=()=>{body.innerHTML='<h2 id="panelTitle">À propos de mon jardin</h2><p>Un outil de réflexion personnelle inspiré de l’entretien motivationnel. Il ne mesure pas la motivation et ne remplace pas le suivi médical.</p><p class="notice">En cas de difficulté avec mes traitements ou mes glycémies, je suis les consignes de soins convenues avec mon équipe et je la contacte si nécessaire. Je ne modifie pas mon traitement à partir de cette application.</p><p>Mes choix restent dans ce navigateur, sans compte ni envoi de données. Sur un appareil partagé, ils peuvent être consultés par d’autres utilisateurs. Effacer les données du navigateur efface aussi le carnet.</p><button class="primary" id="infoBack">Retour au jardin</button><div class="center"><button class="quiet" id="erase">Effacer mon carnet</button></div>';$('infoBack').onclick=close;$('erase').onclick=()=>{body.innerHTML='<h2 id="panelTitle">Effacer mon carnet ?</h2><p>Mes découvertes seront supprimées de ce navigateur.</p><button class="primary" id="cancel">Garder mon carnet</button><div class="center"><button class="quiet" id="confirm">Confirmer la suppression</button></div>';$('cancel').onclick=close;$('confirm').onclick=()=>{entries=[];try{localStorage.removeItem(key)}catch{persistent=false}renderGarden();close();toast('Carnet effacé.');};};open();};renderGarden();
</script></body></html>
