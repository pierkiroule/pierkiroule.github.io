<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le BEP ou l’exploration conjointe •°</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f2e9;color:#263e37;font:16px system-ui}main{max-width:780px;margin:auto;padding:22px}h1,h2,h3{font-family:Georgia;font-weight:normal}h1{font-size:36px;line-height:1.1}small,label{color:#526b60}section{background:#fffdf7;border:1px solid #d6ded2;border-radius:18px;padding:20px;margin:16px 0}label{display:block;margin:16px 0 6px}input,select,button{font:inherit}input:not([type=checkbox]),select{width:100%;padding:12px;border:1px solid #aabbb0;border-radius:9px;background:white;color:inherit}button{border:1px solid #527969;background:#fffdf7;color:#315c4d;padding:12px 16px;border-radius:10px;cursor:pointer;margin:5px 4px 5px 0}button.primary{background:#315c4d;color:white}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bd9353}nav{display:flex;flex-wrap:wrap;gap:5px}nav span{font-size:12px;padding:7px;border-bottom:2px solid #ccc}nav .active{border-color:#315c4d;font-weight:bold}ul{padding-left:20px;line-height:1.65}.check{display:flex;gap:10px;align-items:flex-start;padding:11px 0;margin:0;border-bottom:1px solid #e5e8df;color:inherit}.check input{width:21px;height:21px;flex-shrink:0}.muted{color:#60776d;font-size:14px}.bar{height:9px;background:#dddcd3;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#608d76}.known{font-size:11px;color:#526b60}svg{width:100%;max-height:350px}footer{font-size:12px;color:#526b60;margin-top:30px} .share-panel{border-top:1px solid #d6ded2;margin-top:20px;padding-top:8px}@media print{.share-panel,nav,button,footer,header{display:none}main{padding:0}section{border:0;padding:0}body{background:white}}
 #timerHost{position:sticky;top:0;z-index:5}.timer{position:relative;top:0;z-index:5;background:#fffdf7;border:1px solid #aabbb0;border-radius:14px;padding:12px;margin:12px 0;box-shadow:0 3px 12px #263e3715}.timer strong{font-size:30px;font-variant-numeric:tabular-nums}.timer input[type=number]{width:80px;padding:7px}.timer button{padding:8px 12px}.timer.expired{border-color:#a64d35;color:#a64d35}@media print{.timer{display:none!important}}</style><main><header><small>FORMATION ETP · JEU EN TRINÔME</small><h1>Le BEP ou<br>l’exploration conjointe •°</h1><p>Le dossier est une carte. La rencontre révèle le territoire.</p></header><nav id="nav"></nav><div id="timerHost"></div><div id="app"></div><footer>Personnages fictifs uniquement · Outil pédagogique, non clinique.</footer></main><script>
const data={
'Asthme':['Crises nocturnes','Traitement inhalé de fond prescrit','Pense que le traitement de fond est inutile sans symptômes','Peur de manquer d’air','Reprendre une promenade sans appréhension','Évite les efforts'],
'BPCO':['Essoufflement à la marche','Traitement inhalé prescrit','Pense que tout effort abîme ses poumons','Découragement face à la perte de souffle','Retourner au marché à pied','Évite les sorties longues'],
'Apnées du sommeil':['Somnolence diurne','PPC prescrite','Pense que la PPC sert seulement à supprimer les ronflements','Gêne liée au masque','Retrouver des journées plus actives','Supporte mal le masque'],
'Diabète de type 1':['Variations de glycémie','Insulinothérapie','Craint que toute activité physique provoque une hypoglycémie','Lassitude des décisions quotidiennes','Participer à une sortie sans inquiétude','Peur des hypoglycémies'],
'Diabète de type 2':['Glycémies au-dessus des objectifs habituels','Traitement antidiabétique prescrit','Pense que sans symptômes le diabète est sans conséquence','Se sent jugé sur son alimentation','Retrouver le plaisir des repas partagés','Informations alimentaires contradictoires'],
'Maladie coronarienne':['Fatigue à l’effort','Traitement cardiovasculaire prescrit','Pense que tout effort fragilise son cœur','Peur de la récidive','Reprendre une activité de loisir','Évite les escaliers par crainte'],
'Insuffisance cardiaque':['Essoufflement et fatigue','Traitement cardiologique prescrit','Ne comprend pas l’intérêt de surveiller son poids','Inquiétude face aux variations de symptômes','Pouvoir sortir plus régulièrement','Difficulté à adapter ses activités'],
'Hypertension artérielle':['Peu de symptômes ressentis','Traitement antihypertenseur prescrit','Pense que le traitement est inutile quand tout va bien','Doute sur l’utilité des soins','Préserver son autonomie','Oublis de traitement'],
'Lombalgie chronique':['Douleurs lombaires fluctuantes','Suivi en kinésithérapie','Pense que la douleur signifie forcément une lésion','Peur de se faire mal','Reprendre une activité appréciée','Évite certains mouvements'],
'Arthrose':['Douleurs articulaires','Suivi médical et rééducation','Pense que bouger use toujours davantage les articulations','Frustration face aux limitations','Retrouver des sorties régulières','Difficulté à doser les efforts'],
'Polyarthrite rhumatoïde':['Raideurs matinales','Traitement de fond prescrit','Confond traitement de fond et traitement de la douleur','Inquiétude face aux poussées','Reprendre une activité manuelle','Fatigue fluctuante'],
'Endométriose':['Douleurs pelviennes cycliques','Suivi gynécologique et traitement hormonal','Pense que l’intensité des douleurs indique l’étendue des lésions','Sentiment de ne pas être compris','Reprendre une activité de loisir régulière','Douleurs imprévisibles'],
'Fibromyalgie':['Douleurs diffuses et fatigue','Suivi pluridisciplinaire','Pense devoir attendre de ne plus souffrir pour agir','Sentiment d’incompréhension','Retrouver un rythme de vie satisfaisant','Alternance de suractivité et d’épuisement'],
'TDAH':['Difficultés d’attention et d’organisation','Suivi spécialisé','Attribue ses difficultés à un manque de volonté','Frustration face aux oublis','Mener un projet personnel à terme','Difficulté à organiser les routines'],
'Autisme':['Surcharge sensorielle dans certains contextes','Suivi adapté aux besoins','Ne sait pas encore identifier tous ses besoins d’aménagement','Fatigue liée aux adaptations sociales','Participer à une activité dans un cadre prévisible','Environnements bruyants'],
'Trouble anxieux':['Inquiétudes envahissantes','Suivi psychologique','Pense devoir supprimer toute anxiété avant d’agir','Crainte de perdre le contrôle','Reprendre une activité évitée','Anticipations anxieuses'],
'Trouble bipolaire':['Variations de l’humeur','Traitement thymorégulateur prescrit','S’interroge sur l’utilité du traitement en période stable','Inquiétude face aux rechutes','Retrouver un rythme régulier','Difficulté à repérer les signes précoces'],
'Schizophrénie':['Difficultés de concentration et retrait social','Suivi psychiatrique','Comprend mal le rôle du traitement de fond','Crainte du regard des autres','Reprendre une activité collective','Stigmatisation ressentie'],
'Dépression récurrente':['Fatigue et perte d’intérêt','Suivi psychologique et médical','Pense devoir retrouver la motivation avant toute activité','Culpabilité face à son manque d’énergie','Retrouver une activité appréciée','Difficulté à initier les activités'],
'Épilepsie':['Crises intermittentes','Traitement antiépileptique prescrit','Pense que toute activité est dangereuse','Peur d’une crise en public','Retrouver une activité sociale','Crainte du regard des autres'],
'Migraine chronique':['Céphalées récurrentes','Suivi neurologique','Confond traitement de crise et prévention','Frustration liée aux annulations','Pouvoir prévoir une sortie','Imprévisibilité des crises'],
'Obésité':['Gêne dans certaines activités','Suivi nutritionnel et médical','Pense que tout repose sur la volonté','Crainte du jugement','Retrouver une activité plaisante','Expériences de stigmatisation'],
'Maladie de Crohn':['Douleurs abdominales et transit perturbé','Traitement de fond prescrit','Pense que chaque aliment déclenche une poussée','Inquiétude lors des sorties','Partager un repas à l’extérieur','Accès incertain aux toilettes'],
'Insuffisance rénale chronique':['Fatigue persistante','Suivi néphrologique','Comprend mal le rôle du suivi biologique','Inquiétude pour l’avenir','Maintenir ses activités habituelles','Contraintes des rendez-vous'],
'Cancer':['Fatigue liée au parcours de soins','Suivi oncologique','Ne distingue pas toujours effets du traitement et symptômes de la maladie','Incertitude face à l’avenir','Retrouver une activité qui a du sens','Fatigue et rendez-vous fréquents'],
'VIH':['Peu de symptômes ressentis','Traitement antirétroviral prescrit','S’interroge sur l’utilité du traitement en l’absence de symptômes','Crainte de la stigmatisation','Vivre ses relations plus sereinement','Difficulté à parler de la maladie']};
const titles=['Qu’a-t-il ?','Que fait-il ?','Que sait-il ?','Qui est-il ?','Quel est son projet ?','Quelles sont ses ressources ?','Quels sont ses obstacles ?'];const short=['Santé','Quotidien','Savoirs','Vécu','Projet','Ressources','Obstacles'];const attitudes=['Questions ouvertes','Écoute sans jugement','Reformulations','Respect du rythme et des silences','Vérification de la compréhension','Exploration des priorités du patient','Synthèse partagée'];let stage=0,role='',scenario=null,marks={},att={},seed=0;let config={name:'',age:34,path:'Endométriose',life:'En activité'};const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pick=a=>a[Math.floor(Math.random()*a.length)];const btn=(label,action,primary=false)=>`<button class="${primary?'primary':''}" onclick="${esc(action)}">${label}</button>`;function generate(){resetTimer();const d=data[config.path],young=config.age<18;const life=config.life;const job=life==='En activité'?pick(['Employé administratif','Travail en commerce','Travail de bureau']):life;const social=young?'Vit avec un parent':pick(['Vit seul','Vit en couple','Vit avec des proches']);const support=young?'Un adulte de confiance':pick(['Une amie de confiance','Un proche disponible','Un membre de la famille à l’écoute']);const hobby=pick(['Musique','Dessin','Lecture','Activités dans la nature']);const value=pick(['Autonomie','Liberté','Liens avec les proches','Plaisir']);const history=pick(['Diagnostic posé il y a 18 mois','Diagnostic posé il y a 2 ans','Diagnostic posé il y a 6 mois']);const daily=life==='En activité'?'A dû adapter son emploi du temps professionnel':life==='Scolarisé'||life==='Étudiant'?'A du mal à maintenir son rythme de travail scolaire':'A dû réorganiser ses activités habituelles';scenario={groups:[[history,d[0],d[1]],[job,social,daily],[d[2],'Ne sait pas à qui poser certaines questions'],[d[3],'Préfère parler des difficultés concrètes avant ses émotions'],[d[4],'Valeur : '+value,'Attente : mieux comprendre comment vivre avec la maladie'],[support,hobby,'Sait identifier certains moments où les difficultés diminuent'],[d[5],life==='En activité'?'Horaires peu flexibles':'Difficulté à maintenir une routine']],known:['0-0','0-1','0-2','1-0','1-1'],posture:pick(['Répondez volontiers aux questions ouvertes. Ne dévoilez pas tout spontanément.','Commencez par les symptômes. Parlez du vécu et du projet si le soignant vous invite à les explorer.','Demandez des précisions si une question vous paraît trop technique.'])};marks={};att={};role='';stage=1;render()}
function setup(){return `<section><h2>Préparer ensemble</h2><p>Négociez les paramètres à trois. L’observateur génère ensuite les rôles.</p><label>Prénom fictif</label><input id="name" maxlength="40" value="${esc(config.name)}" placeholder="Prénom"><label>Âge</label><select id="age">${Array.from({length:83},(_,i)=>i+8).map(a=>`<option ${a===config.age?'selected':''}>${a}</option>`).join('')}</select><label>Pathologie ou trouble</label><select id="path">${Object.keys(data).map(p=>`<option ${p===config.path?'selected':''}>${esc(p)}</option>`).join('')}</select><label>Situation de vie</label><select id="life">${['Scolarisé','Étudiant','En activité','Sans emploi','Retraité'].map(p=>`<option ${p===config.life?'selected':''}>${p}</option>`).join('')}</select><p id="error" role="alert"></p>${btn('Générer les rôles','start()',true)}</section>`}function start(){config={name:$('name').value.trim()||'Camille',age:+$('age').value,path:$('path').value,life:$('life').value};if((config.age<18&&!['Scolarisé','Étudiant'].includes(config.life))||(config.age<60&&config.life==='Retraité')){$('error').textContent='Choisissez une situation de vie cohérente avec l’âge pour cet exercice.';return}if(config.age<18&&!['Asthme','Diabète de type 1','TDAH','Autisme','Épilepsie','Migraine chronique','Trouble anxieux','Endométriose'].includes(config.path)){$('error').textContent='Ce scénario est prévu pour un adulte. Choisissez une autre pathologie ou un âge adulte.';return}generate()}
function identity(){return `<h2>${esc(config.name)}, ${config.age} ans</h2><p><b>${esc(config.path)}</b></p>`}function list(a){return '<ul>'+a.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>'}function distribution(){if(!role)return `<section><h2>Distribuer les rôles</h2><p>Confiez l’écran à chaque participant séparément. Masquez la fiche avant de passer au suivant.</p>${btn('Fiche patient','showRole("patient")')}${btn('Dossier soignant','showRole("soignant")')}${btn('Autre scénario','generate()')}${btn('Commencer le BEP','go(2)',true)}</section>`;let content=role==='patient'?`<small>FICHE PATIENT · CONFIDENTIELLE</small>${identity()}${scenario.groups.map((g,i)=>`<h3>${titles[i]}</h3>${list(g)}`).join('')}<h3>Votre posture</h3><p>${esc(scenario.posture)}</p><p class="muted">Vous pouvez improviser sans contredire les éléments du rôle.</p>`:`<small>DOSSIER SOIGNANT · AVANT ENTRETIEN</small>${identity()}${list(scenario.known.map(k=>{let [i,j]=k.split('-');return scenario.groups[i][j]}))}<p>Orientation : équipe de suivi. Premier entretien ETP.</p><h3>Votre mission</h3><p>Conduire un BEP avec la personne. Explorer son expérience, ses priorités et ses ressources. Construire une compréhension partagée.</p>`;return `<section>${content}${sharePanel()}${btn('Imprimer la fiche','window.print()')}${btn('Masquer la fiche','showRole("")',true)}</section>`}function roleText(r){
 const head=[r==='patient'?'FICHE PATIENT — CONFIDENTIELLE':'DOSSIER SOIGNANT — AVANT ENTRETIEN',config.name+', '+config.age+' ans',config.path,''];
 if(r==='patient'){scenario.groups.forEach((g,i)=>head.push(titles[i],...g.map(t=>'• '+t),''));head.push('Votre posture',scenario.posture,'Vous pouvez improviser sans contredire les éléments du rôle.');}
 else{head.push(...scenario.known.map(k=>{const [i,j]=k.split('-');return '• '+scenario.groups[i][j]}),'','Orientation : équipe de suivi. Premier entretien ETP.','','Votre mission : conduire un BEP avec la personne. Explorer son expérience, ses priorités et ses ressources. Construire une compréhension partagée.');}
 return head.join('\n');
}
async function shareRole(channel){
 const r=role;if(!scenario||!['patient','soignant'].includes(r))return;
 const message=roleText(r), title=r==='patient'?'Fiche patient confidentielle':'Dossier soignant';
 if(channel==='native'){try{await navigator.share({title,text:message});}catch(e){if(e.name!=='AbortError')alert('Partage indisponible. Utilisez un autre bouton.');}return;}
 if(channel==='copy'){try{await navigator.clipboard.writeText(message);alert('Fiche copiée.');}catch(e){const field=document.createElement('textarea');field.value=message;document.body.append(field);field.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}field.remove();if(ok)alert('Fiche copiée.');else window.prompt('Copiez cette fiche :',message);}return;}
 const body=encodeURIComponent(message);
 if(channel==='sms'){const sep=/iPad|iPhone|iPod/.test(navigator.userAgent)?'&':'?';location.href='sms:'+sep+'body='+body;}
 if(channel==='mail')location.href='mailto:?subject='+encodeURIComponent(title)+'&body='+body;
 if(channel==='whatsapp')window.open('https://wa.me/?text='+body,'_blank','noopener,noreferrer');
}
function sharePanel(){return `<div class="share-panel"><h3>Partager cette fiche uniquement</h3><p class="muted">Choisissez le destinataire dans votre application de messagerie. Vérifiez le rôle avant l’envoi. Personnages fictifs uniquement.</p>${btn('SMS',"shareRole('sms')")}${btn('E-mail',"shareRole('mail')")}${btn('WhatsApp',"shareRole('whatsapp')")}${btn('Copier le texte',"shareRole('copy')")}${typeof navigator.share==='function'?btn('Autres applications',"shareRole('native')"):''}</div>`;}
function showRole(r){role=r;render()}function go(n){if(n!==2)pauseTimer();stage=n;role='';render();window.scrollTo(0,0)}function check(k,t,known=false){return `<label class="check"><input type="checkbox" ${marks[k]?'checked':''} onchange="marks['${k}']=this.checked"><span>${esc(t)}${known?'<br><span class="known">Déjà dans le dossier — à approfondir</span>':''}</span></label>`}function observe(){return `<section><small>OBSERVATEUR UNIQUEMENT</small>${identity()}<p>Cochez les informations effectivement abordées ou approfondies. Ne cochez pas une information simplement connue du dossier.</p></section>${scenario.groups.map((g,i)=>`<section><h2>${titles[i]}</h2>${g.map((t,j)=>check(i+'-'+j,t,scenario.known.includes(i+'-'+j))).join('')}</section>`).join('')}<section><h2>Posture relationnelle</h2>${attitudes.map((t,i)=>`<label class="check"><input type="checkbox" ${att[i]?'checked':''} onchange="att[${i}]=this.checked">${t}</label>`).join('')}</section>${btn('Terminer l’entretien','go(3)',true)}`}
const prompts=['Comment vivez-vous les symptômes et les soins au quotidien ?','À quoi ressemble une journée habituelle ?','Comment comprenez-vous votre maladie et vos traitements ?','Comment vivez-vous cette situation ?','Qu’aimeriez-vous retrouver ou pouvoir faire ?','Sur quoi ou sur qui pouvez-vous compter ?','Qu’est-ce qui vous complique la vie actuellement ?'];function results(){const counts=scenario.groups.map((g,i)=>g.filter((_,j)=>marks[i+'-'+j]).length);const colors=counts.map((n,i)=>n===0?'#e3e1d7':n===scenario.groups[i].length?'#82ad94':'#d8bc83');return `<section><h2>Carte de l’exploration</h2><svg viewBox="0 0 360 300" role="img" aria-label="Carte des sept dimensions">${short.map((t,i)=>{let a=(i*2*Math.PI/7)-Math.PI/2,x=180+110*Math.cos(a),y=150+105*Math.sin(a);return `<line x1="180" y1="150" x2="${x}" y2="${y}" stroke="#9bad9f"/><circle cx="${x}" cy="${y}" r="40" fill="${colors[i]}" stroke="#708879"/><text x="${x}" y="${y}" text-anchor="middle" font-size="11" fill="#263e37">${t}</text><text x="${x}" y="${y+15}" text-anchor="middle" font-size="10">${counts[i]}/${scenario.groups[i].length}</text>`}).join('')}<circle cx="180" cy="150" r="42" fill="#315c4d"/><text x="180" y="154" fill="white" text-anchor="middle" font-size="12">La personne</text></svg><p class="muted">Vert : exploré · Ocre : partiellement exploré · Gris : non exploré. Ce n’est pas une note.</p></section>${scenario.groups.map((g,i)=>{const missing=g.filter((_,j)=>!marks[i+'-'+j]);return `<section><h3>${titles[i]}</h3><div class="bar"><i style="width:${100*counts[i]/g.length}%"></i></div><p>${counts[i]} / ${g.length} éléments abordés</p>${missing.length?'<b>Resté inexploré</b>'+list(missing)+'<p><b>Piste :</b> '+prompts[i]+'</p>':'<p>Tous les éléments prévus ont été abordés.</p>'}</section>`}).join('')}<section><h2>Dossier et découvertes</h2><p>Éléments du dossier approfondis : ${scenario.known.filter(k=>marks[k]).length}/${scenario.known.length}</p><p>Informations nouvelles abordées : ${Object.keys(marks).filter(k=>marks[k]&&!scenario.known.includes(k)).length}</p><h3>Postures observées</h3>${list(attitudes.filter((_,i)=>att[i]))}<h3>Postures non cochées, à discuter</h3>${list(attitudes.filter((_,i)=>!att[i]))}<p class="muted">Une absence de coche ne signifie pas un échec. La pertinence dépend du contexte et du rythme du patient.</p>${btn('Débriefing','go(4)',true)}${btn('Revoir la grille','go(2)')}</section>`}function debrief(){return `<section><h2>Partager les trois expériences</h2><h3>Patient</h3>${list(['Vous êtes-vous senti écouté et compris ?','Qu’avez-vous découvert ou clarifié pour vous-même ?'])}<h3>Soignant</h3>${list(['Qu’avez-vous appris au-delà du dossier ?','Quelles priorités avez-vous comprises ?'])}<h3>Observateur</h3>${list(['Quels moments ont facilité l’expression ?','Quels territoires restent à explorer ?'])}<h3>Ensemble</h3>${list(['Quelles questions auraient permis d’aller plus loin ?','Quels besoins éducatifs pourraient être discutés avec le patient ?','Que faudrait-il reprendre lors d’une prochaine rencontre ?'])}<p><b>Le BEP n’est pas une exploration du patient, mais une exploration avec le patient.</b></p>${btn('Revoir la carte','go(3)')}${btn('Nouveau trinôme / rotation','restart()',true)}</section>`}function restart(){if(confirm('Effacer le scénario et les observations ?')){scenario=null;marks={};att={};config.name='';go(0)}}
var timerMinutes=15, remaining=900000, deadline=0, timerInterval=null, expired=false;
function resetTimer(){pauseTimer();remaining=timerMinutes*60000;expired=false;paintTimer()}
function pauseTimer(){if(deadline){remaining=Math.max(0,deadline-Date.now());deadline=0}clearInterval(timerInterval);timerInterval=null;paintTimer()}
function setTimer(v){if(deadline)return;timerMinutes=Math.max(1,Math.min(120,Math.round(Number(v)||15)));remaining=timerMinutes*60000;expired=false;renderTimer()}
function startTimer(){if(deadline)return;if(remaining<=0)resetTimer();deadline=Date.now()+remaining;timerInterval=setInterval(paintTimer,250);paintTimer()}
function paintTimer(){let el=$('timerDisplay');let ms=deadline?Math.max(0,deadline-Date.now()):remaining;if(deadline&&ms===0){deadline=0;remaining=0;clearInterval(timerInterval);timerInterval=null;expired=true;try{if(navigator.vibrate)navigator.vibrate([250,100,250]);}catch(e){}}if(!el)return;let sec=Math.ceil(ms/1000);el.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');$('timerStatus').textContent=expired?'Temps écoulé — terminez à votre rythme.':deadline?'Entretien en cours':remaining===timerMinutes*60000?'Prêt':'En pause';$('timerBox').classList.toggle('expired',expired);$('timerDuration').disabled=!!deadline;$('timerStart').disabled=!!deadline;$('timerPause').disabled=!deadline;}
function renderTimer(){const host=$('timerHost');if(stage!==2){host.innerHTML='';return}host.innerHTML=`<div class="timer" id="timerBox"><small>MINUTEUR · OBSERVATEUR</small><div><strong id="timerDisplay"></strong> <span id="timerStatus" role="status"></span></div><label for="timerDuration">Durée (minutes)</label><input id="timerDuration" type="number" min="1" max="120" value="${timerMinutes}" onchange="setTimer(this.value)"><button id="timerStart" class="primary" onclick="startTimer()">Démarrer / reprendre</button><button id="timerPause" onclick="pauseTimer()">Pause</button><button onclick="resetTimer()">Réinitialiser</button></div>`;paintTimer()}

function render(){$('nav').innerHTML=['Préparer','Distribuer','Explorer','Cartographier','Partager'].map((s,i)=>`<span class="${stage===i?'active':''}">${i+1}. ${s}</span>`).join('');$('app').innerHTML=[setup,distribution,observe,results,debrief][stage]();renderTimer()}render();
</script></html>
