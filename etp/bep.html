<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portrait Patient •°</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f3ed;color:#263e37;font:16px system-ui}main{max-width:720px;margin:auto;padding:24px}h1{font:36px Georgia;margin:10px 0}small{color:#526b60}form,article{background:white;border:1px solid #d5ded4;border-radius:16px;padding:20px;margin:20px 0}label{display:block;margin:12px 0 5px}input,select,button{font:inherit;padding:12px;border:1px solid #aabbb0;border-radius:8px;background:white;color:inherit;width:100%}button{cursor:pointer;margin-top:12px;background:#315c4d;color:white}h2{font:26px Georgia;margin:8px 0}h3{font-size:15px;margin:14px 0 4px}ul{margin:0;padding-left:20px;line-height:1.5}section{border-top:1px solid #e0e6df;margin-top:12px}#actions{display:flex;gap:8px}#actions button{background:white;color:#315c4d}@media print{form,header,#actions{display:none!important}main{padding:0}article{border:0;margin:0;padding:0}section{break-inside:avoid}body{background:white;font-size:11pt}}</style></head><body><main><header><small>FORMATION ETP · JEU DE RÔLE</small><h1>Portrait Patient •°</h1><p>Un personnage à incarner pour un BEP.</p></header><form id="form"><label for="name">Prénom fictif</label><input id="name" maxlength="40" placeholder="Camille"><label for="age">Âge</label><select id="age"></select><label for="path">Pathologie ou trouble</label><select id="path"></select><label for="life">Situation de vie</label><select id="life"></select><button>Générer le cas patient</button></form><article id="result" hidden></article><div id="actions" hidden style="display:none"><button id="copy">Copier la fiche</button><button id="print">Imprimer</button></div></main><script>const data={
'Asthme':['Crises nocturnes','Traitement inhalé de fond prescrit','Pense que le traitement de fond est inutile sans symptômes','Peur de manquer d’air','Reprendre une promenade sans appréhension','Évite les efforts'],
'BPCO':['Essoufflement à la marche','Traitement inhalé prescrit','Pense que tout effort abîme ses poumons','Découragement face à la perte de souffle','Retourner au marché à pied','Évite les sorties longues'],
'Apnées du sommeil':['Somnolence diurne','PPC prescrite','Pense que la PPC sert seulement à supprimer les ronflements','Gêne liée au masque','Retrouver des journées plus actives','Supporte mal le masque'],
'Diabète de type 1':['Variations de glycémie','Insulinothérapie','Craint que toute activité physique provoque une hypoglycémie','Lassitude des décisions quotidiennes','Participer à une sortie sans inquiétude','Peur des hypoglycémies'],
'Diabète de type 2':['Glycémies au-dessus des objectifs habituels','Traitement antidiabétique prescrit','Pense que sans symptômes le diabète est sans conséquence','Se sent jugé sur son alimentation','Retrouver le plaisir des repas partagés','Informations alimentaires contradictoires'],
'Maladie coronarienne':['Fatigue à l’effort','Traitement cardiovasculaire prescrit','Pense que tout effort fragilise son cœur','Peur de la récidive','Reprendre une activité de loisir','Évite les escaliers par crainte'],
'Insuffisance cardiaque':['Essoufflement et fatigue','Traitement cardiologique prescrit','Ne comprend pas l’intérêt de surveiller son poids','Inquiétude face aux variations de symptômes','Pouvoir sortir plus régulièrement','Difficulté à adapter ses activités'],
'Hypertension artérielle':['Peu de symptômes ressentis','Traitement antihypertenseur prescrit','Pense que le traitement est inutile quand tout va bien','Doute sur l’utilité des soins','Préserver son autonomie','Oublis de traitement'],
'Lombalgie chronique':['Douleurs lombaires fluctuantes','Suivi en kinésithérapie','Pense que la douleur signifie forcément une lésion','Peur de se faire mal','Reprendre une activité appréciée','Évite certains mouvements'],
'Arthrose':['Douleurs articulaires','Suivi médical et rééducation','Pense que bouger use toujours davantage les articulations','Frustration face aux limitations','Retrouver des sorties régulières','Difficulté à doser les efforts'],
'Polyarthrite rhumatoïde':['Raideurs matinales','Traitement de fond prescrit','Confond traitement de fond et traitement de la douleur','Inquiétude face aux poussées','Reprendre une activité manuelle','Fatigue fluctuante'],
'Endométriose':['Douleurs pelviennes cycliques','Suivi gynécologique et traitement hormonal','Pense que l’intensité des douleurs indique l’étendue des lésions','Sentiment de ne pas être compris','Reprendre une activité de loisir régulière','Douleurs imprévisibles'],
'Fibromyalgie':['Douleurs diffuses et fatigue','Suivi pluridisciplinaire','Pense devoir attendre de ne plus souffrir pour agir','Sentiment d’incompréhension','Retrouver un rythme de vie satisfaisant','Alternance de suractivité et d’épuisement'],
'TDAH':['Difficultés d’attention et d’organisation','Suivi spécialisé','Attribue ses difficultés à un manque de volonté','Frustration face aux oublis','Mener un projet personnel à terme','Difficulté à organiser les routines'],
'Autisme':['Surcharge sensorielle dans certains contextes','Suivi adapté aux besoins','Ne sait pas encore identifier tous ses besoins d’aménagement','Fatigue liée aux adaptations sociales','Participer à une activité dans un cadre prévisible','Environnements bruyants'],
'Trouble anxieux':['Inquiétudes envahissantes','Suivi psychologique','Pense devoir supprimer toute anxiété avant d’agir','Crainte de perdre le contrôle','Reprendre une activité évitée','Anticipations anxieuses'],
'Trouble bipolaire':['Variations de l’humeur','Traitement thymorégulateur prescrit','S’interroge sur l’utilité du traitement en période stable','Inquiétude face aux rechutes','Retrouver un rythme régulier','Difficulté à repérer les signes précoces'],
'Schizophrénie':['Difficultés de concentration et retrait social','Suivi psychiatrique','Comprend mal le rôle du traitement de fond','Crainte du regard des autres','Reprendre une activité collective','Stigmatisation ressentie'],
'Dépression récurrente':['Fatigue et perte d’intérêt','Suivi psychologique et médical','Pense devoir retrouver la motivation avant toute activité','Culpabilité face à son manque d’énergie','Retrouver une activité appréciée','Difficulté à initier les activités'],
'Épilepsie':['Crises intermittentes','Traitement antiépileptique prescrit','Pense que toute activité est dangereuse','Peur d’une crise en public','Retrouver une activité sociale','Crainte du regard des autres'],
'Migraine chronique':['Céphalées récurrentes','Suivi neurologique','Confond traitement de crise et prévention','Frustration liée aux annulations','Pouvoir prévoir une sortie','Imprévisibilité des crises'],
'Obésité':['Gêne dans certaines activités','Suivi nutritionnel et médical','Pense que tout repose sur la volonté','Crainte du jugement','Retrouver une activité plaisante','Expériences de stigmatisation'],
'Maladie de Crohn':['Douleurs abdominales et transit perturbé','Traitement de fond prescrit','Pense que chaque aliment déclenche une poussée','Inquiétude lors des sorties','Partager un repas à l’extérieur','Accès incertain aux toilettes'],
'Insuffisance rénale chronique':['Fatigue persistante','Suivi néphrologique','Comprend mal le rôle du suivi biologique','Inquiétude pour l’avenir','Maintenir ses activités habituelles','Contraintes des rendez-vous'],
'Cancer':['Fatigue liée au parcours de soins','Suivi oncologique','Ne distingue pas toujours effets du traitement et symptômes de la maladie','Incertitude face à l’avenir','Retrouver une activité qui a du sens','Fatigue et rendez-vous fréquents'],
'VIH':['Peu de symptômes ressentis','Traitement antirétroviral prescrit','S’interroge sur l’utilité du traitement en l’absence de symptômes','Crainte de la stigmatisation','Vivre ses relations plus sereinement','Difficulté à parler de la maladie']};

const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)];let text='';function options(el,items,selected){el.replaceChildren(...items.map(x=>{const o=new Option(x,x);o.selected=String(x)===String(selected);return o}))}options($('age'),Array.from({length:83},(_,i)=>i+8),34);const youth=['Asthme','Diabète de type 1','TDAH','Autisme','Épilepsie','Migraine chronique','Trouble anxieux','Endométriose'];function adapt(){const a=+$('age').value;options($('path'),a<18?youth:Object.keys(data),$('path').value||'Endométriose');options($('life'),a<18?['Scolarisé']:a<60?['En activité','Étudiant','Sans emploi']:['Retraité','En activité','Sans emploi'],$('life').value||'En activité')}adapt();$('age').onchange=adapt;
$('form').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim()||'Camille',age=+$('age').value,path=$('path').value,life=$('life').value,d=data[path],young=age<18;const groups=[['Qu’a-t-il ?', [pick(['Diagnostic posé il y a 6 mois','Diagnostic posé il y a 18 mois','Diagnostic posé il y a 2 ans']),d[0],d[1]]],['Que fait-il ?', [life==='En activité'?pick(['Travail administratif','Travail en commerce','Travail de bureau']):life,young?'Vit avec un parent':pick(['Vit seul','Vit en couple','Vit avec des proches']),life==='En activité'?'A dû adapter ses horaires de travail':life==='Scolarisé'||life==='Étudiant'?'A du mal à maintenir son rythme scolaire':'A réorganisé ses activités habituelles']],['Que sait-il ?', [d[2],'Ne sait pas à qui poser certaines questions']],['Qui est-il ?', [d[3],pick(['Parle facilement des difficultés concrètes','Préfère prendre le temps avant de se confier','Utilise parfois l’humour pour parler de ses difficultés'])]],['Quel est son projet ?', [d[4],'Valeur : '+pick(['Autonomie','Liberté','Liens avec les proches','Plaisir']),'Attente : mieux comprendre comment vivre avec la maladie']],['Quelles sont ses ressources ?', [young?'Un adulte de confiance':pick(['Une amie de confiance','Un proche disponible','Un membre de la famille à l’écoute']),pick(['Musique','Dessin','Lecture','Activités dans la nature']),'Repère certains moments où les difficultés diminuent']],['Quels sont ses obstacles ?', [d[5],life==='En activité'?'Horaires peu flexibles':'Difficulté à maintenir une routine']]];const r=$('result');r.replaceChildren();function add(parent,tag,value){const el=document.createElement(tag);el.textContent=value;parent.append(el);return el}add(r,'small','FICHE DE RÔLE · CONFIDENTIELLE');add(r,'h2',name+', '+age+' ans');add(r,'strong',path);text=name+', '+age+' ans — '+path+'\n';for(const [title,items] of groups){const sec=add(r,'section','');add(sec,'h3',title);const ul=add(sec,'ul','');items.forEach(t=>add(ul,'li',t));text+='\n'+title+'\n'+items.map(t=>'• '+t).join('\n')+'\n'}const instruction='Incarnez ce personnage. Répondez naturellement, sans tout dévoiler spontanément.';add(r,'p',instruction);text+='\n'+instruction;r.hidden=false;$('actions').hidden=false;$('actions').style.display='flex';r.scrollIntoView({behavior:'smooth'});};$('print').onclick=()=>window.print();$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(text);$('copy').textContent='Fiche copiée'}catch{window.prompt('Copiez la fiche',text)}};
</script></body></html>
