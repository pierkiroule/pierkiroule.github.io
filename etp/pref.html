<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ma préférence à moi •°</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:repeating-radial-gradient(ellipse at 50% 15%,#f6c96e 0 60px,#edab57 61px 120px,#d77445 121px 180px,#a84843 181px 240px);color:#482d35;font-family:Georgia,serif;padding:18px;display:flex;justify-content:center;align-items:center}main{width:min(100%,720px);background:#fff3d8;border:5px double #a84d46;border-radius:32px;padding:clamp(18px,4vw,36px);box-shadow:0 14px 0 #733f3d66,0 25px 55px #532c3755;text-align:center}header{border-bottom:2px solid #e5b578;padding-bottom:20px} .eyebrow,.tag,.count{font:700 11px/1.5 Arial,sans-serif;letter-spacing:2px;text-transform:uppercase}h1{font-size:clamp(39px,9vw,76px);line-height:.85;margin:14px 0;color:#ad4748;font-style:italic;letter-spacing:-3px;text-shadow:2px 3px #edbc76}header p{margin:15px 0 0;font-style:italic}.record{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;background:repeating-radial-gradient(circle,#382a31 0 2px,#59414a 3px 4px);box-shadow:2px 3px #d5a56a;transform:rotate(-15deg)}.record:after{content:'♪';display:grid;place-items:center;background:#e7a45b;border-radius:50%;width:24px;height:24px;color:#713a43}.progress{display:flex;gap:6px;margin:20px 0 10px}.progress span{height:7px;background:#e8d2ae;border-radius:12px;flex:1}.progress .on{background:#ad4748}.quote{font-size:clamp(21px,5vw,31px);font-style:italic;line-height:1.25;background:#f8e2b9;border-radius:18px;padding:20px 12px;margin:12px 0 18px}.prompt{font-size:17px;font-weight:bold}.choices{display:grid;gap:10px;text-align:left}button{font:inherit;cursor:pointer;touch-action:manipulation} .choice{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fffaf0;color:#482d35;border:2px solid #d5a76e;border-radius:14px;padding:14px;line-height:1.4;font-size:16px}.letter{flex:none;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;background:#f1d3a1;color:#824341;font:bold 14px Arial}.choice:hover:not(:disabled),.choice:focus-visible{border-color:#a84843;background:#fbeacb}.choice.selected{background:#f3c9aa;border-color:#a84843}.choice:disabled{cursor:default}.intent{display:block;font:700 11px/1.5 Arial;color:#8a3b42;text-transform:uppercase;letter-spacing:1px;margin-top:6px}.next{background:#a84843;color:#fff6df;border:0;border-radius:999px;padding:14px 24px;font-weight:bold;box-shadow:0 4px #733f3d;margin-top:18px;width:100%}.next:disabled{opacity:.45;cursor:default}.note{font-size:14px;line-height:1.5;color:#77565a}.feedback{border-top:1px solid #e1b77d;margin-top:18px;padding-top:12px;line-height:1.5}.result{text-align:left;margin:20px 0}.result article{border-bottom:1px solid #e0c396;padding:12px 0}.result p{margin:5px 0}.bar{height:8px;background:#ead4af;border-radius:10px;margin:6px 0 12px}.bar i{display:block;height:100%;background:#a84843;border-radius:10px}.spark{color:#b66c3c;letter-spacing:8px}footer{margin-top:22px;font-size:12px;color:#77565a}button:focus-visible{outline:3px solid #482d35;outline-offset:3px}@media(prefers-reduced-motion:no-preference){.record{animation:spin 12s linear infinite}@keyframes spin{to{transform:rotate(345deg)}}}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:12px 0}.chip{border:2px solid #d5a76e;background:#fffaf0;color:#482d35;border-radius:25px;padding:11px 15px;font-size:16px;line-height:1.3}.chip[aria-pressed=true]{background:#ad4748;color:#fff8e8;border-color:#ad4748}.compose{background:#fffaf0;border:2px dashed #d5a76e;border-radius:14px;padding:17px;margin:15px 0;min-height:65px;font-size:20px;font-style:italic}.step{font:700 11px Arial;letter-spacing:1.4px;text-transform:uppercase;color:#8a3b42;margin-top:18px}.feedback{text-align:left}.feedback h3{margin-bottom:5px}.music{font-size:23px;letter-spacing:4px} .world{padding:10px 0;border-bottom:1px solid #e0c396}.world p{margin:5px 0}.world:last-child{border:0}button:disabled{opacity:.75}.choice[aria-pressed=true]:disabled{opacity:1} .note{margin:10px 0}.heart{color:#9c3549;font:700 12px Arial,sans-serif;margin-left:6px}.world p{font-size:15px}.feedback h3{font-size:18px;margin:0 0 8px}.choice[aria-pressed=false]:disabled{opacity:1}</style></head><body><main><header><div class="record" aria-hidden="true"></div><div class="music" aria-hidden="true">🎵 🎶</div><h1>Ma préférence<br>à moi</h1><p>Clarifier son intention</p></header><section id="game"></section><footer>ETP · Bilan éducatif partagé · Aucune mauvaise réponse.</footer></main><script>
const worlds={
 Vécu:'Le monde de l’expérience subjective : les émotions, les sensations et ce que la situation fait vivre.',
 Quotidien:'Le monde des pratiques : les habitudes, les situations concrètes et les adaptations.',
 Représentations:'Le monde des significations : les croyances, les interprétations et les repères du patient.',
 Ressources:'Le monde des appuis : les capacités, les soutiens et les stratégies déjà présentes ou possibles.',
 'Projets et valeurs':'Le monde des possibles : les aspirations, les priorités et ce qui donne du sens à la vie.'
};
// Chaque intention est proposée exactement trois fois. Une formulation est affichée par intention.
const cases=[
 {p:'Depuis mon diagnostic, tout a changé.',o:[['Vécu','Comment vivez-vous',['ces changements','cette nouvelle étape de votre vie']],['Quotidien','Racontez-moi',['comment se déroule une journée depuis votre diagnostic','ce qui a changé dans vos habitudes']],['Projets et valeurs','Qu’aimeriez-vous',['retrouver de votre vie d’avant','préserver malgré ces changements']]]},
 {p:'Je ne prends pas toujours mon traitement.',o:[['Représentations','Comment comprenez-vous',['le rôle de ce traitement','ce qu’il peut vous apporter']],['Quotidien','Comment se passe',['la prise de votre traitement au quotidien','une journée où vous devez prendre votre traitement']],['Ressources','Sur quoi pouvez-vous vous appuyer',['pour organiser la prise de votre traitement','les jours où vous souhaitez le prendre']]]},
 {p:'Je voudrais changer certaines habitudes, mais j’ai peur.',o:[['Vécu','Qu’est-ce qui vous',['inquiète dans ce changement','semble difficile à vivre dans cette perspective']],['Représentations','Comment imaginez-vous',['ce que ce changement pourrait entraîner','les conséquences de ce changement pour vous']],['Projets et valeurs','Qu’est-ce qui compte pour vous',['dans ce changement','derrière cette envie de changer']]]},
 {p:'J’aimerais pouvoir repartir en randonnée.',o:[['Projets et valeurs','Qu’est-ce qui vous',['attire dans cette perspective','tient à cœur dans la randonnée']],['Ressources','Qu’est-ce qui pourrait vous aider',['à préparer cette reprise','à retrouver le plaisir de marcher']],['Quotidien','Racontez-moi',['comment vous bougez actuellement','la place que la marche occupe dans vos journées']]]},
 {p:'Je ne suis jamais sûr de bien faire.',o:[['Vécu','Comment vivez-vous',['cette incertitude','les moments où vous doutez']],['Ressources','Sur quoi vous appuyez-vous',['pour prendre vos décisions','pour avancer malgré vos doutes']],['Représentations','Qu’est-ce que cela signifie pour vous',['de bien faire','de prendre la bonne décision']]]}
];
const shortWorlds={"Vécu":["Vous invitez le patient à explorer ce qu’il ressent.","Ce qu’il ressent."],"Quotidien":["Vous explorez ce que le patient fait au quotidien.","Ce qu’il fait."],"Projets et valeurs":["Vous explorez ce qui compte pour le patient.","Ce qui compte pour lui."],"Ressources":["Vous explorez ce qui peut aider le patient.","Ce qui l’aide."],"Représentations":["Vous explorez la manière dont le patient comprend sa situation.","Ce qu’il en comprend."]};
let index=0,answers=[],a=-1,b=-1,confirmed=false;const game=document.querySelector('#game');
function phrase(o,k){return o[1]+' '+o[2][k]+(o[1].startsWith('Racontez')?'.':' ?')}
function render(){if(index===cases.length){result();return}const c=cases[index];game.innerHTML=`<div class="progress" aria-hidden="true">${cases.map((_,i)=>`<span class="${i<answers.length?'on':''}"></span>`).join('')}</div><div class="count">${index+1} / 5</div><div class="quote">« ${c.p} »</div><p class="prompt">Quelle serait votre formule préférée ?</p><div class="choices">${c.o.map((x,j)=>`<button class="choice" data-a="${j}" aria-pressed="${a===j}" style="${a===j?'background:#ad4748;color:#fff8e8;border-color:#ad4748':''}" ${confirmed?'disabled':''}>${phrase(x,0)}</button>`).join('')}</div>${confirmed?`<div class="feedback"><h3>Chaque question ouvre un monde différent.</h3>${c.o.map((x,j)=>`<div class="world"><strong>${x[0]}</strong>${j===a?' <span class="heart">♥ Ma préférence</span>':''}<p>${shortWorlds[x[0]][1]}</p></div>`).join('')}</div><button class="next">${index===4?'Découvrir mes intentions':'Situation suivante →'}</button>`:''}`;game.querySelectorAll('[data-a]').forEach(el=>el.onclick=()=>{if(confirmed)return;a=+el.dataset.a;answers.push({a});confirmed=true;render();game.querySelector('.next').focus({preventScroll:true})});const next=game.querySelector('.next');if(next)next.onclick=()=>{index++;a=b=-1;confirmed=false;render();window.scrollTo(0,0)}}
function result(){const counts=Object.fromEntries(Object.keys(worlds).map(k=>[k,0]));answers.forEach((v,i)=>counts[cases[i].o[v.a][0]]++);const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);const dominant=sorted.filter(x=>x[1]===sorted[0][1]).map(x=>x[0]);game.innerHTML=`<div class="music" style="margin-top:20px">🎵 🎶</div><h2>Mes préférences d’exploration</h2><p><strong>${dominant.length>1?'Intentions les plus choisies':'Intention la plus choisie'} : ${dominant.join(' · ')}</strong></p><div class="result">${sorted.map(([k,n])=>`<div><strong>${k}</strong> · ${n}/5<div class="bar"><i style="width:${n*20}%"></i></div></div>`).join('')}</div><p class="note">Ces cinq choix illustrent vos préférences dans ce jeu.</p><div class="feedback"><h2>Devenir un explorateur curieux</h2><p>Avec la pratique, le questionnement devient un réflexe d’explorateur curieux.</p><p><strong>Même ouverte, une question suggère une direction.</strong></p><p>En ETP comme en hypnose et en communication thérapeutique, les mots orientent l’attention.</p></div><button class="next" id="restart">Rejouer le 45 tours ↻</button>`;document.querySelector('#restart').onclick=()=>{index=0;answers=[];a=b=-1;confirmed=false;render();window.scrollTo(0,0)}}render();
</script></body></html>
