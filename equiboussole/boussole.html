<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Boussole des Résonances</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#f6f3ed;
  --surface:#fff;
  --ink:#0f1c2a;
  --ink-mid:#25394d;
  --ink-soft:#5d7082;
  --gold:#aa823a;

  --nord:#2e5f85;
  --est:#337560;
  --sud:#a65424;
  --ouest:#55448c;

  --shadow:0 8px 24px rgba(15,28,42,.08);
}

html,
body{
  width:100%;
  height:100%;
  background:var(--bg);
  overflow:hidden;
}

body{
  font-family:'Jost',sans-serif;
  color:var(--ink);
  max-width:430px;
  margin:0 auto;
  position:relative;
  touch-action:none;
  transform-origin:center center;
}

/* screens */

.screen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
  background:var(--bg);
}

.screen.active{
  opacity:1;
  pointer-events:auto;
}

/* home */

.home-header{
  padding:16px 18px 0;
  text-align:center;
}

.eyebrow{
  font-size:9px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--ink-soft);
  font-weight:600;
  margin-bottom:6px;
}

.title{
  font-family:'Cormorant Garamond',serif;
  font-size:30px;
  line-height:1.05;
  font-weight:600;
}

.title em{
  font-style:italic;
  font-weight:400;
}

.subtitle{
  margin-top:8px;
  font-size:11px;
  line-height:1.45;
  color:var(--ink-soft);
}

.home-banner{
  width:calc(100% - 36px);
  height:86px;
  margin:12px auto 0;
  border-radius:18px;
  overflow:hidden;
  background:rgba(255,255,255,.65);
  box-shadow:var(--shadow);
}

.home-banner img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

/* compass */

.compass-wrap{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:4px 6px;
}

.compass-box{
  width:100%;
  max-width:410px;
  aspect-ratio:320 / 340;
}

svg{
  width:100%;
  height:100%;
  display:block;
}

.tap-label{
  cursor:pointer;
}

.tap-label text{
  paint-order:stroke fill;
  stroke:var(--bg);
  stroke-width:5px;
  stroke-linejoin:round;
}

.axis-title{
  font-size:10px;
  font-weight:700;
}

.axis-sub{
  font-family:'Cormorant Garamond',serif;
  font-size:14px;
  font-style:italic;
  font-weight:500;
}

.ring-label{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-weight:600;
  fill:var(--ink);
  paint-order:stroke fill;
  stroke:#fff;
  stroke-width:2px;
}

.core-label{
  font-weight:700;
  fill:var(--ink);
  paint-order:stroke fill;
  stroke:#fff;
  stroke-width:2px;
}

@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:.72}
}

@keyframes breathe{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.04)}
}

.ring-tech{animation:pulse 6s ease-in-out infinite}
.ring-morph{animation:pulse 5s ease-in-out infinite .6s}
.ring-semi{animation:pulse 4s ease-in-out infinite 1s}
.core-breathe{
  transform-origin:center;
  animation:breathe 3s ease-in-out infinite;
}

/* credits */

.credits{
  text-align:center;
  font-size:9px;
  line-height:1.5;
  color:var(--ink-mid);
  padding:4px 16px 78px;
}

.credits a{
  color:var(--gold);
  text-decoration:none;
}

/* detail */

.detail-header{
  padding:18px 16px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid rgba(15,28,42,.08);
}

.back-btn{
  width:38px;
  height:38px;
  border:none;
  border-radius:50%;
  background:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
  font-size:18px;
}

.detail-title{
  flex:1;
}

.detail-cardinal{
  font-size:9px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--ink-soft);
  font-weight:600;
}

.detail-name{
  font-family:'Cormorant Garamond',serif;
  font-size:30px;
  line-height:1.05;
}

.detail-bar{
  width:5px;
  height:44px;
  border-radius:99px;
}

.scroll{
  flex:1;
  overflow-y:auto;
  padding:0 16px 96px;
  -webkit-overflow-scrolling:touch;
}

.scroll::-webkit-scrollbar{
  display:none;
}

.section{
  margin-top:22px;
}

.section-head{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  font-size:9px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--ink-soft);
  font-weight:600;
}

.section-head::after{
  content:'';
  flex:1;
  height:1px;
  background:rgba(15,28,42,.08);
}

.desc-text{
  font-family:'Cormorant Garamond',serif;
  font-size:20px;
  line-height:1.5;
  font-style:italic;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.chip{
  padding:7px 12px;
  border-radius:999px;
  background:#fff;
  border:1px solid rgba(15,28,42,.1);
  font-size:12px;
}

.question{
  padding:13px 14px;
  border-left:4px solid var(--gold);
  border-radius:13px;
  background:rgba(255,255,255,.82);
  font-family:'Cormorant Garamond',serif;
  font-size:18px;
  font-style:italic;
  line-height:1.4;
  margin-bottom:8px;
}

.text-block{
  background:rgba(255,255,255,.82);
  border-radius:15px;
  padding:16px;
  border:1px solid rgba(15,28,42,.08);
  font-size:14px;
  line-height:1.65;
  color:var(--ink-mid);
}

/* couches */

.couche-header{
  padding:18px 16px 14px;
  border-bottom:1px solid rgba(15,28,42,.08);
}

.theory-card,
.couche-card{
  background:rgba(255,255,255,.84);
  border:1px solid rgba(15,28,42,.08);
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow);
  margin-top:16px;
}

.theory-card p{
  font-size:13px;
  line-height:1.7;
  color:var(--ink-mid);
}

.couche-title{
  font-family:'Cormorant Garamond',serif;
  font-size:26px;
  margin-bottom:8px;
}

.couche-label{
  font-size:9px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--ink-soft);
  font-weight:700;
  margin-bottom:4px;
}

/* nav */

.global-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:430px;
  display:flex;
  background:rgba(246,243,237,.96);
  backdrop-filter:blur(14px);
  border-top:1px solid rgba(15,28,42,.08);
  padding:8px 0 16px;
  z-index:50;
}

.nav-btn{
  flex:1;
  border:none;
  background:none;
  color:var(--ink-soft);
  opacity:.55;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}

.nav-btn.active{
  opacity:1;
  color:var(--ink);
}

.nav-icon{
  font-size:18px;
}

.nav-label{
  font-size:8px;
  letter-spacing:.1em;
  text-transform:uppercase;
  font-weight:700;
}

@media(max-height:700px){
  .home-banner{display:none}
  .title{font-size:26px}
}
</style>
</head>
