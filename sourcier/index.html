<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#061923"><title>Silent Bubble</title>
<style>
:root{--ink:#061923;--cream:#f4f2df;--mint:#76e4ad;--red:#ef6b67}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--cream);font-family:Inter,Avenir,system-ui,sans-serif;touch-action:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.screen{position:fixed;z-index:5;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;background:radial-gradient(circle at 50% 42%,#17465a,#071b29 68%);transition:.45s}.hidden{opacity:0;visibility:hidden;pointer-events:none}.eyebrow{color:#9bcbbb;font-size:10px;letter-spacing:.3em}.title{margin:10px 0 42px;font-size:clamp(38px,12vw,70px);font-weight:350;line-height:.94;letter-spacing:.13em}.choices{display:grid;gap:14px;width:min(340px,90vw)}button{min-height:62px;border:1px solid #ffffff20;border-radius:999px;background:#ffffff0d;color:var(--cream);font:750 12px/1 system-ui;letter-spacing:.22em;cursor:pointer}button:first-child{background:linear-gradient(135deg,#8de8bd,#62cda8);color:#08251e}.copy{max-width:340px;color:#c5d3d2;line-height:1.7}.om{margin:10px;font-size:clamp(32px,10vw,54px);font-weight:300;color:#a7f4cb}.preview{width:min(300px,80vw);height:140px;object-fit:cover;border-radius:28px;opacity:.32;transform:scaleX(-1);margin:12px}.status{min-height:48px;color:#b7d7cc;font-size:13px;line-height:1.7}.fallback{margin-top:14px;background:#ffffff0d!important;color:var(--cream)!important}.hud{position:fixed;z-index:3;top:max(22px,env(safe-area-inset-top));left:22px;right:22px;display:flex;justify-content:space-between;pointer-events:none;font-size:11px;font-weight:800;letter-spacing:.22em;text-shadow:0 2px 12px #000}.hud .count{color:#9cf2bd;font-size:14px;letter-spacing:.08em}.lift{position:fixed;z-index:3;left:50%;bottom:max(24px,env(safe-area-inset-bottom));width:90px;height:3px;transform:translateX(-50%);background:#ffff </style></head><body>
<canvas id="world" aria-label="Silent Bubble, couloir du silence"></canvas><audio id="city" src="audio/urbain.mp3" loop preload="auto"></audio>
<main id="menu" class="screen"><p class="eyebrow">UNE BULLE · UN SOUFFLE</p><h1 class="title">SILENT<br>BUBBLE</h1><div class="choices"><button id="touchChoice">TOUCHER</button><button id="voiceChoice">OMMM</button></div></main>
<section id="intro" class="screen hidden"><p class="copy">Ouvrez doucement la bouche<br>et faites :</p><div class="om">Ommmm…</div><p class="copy">Votre voix porte la bulle.</p><button id="prepareVoice">CONTINUER</button><button class="fallback">CONTINUER EN TACTILE</button></section>
<section id="calibration" class="screen hidden"><p class="eyebrow">CALIBRATION DOUCE</p><video id="camera" class="preview" playsinline muted></video><p id="calibrationText" class="status">Regardez naturellement l’écran<br><b>3</b></p><button class="fallback">CONTINUER EN TACTILE</button></section>
<div id="hud" class="hud hidden"><span id="mood">SILENCE</span><span class="count">● <b id="score">0</b></span></div><div id="lift" class="lift"><i></i></div><pre id="debug" class="debug hidden"></pre>
<script src="game-feel.js"></script><script src="bubble-physics.js"></script><script>
(()=>{"use strict";
const GAME_FEEL=SilentBubbleGameFeel,DEBUG_GAME_FEEL=false,$=id=>document.getElementById(id),canvas=$("world"),ctx=canvas.getContext("2d"),menu=$("menu"),intro=$("intro"),calibration=$("calibration"),camera=$("camera"),hud=$("hud"),mood=$("mood"),scoreEl=$("score"),liftEl=$("lift"),debug=$("debug"),city=$("city");
let W=0,H=0,DPR=1,running=false,mode="touch",holding=false,liftInput=0,targetLift=0,worldX=0,last=performance.now(),startedAt=0,noiseLeft=0,impactCooldown=0,collisionState="none",score=0,objects=[],nextGreen=260,nextRed=520,stream=null,audioContext=null,analyser=null,audioData=null,faceLandmarker=null,lastFaceAt=0,mouthRatio=0,mouthOpen=false,faceConfidence=0,rawRms=0,voiceLevel=0,noiseFloor=GAME_FEEL.voiceFloor,mouthOpenThreshold=GAME_FEEL.mouthOpenThreshold,mouthCloseThreshold=GAME_FEEL.mouthCloseThreshold,calibrating=false,calibrationSamples=[],audioSamples=[];
const bubble={...SilentBubblePhysics.createState(),x:0,r:27};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),smooth=(a,b,rate,dt)=>a+(b-a)*(1-Math.exp(-rate*dt));
function corridorAt(x){const q=(x+worldX)*.0024,center=H*.5+Math.sin(q*.72)*H*.12+Math.sin(q*.27+1.8)*H*.07,half=clamp(H*(.30+Math.sin(q*.38+2)*.035+Math.sin(q*.16)*.025),GAME_FEEL.corridorMinHalf,Math.min(GAME_FEEL.corridorMaxHalf,H*.39));return{top:center-half,bottom:center+half,center,half};}
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);bubble.x=W*.28;if(!running)bubble.y=H*.5;}addEventListener("resize",resize);
function setScreen(show){[menu,intro,calibration].forEach(el=>el.classList.toggle("hidden",el!==show));}
function startTouch(){stopMedia();mode="touch";startGame();}
function startGame(){setScreen(null);hud.classList.remove("hidden");running=true;holding=false;liftInput=0;worldX=0;score=0;objects.length=0;nextGreen=220;nextRed=480;noiseLeft=0;bubble.y=H*.5;bubble.vy=0;startedAt=performance.now();liftEl.classList.add("show");setTimeout(()=>liftEl.classList.remove("show"),6500);last=performance.now();}
function spawn(type){const x=W+50,c=corridorAt(x),r=type==="green"?9:14,minY=c.top+r+GAME_FEEL.objectSafetyMargin,maxY=c.bottom-r-GAME_FEEL.objectSafetyMargin;if(maxY<=minY)return;objects.push({type,x,y:minY+Math.random()*(maxY-minY),r,dead:false,pulse:0});}
function triggerNoise(){if(impactCooldown>0)return;noiseLeft=GAME_FEEL.noiseDuration;impactCooldown=GAME_FEEL.impactCooldown;navigator.vibrate?.(16);city.volume=.001;city.play().catch(()=>{});}
function updateAudio(){if(!analyser)return;analyser.getFloatTimeDomainData(audioData);let sum=0,zero=0;for(let i=0;i<audioData.length;i++){sum+=audioData[i]*audioData[i];if(i&&audioData[i-1]*audioData[i]<0)zero++;}rawRms=Math.sqrt(sum/audioData.length);const tonal=zero/audioData.length<.16;voiceLevel=smooth(voiceLevel,rawRms,GAME_FEEL.voiceSmoothing,1/60);if(calibrating)audioSamples.push(rawRms);else if(!mouthOpen)noiseFloor=smooth(noiseFloor,Math.min(rawRms,GAME_FEEL.voiceFloor*3),.25,1/60);const active=mouthOpen&&faceConfidence>=GAME_FEEL.faceConfidenceThreshold&&tonal&&voiceLevel>noiseFloor*1.3;const normalized=clamp((voiceLevel-noiseFloor)/(GAME_FEEL.voiceCeiling-noiseFloor),0,1);targetLift=active?GAME_FEEL.minVoiceLift+(1-GAME_FEEL.minVoiceLift)*Math.sqrt(clamp(normalized*GAME_FEEL.voiceGain,0,1)):0;}
async function startVoice(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error("Médias indisponibles");stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:480}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});camera.srcObject=stream;await camera.play();audioContext=new (window.AudioContext||window.webkitAudioContext)();analyser=audioContext.createAnalyser();analyser.fftSize=512;audioData=new Float32Array(analyser.fftSize);audioContext.createMediaStreamSource(stream).connect(analyser);calibrationText.innerHTML="Chargement du visage…";const vision=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm"),files=await vision.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");faceLandmarker=await vision.FaceLandmarker.createFromOptions(files,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:"GPU"},runningMode:"VIDEO",numFaces:1,minFaceDetectionConfidence:.5,minFacePresenceConfidence:.5,minTrackingConfidence:.5});beginCalibration();}catch(e){console.warn(e);calibrationText.innerHTML="Caméra, micro ou reconnaissance indisponible.<br>Vous pouvez continuer en tactile.";}}
function trackFace(now){if(!faceLandmarker||camera.readyState<2||now-lastFaceAt<66)return;lastFaceAt=now;const result=faceLandmarker.detectForVideo(camera,now),face=result.faceLandmarks?.[0];faceConfidence=face?1:0;if(!face)return;const width=Math.hypot(face[291].x-face[61].x,face[291].y-face[61].y),open=Math.hypot(face[13].x-face[14].x,face[13].y-face[14].y);mouthRatio=smooth(mouthRatio,width?open/width:0,GAME_FEEL.mouthSmoothing,.066);if(calibrating)calibrationSamples.push(mouthRatio);else if(mouthOpen?mouthRatio<mouthCloseThreshold:mouthRatio>mouthOpenThreshold)mouthOpen=!mouthOpen;}
function beginCalibration(){calibrating=true;calibrationSamples.length=0;audioSamples.length=0;const start=performance.now(),tick=()=>{const left=Math.ceil(3-(performance.now()-start)/1000);calibrationText.innerHTML=left>0?`Regardez naturellement l’écran<br><b>${left}</b>`:"Prêt";if(left>0)setTimeout(tick,120);else{const mouthBase=calibrationSamples.length?calibrationSamples.reduce((a,b)=>a+b,0)/calibrationSamples.length:.035,noiseBase=audioSamples.length?audioSamples.reduce((a,b)=>a+b,0)/audioSamples.length:GAME_FEEL.voiceFloor;mouthOpenThreshold=Math.max(GAME_FEEL.mouthOpenThreshold,mouthBase*1.75);mouthCloseThreshold=Math.max(.04,mouthBase*1.35);noiseFloor=Math.max(GAME_FEEL.voiceFloor,noiseBase*1.35);calibrating=false;setTimeout(()=>{mode="voice";startGame()},500);}};tick();}
function stopMedia(){stream?.getTracks().forEach(t=>t.stop());stream=null;faceLandmarker?.close?.();faceLandmarker=null;audioContext?.close?.();audioContext=null;analyser=null;camera.srcObject=null;}
function update(dt,now){worldX+=GAME_FEEL.worldSpeed*dt;impactCooldown=Math.max(0,impactCooldown-dt);if(mode==="touch")targetLift=holding?1:0;else updateAudio();liftInput=smooth(liftInput,targetLift,targetLift>liftInput?GAME_FEEL.liftAttack:GAME_FEEL.liftRelease,dt);SilentBubblePhysics.step(bubble,liftInput,dt,GAME_FEEL);const c=corridorAt(bubble.x),top=c.top+bubble.r,bottom=c.bottom-bubble.r;if(bubble.y<top){bubble.y=top;if(collisionState!=="top")triggerNoise();collisionState="top";SilentBubblePhysics.collide(bubble,1,GAME_FEEL);}else if(bubble.y>bottom){bubble.y=bottom;if(collisionState!=="bottom")triggerNoise();collisionState="bottom";SilentBubblePhysics.collide(bubble,-1,GAME_FEEL);}else if(bubble.y>top+5&&bubble.y<bottom-5)collisionState="none";
nextGreen-=GAME_FEEL.worldSpeed*dt;nextRed-=GAME_FEEL.worldSpeed*dt;if(nextGreen<0){spawn("green");nextGreen=GAME_FEEL.greenSpawnRate*(.75+Math.random()*.7);}if(nextRed<0){spawn("red");nextRed=GAME_FEEL.redSpawnRate*(.8+Math.random()*.65);}for(const o of objects){o.x-=GAME_FEEL.worldSpeed*dt;o.pulse=Math.max(0,o.pulse-dt);if(!o.dead&&Math.hypot(o.x-bubble.x,o.y-bubble.y)<o.r+bubble.r){o.dead=true;if(o.type==="green"){score++;scoreEl.textContent=score;o.pulse=.3;}else{triggerNoise();bubble.vy+=bubble.y<o.y?-10:10;}}}while(objects.length&&objects[0].x<-60)objects.shift();noiseLeft=Math.max(0,noiseLeft-dt);mood.textContent=noiseLeft?"VACARME":"SILENCE";mood.classList.toggle("noise",noiseLeft>0);const volume=noiseLeft?Math.min(1,(GAME_FEEL.noiseDuration-noiseLeft)*5,noiseLeft)*.55:0;city.volume=smooth(city.volume,volume,noiseLeft?10:2,dt);if(!noiseLeft&&city.volume<.005)city.pause();liftEl.firstElementChild.style.width=`${liftInput*100}%`;}
function draw(now){ctx.setTransform(DPR,0,0,DPR,0,0);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#081d2a");bg.addColorStop(1,"#123a46");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);const top=[],bottom=[];for(let x=-12;x<=W+12;x+=12){const c=corridorAt(x);top.push([x,c.top]);bottom.push([x,c.bottom]);}const red=noiseLeft?clamp(noiseLeft/.45,0,1):0;ctx.fillStyle=`rgb(${43+red*45},${35-red*5},${54-red*5})`;ctx.beginPath();ctx.moveTo(0,0);for(const p of top)ctx.lineTo(...p);ctx.lineTo(W,0);ctx.fill();ctx.beginPath();ctx.moveTo(0,H);for(const p of bottom)ctx.lineTo(...p);ctx.lineTo(W,H);ctx.fill();ctx.strokeStyle=noiseLeft?"rgba(244,103,96,.65)":"rgba(133,232,194,.32)";ctx.lineWidth=2;for(const edge of [top,bottom]){ctx.beginPath();edge.forEach((p,i)=>ctx[i?"lineTo":"moveTo"](...p));ctx.stroke();}
for(const o of objects){if(o.dead)continue;ctx.save();ctx.translate(o.x,o.y);ctx.shadowColor=o.type==="green"?"#5ff0a0":"#ff5555";ctx.shadowBlur=15;ctx.fillStyle=o.type==="green"?"#77eaa9":"#ef5f5e";ctx.globalAlpha=.95;ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#ffffff88";ctx.lineWidth=1;ctx.stroke();ctx.restore();}
const audioGlow=mode==="voice"?clamp(voiceLevel*GAME_FEEL.voiceGain*8,0,1):liftInput*.25,wobble=Math.sin(now*.012)*audioGlow*GAME_FEEL.membraneResponse;ctx.save();ctx.translate(bubble.x,bubble.y);ctx.scale(bubble.scaleX-wobble,bubble.scaleY+wobble);ctx.shadowColor=noiseLeft?"#ec7177":"#64d9ff";ctx.shadowBlur=24+audioGlow*13;const g=ctx.createRadialGradient(-9,-10,1,0,0,bubble.r);g.addColorStop(0,"#f4ffff");g.addColorStop(.25,`hsl(${190+audioGlow*45} 85% 71%)`);g.addColorStop(.66,"#347be6");g.addColorStop(1,noiseLeft?"#7c326e":"#17368d");ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,bubble.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#d8ffff99";ctx.lineWidth=1;ctx.stroke();ctx.restore();if(DEBUG_GAME_FEEL){debug.classList.remove("hidden");debug.textContent=`FPS ${(1/Math.max(.001,(performance.now()-last)/1000)).toFixed(0)}\nliftInput ${liftInput.toFixed(2)}\nstate ${mode==="touch"?(holding?"holding":"released"):(mouthOpen?"ommm":"silent")}\nmouthRatio ${mouthRatio.toFixed(3)}\nmouth ${mouthOpen?"open":"closed"}\nface confidence ${faceConfidence.toFixed(2)}\nraw RMS ${rawRms.toFixed(4)}\nfiltered audio ${voiceLevel.toFixed(4)}\nnoise floor ${noiseFloor.toFixed(4)}\nbubble vy ${bubble.vy.toFixed(1)}\ncollision ${collisionState}`;}}
function frame(now){const dt=Math.min(.034,(now-last)/1000||.016);last=now;if(mode==="voice"&&(calibrating||running))trackFace(now);if(running)update(dt,now);draw(now);requestAnimationFrame(frame);}canvas.addEventListener("pointerdown",e=>{if(!running||mode!=="touch")return;holding=true;canvas.setPointerCapture(e.pointerId);});const release=e=>{if(mode!=="touch")return;holding=false;if(canvas.hasPointerCapture?.(e.pointerId))canvas.releasePointerCapture(e.pointerId);};canvas.addEventListener("pointerup",release);canvas.addEventListener("pointercancel",release);$("touchChoice").onclick=startTouch;$("voiceChoice").onclick=()=>setScreen(intro);$("prepareVoice").onclick=()=>{setScreen(calibration);startVoice();};document.querySelectorAll(".fallback").forEach(b=>b.onclick=startTouch);addEventListener("pagehide",stopMedia);resize();requestAnimationFrame(frame);
})();</script></body></html>
