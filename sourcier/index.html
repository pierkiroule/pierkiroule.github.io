<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>SILENT — La voie du silence</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #02050e; touch-action: none; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .screen { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; color: #f5fbff; text-align: center; background: radial-gradient(circle at 50% 44%, rgba(36,154,255,.1), transparent 30%), rgba(2,5,14,.91); backdrop-filter: blur(14px); transition: opacity .65s ease, visibility .65s ease; }
    .screen.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .brand { margin: 0; font-size: min(15vw, 72px); font-weight: 100; letter-spacing: .16em; text-indent: .16em; text-shadow: 0 0 42px rgba(75,200,255,.24); }
    .subtitle { margin-top: 13px; font-size: 8px; letter-spacing: .52em; text-indent: .52em; opacity: .48; }
    .copy { margin: 48px 0 38px; font-size: 13px; line-height: 1.9; font-weight: 300; letter-spacing: .04em; opacity: .68; }
    button { appearance: none; border: 1px solid rgba(150,225,255,.3); border-radius: 999px; padding: 16px 34px; background: rgba(80,190,255,.06); color: #fff; font-size: 9px; letter-spacing: .32em; cursor: pointer; transition: .25s ease; }
    button:hover { background: rgba(80,190,255,.13); border-color: rgba(180,235,255,.58); transform: translateY(-2px); }
    button:focus-visible { outline: 2px solid #86eaff; outline-offset: 4px; }
    #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; color: white; opacity: 0; transition: opacity .4s; }
    #hud.show { opacity: 1; }
    #score { position: absolute; top: max(22px, env(safe-area-inset-top)); left: max(22px, env(safe-area-inset-left)); font-size: 9px; letter-spacing: .3em; opacity: .58; font-variant-numeric: tabular-nums; }
    #score strong { margin-left: 8px; color: #b8f5ff; font-size: 14px; font-weight: 300; }
    #combo { position: absolute; top: max(50px, calc(env(safe-area-inset-top) + 28px)); left: max(22px, env(safe-area-inset-left)); color: #70dcff; font-size: 10px; letter-spacing: .2em; opacity: 0; transform: translateY(5px); transition: .2s; }
    #combo.show { opacity: .85; transform: none; }
    #timer { position: absolute; top: max(22px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-size: 9px; letter-spacing: .24em; font-variant-numeric: tabular-nums; opacity: .38; }
    #energy { position: absolute; top: max(23px, env(safe-area-inset-top)); right: max(22px, env(safe-area-inset-right)); display: flex; gap: 6px; }
    #energy i { display: block; width: 5px; height: 5px; border-radius: 50%; background: #ff7180; box-shadow: 0 0 8px #ff4058; transition: .3s; }
    #energy i.off { background: rgba(255,255,255,.1); box-shadow: none; }
    #gesture { position: absolute; left: 50%; bottom: max(30px, env(safe-area-inset-bottom)); transform: translateX(-50%); white-space: nowrap; font-size: 8px; letter-spacing: .3em; opacity: 0; transition: opacity .5s; }
    #gesture.show { opacity: .46; }
    #finalScreen .label { font-size: 8px; letter-spacing: .42em; opacity: .45; }
    #finalScore { margin: 16px 0 38px; font-size: 72px; font-weight: 100; color: #c9f8ff; text-shadow: 0 0 35px rgba(60,210,255,.45); }
    #bestCombo { margin: 12px 0 44px; font-size: 30px; font-weight: 200; color: #7fe5ff; }
    @media (prefers-reduced-motion: reduce) { .screen, #combo { transition-duration: .01ms; } }
  </style>
</head>
<body>
  <canvas id="game" aria-label="SILENT, guidez le papillon sur les courants de silence"></canvas>
  <div id="hud" aria-live="polite">
    <div id="score">SILENCE <strong>0</strong></div>
    <div id="combo">x2</div>
    <div id="timer">60</div>
    <div id="energy" aria-label="Énergie"><i></i><i></i><i></i></div>
    <div id="gesture">GLISSEZ · SUIVEZ LE BLEU · ÉVITEZ LE ROUGE</div>
  </div>
  <main id="startScreen" class="screen">
    <h1 class="brand">SILENT</h1>
    <div class="subtitle">LA VOIE DU SILENCE</div>
    <div class="copy">Glissez dans les nappes de silence.<br>Évitez les nappes du vacarme.</div>
    <button id="startBtn" type="button">JOUER</button>
  </main>
  <section id="finalScreen" class="screen hide">
    <div class="label">SILENCE RECUEILLI</div>
    <div id="finalScore">0</div>
    <div class="label">MEILLEURE SÉRIE</div>
    <div id="bestCombo">x1</div>
    <button id="replayBtn" type="button">REJOUER</button>
  </section>
  <script>
  (() => {
    "use strict";

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d", { alpha: false });
    const startScreen = document.getElementById("startScreen");
    const finalScreen = document.getElementById("finalScreen");
    const hud = document.getElementById("hud");
    const scoreNode = document.querySelector("#score strong");
    const comboNode = document.getElementById("combo");
    const timerNode = document.getElementById("timer");
    const gesture = document.getElementById("gesture");
    const energyDots = [...document.querySelectorAll("#energy i")];
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    let W = innerWidth, H = innerHeight, running = false, ending = false, previous = 0, elapsed = 0;
    let score = 0, combo = 1, comboRun = 0, bestCombo = 1, energy = 3;
    let spawnClock = 0, shake = 0, cyanBloom = 0, redFlash = 0, hitStop = 0, hitCooldown = 0;
    let objects = [], particles = [], waves = [], stars = [];
    const pointer = { down: false, x: W * .5 };
    const ship = { x: W * .5, targetX: W * .5, vx: 0, y: H * .79, tilt: 0, squash: 0 };

    // Reserved for a later optional sound layer. Gameplay never depends on it.
    const audio = { enabled: false, update() {}, collect() {}, hit() {} };

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ship.y = H * .79; ship.x = ship.targetX = clamp(ship.x, 24, W - 24);
      stars = Array.from({ length: Math.min(120, Math.floor(W * H / 6500)) }, () => ({ x: Math.random() * W, y: Math.random() * H, z: .2 + Math.random() * .8, size: .3 + Math.random() }));
    }
    function resetGame() {
      elapsed = score = comboRun = 0; combo = bestCombo = 1; energy = 3;
      spawnClock = .55; shake = cyanBloom = redFlash = hitStop = hitCooldown = 0;
      objects = []; particles = []; waves = [];
      ship.x = ship.targetX = W * .5; ship.vx = ship.tilt = ship.squash = 0;
      scoreNode.textContent = "0"; comboNode.classList.remove("show"); timerNode.textContent = "60";
      energyDots.forEach(dot => dot.classList.remove("off"));
    }
    function spawn(type, x, y, scale = 1, delay = 0) {
      const bad = type === "noise";
      objects.push({ type, x, y: y - delay, baseX: x, radius: (bad ? 29 : 34) * scale * (.85 + Math.random() * .3), length: (bad ? 125 : 155) * scale * (.85 + Math.random() * .3),
        vy: 0, phase: Math.random() * 10, behavior: bad ? Math.floor(Math.random() * (elapsed > 35 ? 4 : elapsed > 15 ? 3 : 2)) : Math.floor(Math.random() * 3),
        variant: Math.floor(Math.random() * 4), dead: false, collected: false, absorb: 0 });
    }
    function spawnPattern() {
      const progress = elapsed / 60, margin = 35, lane = margin + Math.random() * (W - margin * 2);
      const noiseChance = .15 + progress * .27;
      if (elapsed > 9 && Math.random() < .28 + progress * .2) {
        const count = 2 + (Math.random() < progress * .65 ? 1 : 0), gap = Math.min(62, W / 5);
        const start = clamp(lane - (count - 1) * gap * .5, margin, W - margin - (count - 1) * gap);
        for (let i = 0; i < count; i++) spawn(Math.random() < noiseChance ? "noise" : "silence", start + i * gap, -30, .8 + Math.random() * .25, i * 25);
      } else {
        spawn(Math.random() < noiseChance ? "noise" : "silence", lane, -30, 1, 0);
      }
      if (elapsed > 22 && W > 250 && Math.random() < .18) {
        const safeLeft = Math.random() < .5;
        const dangerCenter = W * (safeLeft ? .72 : .28);
        for (let i = -1; i <= 1; i++) spawn("noise", dangerCenter + i * Math.min(35, W * .1), -90, .82, (i + 1) * 12);
        spawn("silence", W * (safeLeft ? .2 : .8), -105, 1.15);
      }
    }
    function burst(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2, speed = 35 + Math.random() * 105;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: .45 + Math.random() * .35, max: .8, color, size: .7 + Math.random() * 2 });
      }
    }
    function collect(object) {
      if (object.collected) return;
      object.collected = true; comboRun++; combo = Math.min(4, 1 + Math.floor(comboRun / 4)); bestCombo = Math.max(bestCombo, combo);
      score += combo; cyanBloom = Math.min(1, cyanBloom + .34); hitStop = .025;
      waves.push({ x: ship.x, y: ship.y, radius: 8, life: 1, color: "90,225,255" });
      burst(ship.x, ship.y - 5, "105,225,255", 9); ship.squash = -.22; audio.collect();
      scoreNode.textContent = String(score); comboNode.textContent = `x${combo}`; comboNode.classList.toggle("show", combo > 1);
    }
    function collideNoise(object) {
      if (hitCooldown > 0) { object.dead = true; return; }
      object.dead = true; combo = 1; comboRun = 0; energy = Math.max(0, energy - 1); shake = 1; redFlash = .7; ship.squash = .34;
      hitCooldown = .7;
      waves.push({ x: ship.x, y: ship.y, radius: 7, life: .75, color: "255,80,105" });
      burst(ship.x, ship.y, "255,85,105", 8); energyDots.forEach((dot, i) => dot.classList.toggle("off", i >= energy));
      comboNode.classList.remove("show"); audio.hit();
      if (energy === 0) setTimeout(() => { energy = 3; energyDots.forEach(dot => dot.classList.remove("off")); }, 1400);
    }
    function update(dt) {
      if (hitStop > 0) { hitStop -= dt; return; }
      elapsed += dt; const progress = clamp(elapsed / 60, 0, 1), scroll = 105 + progress * 145;
      if (elapsed >= 60) { finish(); return; }
      timerNode.textContent = String(Math.ceil(60 - elapsed));
      spawnClock -= dt;
      if (spawnClock <= 0) { spawnPattern(); spawnClock = Math.max(.28, .82 - progress * .43) * (.82 + Math.random() * .38); }

      // Direct positional tracking gives touch input priority; retained velocity
      // provides a short, controlled surf-like glide when the finger lifts.
      if (pointer.down) {
        const oldX = ship.x;
        ship.x += (ship.targetX - ship.x) * (1 - Math.exp(-24 * dt));
        const measuredVelocity = (ship.x - oldX) / Math.max(dt, .001);
        ship.vx += (measuredVelocity - ship.vx) * (1 - Math.exp(-18 * dt));
      } else {
        ship.x += ship.vx * dt;
        ship.vx *= Math.exp(-9 * dt);
      }
      ship.x = clamp(ship.x, 20, W - 20);
      ship.tilt += (clamp(ship.vx / 360, -.52, .52) - ship.tilt) * (1 - Math.exp(-12 * dt));
      ship.squash *= Math.exp(-12 * dt); cyanBloom *= Math.exp(-2.8 * dt); redFlash *= Math.exp(-8 * dt); shake *= Math.exp(-15 * dt);
      hitCooldown = Math.max(0, hitCooldown - dt);

      for (const object of objects) {
        object.phase += dt; object.vy += (scroll - object.vy) * (1 - Math.exp(-4 * dt)); object.y += object.vy * dt;
        const drift = object.type === "noise" ? 1 : .55;
        if (object.behavior === 1) object.x = object.baseX + Math.sin(object.phase * 1.35) * (18 + progress * 20) * drift;
        if (object.behavior === 2) object.x = object.baseX + Math.sin(object.phase * 2.15) * (12 + progress * 16) * drift;
        if (object.behavior === 3) object.x += Math.sin(object.phase * 3.4) * 34 * dt;
        const dx = ship.x - object.x, dy = ship.y - object.y, distance = Math.hypot(dx, dy);
        if (object.type === "silence" && !object.collected && distance < 72 && distance > 1) {
          const pull = (1 - distance / 72) * 460; object.x += dx / distance * pull * dt; object.y += dy / distance * pull * dt; object.absorb = 1 - distance / 72;
        }
        const ribbonDistance = Math.abs(dy) < object.length * .5 + 10 ? Math.abs(dx) : distance;
        if (!object.collected && ribbonDistance < object.radius + 11 && Math.abs(dy) < object.length * .5 + 10) object.type === "silence" ? collect(object) : collideNoise(object);
      }
      objects = objects.filter(object => !object.dead && object.y < H + 70);
      for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.exp(-2 * dt); p.vy *= Math.exp(-2 * dt); p.life -= dt; }
      particles = particles.filter(p => p.life > 0);
      for (const wave of waves) { wave.radius += 150 * dt; wave.life -= 1.35 * dt; }
      waves = waves.filter(w => w.life > 0); audio.update(dt);
      for (const star of stars) { star.y += scroll * star.z * .12 * dt; if (star.y > H) { star.y = 0; star.x = Math.random() * W; } }
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, H);
      gradient.addColorStop(0, `rgb(${3 + cyanBloom * 3},${7 + cyanBloom * 8},${19 + cyanBloom * 13})`);
      gradient.addColorStop(1, "#01030a"); ctx.fillStyle = gradient; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = "screen";
      for (const star of stars) { ctx.fillStyle = `rgba(100,175,220,${.035 + star.z * .07})`; ctx.fillRect(star.x, star.y, star.size, star.size * 3); }
      ctx.globalCompositeOperation = "source-over";
    }
    function drawObject(object) {
      const bad = object.type === "noise", hue = bad ? 352 : 193, segments = 24;
      const pulse = 1 + Math.sin(object.phase * (bad ? 7 : 2.2)) * (bad ? .07 : .035);
      const centerX = t => Math.sin(t * Math.PI * (bad ? 3.2 : 2.1) + object.phase * (bad ? 5.5 : 1.5)) * (bad ? 9 : 6);
      const edgeX = (t, side, inset = 0) => {
        const tapered = Math.sin(Math.PI * t) * object.radius * pulse;
        const livingEdge = Math.sin(t * Math.PI * (5 + object.variant) + object.phase * (bad ? 7 : 2.6) + side) * (bad ? 4 : 2.5);
        return centerX(t) + side * Math.max(2, tapered + livingEdge - inset);
      };
      ctx.save(); ctx.translate(object.x, object.y); ctx.globalCompositeOperation = "screen"; ctx.globalAlpha = object.collected ? .35 : 1;
      const wash = ctx.createLinearGradient(0, -object.length * .5, 0, object.length * .5);
      wash.addColorStop(0, `hsla(${hue},100%,70%,0)`); wash.addColorStop(.2, `hsla(${hue},100%,65%,${bad ? .13 : .1})`);
      wash.addColorStop(.55, `hsla(${hue},100%,72%,${bad ? .2 : .15})`); wash.addColorStop(1, `hsla(${hue},100%,60%,0)`);
      ctx.fillStyle = wash; ctx.shadowColor = `hsla(${hue},100%,60%,.35)`; ctx.shadowBlur = bad ? 18 : 24; ctx.beginPath();
      for (let i = 0; i <= segments; i++) { const t = i / segments, y = (t - .5) * object.length; ctx[i ? "lineTo" : "moveTo"](edgeX(t, -1), y); }
      for (let i = segments; i >= 0; i--) { const t = i / segments, y = (t - .5) * object.length; ctx.lineTo(edgeX(t, 1), y); }
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0; ctx.lineWidth = bad ? 1.1 : .75;
      for (const side of [-1, 1]) {
        ctx.strokeStyle = `hsla(${hue},100%,82%,${bad ? .38 : .25})`; ctx.beginPath();
        for (let i = 1; i < segments; i++) { const t = i / segments, y = (t - .5) * object.length; ctx[i > 1 ? "lineTo" : "moveTo"](edgeX(t, side), y); }
        ctx.stroke();
      }
      // Slow inner veins make the translucent mass feel alive without hard edges.
      for (let vein = -1; vein <= 1; vein++) {
        ctx.strokeStyle = `hsla(${hue},100%,85%,${bad ? .13 : .1})`; ctx.lineWidth = .6; ctx.beginPath();
        for (let i = 2; i < segments - 1; i++) { const t = i / segments, y = (t - .5) * object.length; ctx[i > 2 ? "lineTo" : "moveTo"](centerX(t) + vein * Math.sin(Math.PI * t) * object.radius * .42, y); }
        ctx.stroke();
      }
      ctx.restore();
    }
    function drawShip() {
      const flutter = Math.sin(elapsed * 12) * .16;
      ctx.save(); ctx.translate(ship.x, ship.y); ctx.rotate(ship.tilt * .55); ctx.scale(1 - ship.squash * .25, 1 + ship.squash * .35); ctx.globalCompositeOperation = "screen";
      const trail = ctx.createLinearGradient(0, 5, 0, 52); trail.addColorStop(0, "rgba(80,220,255,.45)"); trail.addColorStop(1, "rgba(45,100,255,0)");
      ctx.fillStyle = trail; ctx.beginPath(); ctx.moveTo(-3, 5); ctx.quadraticCurveTo(0, 48 + Math.abs(ship.vx) * .02, 3, 5); ctx.closePath(); ctx.fill();
      ctx.shadowColor = "#76e8ff"; ctx.shadowBlur = 20;
      for (const side of [-1, 1]) {
        ctx.save(); ctx.scale(side, 1); ctx.rotate(flutter);
        const wing = ctx.createRadialGradient(7, -5, 1, 9, -3, 15); wing.addColorStop(0, "rgba(245,255,255,.95)"); wing.addColorStop(.35, "rgba(105,228,255,.68)"); wing.addColorStop(1, "rgba(30,115,210,.08)");
        ctx.fillStyle = wing; ctx.strokeStyle = "rgba(150,240,255,.65)"; ctx.lineWidth = .8;
        ctx.beginPath(); ctx.moveTo(1, -7); ctx.bezierCurveTo(8, -20, 20, -16, 17, -5); ctx.bezierCurveTo(15, 5, 7, 10, 1, 4); ctx.closePath(); ctx.fill(); ctx.stroke();
        // The inner arc suggests an ear listening to the current.
        ctx.shadowBlur = 0; ctx.strokeStyle = "rgba(205,250,255,.42)"; ctx.beginPath(); ctx.arc(8, -4, 5, -.9, 1.45); ctx.stroke(); ctx.restore();
      }
      ctx.shadowBlur = 14; ctx.fillStyle = "rgba(230,253,255,.95)"; ctx.beginPath(); ctx.ellipse(0, 1, 2.4, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0; ctx.strokeStyle = "rgba(190,245,255,.75)"; ctx.beginPath(); ctx.moveTo(-1, -8); ctx.quadraticCurveTo(-5, -15, -8, -16); ctx.moveTo(1, -8); ctx.quadraticCurveTo(5, -15, 8, -16); ctx.stroke(); ctx.restore();
    }
    function render() {
      drawBackground(); const sx = (Math.random() - .5) * shake * 6, sy = (Math.random() - .5) * shake * 4;
      ctx.save(); ctx.translate(sx, sy); for (const object of objects) drawObject(object);
      ctx.globalCompositeOperation = "screen";
      for (const wave of waves) { ctx.strokeStyle = `rgba(${wave.color},${wave.life * .55})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(wave.x, wave.y, wave.radius, 0, Math.PI * 2); ctx.stroke(); }
      for (const p of particles) { ctx.fillStyle = `rgba(${p.color},${clamp(p.life / p.max, 0, 1)})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
      drawShip(); ctx.restore();
      if (redFlash > .01) { ctx.fillStyle = `rgba(255,25,60,${redFlash * .08})`; ctx.fillRect(0, 0, W, H); }
      const vignette = ctx.createRadialGradient(W * .5, H * .5, Math.min(W, H) * .2, W * .5, H * .5, Math.max(W, H) * .72);
      vignette.addColorStop(.45, "rgba(0,0,0,0)"); vignette.addColorStop(1, "rgba(0,0,8,.52)"); ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
    }
    function updateEnding(dt) {
      for (const p of particles) {
        const dx = W * .5 - p.x, dy = H * .5 - p.y;
        p.vx += dx * .42 * dt; p.vy += dy * .42 * dt;
        p.vx *= Math.exp(-1.1 * dt); p.vy *= Math.exp(-1.1 * dt);
        p.x += p.vx * dt; p.y += p.vy * dt; p.life = Math.max(.35, p.life - dt * .08);
      }
    }
    function frame(timestamp) {
      if (!previous) previous = timestamp; const dt = Math.min((timestamp - previous) / 1000, .033); previous = timestamp;
      if (running) update(dt); else if (ending) updateEnding(dt); render(); requestAnimationFrame(frame);
    }
    function finish() {
      running = false; ending = true; pointer.down = false; hud.classList.remove("show"); gesture.classList.remove("show");
      document.getElementById("finalScore").textContent = String(score); document.getElementById("bestCombo").textContent = `x${bestCombo}`;
      finalScreen.classList.remove("hide");
      for (let i = 0; i < Math.min(score, 80); i++) { const angle = Math.random() * Math.PI * 2, radius = Math.random() * Math.max(W, H) * .45; particles.push({ x: W * .5 + Math.cos(angle) * radius, y: H * .5 + Math.sin(angle) * radius, vx: -Math.cos(angle) * radius * .18, vy: -Math.sin(angle) * radius * .18, life: 5, max: 5, color: "90,220,255", size: 1 + Math.random() * 2 }); }
    }
    function begin() {
      resetGame(); running = true; ending = false; previous = performance.now(); startScreen.classList.add("hide"); finalScreen.classList.add("hide"); hud.classList.add("show"); gesture.classList.add("show");
      setTimeout(() => gesture.classList.remove("show"), 3200);
    }
    canvas.addEventListener("pointerdown", event => { if (!running) return; event.preventDefault(); pointer.down = true; pointer.x = ship.targetX = event.clientX; canvas.setPointerCapture?.(event.pointerId); }, { passive: false });
    canvas.addEventListener("pointermove", event => { if (!running || !pointer.down) return; event.preventDefault(); pointer.x = ship.targetX = event.clientX; }, { passive: false });
    const release = () => { pointer.down = false; };
    canvas.addEventListener("pointerup", release); canvas.addEventListener("pointercancel", release);
    addEventListener("resize", resize); addEventListener("pagehide", () => { running = false; });
    document.getElementById("startBtn").addEventListener("click", begin); document.getElementById("replayBtn").addEventListener("click", begin);
    resize(); resetGame(); render(); requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
