<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Collectif RÉSONANCE</title>
  <style>
    .bubble-voice {
    position: fixed;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    opacity: 0.8;
    background-image: url('https://raw.githubusercontent.com/pierkiroule/pierkiroule.github.io/refs/heads/master/Reso/39243998%20(1).jpeg');
    background-size: cover;
    background-position: center;
    box-shadow: 0 0 8px rgba(0,0,0,0.2);
    z-index: 999;
    cursor: pointer;
    transition: box-shadow 0.4s ease;
  }

  .bubble-voice:hover {
    box-shadow: 0 0 15px rgba(0, 100, 150, 0.4);
  }
    body {
      margin: 0;
      background: white;
      font-family: 'Helvetica Neue', sans-serif;
      overflow-x: hidden;
    }.title {
  text-align: center;
  font-size: clamp(2rem, 5vw, 3.5rem);
  margin-top: 40px;
  color: #4682B4;
  letter-spacing: 0.1em;
}

.intro {
  text-align: center;
  font-size: clamp(1rem, 2.5vw, 1.4rem);
  margin-top: 10px;
  color: #aac;
  padding: 0 1em;
}

.morse-container {
  position: absolute;
  top: 25vh;
  left: 50%;
  transform: translateX(-50%);
  width: max-content;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 2vw;
}

.morse-letter {
  margin: 40px 0;
  font-size: clamp(0.8rem, 2vw, 1rem);
  color: #bbb;
  cursor: pointer;
  text-align: center;
  transition: all 0.3s ease;
  position: relative;
}

.morse-letter.active {
  color: #004466;
  text-shadow: 0 0 20px rgba(0, 100, 150, 0.4);
  transform: scale(1.1);
}

.morse-code {
  font-size: clamp(2rem, 5vw, 3rem);
  color: #333;
  letter-spacing: 0.2em;
}

.bubble, .keyword {
  position: absolute;
  border-radius: 50%;
  opacity: 0.1;
  background: white;
  animation: float 60s infinite ease-in-out;
  transition: all 0.5s ease;
}

.keyword {
  font-size: 1em;
  color: #d0d0d0;
  opacity: 0.3;
  background: none;
}

.animated {
  opacity: 0.6 !important;
  background: #def !important;
  color: #669 !important;
  transform: scale(1.2) !important;
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-50vh); }
  100% { transform: translateY(0); }
}

.particle {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #99ccff;
  opacity: 0.8;
  animation: rise 1s ease-out forwards;
  pointer-events: none;
}

@keyframes rise {
  to {
    transform: translateY(-50px);
    opacity: 0;
  }
}

#resonance-animation {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100vw;
  max-height: 40vh;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(3px);
  color: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 9999;
  border-top: 1px solid #ccc;
  box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
  transition: opacity 1s ease;
  padding: 2vh 0;
}

.resonance-letter {
  font-size: 8vw;
  opacity: 0;
  transform: scale(2);
  transition: all 1s ease;
}

.resonance-text {
  font-size: 1em;
  max-width: 80vw;
  opacity: 0;
  margin-top: 0.5em;
  transition: opacity 1s ease;
}

#replay-resonance {
  position: fixed;
  bottom: 12px;
  right: 16px;
  font-size: 1.8em;
  background: none;
  border: none;
  color: #888;
  cursor: pointer;
  z-index: 50;
  transition: opacity 0.4s ease;
}

#replay-resonance:hover {
  color: #222;
  opacity: 1;
}

  </style>
</head>
<body>
  <div class="title">Collectif RÉSONANCE</div>
  <div class="intro">Autorisez-vous à fermer les yeux et ouvrir vos oreilles...</div>
  <div class="morse-container">
    <div class="morse-letter" data-sound="https://github.com/pierkiroule/pierkiroule.github.io/raw/refs/heads/master/cellmp3/blobiflowers.mp3">R<br><span class="morse-code">.-.</span></div>
    <div class="morse-letter" data-sound="https://github.com/pierkiroule/pierkiroule.github.io/raw/refs/heads/master/cellmp3/forest.mp3">E<br><span class="morse-code">.</span></div>
    <div class="morse-letter" data-sound="https://github.com/pierkiroule/pierkiroule.github.io/raw/refs/heads/master/cellmp3/or.mp3">S<br><span class="morse-code">...</span></div>
    <div class="morse-letter" data-sound="https://github.com/pierkiroule/pierkiroule.github.io/raw/refs/heads/master/cellmp3/expedrum.mp3">O<br><span class="morse-code">---</span></div>
    <div class="morse-letter" data-sound="https://github.com/pierkiroule/pierkiroule.github.io/raw/refs/heads/master/cellmp3/neig.mp3">N<br><span class="morse-code">-.</span></div>
    <div class="morse-letter" data-sound="https://github.com/pierkiroule/pierkiroule.github.io/raw/refs/heads/master/cellmp3/flamant.mp3">A<br><span class="morse-code">.-</span></div>
    <div class="morse-letter" data-sound="https://github.com/pierkiroule/pierkiroule.github.io/raw/refs/heads/master/cellmp3/celmuzic1.mp3">N<br><span class="morse-code">-.</span></div>
    <div class="morse-letter" data-sound="https://github.com/pierkiroule/pierkiroule.github.io/raw/refs/heads/master/cellmp3/celmuzic2.mp3">C<br><span class="morse-code">-.-.</span></div>
    <div class="morse-letter" data-sound="https://github.com/pierkiroule/pierkiroule.github.io/raw/refs/heads/master/cellmp3/boumy.mp3">E<br><span class="morse-code">.</span></div>
  </div><audio id="gong" src="https://github.com/pierkiroule/pierkiroule.github.io/raw/refs/heads/master/cellmp3/bubble-pop-2-293341.mp3"></audio>


<div class="bubble-voice" id="voiceBubble" title="Écouter Pier•°"></div>
<audio id="voiceAudio" src="https://github.com/pierkiroule/pierkiroule.github.io/raw/refs/heads/master/Reso/My%20Recording_117.mp3"></audio>

<script>
  const bubble = document.getElementById('voiceBubble');
  const audio = document.getElementById('voiceAudio');

  // Mouvement rebondissant
  let posX = 100, posY = 100;
  let velX = 0.3, velY = 0.2;

  function animateBubble() {
    const w = window.innerWidth;
    const h = window.innerHeight;

    posX += velX;
    posY += velY;

    if (posX <= 0 || posX >= w - 280) velX *= -1;
    if (posY <= 0 || posY >= h - 280) velY *= -1;

    bubble.style.left = posX + 'px';
    bubble.style.top = posY + 'px';

    requestAnimationFrame(animateBubble);
  }

  animateBubble();

  // Clic audio
  bubble.addEventListener('click', () => {
    if (audio.paused) {
      audio.currentTime = 0;
      audio.play();
    } else {
      audio.pause();
    }
  });

  // Pause audio en quittant la page
  window.addEventListener('beforeunload', () => {
    audio.pause();
  });
</script>



  
  <div id="resonance-animation">
    <div class="resonance-letter" id="resonance-letter">R</div>
    <div class="resonance-text" id="resonance-text">Résonance — L’art de vibrer ensemble.</div>
  </div>
  <button id="replay-resonance" title="Rejouer RÉSONANCE">•°</button>  <script>
    const letters = document.querySelectorAll('.morse-letter');
    const gong = document.getElementById('gong');
    let currentAudio = null;
    const floaters = [];

    function animateFloaters() {
      floaters.forEach(el => {
        el.classList.add('animated');
        setTimeout(() => el.classList.remove('animated'), 2000);
      });
    }

    function spawnParticles(x, y) {
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = `${x + Math.random() * 40 - 20}px`;
        p.style.top = `${y + Math.random() * 20 - 10}px`;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1000);
      }
    }

    letters.forEach(letter => {
      const sound = new Audio(letter.dataset.sound);
      letter.addEventListener('click', e => {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }
        sound.currentTime = 0;
        sound.play();
        gong.currentTime = 0;
        gong.play();
        currentAudio = sound;

        letters.forEach(l => l.classList.remove('active'));
        letter.classList.add('active');
        setTimeout(() => letter.classList.remove('active'), 1500);

        animateFloaters();
        spawnParticles(e.pageX, e.pageY);
      });
    });

    const keywords = ['écoute', 'silence', 'harmonie', 'vibration', 'souffle'];
    for (let i = 0; i < 30; i++) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const size = Math.random() * 60 + 40;
      bubble.style.width = size + 'px';
      bubble.style.height = size + 'px';
      bubble.style.left = Math.random() * 90 + 'vw';
      bubble.style.top = Math.random() * 6000 + 'px';
      document.body.appendChild(bubble);
      floaters.push(bubble);
    }
    for (let i = 0; i < 10; i++) {
      const word = document.createElement('div');
      word.className = 'keyword';
      word.innerText = keywords[i % keywords.length];
      word.style.left = Math.random() * 90 + 'vw';
      word.style.top = Math.random() * 6000 + 'px';
      document.body.appendChild(word);
      floaters.push(word);
    }

    const lettres = [
      { l: "R", t: "Résonance — L’art de vibrer ensemble." },
      { l: "É", t: "Écoute — Disponibilité sensorielle et attention au monde." },
      { l: "S", t: "Sens — Ce que nous cherchons à tisser." },
      { l: "O", t: "Ondes — Nos matières premières : sons, souffles, silences." },
      { l: "N", t: "Nids — Espaces poétiques, partagés, refuges." },
      { l: "A", t: "Altérité — Travailler avec l’autre et l’imprévu." },
      { l: "N", t: "Néotopies — Utopies concrètes et fictions agissantes." },
      { l: "C", t: "Création — Improvisation, déconstruction, expérimentation." },
      { l: "E", t: "Échos — Traces et résonances à venir." },
    ];

    function startAnimation() {
      const anim = document.getElementById("resonance-animation");
      const letter = document.getElementById("resonance-letter");
      const text = document.getElementById("resonance-text");
      let index = 0;
      function showNext() {
        if (index >= lettres.length) {
          anim.style.opacity = 0;
          setTimeout(() => anim.remove(), 1500);
          return;
        }
        letter.style.opacity = 0;
        text.style.opacity = 0;
        setTimeout(() => {
          letter.textContent = lettres[index].l;
          text.textContent = lettres[index].t;
          letter.style.transform = 'scale(1)';
          letter.style.opacity = 1;
          text.style.opacity = 1;
          index++;
          setTimeout(showNext, 2800);
        }, 800);
      }
      setTimeout(showNext, 500);
    }

    window.addEventListener('load', () => {
      startAnimation();
    });

    document.getElementById("replay-resonance").addEventListener("click", () => {
      const old = document.getElementById("resonance-animation");
      if (old) old.remove();
      const anim = document.createElement("div");
      anim.id = "resonance-animation";
      anim.innerHTML = `
        <div class="resonance-letter" id="resonance-letter">R</div>
        <div class="resonance-text" id="resonance-text">Résonance — L’art de vibrer ensemble.</div>
      `;
      document.body.appendChild(anim);
      startAnimation();
    });
  </script></body>
</html>
