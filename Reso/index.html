<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Collectif RÉSONANCE</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: white;
      font-family: 'Helvetica Neue', sans-serif;
      overflow: hidden;
    }
    .title {
      text-align: center;
      font-size: 3em;
      margin-top: 40px;
      color: #4682B4;
      letter-spacing: 0.1em;
    }
    .intro {
      text-align: center;
      font-size: 1.2em;
      margin-top: 10px;
      color: #aac;
    }
    .morse-container {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .morse-letter {
      margin: 40px 0;
      font-size: 0.8em;
      color: #bbb;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .morse-code {
      font-size: 1.5em;
      color: #333;
      letter-spacing: 0.2em;
    }
    .bubble, .keyword {
      position: absolute;
      border-radius: 50%;
      opacity: 0.1;
      background: white;
      animation: float 60s infinite ease-in-out;
      transition: transform 0.5s ease;
    }
    .keyword {
      font-size: 1em;
      color: #d0d0d0;
      opacity: 0.3;
      background: none;
    }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-50vh); }
      100% { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="title">Collectif RÉSONANCE</div>
  <div class="intro">Autorisez-vous à fermer les yeux et ouvrir vos oreilles...</div>  <div class="morse-container">
    <div class="morse-letter" data-sound="https://github.com/pierkiroule/pierkiroule.github.io/raw/refs/heads/master/cellmp3/blobiflowers.mp3">R<br><span class="morse-code">.-.</span></div>
    <div class="morse-letter" data-sound="https://github.com/pierkiroule/pierkiroule.github.io/raw/refs/heads/master/cellmp3/forest.mp3">E<br><span class="morse-code">.</span></div>
    <div class="morse-letter" data-sound="https://github.com/pierkiroule/pierkiroule.github.io/raw/refs/heads/master/cellmp3/or.mp3">S<br><span class="morse-code">...</span></div>
    <div class="morse-letter" data-sound="https://github.com/pierkiroule/pierkiroule.github.io/raw/refs/heads/master/cellmp3/expedrum.mp3">O<br><span class="morse-code">---</span></div>
    <div class="morse-letter" data-sound="https://github.com/pierkiroule/pierkiroule.github.io/raw/refs/heads/master/cellmp3/neig.mp3">N<br><span class="morse-code">-.</span></div>
    <div class="morse-letter" data-sound="https://github.com/pierkiroule/pierkiroule.github.io/raw/refs/heads/master/cellmp3/flamant.mp3">A<br><span class="morse-code">.-</span></div>
    <div class="morse-letter" data-sound="https://github.com/pierkiroule/pierkiroule.github.io/raw/refs/heads/master/cellmp3/celmuzic1.mp3">N<br><span class="morse-code">-.</span></div>
    <div class="morse-letter" data-sound="https://github.com/pierkiroule/pierkiroule.github.io/raw/refs/heads/master/cellmp3/celmuzic2.mp3">C<br><span class="morse-code">-.-.</span></div>
    <div class="morse-letter" data-sound="https://github.com/pierkiroule/pierkiroule.github.io/raw/refs/heads/master/cellmp3/boumy.mp3">E<br><span class="morse-code">.</span></div>
  </div>  <script>
    let currentAudio = null;
    const letters = document.querySelectorAll('.morse-letter');
    const allFloaters = [];

    letters.forEach(letter => {
      const audio = new Audio(letter.dataset.sound);
      letter.addEventListener('click', () => {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }
        audio.currentTime = 0;
        audio.play();
        currentAudio = audio;

        // Animer les bulles et mots clés au clic
        allFloaters.forEach(el => {
          el.style.transform = `scale(${1 + Math.random() * 0.5}) translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px)`;
          setTimeout(() => {
            el.style.transform = "translate(0,0)";
          }, 500);
        });
      });
    });

    const keywords = ['écoute', 'silence', 'harmonie', 'vibration', 'souffle'];
    for (let i = 0; i < 30; i++) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const size = Math.random() * 60 + 40;
      bubble.style.width = size + 'px';
      bubble.style.height = size + 'px';
      bubble.style.left = Math.random() * 100 + 'vw';
      bubble.style.top = Math.random() * 5000 + 'px';
      document.body.appendChild(bubble);
      allFloaters.push(bubble);
    }
    for (let i = 0; i < 10; i++) {
      const word = document.createElement('div');
      word.className = 'keyword';
      word.innerText = keywords[i % keywords.length];
      word.style.left = Math.random() * 100 + 'vw';
      word.style.top = Math.random() * 5000 + 'px';
      document.body.appendChild(word);
      allFloaters.push(word);
    }
  </script></body>
</html>
