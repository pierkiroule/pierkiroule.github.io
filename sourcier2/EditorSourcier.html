<div class="app">
  <header class="top">

    <div class="brand"><strong>ÉDITEUR DES SOURCIERS <span style="color:#77a08b">•°</span></strong><span>Composez des expériences à écouter</span></div>

      <button class="btn" id="saveJsonBtn" title="Sauvegarder le projet dans un fichier JSON"> <span>↓</span> Projet JSON</button>
      <button class="btn" id="exportAllBtn" title="Exporter toutes les pages HTML dans un ZIP"> <span>↓</span> Tout exporter</button>
      <button class="btn primary" id="exportBtn"> <span>↓</span> <span class="hide-small">Exporter </span>HTML</button>
    </div>
  </header>
  <div class="workspace">
    <aside class="sidebar">
      <div class="tabbar" role="tablist"><button class="tab active" data-tab="pages">Pages</button><button class="tab" data-tab="elements">Éléments</button><button class="tab" data-tab="templates">Modèles</button></div>
      <div class="side-scroll" id="sideContent"></div>

          <button class="iconbtn" id="redoBtn" title="Rétablir (Ctrl+Y)">↷</button>

        <div id="canvasHost"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => 'e'+Math.random().toString(36).slice(2,10);
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
const TODAY = new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const icons={title:'T',text:'¶',image:'▧',audio:'♫',video:'▶',button:'↗',timer:'◷',shape:'◯'};
const TYPES={title:'Titre',text:'Texte',image:'Image',audio:'Audio',video:'Vidéo',button:'Bouton',timer:'Minuteur',shape:'Forme'};
const defaults={
  title:{x:30,y:135,w:330,h:112,text:'Écouter le vivant',size:35,color:'#ffffff',align:'left',weight:'normal'},
  text:{x:30,y:269,w:330,h:90,text:'Une invitation à prendre le temps de percevoir ce qui nous entoure.',size:16,color:'#e8f2e5',align:'left',weight:'normal'},
  image:{x:45,y:220,w:300,h:190,url:'',alt:'Image sensible',radius:16},
  audio:{x:30,y:485,w:330,h:75,label:'Écouter le paysage',url:'',rules:[]},
  video:{x:35,y:345,w:320,h:180,url:'',poster:'',radius:14},
  button:{x:60,y:570,w:270,h:51,text:'Explorer',href:'https://',color:'#e9f0d4',textColor:'#315144'},
  timer:{x:115,y:400,w:160,h:115,seconds:60,label:'Un instant de silence'},
  shape:{x:117,y:298,w:156,h:156,color:'#ffffff',opacity:0.17,round:50}
};
function block(type, overrides={}){return {id:uid(),type,...clone(defaults[type]),...overrides};}
function makeTemplate(id){
 if(id==='situ')return {theme:'forest',blocks:[block('title',{text:'Un instant d’écoute',y:152}),block('text',{text:'Que percevez-vous lorsque vous prenez le temps de ne rien faire ?',y:290}),block('timer',{y:421,seconds:60})]};
 if(id==='season')return {theme:'mist',blocks:[block('title',{text:'Les voix du vivant',y:155,color:'#263c35'}),block('text',{text:'À chaque saison, le paysage invente une autre manière de se faire entendre.',y:294,color:'#405649'}),block('audio',{y:440,label:'Écoute du moment',rules:[{id:uid(),label:'Printemps',start:'2027-03-20',end:'2027-06-20',url:''},{id:uid(),label:'Été',start:'2027-06-21',end:'2027-09-22',url:''},{id:uid(),label:'Automne',start:'2027-09-23',end:'2027-12-20',url:''},{id:uid(),label:'Hiver',start:'2027-12-21',end:'2028-03-19',url:''}]})]};
 if(id==='free')return {theme:'night',blocks:[block('title',{text:'Laissez-vous surprendre',y:175}),block('text',{text:'Une expérience à explorer librement, à votre rythme.',y:310}),block('audio',{y:460,label:'Commencer l’écoute'})]};
 return {theme:'sand',blocks:[block('title',{text:'Une nouvelle expérience',y:180,color:'#33443a'}),block('text',{text:'Composez votre page avec les éléments de gauche.',y:305,color:'#41584b'})]};
}
const BUILTINS=[{id:'situ',name:'Écoute in situ',desc:'Une invitation à écouter le milieu, avec minuteur.',theme:'forest'},{id:'season',name:'Écoute saisonnière',desc:'Quatre plages datées et un lecteur audio.',theme:'mist'},{id:'free',name:'Écoute libre',desc:'Un paysage sonore disponible à tout moment.',theme:'night'},{id:'blank',name:'Page essentielle',desc:'Une composition douce à personnaliser.',theme:'sand'}];
function newPage(i,type){const t=makeTemplate(type);return {id:uid(),slug:String(i).padStart(2,'0'),name:'Borne '+String(i).padStart(2,'0'),kind:type,theme:t.theme,blocks:t.blocks};}
function initialProject(){return {version:1,name:'Parcours Heinlex',pages:Array.from({length:13},(_,i)=>newPage(i+1,i<6?'situ':i<12?'season':'free')),templates:[]};}
const STORE='sourciers-editor-project-v1';
let project;
try{const saved=localStorage.getItem(STORE);project=saved?JSON.parse(saved):initialProject();if(!Array.isArray(project.pages)||!project.pages.length)throw Error('Projet vide');project.templates??=[];}catch{project=initialProject();}
let activeId=project.pages[0].id, selectedId=null, tab='pages',mode='edit',previewDate=TODAY;
const history=[],future=[];
const page=()=>project.pages.find(p=>p.id===activeId)||project.pages[0];
const selected=()=>page().blocks.find(b=>b.id===selectedId);
function checkpoint(){history.push(JSON.stringify(project));if(history.length>60)history.shift();future.length=0;}
function save(){try{localStorage.setItem(STORE,JSON.stringify(project));$('#saveState').innerHTML='<span class="status-dot"></span> Enregistré localement';}catch{$('#saveState').textContent='Exportez le projet JSON pour le sauvegarder';}}
function commit(fn,{refresh='all',historyStep=true}={}){if(historyStep)checkpoint();fn();save();if(refresh==='all')render();else if(refresh==='canvas')renderCanvas();else if(refresh==='sidebar')renderSidebar();}
let toastTimer;

 const css=`*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif}body{background:#102b25;display:flex;align-items:center;justify-content:center;min-height:100svh}.scene{width:min(100vw,390px);height:700px;position:relative;overflow:hidden;color:#fff;isolation:isolate}.forest{background:radial-gradient(ellipse at 72% 9%,#658c71,#325d4e 45%,#15382f 95%)}.mist{background:radial-gradient(ellipse at 75% 18%,#ced7bb,#a4bba6 42%,#6e8b7f 87%);color:#263c35}.night{background:radial-gradient(ellipse at 20% 10%,#536d70,#193e49 48%,#0d2730 95%)}.sand{background:radial-gradient(ellipse at 60% 10%,#f6ebd7,#e4d4b2 52%,#b6bda8 98%);color:#33443a}.micro{position:absolute;top:25px;left:30px;font-size:10px;font-weight:700;letter-spacing:.13em;opacity:.75}.number{position:absolute;right:27px;top:25px;font-size:10px;opacity:.7}.foot{position:absolute;bottom:18px;left:0;right:0;text-align:center;letter-spacing:.07em;font-size:10px;opacity:.6}.unit{position:absolute;overflow:hidden;overflow-wrap:anywhere}.txt{width:100%;height:100%;white-space:pre-wrap}.media{width:100%;height:100%;object-fit:cover}.sound{height:100%;width:100%;padding:12px;background:#ffffff29;border:1px solid #ffffff44;border-radius:15px;backdrop-filter:blur(6px);display:flex;align-items:center;gap:10px;color:inherit}.sound .label{font-size:12px;flex:1;min-width:0}.sound .label strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sound .label small{font-size:10px;opacity:.76}.sound button{border:0;border-radius:50%;background:#e9f3e3;color:#224939;width:39px;height:39px;display:grid;place-items:center;cursor:pointer;flex:none;font-size:15px}.sound audio{width:100%;height:34px;max-width:180px;margin-top:5px;display:none}.sound.playing{align-items:center}.sound.playing audio{display:block}.sound.unavailable{opacity:.7}.sound.unavailable button{opacity:.5;cursor:default}.clip{width:100%;height:100%}.linkbtn{width:100%;height:100%;border:none;border-radius:40px;font-weight:700;cursor:pointer}.timer{width:100%;height:100%;background:#ffffff24;border:1px solid #ffffff64;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:inherit;cursor:pointer}.timer b{font:300 36px Georgia,serif}.timer small{font-size:10px}.shape{width:100%;height:100%}@media(min-width:500px){.scene{border-radius:14px;box-shadow:0 20px 70px #071e1a66;margin:20px auto}}@media(max-width:390px){.scene{transform-origin:top left;transform:scale(calc(100vw / 390px));margin-bottom:calc(-700px + 700px * 100vw / 390px)}body{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:0s!important;transition-duration:0s!important}}`;
 const runtime=`(function(){'use strict';const data=${safeJs(data)};const testDate=${safeJs(simulated)};const $=s=>document.querySelector(s);const scene=$('#scene');const today=testDate||new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const safeUrl=u=>{try{const v=new URL(u,location.href);return v.protocol==='https:'||v.protocol==='http:'?v.href:''}catch{return ''}};function append(parent,tag,cls){const el=document.createElement(tag);if(cls)el.className=cls;parent.appendChild(el);return el;}for(const b of data.blocks){const holder=append(scene,'div','unit');holder.style.left=b.x+'px';holder.style.top=b.y+'px';holder.style.width=b.w+'px';holder.style.height=b.h+'px';if(b.type==='title'||b.type==='text'){const el=append(holder,'div','txt');el.textContent=b.text||'';el.style.font=(b.weight==='bold'?'700':'400')+' '+(b.size||20)+'px/'+(b.type==='title'?1.15:1.45)+' '+(b.type==='title'?'Georgia,serif':'system-ui,sans-serif');el.style.color=b.color;el.style.textAlign=b.align||'left';}else if(b.type==='image'){const url=safeUrl(b.url);if(url){const el=append(holder,'img','media');el.src=url;el.alt=b.alt||'';el.loading='lazy';el.style.borderRadius=(b.radius||0)+'px';}}else if(b.type==='video'){const url=safeUrl(b.url);if(url){const el=append(holder,'video','media');el.controls=true;el.preload='none';el.playsInline=true;el.src=url;el.style.borderRadius=(b.radius||0)+'px';const poster=safeUrl(b.poster);if(poster)el.poster=poster;}}else if(b.type==='audio'){const matches=(b.rules||[]).filter(r=>r.start&&r.end&&r.start<=today&&r.end>=today&&safeUrl(r.url)).sort((a,c)=>c.start.localeCompare(a.start));const active=matches[0];const audioUrl=safeUrl(active?.url||b.url);const box=append(holder,'div','sound');const btn=append(box,'button');btn.type='button';btn.textContent=audioUrl?'▶':'–';const text=append(box,'div','label');const name=append(text,'strong');name.textContent=active?.label||b.label||'Écouter';const small=append(text,'small');small.textContent=audioUrl?'Appuyer pour écouter':'Aucune écoute disponible pour le moment';if(audioUrl){const audio=append(text,'audio');audio.controls=true;audio.preload='none';audio.src=audioUrl;btn.setAttribute('aria-label','Écouter');btn.onclick=()=>{if(audio.paused){audio.play().then(()=>{box.classList.add('playing');btn.textContent='Ⅱ'}).catch(()=>{small.textContent='Lecture impossible : vérifier le flux audio';});}else{audio.pause();btn.textContent='▶'}};audio.onpause=()=>{btn.textContent='▶'};audio.onplay=()=>{box.classList.add('playing');btn.textContent='Ⅱ'}}else{box.classList.add('unavailable');btn.disabled=true;}}else if(b.type==='button'){const el=append(holder,'button','linkbtn');el.textContent=b.text||'Explorer';el.style.background=b.color;el.style.color=b.textColor;const u=safeUrl(b.href);el.onclick=()=>{if(u)window.open(u,'_blank','noopener,noreferrer')}}else if(b.type==='timer'){const el=append(holder,'button','timer');const time=append(el,'b');const label=append(el,'small');label.textContent=b.label||'Un instant';let t=Math.max(1,Number(b.seconds)||60),remaining=t,tick=null;const paint=()=>time.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');paint();el.title='Démarrer ou arrêter le minuteur';el.onclick=()=>{if(tick){clearInterval(tick);tick=null;return}if(remaining<=0)remaining=t;tick=setInterval(()=>{remaining--;paint();if(remaining<=0){clearInterval(tick);tick=null}},1000)}}else if(b.type==='shape'){const el=append(holder,'div','shape');el.style.background=b.color;el.style.opacity=b.opacity;el.style.borderRadius=(b.round||0)+'%';}}})();`;
 return `<!doctype html>\n<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#244b40"><title>${esc(p.name)} — Les Sourciers du Vivant</title><meta name="description" content="Une expérience d'écoute sensible des Sourciers du Vivant"><style>${css}</style></head><body><main class="scene ${esc(p.theme)}" id="scene" aria-label="${esc(p.name)}"><div class="micro">LES SOURCIERS DU VIVANT •°</div><div class="number">${esc(p.slug)}</div><div class="foot">ÉCOUTER LE VIVANT AUTREMENT</div></main><script>${runtime}</scr${'ipt'}></body></html>`;

function download(blob,name){const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=name;document.body.appendChild(link);link.click();setTimeout(()=>{URL.revokeObjectURL(link.href);link.remove()},1500)}
function htmlFile(){const p=page();const warnings=p.blocks.filter(b=>b.type==='audio').flatMap(b=>validateRules(b.rules||[]));if(warnings.length)toast('Attention : périodes audio à vérifier');download(new Blob([exportPage(p)],{type:'text/html;charset=utf-8'}),'borne-'+p.slug.replace(/[^a-z0-9-]/gi,'-')+'.html');toast('HTML autonome exporté')}
function jsonFile(){download(new Blob([JSON.stringify(project,null,2)],{type:'application/json'}),'sourciers-projet.json');toast('Projet sauvegardé en JSON')}
// Small ZIP writer (STORE method, no external dependency).
const encoder=new TextEncoder();let crcTable=null;function crc32(bytes){if(!crcTable){crcTable=Array.from({length:256},(_,n)=>{let c=n;for(let i=0;i<8;i++)c=c&1?0xedb88320^(c>>>1):c>>>1;return c>>>0})}let crc=0xffffffff;for(const byte of bytes)crc=crcTable[(crc^byte)&255]^(crc>>>8);return(crc^0xffffffff)>>>0}
function makeZip(files){const parts=[],centers=[];let offset=0;const u16=(d,p,v)=>d.setUint16(p,v,true);const u32=(d,p,v)=>d.setUint32(p,v>>>0,true);files.forEach(([name,str])=>{const nameBytes=encoder.encode(name),content=encoder.encode(str),crc=crc32(content);const head=new Uint8Array(30+nameBytes.length),h=new DataView(head.buffer);u32(h,0,0x04034b50);u16(h,4,20);u16(h,6,0x0800);u16(h,8,0);u32(h,14,crc);u32(h,18,content.length);u32(h,22,content.length);u16(h,26,nameBytes.length);head.set(nameBytes,30);parts.push(head,content);const center=new Uint8Array(46+nameBytes.length),c=new DataView(center.buffer);u32(c,0,0x02014b50);u16(c,4,20);u16(c,6,20);u16(c,8,0x0800);u32(c,16,crc);u32(c,20,content.length);u32(c,24,content.length);u16(c,28,nameBytes.length);u32(c,42,offset);center.set(nameBytes,46);centers.push(center);offset+=head.length+content.length});const centralSize=centers.reduce((a,b)=>a+b.length,0);const end=new Uint8Array(22),e=new DataView(end.buffer);u32(e,0,0x06054b50);u16(e,8,files.length);u16(e,10,files.length);u32(e,12,centralSize);u32(e,16,offset);return new Blob([...parts,...centers,end],{type:'application/zip'})}
function allPages(){const files=project.pages.map(p=>['borne-'+p.slug.replace(/[^a-z0-9-]/gi,'-')+'.html',exportPage(p)]);files.push(['README.txt','LES SOURCIERS DU VIVANT — PAGES HTML\n\nUne page HTML autonome par borne.\nLes médias sont référencés par URL HTTPS.\nToute modification des programmations nécessite un nouvel export.\nDéposez les pages sur votre hébergeur, puis imprimez des QR codes pointant vers leurs URL stables.\n\n']);download(makeZip(files),'sourciers-pages-html.zip');toast(files.length-1+' pages exportées dans un ZIP')}
function doUndo(redo=false){const from=redo?future:history,to=redo?history:future;if(!from.length)return;to.push(JSON.stringify(project));project=JSON.parse(from.pop());if(!project.pages.some(p=>p.id===activeId))activeId=project.pages[0].id;if(!page().blocks.some(b=>b.id===selectedId))selectedId=null;save();render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderSidebar()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});$('#previewDate').onchange=e=>{previewDate=e.target.value||TODAY;renderCanvas();$('#canvasLabel').textContent='APERÇU RÉEL · CONTENU AU '+fmt(previewDate)};
$('#exportBtn').onclick=htmlFile;$('#saveJsonBtn').onclick=jsonFile;$('#exportAllBtn').onclick=allPages;$('#undoBtn').onclick=()=>doUndo();$('#redoBtn').onclick=()=>doUndo(true);
$('#importBtn').onclick=()=>$('#fileImport').click();$('#fileImport').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const imported=JSON.parse(await file.text());if(!Array.isArray(imported.pages)||!imported.pages.length||!imported.pages.every(p=>Array.isArray(p.blocks)))throw Error('Format de projet non reconnu');ask('Importer ce projet ?',`Ce fichier contient ${imported.pages.length} page(s). Il remplacera le projet local actuel.`,()=>commit(()=>{project=imported;project.templates??=[];activeId=project.pages[0].id;selectedId=null;}));}catch(err){toast('Import impossible : '+err.message)}e.target.value=''};
window.addEventListener('keydown',e=>{const editing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();doUndo(e.shiftKey)}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();doUndo(true)}else if(!editing&&selectedId&&(e.key==='Delete'||e.key==='Backspace')){e.preventDefault();commit(()=>{page().blocks=page().blocks.filter(b=>b.id!==selectedId);selectedId=null})}else if(!editing&&selectedId&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();commit(()=>{const b=selected();if(!b)return;const n=e.shiftKey?10:1;if(e.key==='ArrowUp')b.y=clamp(b.y-n,0,700-b.h);if(e.key==='ArrowDown')b.y=clamp(b.y+n,0,700-b.h);if(e.key==='ArrowLeft')b.x=clamp(b.x-n,0,390-b.w);if(e.key==='ArrowRight')b.x=clamp(b.x+n,0,390-b.w)})}});
