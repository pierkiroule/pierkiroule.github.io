
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3efe7">
<title>Empreintes du Vivant •°</title>
<style>
:root{
  --paper:#f3efe7;
  --ink:#34352f;
  --muted:#89877e;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  background:var(--paper);
  color:var(--ink);
  font-family:Georgia,serif;
}
#scene{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
header{
  position:fixed;
  z-index:3;
  top:calc(17px + env(safe-area-inset-top));
  left:19px;
  right:15px;
  pointer-events:none;
}
h1{
  margin:0;
  font-size:clamp(24px,6vw,42px);
  font-weight:400;
  letter-spacing:-.055em;
  line-height:1.08;
}
header p{
  margin:8px 0 0;
  font-size:12px;
  font-style:italic;
  color:var(--muted);
}
#mic{
  position:fixed;
  z-index:4;
  bottom:calc(20px + env(safe-area-inset-bottom));
  left:50%;
  transform:translateX(-50%);
  min-width:115px;
  min-height:48px;
  padding:12px 22px;
  border:1px solid #c9c4b9;
  border-radius:30px;
  background:rgba(243,239,231,.95);
  color:var(--ink);
  font:13px system-ui,sans-serif;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
#mic.active{
  background:var(--ink);
  color:var(--paper);
}
#status{
  position:fixed;
  z-index:3;
  bottom:calc(80px + env(safe-area-inset-bottom));
  left:0;
  width:100%;
  text-align:center;
  font:11px system-ui,sans-serif;
  color:var(--muted);
  pointer-events:none;
}
@media(min-width:700px){
  header{top:28px;left:32px}
}
</style>
</head>
<body>

<header>
  <h1>Empreintes du Vivant •°</h1>
  <p>Ce qui nous traverse laisse une trace.</p>
</header>

<svg id="scene"
 xmlns="http://www.w3.org/2000/svg"
 viewBox="-195 -350 390 700"
 preserveAspectRatio="xMidYMid meet">
  <g id="contours"
    fill="none"
    stroke="#34352f"
    stroke-linejoin="round"
    stroke-linecap="round"></g>
  <g id="words"
    text-anchor="middle"
    pointer-events="none"></g>
</svg>

<div id="status">Toucher, étirer, laisser revenir</div>
<button id="mic" aria-pressed="false">Micro</button>

<script>
"use strict";

const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";
const TAU=Math.PI*2;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const gauss=(x,s)=>Math.exp(-.5*(x/s)**2);

function smooth(x){
  x=clamp(x,0,1);
  return x*x*(3-2*x);
}

function adiff(a,b){
  return Math.atan2(
    Math.sin(a-b),
    Math.cos(a-b)
  );
}

// ====================================
// TRAME
// ====================================

const svg=$("scene");
const contours=$("contours");

const COUNT=38;
const STEPS=160;
const BASE=64;
const GAP=5.15;
const MIN_GAP=2.35;
const YS=.88;

const paths=[];
const angles=new Float32Array(STEPS);
const cosines=new Float32Array(STEPS);
const sines=new Float32Array(STEPS);

for(let i=0;i<STEPS;i++){
  const a=i/STEPS*TAU;
  angles[i]=a;
  cosines[i]=Math.cos(a);
  sines[i]=Math.sin(a);
}

for(let j=0;j<COUNT;j++){
  const p=document.createElementNS(NS,"path");
  p.setAttribute("fill","none");
  p.setAttribute("vector-effect","non-scaling-stroke");
  contours.appendChild(p);
  paths.push(p);
}

function resize(){
  const w=window.innerWidth;
  const h=window.innerHeight;
  const vw=w<h?390:650;
  const vh=vw*h/w;

  svg.setAttribute(
    "viewBox",
    `${-vw/2} ${-vh/2} ${vw} ${vh}`
  );
}

window.addEventListener("resize",resize);
resize();

// ====================================
// MICRO
// ====================================

let context=null;
let analyser=null;
let bins=null;
let stream=null;
let source=null;
let micActive=false;
let micBusy=false;

const sound={low:0,mid:0,high:0};

async function stopMic(){
  micActive=false;

  if(source){
    source.disconnect();
    source=null;
  }
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream=null;
  }
  if(context){
    try{await context.close()}catch(e){}
    context=null;
  }

  analyser=null;
  bins=null;

  $("mic").classList.remove("active");
  $("mic").setAttribute("aria-pressed","false");
  $("mic").textContent="Micro";
  $("status").textContent="Toucher, étirer, laisser revenir";
}

$("mic").onclick=async()=>{
  if(micBusy)return;
  micBusy=true;

  if(micActive){
    await stopMic();
    micBusy=false;
    return;
  }

  try{
    const AudioClass=
      window.AudioContext||
      window.webkitAudioContext;

    context=new AudioClass();

    analyser=context.createAnalyser();
    analyser.fftSize=1024;
    analyser.smoothingTimeConstant=.88;

    bins=new Uint8Array(analyser.frequencyBinCount);

    stream=await navigator.mediaDevices
      .getUserMedia({audio:true});

    source=context.createMediaStreamSource(stream);
    source.connect(analyser);

    await context.resume();

    micActive=true;
    $("mic").classList.add("active");
    $("mic").setAttribute("aria-pressed","true");
    $("mic").textContent="Micro actif";
    $("status").textContent="Écouter ce qui résonne";

  }catch(e){
    await stopMic();
    $("status").textContent="Micro indisponible";
  }

  micBusy=false;
};

function band(a,b){
  if(!context||!bins)return 0;

  const hz=context.sampleRate/analyser.fftSize;
  const start=Math.floor(a/hz);
  const end=Math.min(
    bins.length,
    Math.ceil(b/hz)
  );

  let sum=0,n=0;
  for(let i=start;i<end;i++){
    sum+=bins[i]/255;
    n++;
  }
  return n?sum/n:0;
}

function updateSound(t,dt){
  let low,mid,high;

  if(micActive&&analyser){
    analyser.getByteFrequencyData(bins);
    low=band(35,300);
    mid=band(300,1800);
    high=band(1800,8500);
  }else{
    low=.17+.09*Math.sin(t*.42);
    mid=.13+.07*Math.sin(t*.7+1);
    high=.07+.04*Math.sin(t*1.1+2);
  }

  const k=1-Math.exp(-dt*4);
  sound.low=lerp(sound.low,low,k);
  sound.mid=lerp(sound.mid,mid,k);
  sound.high=lerp(sound.high,high,k);
}

// ====================================
// FORME-MÈRE
// ====================================

function mother(a,t){
  return 1+
    .15*Math.sin(a*2-t*.11+.4)+
    .10*Math.sin(a*3+t*.08+1.8)+
    .055*Math.sin(a*5-t*.06+2.3)+
    .025*Math.sin(a*8+t*.04)+
    .13*sound.low*Math.sin(a*3-t*.3)+
    .09*sound.mid*Math.sin(a*6+t*.35);
}

// ====================================
// RESPIRATIONS AUTONOMES
// ====================================

const breaths=[
  {a:.4,r:7,va:.1,p:0,w:6,s:.85},
  {a:2.6,r:21,va:-.07,p:2,w:9,s:-.7},
  {a:4.7,r:13,va:.06,p:4,w:7,s:.7},
  {a:5.8,r:31,va:-.05,p:1,w:5,s:.6}
];

function breathing(j,a,t){
  let v=0;

  for(const b of breaths){
    const ca=b.a+t*b.va;
    const cr=b.r+Math.sin(t*.13+b.p)*5;

    v+=
      b.s*
      gauss(adiff(a,ca),.7)*
      gauss(j-cr,b.w)*
      Math.sin(t*.55-j*.11+b.p);
  }

  return v;
}

const voids=[
  {a:1.2,r:12,p:0,v:.06,s:1.65},
  {a:3.7,r:25,p:2.5,v:-.05,s:1.45},
  {a:5.1,r:33,p:4.1,v:.04,s:1.2}
];

function opening(j,a,t){
  let v=0;

  for(const o of voids){
    const life=smooth(
      .5+.5*Math.sin(t*.17+o.p)
    );

    v+=
      o.s*life*
      gauss(adiff(a,o.a+t*o.v),.68)*
      gauss(j-o.r,4.3);
  }

  return v;
}

// ====================================
// MEMBRANE : ONDE TACTILE
// ====================================

// La première rangée est la membrane
// centrale invisible.
// Les suivantes forment les cernes.

const ROWS=COUNT+1;
const SIZE=ROWS*STEPS;

const displacement=new Float32Array(SIZE);
const velocity=new Float32Array(SIZE);
const force=new Float32Array(SIZE);

const touches=new Map();

const idx=(j,i)=>j*STEPS+i;

function toSVG(e){
  const p=svg.createSVGPoint();
  p.x=e.clientX;
  p.y=e.clientY;

  const m=svg.getScreenCTM();

  return m
    ?p.matrixTransform(m.inverse())
    :{x:0,y:0};
}

function polar(x,y){
  const yy=y/YS;
  return {
    a:Math.atan2(yy,x),
    r:Math.hypot(x,yy)
  };
}

function down(e){
  e.preventDefault();
  svg.setPointerCapture(e.pointerId);

  const p=toSVG(e);
  touches.set(e.pointerId,{
    x:p.x,
    y:p.y,
    px:p.x,
    py:p.y,
    ox:p.x,
    oy:p.y,
    age:0
  });
}

function move(e){
  const touch=touches.get(e.pointerId);
  if(!touch)return;

  e.preventDefault();
  const p=toSVG(e);
  touch.x=p.x;
  touch.y=p.y;
}

function up(e){
  touches.delete(e.pointerId);
}

svg.addEventListener("pointerdown",down);
svg.addEventListener("pointermove",move);
svg.addEventListener("pointerup",up);
svg.addEventListener("pointercancel",up);

// ====================================
// INJECTION DE L'ONDE
// ====================================

function inject(dt){
  force.fill(0);

  for(const touch of touches.values()){
    touch.age+=dt;

    const dx=touch.x-touch.px;
    const dy=(touch.y-touch.py)/YS;

    const travel=Math.hypot(dx,dy);
    if(travel<.001)continue;

    const samples=Math.min(
      12,
      Math.max(1,Math.ceil(travel/7))
    );

    for(let s=0;s<samples;s++){
      const u=(s+.5)/samples;
      const x=lerp(touch.px,touch.x,u);
      const y=lerp(touch.py,touch.y,u);
      const p=polar(x,y);

      const radialDrag=
        dx*Math.cos(p.a)+
        dy*Math.sin(p.a);

      const tangentialDrag=
        -dx*Math.sin(p.a)+
        dy*Math.cos(p.a);

      // La forme centrale réagit
      // même si le doigt part du vide.
      const centerInfluence=
        smooth((BASE+35-p.r)/85);

      const strength=
        1+centerInfluence*2.8;

      const targetRow=clamp(
        (p.r-BASE)/GAP,
        0,
        COUNT
      );

      for(let j=0;j<ROWS;j++){
        const distance=j-targetRow;

        const radialWeight=gauss(
          distance,
          centerInfluence>.2?8:5
        );

        if(radialWeight<.002)continue;

        for(let i=0;i<STEPS;i++){
          const da=adiff(angles[i],p.a);
          const angularWeight=gauss(da,.55);

          const weight=
            radialWeight*angularWeight;

          if(weight<.002)continue;

          // Le geste radial tire la membrane.
          // Le geste tangentiel crée
          // une légère torsion.
          const gesture=
            radialDrag+
            tangentialDrag*Math.sin(da)*.6;

          force[idx(j,i)]+=
            clamp(gesture,-22,22)*
            weight*
            strength/
            samples;
        }
      }
    }

    touch.px=touch.x;
    touch.py=touch.y;
  }
}

// ====================================
// PROPAGATION ÉLASTIQUE
// ====================================

function simulate(dt){
  const step=Math.min(dt,.033);

  // Onde amortie.
  const spring=5.2;
  const damping=3.5;

  // Couplage radial plus marqué :
  // l'onde traverse les cernes.
  const radialCoupling=65;
  const angularCoupling=15;

  for(let j=0;j<ROWS;j++){
    for(let i=0;i<STEPS;i++){
      const k=idx(j,i);

      const left=idx(
        j,(i+STEPS-1)%STEPS
      );
      const right=idx(
        j,(i+1)%STEPS
      );

      const inner=j>0
        ?idx(j-1,i)
        :k;

      const outer=j<ROWS-1
        ?idx(j+1,i)
        :k;

      const radialLaplacian=
        displacement[inner]+
        displacement[outer]-
        2*displacement[k];

      const angularLaplacian=
        displacement[left]+
        displacement[right]-
        2*displacement[k];

      const acceleration=
        radialLaplacian*radialCoupling+
        angularLaplacian*angularCoupling-
        spring*displacement[k]-
        damping*velocity[k]+
        force[k]*85;

      velocity[k]+=
        acceleration*step;
    }
  }

  for(let k=0;k<SIZE;k++){
    displacement[k]+=velocity[k]*step;

    displacement[k]=clamp(
      displacement[k],
      -36,36
    );
  }
}

// ====================================
// MOTS DU PASSAGE
// ====================================

const lexicon=[
  "absence",
  "douceur",
  "manque",
  "présence",
  "souvenir",
  "tendresse",
  "silence",
  "passage",
  "fragilité",
  "lien",
  "chagrin",
  "empreinte",
  "espérance",
  "respirer",
  "demeurer",
  "ensemble",
  "encore",
  "vivant"
];

const word=document.createElementNS(NS,"text");

word.setAttribute("text-anchor","middle");
word.setAttribute("dominant-baseline","middle");
word.setAttribute("font-family","Georgia,serif");
word.setAttribute("font-style","italic");
word.setAttribute("font-size","25");
word.setAttribute("fill","#34352f");
word.setAttribute("opacity","0");

$("words").appendChild(word);

let wordIndex=-1;
let wordClock=0;

const WORD_CYCLE=14;
const FADE_IN=3;
const HOLD=6;
const FADE_OUT=3;

function nextWord(){
  let n;
  do{
    n=Math.floor(Math.random()*lexicon.length);
  }while(n===wordIndex);

  wordIndex=n;
  word.textContent=lexicon[n];
}

nextWord();

function updateWords(dt,t){
  wordClock+=dt;

  if(wordClock>=WORD_CYCLE){
    wordClock-=WORD_CYCLE;
    nextWord();
  }

  const u=wordClock;
  let alpha=0;

  if(u<FADE_IN){
    alpha=smooth(u/FADE_IN);
  }else if(u<FADE_IN+HOLD){
    alpha=1;
  }else if(u<FADE_IN+HOLD+FADE_OUT){
    alpha=1-smooth(
      (u-FADE_IN-HOLD)/FADE_OUT
    );
  }

  word.setAttribute(
    "opacity",
    (alpha*.94).toFixed(3)
  );

  word.setAttribute(
    "x",
    (Math.sin(t*.08)*2).toFixed(2)
  );

  word.setAttribute(
    "y",
    (Math.cos(t*.07)*2).toFixed(2)
  );
}

// ====================================
// DESSIN DES CERNES
// ====================================

const radial=new Float32Array(STEPS);

function opacity(j,t){
  return clamp(
    .38+j/COUNT*.32+
    Math.sin(j*.4-t*.25)*.12+
    Math.sin(j*.17+t*.19)*.08,
    .16,.9
  );
}

function draw(t){
  // La membrane centrale est invisible.
  for(let i=0;i<STEPS;i++){
    radial[i]=
      BASE*mother(angles[i],t)+
      displacement[idx(0,i)];
  }

  for(let j=0;j<COUNT;j++){
    let d="";

    for(let i=0;i<STEPS;i++){
      const a=angles[i];

      const natural=breathing(j,a,t);
      const empty=opening(j,a,t);

      const audio=
        Math.sin(a*5-t*.6-j*.13)*
        sound.mid*.5;

      const baseGap=
        GAP*(
          1+
          natural*.4+
          empty*.9+
          audio*.35
        );

      // La membrane transmet
      // sa déformation aux cernes.
      const waveGap=
        displacement[idx(j+1,i)]-
        displacement[idx(j,i)];

      const gap=Math.max(
        MIN_GAP,
        baseGap+waveGap
      );

      radial[i]+=gap;

      const r=radial[i];

      const x=cosines[i]*r;
      const y=sines[i]*r*YS;

      d+=(i===0?"M":"L")+
        x.toFixed(2)+" "+
        y.toFixed(2)+" ";
    }

    d+="Z";

    const p=paths[j];
    p.setAttribute("d",d);
    p.setAttribute(
      "opacity",
      opacity(j,t).toFixed(3)
    );
    p.setAttribute(
      "stroke-width",
      (
        .55+j/COUNT*.4+
        Math.sin(j*.6+t*.1)*.07
      ).toFixed(2)
    );
  }
}

// ====================================
// ANIMATION
// ====================================

let time=0;
let last=0;
let lastDraw=0;

function animate(now){
  requestAnimationFrame(animate);

  const dt=Math.min(
    (now-last||16)/1000,
    .04
  );

  last=now;
  time+=dt;

  updateSound(time,dt);
  inject(dt);
  simulate(dt);
  updateWords(dt,time);

  if(now-lastDraw>=33){
    lastDraw=now;
    draw(time);
  }
}

requestAnimationFrame(animate);

</script>
</body>
</html>
