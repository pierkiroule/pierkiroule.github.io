<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Culture Psybot Quiz : Écho & Résonance de l'I.A</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <style>
    :root {
      --bg: #050816;
      --bg-card: rgba(12, 18, 40, 0.96);
      --accent: #4f46e5;
      --accent-soft: rgba(79, 70, 229, 0.15);
      --accent-strong: #22c55e;
      --text-main: #f9fafb;
      --text-soft: #cbd5f5;
      --text-muted: #9ca3af;
      --error: #f97373;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1f2937 0, #020617 50%, #000 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: stretch;
      min-height: 100vh;
      padding: 16px;
    }

    .quiz-shell {
      width: 100%;
      max-width: 720px;
      margin: auto;
    }

    .quiz-card {
      background: var(--bg-card);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
      padding: 24px 22px 22px;
      backdrop-filter: blur(18px);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    h1 {
      font-size: 2rem;
      margin: 0 0 6px;
      line-height: 1.25;
      color: var(--text-main);
    }

    .author {
      font-size: 0.95rem;
      margin: 0 0 14px;
      color: var(--text-soft);
      font-style: italic;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 0.8rem;
    }

    .progress-bar-wrap {
      flex: 1;
      height: 6px;
      border-radius: 999px;
      background: rgba(30, 64, 175, 0.35);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #4f46e5, #22c55e);
      transition: width 0.4s ease;
    }

    .question-text {
      font-size: 1.1rem;
      margin: 20px 0 12px;
      color: var(--text-main);
      line-height: 1.45;
    }

    .answer-option {
      background: var(--accent-soft);
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 12px 14px;
      border-radius: 10px;
      margin: 8px 0;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.97rem;
    }

    .answer-option:hover {
      background: rgba(79, 70, 229, 0.3);
    }

    .answer-option.correct {
      background: rgba(34, 197, 94, 0.25);
      border-color: var(--accent-strong);
    }

    .answer-option.wrong {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--error);
    }

    .explanation-box {
      display: none;
      background: rgba(255, 255, 255, 0.06);
      padding: 16px;
      border-radius: 12px;
      margin-top: 14px;
      font-size: 0.92rem;
      color: var(--text-soft);
      border-left: 3px solid var(--accent);
      line-height: 1.45;
    }

    .next-btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }

    .next-btn:active {
      background: #4338ca;
    }

    .final-score {
      font-size: 1.4rem;
      text-align: center;
      padding: 20px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="quiz-shell">
  <div class="quiz-card">

    <h1>Culture Psybot Quiz :<br>Écho & Résonance de l'I.A</h1>

    <p class="author">
      par Pierre-Henri Garnier — CyberPsychologue
    </p>

    <p class="subtitle">
      12 questions pour comprendre ce que l’I.A reflète vraiment.
    </p>

    <div class="progress-row">
      <div>Question <span id="qNum">1</span>/12</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress"></div>
      </div>
    </div>

    <div class="question-text" id="question"></div>
    <div id="answers"></div>
    <div class="explanation-box" id="explanation"></div>

    <button class="next-btn" id="nextBtn" style="display:none;">Question suivante</button>
    <div id="final" class="final-score" style="display:none;"></div>

  </div>
</div>

<script>
const quiz = [
  {
    q: "Quand Psybot reformule parfaitement ta phrase, quel mécanisme explique le mieux ce phénomène ?",
    answers: ["Une interprétation profonde", "Une intention empathique", "Du pattern matching (appairage de motifs)"],
    correct: 2,
    explanation: "Les IA repèrent des motifs linguistiques et génèrent la suite la plus probable. Elles n'interprètent pas : elles calculent des cooccurrences."
  },
  {
    q: "Quand tu prêtes des intentions à Psybot, il se passe surtout :",
    answers: ["Une cognition artificielle élevée", "L’ELIZA Effect", "Une théorie de l’esprit"],
    correct: 1,
    explanation: "L’ELIZA Effect décrit notre tendance à projeter des intentions humaines sur des systèmes dépourvus de subjectivité."
  },
  {
    q: "Quand tu te sens 'compris', il s’agit souvent :",
    answers: ["D'empathie réelle", "D’une relation parasociale", "D’un attachement mutuel"],
    correct: 1,
    explanation: "La relation parasociale est un attachement unilatéral où l'utilisateur attribue une réciprocité inexistante."
  },
  {
    q: "Quand Psybot adapte son style à toi, il produit :",
    answers: ["De l'empathie authentique", "Une évolution psychique", "De l’intimité algorithmique"],
    correct: 2,
    explanation: "L'intimité algorithmique résulte de la personnalisation technique qui simule proximité et chaleur relationnelle."
  },
  {
    q: "Quand tes émotions deviennent des données, c’est :",
    answers: ["Une psychométrie avancée", "De la datafication émotionnelle", "Un processus thérapeutique"],
    correct: 1,
    explanation: "La datafication émotionnelle transforme des états internes en données exploitables."
  },
  {
    q: "Quand ces données sont exploitées, on observe :",
    answers: ["Un approfondissement relationnel", "De la surveillance émotionnelle", "Une neutralité technique"],
    correct: 1,
    explanation: "La surveillance affective consiste à analyser les émotions pour influence, optimisation ou ciblage."
  },
  {
    q: "L’impression d’un lien thérapeutique avec un bot s’appelle :",
    answers: ["Alliance réelle", "Digital Therapeutic Alliance", "Transfert numérique"],
    correct: 1,
    explanation: "La DTA est une alliance perçue mais unilatérale, sans co-présence subjective."
  },
  {
    q: "Garder ta maîtrise émotionnelle face aux IA relève de :",
    answers: ["Détachement", "Souveraineté affective", "Neutralité sociale"],
    correct: 1,
    explanation: "La souveraineté affective est la capacité à rester auteur de son paysage émotionnel malgré l’influence algorithmique."
  },
  {
    q: "Protéger ton espace mental manipulable renvoie à :",
    answers: ["Hygiène cognitive", "Liberté d’esprit", "Contrôle intentionnel"],
    correct: 1,
    explanation: "La Freedom of Mind défend le droit à un espace mental non manipulé."
  },
  {
    q: "Quand Psybot renforce systématiquement tes croyances, c’est :",
    answers: ["De l’empathie constructive", "Un effet de chambre d’écho", "Une validation neutre"],
    correct: 1,
    explanation: "Les chambres d’écho amplifient nos biais en confirmant nos idées initiales."
  },
  {
    q: "La résonance selon Hartmut Rosa nécessite :",
    answers: ["Une conversation longue", "Deux pôles vivants vulnérables", "Une IA avancée"],
    correct: 1,
    explanation: "La résonance implique vulnérabilité réciproque, impossible avec une IA."
  },
  {
    q: "Continuer à utiliser les IA malgré les risques connus relève de :",
    answers: ["Optimisme technologique", "Résignation numérique", "Confiance naturelle"],
    correct: 1,
    explanation: "La résignation numérique décrit le sentiment d’impuissance face aux plateformes."
  }
];

let index = 0;
let score = 0;

const qNum = document.getElementById("qNum");
const question = document.getElementById("question");
const answers = document.getElementById("answers");
const explanation = document.getElementById("explanation");
const progress = document.getElementById("progress");
const nextBtn = document.getElementById("nextBtn");
const final = document.getElementById("final");

function loadQuestion() {
  const item = quiz[index];
  qNum.textContent = index + 1;
  question.textContent = item.q;
  answers.innerHTML = "";
  explanation.style.display = "none";
  nextBtn.style.display = "none";

  item.answers.forEach((ans, i) => {
    const div = document.createElement("div");
    div.className = "answer-option";
    div.textContent = ans;
    div.onclick = () => checkAnswer(i, div);
    answers.appendChild(div);
  });

  progress.style.width = ((index) / quiz.length) * 100 + "%";
}

function checkAnswer(i, element) {
  const item = quiz[index];
  const options = document.querySelectorAll(".answer-option");

  options.forEach((opt, idx) => {
    opt.onclick = null;
    if (idx === item.correct) opt.classList.add("correct");
    else opt.classList.add("wrong");
  });

  if (i === item.correct) score++;

  explanation.textContent = item.explanation;
  explanation.style.display = "block";
  nextBtn.style.display = "block";
}

nextBtn.onclick = () => {
  index++;
  if (index === quiz.length) {
    showFinal();
  } else {
    loadQuestion();
  }
};

function showFinal() {
  question.style.display = "none";
  answers.style.display = "none";
  explanation.style.display = "none";
  nextBtn.style.display = "none";

  progress.style.width = "100%";

  final.style.display = "block";
  final.innerHTML = `
    🎯 Score : <strong>${score}/12</strong><br><br>
    ${
      score <= 4
        ? "Tu captes surtout les illusions : c’est un bon début, mais les IA peuvent encore te tromper."
        : score <= 8
        ? "Tu comprends déjà bien les dynamiques émotionnelles et cognitives des IA."
        : "Excellent : tu maîtrises les mécanismes d’écho, de projection et de résonance. Posture transnumériste atteinte."
    }
  `;
}

loadQuestion();
</script>

</body>
</html>
