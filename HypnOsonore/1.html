<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Balade HypnOsonore •°○</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; font-family: sans-serif; }
    #banner { width: 100%; height: auto; display: block; }
    #map { width: 100vw; height: 100vw; margin: 0; border: 1px solid #ccc; touch-action: none; }
    #startBtn { padding: 10px 20px; font-size: 1em; margin: 1em; }
    .hypno-marker { font-size: 24px; color: red; font-weight: bold; cursor: pointer; }
    .user-marker { font-size: 20px; color: blue; font-weight: bold; }
    #info { padding: 0 1em; }
    .slider-container { margin: 1em 0; }
  </style>
</head>
<body>
  <img id="banner" src="https://via.placeholder.com/800x200?text=Balade+HypnOsonore" alt="bannière">
  <h1 style="padding:1em;">Balade HypnOsonore •°○</h1>
  <p id="instructions">Placez les 3 bulles sonores sur la carte. Ajustez leur taille. Zoomez pour précision.</p>
  <div id="info">Cliquez sur la carte pour positionner les 3 bulles.</div>
  <button id="startBtn" disabled>Activer l’audio</button>
  <div id="sliders-container"></div>
  <div id="map"></div>

  <script>
    const map = L.map('map', { maxZoom: 25 }).setView([47.1497961, -1.5245526], 20);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 25
    }).addTo(map);

    const hypnoIcon = L.divIcon({ className: 'hypno-marker', html: '•°', iconSize: [24, 24], iconAnchor: [12, 12] });
    const userIcon = L.divIcon({ className: 'user-marker', html: '■', iconSize: [20, 20], iconAnchor: [10, 10] });

    const urls = [
      "https://pierkiroule.github.io/mp3/muzik1.mp3",
      "https://pierkiroule.github.io/mp3/muzik2.mp3",
      "https://pierkiroule.github.io/mp3/muzik3.mp3"
    ];

    let soundPoints = [];
    let audioReady = false;
    let userMarker = null;

    document.getElementById("startBtn").addEventListener("click", () => {
      const test = new Howl({ src: [urls[0]], volume: 0 });
      test.play();
      setTimeout(() => test.stop(), 300);
      Howler.ctx.resume();
      audioReady = true;
      document.getElementById("startBtn").style.display = "none";
      document.getElementById("info").innerText = "Marchez pour explorer les bulles sonores.";
    });

    map.on('click', function(e) {
      if (soundPoints.length >= 3) return;
      const lat = e.latlng.lat;
      const lon = e.latlng.lng;
      const radius = 50;
      const url = urls[soundPoints.length];
      const howl = new Howl({ src: [url], loop: true, volume: 0 });

      const point = { lat, lon, radius, howl, marker: null, circle: null, playing: false };
      const circle = L.circle([lat, lon], {
        radius: radius,
        color: 'red',
        fillOpacity: 0.2
      }).addTo(map);
      const marker = L.marker([lat, lon], { icon: hypnoIcon }).addTo(map);

      const sliderContainer = document.createElement('div');
      sliderContainer.className = 'slider-container';
      sliderContainer.innerHTML = `
        <label>Taille de la bulle ${soundPoints.length + 1} (dm) :</label>
        <input type="range" min="1" max="1000" value="500" step="0.1">
      `;
      document.getElementById('sliders-container').appendChild(sliderContainer);

      const slider = sliderContainer.querySelector('input');
      slider.addEventListener('input', (event) => {
        const newRadius = event.target.value / 10;
        circle.setRadius(newRadius);
        point.radius = newRadius;
      });

      point.marker = marker;
      point.circle = circle;
      soundPoints.push(point);

      if (soundPoints.length === 3) {
        document.getElementById("startBtn").disabled = false;
        document.getElementById("info").innerText = "Les 3 bulles sont posées. Activez l’audio pour commencer.";
      }
    });

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.marker([lat, lon], { icon: userIcon }).addTo(map);

        if (!audioReady) return;

        soundPoints.forEach(p => {
          const dist = getDistance(lat, lon, p.lat, p.lon);
          if (dist < p.radius) {
            const volume = 1 - dist / p.radius;
            p.howl.volume(Math.max(0, volume));
            if (!p.playing) {
              p.howl.play();
              p.playing = true;
            }
          } else {
            p.howl.volume(0);
            if (p.playing) {
              p.howl.pause();
              p.playing = false;
            }
          }
        });
      }, err => alert("Erreur GPS : " + err.message), { enableHighAccuracy: true });
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2)**2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }
  </script>
</body>
</html>
